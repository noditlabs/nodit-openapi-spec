    patch:
      security:
      - api_key: []
      operationId: updateAddressSetAddresses
      summary: Update Addresses in Address Set
      description: |
        API for adding and removing addresses of an Address Set via an `add`/`remove` batch. To replace the entire address list at once, use the Import Addresses into Address Set API (CSV overwrite).

        Up to 1,000 addresses can be sent per request across `add` and `remove` combined; exceeding this returns 422 `ADDRESS_LIMIT_EXCEEDED`. The total addresses in a set cannot exceed the plan limit (up to 5,000,000). Every address must match the set's `addressFormat`. Address change requests for the same set must be spaced out; if the rate limit is hit, retry after `retryAfterSeconds` from the 429 response.

        If the same address is included in both `add` and `remove`, nothing happens to that address, and it is counted in both `skipped` and `notFound` in the response.
