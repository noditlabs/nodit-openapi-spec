                  type: object
                  description: Parameter specifying the information required to receive notifications when an event occurs.
                  properties:
                    webhookUrl:
                      type: string
                      description: Parameter specifying the webhook URL to receive notifications when the subscribed event occurs. A publicly accessible URL must be specified.
                description:
                  type: string
                  description: Parameter specifying the description of the event.
                isActive:
                  type: boolean
                  description: Parameter specifying whether the Webhook is active. When set to true, the Webhook is activated; when set to false, it is deactivated. A deactivated Webhook cannot receive notifications but is not deleted.
                condition:
                  oneOf:
                  - title: EVM
                    type: object
                    description: Field for defining detailed conditions of the events you want to subscribe to. Available conditions vary by event type, so refer to the Webhook Types page for usage.
                    oneOf:
                    - title: ADDRESS_ACTIVITY
                      description: Monitors activity of the addresses you specify. This event sends a notification whenever these accounts are involved as either sender (from) or recipient (to) in a transaction, i.e., when a transaction, token transfer (ERC20), or NFT transfer (ERC721, ERC1155) occurs. This service enables users to track activity across multiple addresses in real time and effectively monitor asset movements and transactions. Provide the monitored addresses in **exactly one** of two ways, either listing them directly in `addresses` or specifying the `addressSetId` of a set created in advance with the Address Set API. Providing both returns 400 `INVALID_PARAMETER`, and providing neither returns 400 `MISSING_REQUIRED_PARAMETER`.
                      type: object
                      oneOf:
                      - required:
                        - addresses
                      - required:
                        - addressSetId
                      properties:
                        addresses:
                          type: array
                          description: List of addresses to monitor for events. Cannot be used together with `addressSetId`.
