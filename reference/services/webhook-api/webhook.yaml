  /webhook/address-sets/{addressSetId}/addresses/download:
    get:
      security:
      - api_key: []
      operationId: downloadAddressSetAddresses
      summary: Export Addresses from Address Set
      description: |
        API for downloading all addresses stored in an Address Set as a streamed CSV file. There are no filter parameters.

        The CSV has a single `address` column. The first line is the header `address`, followed by one address per line. This differs from the two-column `address,createdAt` format of the per-subscription download API (`/v1/{protocol}/{network}/webhooks/{subscriptionId}/addresses/download`). The attachment filename is `address-set-{addressSetId}.csv`.

        The downloaded file is in a format that can be uploaded as-is to the Import Addresses into Address Set API.
      x-seo-description: Download all addresses of an address set as a streamed CSV file.
      tags:
      - ADDRESS_SET
      parameters:
      - name: addressSetId
        in: path
        required: true
        description: Parameter that specifies the addressSetId assigned to the Address Set. Use the addressSetId returned when the Address Set was created. It is a 19-digit number but is returned as a string in JSON. Parsing it as a number in JavaScript or similar environments loses precision, so always handle it as a string.
        schema:
          type: string
          example: "1788439512345678901"
      responses:
        "200":
          description: CSV file download
          headers:
            Content-Disposition:
              description: Attachment filename, in the form `address-set-{addressSetId}.csv`.
              schema:
                type: string
                example: attachment; filename="address-set-1788439512345678901.csv"
          content:
            text/csv:
              schema:
                type: string
                format: binary
              example: |
                address
                0xabc0000000000000000000000000000000000001
                0xabc0000000000000000000000000000000000002
        "400":
          $ref: '#/components/responses/400'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                    enum:
                    - RESOURCE_NOT_FOUND
                    description: Code that identifies the cause of the error.
                  message:
                    type: string
                    description: Detailed message including the cause of the error.
              examples:
                RESOURCE_NOT_FOUND:
                  summary: The set does not exist (including a set that was just deleted), belongs to another account, or does not belong to the API key's project (the three cases are not distinguished)
                  value:
                    code: RESOURCE_NOT_FOUND
                    message: 'Resource not found: addressSetId=1788439512345678901'
        "405":
          $ref: '#/components/responses/405'
        "408":
          $ref: '#/components/responses/408'
        "409":
          $ref: '#/components/responses/409'
        "413":
          $ref: '#/components/responses/413'
        "414":
          $ref: '#/components/responses/414'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
        "503":
          $ref: '#/components/responses/503'
  /{chain}/{network}/webhooks/{subscriptionId}/addresses/download:
    get:
      security:
      - api_key: []
      operationId: exportAddresses
      summary: Export Addresses
