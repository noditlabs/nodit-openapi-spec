          enum:
          - aptos
          - arbitrum
          - arc
          - avalanche
          - base
          - bnb
          - ethereum
          - giwa
          - kaia
          - optimism
          - polygon
          - tron
        description: Parameter to specify the target chain for the query.
      - name: network
        in: path
        required: true
        schema:
          type: string
          enum:
          - mainnet
          - testnet
          - sepolia
          - fuji
          - hoodi
          - kairos
          default: mainnet
        description: Parameter to specify the network of the target chain. Supported networks may vary depending on the chain.
        x-enum-by:
          param: chain
          options:
            aptos:
            - mainnet
            - testnet
            arbitrum:
            - mainnet
            - sepolia
            arc:
            - mainnet
            - testnet
            avalanche:
            - mainnet
            - fuji
            base:
            - mainnet
            - sepolia
            bnb:
            - mainnet
            - testnet
            ethereum:
            - mainnet
            - sepolia
            - hoodi
            giwa:
            - sepolia
            kaia:
            - mainnet
            - kairos
            optimism:
            - mainnet
            - sepolia
            polygon:
            - mainnet
            tron:
            - mainnet
      - name: subscriptionId
        in: query
        required: true
        schema:
          type: string
          example: "5001"
        description: Parameter that specifies the subscriptionId assigned to the Webhook to query. Use the subscriptionId returned when creating the Webhook to query, update, or delete Webhook information. Enter an empty value to query all Webhook information.
      - name: page
        in: query
        required: false
        schema:
          type: string
          example: 1
