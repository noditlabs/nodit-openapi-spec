              examples:
                RESOURCE_NOT_FOUND:
                  summary: The set does not exist (including a set that was just deleted), belongs to another account, or does not belong to the API key's project (the three cases are not distinguished)
                  value:
                    code: RESOURCE_NOT_FOUND
                    message: 'Resource not found: addressSetId=1788439512345678901'
        "405":
