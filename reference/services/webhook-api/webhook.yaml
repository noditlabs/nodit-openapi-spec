      summary: List Addresses in Address Set
      description: |
        API for retrieving the addresses stored in an Address Set with cursor-based pagination. Prefix search on addresses is supported via `search`.

        If the response contains `cursor`, pass it as the `cursor` parameter in the next request to continue. On the last page the `cursor` field itself is absent from the response, so check for the presence of `cursor` to detect the end.
