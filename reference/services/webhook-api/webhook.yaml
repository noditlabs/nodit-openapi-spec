openapi: 3.1.0
info:
  title: Webhook API
  version: 1.0.0
servers:
- url: https://web3.nodit.io/v1
  description: Webhook API
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  responses:
    "400":
      description: Bad Request
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - MISSING_REQUIRED_PARAMETER
                - INVALID_PARAMETER
                - WRONG_RANGE_PARAMETER
                - DEPRECATED_OPERATION
                description: Code to identify the cause of the bad request
              message:
                type: string
                description: Detailed message including the name, value, etc. of the invalid parameter
            required:
            - code
            - message
          examples:
            MISSING_REQUIRED_PARAMETER:
              summary: A required parameter is missing
              value:
                code: MISSING_REQUIRED_PARAMETER
                message: 'Missing required parameter: { PARAMETER_NAME }'
            INVALID_PARAMETER:
              summary: A parameter has an invalid value
              value:
                code: INVALID_PARAMETER
                message: 'Invalid parameter: { PARAMETER1_NAME = PARAMETER1_VALUE }'
            WRONG_RANGE_PARAMETER:
              summary: A value is outside the allowed range
              value:
                code: WRONG_RANGE_PARAMETER
                message: 'Wrong range parameter: { PARAMETER_NAME }'
            DEPRECATED_OPERATION:
              summary: The requested API is no longer supported
              value:
                code: DEPRECATED_OPERATION
                message: This operation has been deprecated
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - NO_AUTHENTICATION_FOUND
                - AUTHENTICATION_FAILED
                description: Code to identify the cause of authentication failure
              message:
                type: string
                description: Detailed message including the cause of authentication failure
            required:
            - code
            - message
          examples:
            NO_AUTHENTICATION_FOUND:
              summary: The request does not include authentication (API Key)
              value:
                code: NO_AUTHENTICATION_FOUND
                message: No authentication found.
            AUTHENTICATION_FAILED:
              summary: The authentication (API Key) is invalid
              value:
                code: AUTHENTICATION_FAILED
                message: Authentication failed.
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - PERMISSION_DENIED
                description: Code indicating permission denied
              message:
                type: string
                description: Detailed message including information about the denied resource
            required:
            - code
            - message
          examples:
            PERMISSION_DENIED:
              summary: The request accesses a resource it is not authorized for
              value:
                code: PERMISSION_DENIED
                message: Permission denied
    "404":
      description: Not Found
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - WRONG_ENDPOINT
                - NOT_SUPPORTED_CHAIN
                - RESOURCE_NOT_FOUND
                description: Code to identify the cause of the resource not found
              message:
                type: string
                description: Detailed message including the name, value, etc. of the resource not found
            required:
            - code
            - message
          examples:
            WRONG_ENDPOINT:
              summary: The requested API path does not exist
              value:
                code: WRONG_ENDPOINT
                message: Wrong endpoint
            NOT_SUPPORTED_CHAIN:
              summary: The requested chain is not supported
              value:
                code: NOT_SUPPORTED_CHAIN
                message: Not supported chain
            RESOURCE_NOT_FOUND:
              summary: The requested resource does not exist
              value:
                code: RESOURCE_NOT_FOUND
                message: 'Resource not found: { RESOURCE_NAME = RESOURCE_VALUE }'
    "405":
      description: Method Not Allowed
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - METHOD_NOT_ALLOWED
                description: Code indicating a disallowed HTTP method
              message:
                type: string
                description: Detailed message about the disallowed HTTP method
            required:
            - code
            - message
          examples:
            METHOD_NOT_ALLOWED:
              summary: The request uses an unsupported HTTP method
              value:
                code: METHOD_NOT_ALLOWED
                message: Method not allowed
    "408":
      description: Request Timeout
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TIMEOUT
                description: Code indicating request timeout
              message:
                type: string
                description: Detailed message including the cause of the timeout
            required:
            - code
            - message
          examples:
            TIMEOUT:
              summary: Processing did not finish within the time limit
              value:
                code: TIMEOUT
                message: Request timeout
    "409":
      description: Conflict
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - RESOURCE_ALREADY_EXISTS
                - REJECTED
                description: Code to identify the cause of the request conflict
              message:
                type: string
                description: Detailed message including information about the conflicting resource
            required:
            - code
            - message
          examples:
            RESOURCE_ALREADY_EXISTS:
              summary: The request tries to create a resource that already exists
              value:
                code: RESOURCE_ALREADY_EXISTS
                message: Resource already exists
            REJECTED:
              summary: The server rejected the request
              value:
                code: REJECTED
                message: Request rejected
    "413":
      description: Payload Too Large
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - CONTENTS_TOO_LARGE
                description: Code indicating payload size exceeded
              message:
                type: string
                description: Detailed message including the maximum allowed payload size
            required:
            - code
            - message
          examples:
            CONTENTS_TOO_LARGE:
              summary: The payload exceeds the server's maximum size
              value:
                code: CONTENTS_TOO_LARGE
                message: Contents too large
    "414":
      description: URI Too Long
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_LONG_URI
                description: Code indicating URI length exceeded
              message:
                type: string
                description: Detailed message including the maximum allowed URI length
            required:
            - code
            - message
          examples:
            TOO_LONG_URI:
              summary: The request URI exceeds the server's maximum length
              value:
                code: TOO_LONG_URI
                message: URI too long
    "429":
      description: Too Many Requests
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_MANY_REQUESTS
                - EXCEEDED_QUOTA_LIMIT
                description: Code identifying the cause of the request limit exceeded
              message:
                type: string
                description: Detailed message including the exceeded limit type and allowed threshold
            required:
            - code
            - message
          examples:
            TOO_MANY_REQUESTS:
              summary: The rate limit was exceeded
              value:
                code: TOO_MANY_REQUESTS
                message: Too many requests
            EXCEEDED_QUOTA_LIMIT:
              summary: The quota limit was exceeded
              value:
                code: EXCEEDED_QUOTA_LIMIT
                message: Exceeded quota limit
    "500":
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - INTERNAL_SERVER_ERROR
                - INTERRUPTED
                description: Code to identify the cause of the internal server error
              message:
                type: string
                description: Detailed message including the cause of the server error
            required:
            - code
            - message
          examples:
            INTERNAL_SERVER_ERROR:
              summary: An internal server error occurred
              value:
                code: INTERNAL_SERVER_ERROR
                message: Internal server error
            INTERRUPTED:
              summary: Processing failed temporarily due to server load
              value:
                code: INTERRUPTED
                message: Request interrupted
    "503":
      description: Service Unavailable
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - UNAVAILABLE
                description: Code indicating service unavailability
              message:
                type: string
                description: Detailed message including the cause of the service outage
            required:
            - code
            - message
          examples:
            UNAVAILABLE:
              summary: The service is unavailable due to infrastructure downtime or an upgrade
              value:
                code: UNAVAILABLE
                message: Service unavailable
paths:
  /webhook/address-sets:
    post:
      security:
      - api_key: []
      operationId: createAddressSet
      summary: Create Address Set
      description: |
        API for creating an Address Set. An Address Set is a reusable collection of addresses that can be attached to Webhooks as monitoring targets. You can register addresses with `addresses` at creation time or leave it empty and add them later.

        The address format (`addressFormat`) is required and must be either `EVM` or `TRON`. It cannot be changed after creation. Up to 1,000 addresses can be registered in a single request.

        The `addressSetId` in the response: It is a 19-digit number but is returned as a string in JSON. Parsing it as a number in JavaScript or similar environments loses precision, so always handle it as a string.
      x-seo-description: Create a reusable EVM or TRON address set for ADDRESS_ACTIVITY webhooks, optionally seeding it with an initial list of addresses.
      tags:
      - ADDRESS_SET
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - name
              - addressFormat
              properties:
                name:
                  type: string
                  maxLength: 128
                  description: Parameter that specifies the name of the Address Set. Up to 128 characters. Duplicate names are allowed.
                description:
                  type: string
                  maxLength: 512
                  description: Parameter that specifies the description of the Address Set. Up to 512 characters.
                addressFormat:
                  type: string
                  enum:
                  - EVM
                  - TRON
                  description: Required parameter that specifies the format of addresses stored in the Address Set. Either `EVM` or `TRON`; there is no default. It cannot be changed after creation.
                addresses:
                  type: array
                  maxItems: 1000
                  description: List of addresses to register at creation time. If omitted or empty, a set with no addresses is created. Up to 1,000 addresses can be provided, and every address must match `addressFormat`.
                  items:
                    type: string
                    description: An address matching the set's `addressFormat`. EVM addresses (0x + 40 hex) are case-insensitive and normalized to lowercase for storage. TRON addresses (Base58, 34 characters starting with `T`) are case-sensitive.
                    example: "0xabc0000000000000000000000000000000000001"
            example:
              name: exchange-hot-wallets
              description: Hot wallets monitored for deposits
              addressFormat: EVM
              addresses:
              - "0xabc0000000000000000000000000000000000001"
              - "0xabc0000000000000000000000000000000000002"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                description: Address Set object.
                required:
                - addressSetId
                - name
                - description
                - addressFormat
                - status
                - addressCount
                - webhookCount
                - createdAt
                - updatedAt
                properties:
                  addressSetId:
                    type: string
                    description: Field indicating the addressSetId assigned to the Address Set. The addressSetId is a unique value that identifies the Address Set and is used to retrieve, update, or delete it. It is a 19-digit number but is returned as a string in JSON. Parsing it as a number in JavaScript or similar environments loses precision, so always handle it as a string.
                    example: "1788439512345678901"
                  name:
                    type: string
                    maxLength: 128
                    description: Field indicating the name of the Address Set. Up to 128 characters.
                    example: exchange-hot-wallets
                  description:
                    type: string
                    maxLength: 512
                    description: Field indicating the description of the Address Set. Up to 512 characters; an empty string (`""`) for a set without a description.
                    example: Hot wallets monitored for deposits
                  addressFormat:
                    type: string
                    enum:
                    - EVM
                    - TRON
                    description: Field indicating the format of addresses stored in the Address Set. Either `EVM` or `TRON`; it cannot be changed after creation.
                    example: EVM
                  status:
                    type: string
                    enum:
                    - READY
                    - IMPORTING
                    description: Field indicating the status of the Address Set. `READY` means addresses can be changed and the set can be attached to Webhooks; `IMPORTING` means a CSV import is in progress. While the status is `IMPORTING`, addresses cannot be changed and the set cannot be attached to a Webhook (name and description can still be updated). A deleted set stops being retrievable immediately after deletion (404), so no separate deletion status appears in responses.
                    example: READY
                  addressCount:
                    type: integer
                    description: Field indicating the total number of addresses stored in the Address Set.
                    example: 100000
                  webhookCount:
                    type: integer
                    description: Field indicating the number of Webhooks currently using this Address Set. The set cannot be deleted when this value is 1 or more.
                    example: 0
                  createdAt:
                    type: string
                    format: date-time
                    description: Indicates when the Address Set was created. This field is returned in ISO 8601 format.
                    example: '2026-07-01T00:00:00.000Z'
                  updatedAt:
                    type: string
                    format: date-time
                    description: Indicates when the Address Set was last modified. This field is returned in ISO 8601 format.
                    example: '2026-07-01T00:00:00.000Z'
              example:
                addressSetId: "1788439512345678901"
                name: exchange-hot-wallets
                description: Hot wallets monitored for deposits
                addressFormat: EVM
                status: READY
                addressCount: 2
                webhookCount: 0
                createdAt: '2026-07-01T00:00:00.000Z'
                updatedAt: '2026-07-01T00:00:00.000Z'
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                    enum:
                    - MISSING_REQUIRED_PARAMETER
                    - INVALID_PARAMETER
                    description: Code that identifies the cause of the error.
                  message:
                    type: string
                    description: Detailed message including the cause of the error.
              examples:
                MISSING_REQUIRED_PARAMETER:
                  summary: A required parameter (`name`, `addressFormat`) is missing
                  value:
                    code: MISSING_REQUIRED_PARAMETER
                    message: 'Missing required parameter: addressFormat'
                INVALID_PARAMETER:
                  summary: The request contains addresses that do not match the set's address format (`EVM`/`TRON`) (the message includes the first 5)
                  value:
                    code: INVALID_PARAMETER
                    message: 'not EVM addresses: TLa2f6VPqDgRE67v1736s7bJ8Ray5wYjU7, 0xabc, not-an-address, 0x123, 0x456'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "404":
          $ref: '#/components/responses/404'
        "405":
          $ref: '#/components/responses/405'
        "408":
          $ref: '#/components/responses/408'
        "409":
          $ref: '#/components/responses/409'
        "413":
          $ref: '#/components/responses/413'
        "414":
          $ref: '#/components/responses/414'
        "422":
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                    enum:
                    - ADDRESS_LIMIT_EXCEEDED
                    description: Code that identifies the cause of the error.
                  message:
                    type: string
                    description: Detailed message including the cause of the error.
              examples:
                ADDRESS_LIMIT_EXCEEDED:
                  summary: '`addresses` contains more than 1,000 addresses'
                  value:
                    code: ADDRESS_LIMIT_EXCEEDED
                    message: A request cannot carry more than 1000 addresses.
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
        "503":
          $ref: '#/components/responses/503'
    get:
      security:
      - api_key: []
      operationId: listAddressSets
      summary: List Address Sets
      description: |
        API for retrieving the list of Address Sets created in the project, with pagination. Specify the page with `page` and `rpp`. Both the default and the maximum of `rpp` are 100.
      x-seo-description: Retrieve the list of address sets in your project with page-based pagination.
      tags:
      - ADDRESS_SET
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          example: 1
        description: Specifies the page to query. The default is 1.
      - name: rpp
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
          example: 100
        description: Specifies the number of Address Sets to query per page. The valid range is 1 to 100. The default is 100.
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                required:
                - total
                - page
                - rpp
                - items
                properties:
                  total:
                    type: integer
                    description: Total number of Address Sets matching the query.
                    example: 1
                  page:
                    type: integer
                    description: Current page number of the query.
                    example: 1
                  rpp:
                    type: integer
                    description: Number of Address Sets per page returned based on the request.
                    example: 100
                  items:
                    type: array
                    description: List of Address Sets.
                    items:
                      type: object
                      description: Address Set object.
                      required:
                      - addressSetId
                      - name
                      - description
                      - addressFormat
                      - status
                      - addressCount
                      - webhookCount
                      - createdAt
                      - updatedAt
                      properties:
                        addressSetId:
                          type: string
                          description: Field indicating the addressSetId assigned to the Address Set. The addressSetId is a unique value that identifies the Address Set and is used to retrieve, update, or delete it. It is a 19-digit number but is returned as a string in JSON. Parsing it as a number in JavaScript or similar environments loses precision, so always handle it as a string.
                          example: "1788439512345678901"
                        name:
                          type: string
                          maxLength: 128
                          description: Field indicating the name of the Address Set. Up to 128 characters.
                          example: exchange-hot-wallets
                        description:
                          type: string
                          maxLength: 512
                          description: Field indicating the description of the Address Set. Up to 512 characters; an empty string (`""`) for a set without a description.
                          example: Hot wallets monitored for deposits
                        addressFormat:
                          type: string
                          enum:
                          - EVM
                          - TRON
                          description: Field indicating the format of addresses stored in the Address Set. Either `EVM` or `TRON`; it cannot be changed after creation.
                          example: EVM
                        status:
                          type: string
                          enum:
                          - READY
                          - IMPORTING
                          description: Field indicating the status of the Address Set. `READY` means addresses can be changed and the set can be attached to Webhooks; `IMPORTING` means a CSV import is in progress. While the status is `IMPORTING`, addresses cannot be changed and the set cannot be attached to a Webhook (name and description can still be updated). A deleted set stops being retrievable immediately after deletion (404), so no separate deletion status appears in responses.
                          example: READY
                        addressCount:
                          type: integer
                          description: Field indicating the total number of addresses stored in the Address Set.
                          example: 100000
                        webhookCount:
                          type: integer
                          description: Field indicating the number of Webhooks currently using this Address Set. The set cannot be deleted when this value is 1 or more.
                          example: 0
                        createdAt:
                          type: string
                          format: date-time
                          description: Indicates when the Address Set was created. This field is returned in ISO 8601 format.
                          example: '2026-07-01T00:00:00.000Z'
                        updatedAt:
                          type: string
                          format: date-time
                          description: Indicates when the Address Set was last modified. This field is returned in ISO 8601 format.
                          example: '2026-07-01T00:00:00.000Z'
              example:
                total: 1
                page: 1
                rpp: 100
                items:
                - addressSetId: "1788439512345678901"
                  name: exchange-hot-wallets
                  description: Hot wallets monitored for deposits
                  addressFormat: EVM
                  status: READY
                  addressCount: 100000
                  webhookCount: 0
                  createdAt: '2026-07-01T00:00:00.000Z'
                  updatedAt: '2026-07-01T00:00:00.000Z'
        "400":
          $ref: '#/components/responses/400'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "404":
          $ref: '#/components/responses/404'
        "405":
          $ref: '#/components/responses/405'
        "408":
          $ref: '#/components/responses/408'
        "409":
          $ref: '#/components/responses/409'
        "413":
          $ref: '#/components/responses/413'
        "414":
          $ref: '#/components/responses/414'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
        "503":
          $ref: '#/components/responses/503'
  /{chain}/{network}/webhooks:
    post:
      security:
      - api_key: []
      operationId: createWebhook
      summary: Create Webhook
      description: |+
        API for creating a Webhook. Create a Webhook by providing subscription details and Webhook URL. Once created, events will be sent to the Webhook URL. On creation, the API returns the Webhook's Subscription ID, which you can use to query, update, and delete the Webhook.

        **condition for ADDRESS_ACTIVITY**

        Provide the `condition` of an `ADDRESS_ACTIVITY` event in exactly one of the following two ways. Providing both returns 400 `INVALID_PARAMETER`, and providing neither returns 400 `MISSING_REQUIRED_PARAMETER`.

        - `addresses`: list the monitored addresses directly. This is the existing method and keeps working as before.
        - `addressSetId`: specify a set created in advance with the Address Set API. The set must be in `READY` status (otherwise 409 `ADDRESS_SET_NOT_READY`), and its `addressFormat` must match the chain's address format (otherwise 422 `ADDRESS_SET_FORMAT_MISMATCH`, e.g. attaching a TRON set to an EVM chain). A set that does not exist, or that belongs to another account or a project other than the one creating the Webhook, returns 404 `RESOURCE_NOT_FOUND`. Passing `addressSetId` for an event type other than `ADDRESS_ACTIVITY` returns 400.

        Request examples:

        - Existing method: `{ "eventType": "ADDRESS_ACTIVITY", "condition": { "addresses": ["0x..."] } }`
        - Using an Address Set: `{ "eventType": "ADDRESS_ACTIVITY", "condition": { "addressSetId": "1788439512345678901" } }`

      x-seo-description: Create a new webhook subscription to receive real-time blockchain event notifications to your endpoint.
      x-hide-try-it: true
      tags:
      - Webhook API
      parameters:
      - name: chain
        in: path
        required: true
        schema:
          type: string
          enum:
          - aptos
          - arbitrum
          - arc
          - avalanche
          - base
          - bnb
          - ethereum
          - giwa
          - kaia
          - optimism
          - polygon
          - tron
        description: Parameter to specify the target chain for the query.
      - name: network
        in: path
        required: true
        schema:
          type: string
          enum:
          - mainnet
          - testnet
          - sepolia
          - fuji
          - hoodi
          - kairos
          default: mainnet
        description: Parameter to specify the network of the target chain. Supported networks may vary depending on the chain.
        x-enum-by:
          param: chain
          options:
            aptos:
            - mainnet
            - testnet
            arbitrum:
            - mainnet
            - sepolia
            arc:
            - mainnet
            - testnet
            avalanche:
            - mainnet
            - fuji
            base:
            - mainnet
            - sepolia
            bnb:
            - mainnet
            - testnet
            ethereum:
            - mainnet
            - sepolia
            - hoodi
            giwa:
            - sepolia
            kaia:
            - mainnet
            - kairos
            optimism:
            - mainnet
            - sepolia
            polygon:
            - mainnet
            tron:
            - mainnet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              type: object
              properties:
                eventType:
                  oneOf:
                  - title: EVM
                    type: string
                    description: Parameter specifying the event type identifier to subscribe to via Webhook. For information on supported event types, refer to the Event Types page.
                    enum:
                    - ADDRESS_ACTIVITY
                    - TOKEN_TRANSFER
                    - LOG
                  - title: Aptos
                    type: string
                    description: Parameter that specifies the event type identifier to subscribe to via Webhook. For information on supported event types, refer to the Event Types page.
                    enum:
                    - EVENT
                    - TRANSACTION
                  - title: Tron
                    type: string
                    description: Parameter specifying the event type identifier to subscribe to via Webhook. For information on supported event types, refer to the Event Types page.
                    enum:
                    - ADDRESS_ACTIVITY
                    - TOKEN_TRANSFER
                    - LOG
                description:
                  type: string
                  description: Parameter that specifies the description of the event.
                notification:
                  type: object
                  description: Parameter that specifies the information required to receive notifications when events occur.
                  properties:
                    webhookUrl:
                      type: string
                      description: Parameter that specifies the webhook URL to receive notifications when subscribed events occur. Must be a publicly accessible URL.
                isInstant:
                  type: boolean
                  description: |-
                    Parameter that specifies whether to enable the Instant Webhook option. Defaults to false when not specified.
                    - true: Enables the Instant Webhook option. You can receive Webhook messages immediately when the event is detected, regardless of block confirmation status.
                    - false: Disables the Instant Webhook option. Messages are sent only after the block containing the event transaction has been confirmed.
                withNative:
                  type: boolean
                  default: false
                  description: Field that selects whether to retrieve native transfer information. It can only be set when creating an `ADDRESS_ACTIVITY` event on EVM-based chains and Tron. When enabled, EVM-based chains deliver messages of the nativeTransfer, withdrawal, atomic, erc20, erc721, and erc1155 types, and Tron delivers messages of the Native Transfer (Tron) type.
                reorgCorrectionEnabled:
                  type: boolean
                  default: false
                  description: 'Field that selects whether to apply reorg detection and correction. With this option enabled, when a reorg block occurs, the message affected by the reorg is re-sent under the same Sequence Number with the `event.reorgRemoved: true` tag. The information of the new block is then sent under a new Sequence Number.'
                condition:
                  oneOf:
                  - title: EVM
                    type: object
                    description: Field for defining detailed conditions of the events you want to subscribe to. Available conditions vary by event type, so refer to the Webhook Types page for usage.
                    oneOf:
                    - title: ADDRESS_ACTIVITY
                      description: Monitors activity of the addresses you specify. This event sends a notification whenever these accounts are involved as either sender (from) or recipient (to) in a transaction, i.e., when a transaction, token transfer (ERC20), or NFT transfer (ERC721, ERC1155) occurs. This service enables users to track activity across multiple addresses in real time and effectively monitor asset movements and transactions. Provide the monitored addresses in **exactly one** of two ways, either listing them directly in `addresses` or specifying the `addressSetId` of a set created in advance with the Address Set API. Providing both returns 400 `INVALID_PARAMETER`, and providing neither returns 400 `MISSING_REQUIRED_PARAMETER`.
                      type: object
                      oneOf:
                      - required:
                        - addresses
                      - required:
                        - addressSetId
                      properties:
                        addresses:
                          type: array
                          description: List of addresses to monitor for events. Cannot be used together with `addressSetId`.
                          items:
                            type: string
                            format: ^0[xX][0-9a-fA-F]{40}$
                            default: "0x4838b106fce9647bdf1e7877bf73ce8b0bad5f97"
                            example: "0xd8dA6BF26964aF9D7eEd9e03E53415D37aA96045"
                        addressSetId:
                          type: string
                          description: The addressSetId of the Address Set whose addresses are to be monitored. Specify a set created in advance with the Address Set API; it cannot be used together with `addresses`. The set must be in `READY` status (otherwise 409 `ADDRESS_SET_NOT_READY`), and its `addressFormat` must match the chain's address format (otherwise 422 `ADDRESS_SET_FORMAT_MISMATCH`). Specifying a set that does not exist, or that belongs to another account or another project, returns 404 `RESOURCE_NOT_FOUND`. Pass the 19-digit number as a string.
                          example: "1788439512345678901"
                    - title: TOKEN_TRANSFER
                      description: Provides a notification when a token (ERC20) transfer or NFT (ERC721, ERC1155) transfer occurs. Users can specify a contract address to monitor token movements from that contract. For NFTs under ERC721 and ERC1155 standards, you can also set a specific token ID as a condition to track transfers of only that token.
                      type: object
                      required:
                      - tokens
                      properties:
                        tokens:
                          type: array
                          description: Token information object for monitoring transfer events
                          items:
                            type: object
                            required:
                            - contractAddress
                            properties:
                              contractAddress:
                                type: string
                                description: Contract address of the ERC20, ERC721, or ERC1155 token to monitor
                                format: ^0[xX][0-9a-fA-F]{40}$
                                default: "0x4838b106fce9647bdf1e7877bf73ce8b0bad5f97"
                                example: "0xd8dA6BF26964aF9D7eEd9e03E53415D37aA96045"
                              tokenId:
                                type: string
                                description: Token ID when monitoring transfer events for a specific token in the ERC721 or ERC1155 contract only
                                format: ^[0-9]+$
                                example:
                                - "1"
                                - "9386"
                    - title: LOG
                      description: Provides a notification when a transaction containing specified smart contract event logs is created. Users can specify the account address (address) to monitor and event identifier information (topics) as filter conditions. For example, configuring monitoring for the ERC20 standard token transfer event Transfer(address,address,uint256) captures all transaction logs matching that event signature (0xddf252ad...). Use the LOG EventType to efficiently track important activities such as standard token transfers or specific smart contract events.
                      type: object
                      required:
                      - address
                      - topics
                      properties:
                        address:
                          type: string
                          description: Target address to monitor for token transfer events
                          default: "0xd8dA6BF26964aF9D7eEd9e03E53415D37aA96045"
                          example:
                          - "0xd8dA6BF26964aF9D7eEd9e03E53415D37aA96045"
                          - "0x3f5CE5FBFe3E9af3971dD833D26bA9b5C936f0bE"
                        topics:
                          type: array
                          description: |
                            Array of topics for the Event Log to monitor. Can contain up to 4 strings.

                            > 📘 The Topic fields of the event you want to monitor are used to filter data associated with smart contract events. Each topic contains the event's signature and indexed parameter information.
                            > **topics[0]: Event Signature**
                            > - topics[0] is always the Keccak256 hash of the event signature.
                            > For example, for the Transfer(address indexed from, address indexed to, uint256 value) event, the event signature can be verified with code like this:
                            > `Keccak256("Transfer(address,address,uint256)") = 0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef `
                            >
                            > **topics[1], topics[2], topics[3]: Indexed Parameters**
                            > - topics[1] onward correspond to indexed parameter values of the event. Only event parameters declared with the indexed keyword in the smart contract are included in topics. For the Transfer event example above, the from address maps to topics[1] and the to address to topics[2]. To filter events where from is a specific address, enter that address in topics[1]. Values for non-indexed parameters can be found in the data field of the retrieved logs.
                            >
                            > **How to find Topic values**
                            > - From smart contract code: Check the event definition in Solidity code, identify indexed parameters and the event signature, then obtain topic values via Keccak256 hashing.
                            > - Using a block explorer: Select a sample transaction to trace, go to the transaction details, and find topic values in sections such as "Logs". Below is an example view from Etherscan (https://etherscan.io) for USDC (ERC20) Transfer event logs.
                          minItems: 1
                          maxItems: 4
                          items:
                            type: string
                            default: "0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef"
                            example:
                            - "0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef"
                            - "0x000000000000000000000000b7aa2d3c833a6827c4f39bef9622d7cddf66b7e7"
                            - "0x0000000000000000000000003264039cfaa37a70a0e8ccfbf4b7e60bedce5c9f"
                  - title: Aptos
                    type: object
                    description: Field for defining detailed conditions of the events you want to subscribe to. Available conditions vary by event type, so refer to the Webhook Types page for usage.
                    oneOf:
                    - title: EVENT
                      description: Sends a notification whenever a specified event occurs. Users can quickly identify important activities happening on the network.
                      type: object
                      required:
                      - eventType
                      - eventAccountAddress
                      properties:
                        eventType:
                          type: string
                          description: |
                            The event type to monitor. Event types refer to the name of the event struct defined in the module. Enter in the format `module_address::module_name::event_name`.
                            > 📘 Can't `0x1::transaction_fee::FeeStatement` be used in eventType?
                            > No. This event is included in all user transactions that consume gas fees.
                            > Therefore, there is no need to subscribe to it as a separate event. We recommend subscribing to the Transaction event instead.
                          default: 0x1::account::CoinRegisterEvent
                          example:
                          - 0x6d138096fb880d1c16b48f10686b98a96000c0ac18501425378f784c6b81c34d::eragon_lucky_wheel::EragonLuckyWheelEvent
                          - 0x1::coin::CoinDeposit
                        eventAccountAddress:
                          type: string
                          description: |
                            The address that emits the event you want to monitor.
                            > 📘 Must eventAccountAddress be 0x0 for Module Events?
                            > Yes. When eventType is "Module Events", you must set eventAccountAddress to "0x0". For "Event-Handler Events", enter the account address that emitted the event. For more details on event types, see the [Aptos official documentation](https://aptos.dev/en/network/blockchain/events).
                          default: "0x0"
                          example:
                          - "0x1"
                          - "0x6d138096fb880d1c16b48f10686b98a96000c0ac18501425378f784c6b81c34d"
                        eventData:
                          type: string
                          format: json
                          description: Object specifying event data filtering conditions. Use this field to filter for specific events by specifying key-value pairs. Supports JSON object format with up to 3 levels of nesting. Filtering applies only when the specified keys and values exactly match the event data.
                          example:
                          - '{ transfer: { sender: "0xcafe", receiver: "0xface" } }'
                    - title: TRANSACTION
                      description: When you configure the API with a specific event type (eventType) and the account that emits the event (eventAccountAddress), this feature returns all details of the transaction containing that event type whenever it occurs. When an event occurs, you can view the full transaction details including sender, receiver, amount, called functions, and related data, making it useful for system monitoring.
                      type: object
                      oneOf:
                      - title: function condition set
                        required:
                        - payloadFunction
                        properties:
                          payloadFunction:
                            type: string
                            description: The function to monitor. Enter in the format `module_address::module_name::function_name`.
                            default: 0x6d138096fb880d1c16b48f10686b98a96000c0ac18501425378f784c6b81c34d::eragon_lucky_wheel::roll_premium
                            example:
                            - 0x1::aptos_account::transfer
                            - 0x1::aptos_account::transfer_coins
                            - 0x1::primary_fungible_store::transfer
                      - title: event condition set
                        required:
                        - eventType
                        - eventAccountAddress
                        properties:
                          eventType:
                            type: string
                            description: |
                              The event type to monitor. Event types refer to the name of the event struct defined in the module. Enter in the format `module_address::module_name::event_name`.
                              > 📘 Can't `0x1::transaction_fee::FeeStatement` be used in eventType?
                              > No. This event is included in all user transactions that consume gas fees.
                              > Therefore, there is no need to subscribe to it as a separate event. We recommend subscribing to the Transaction event instead.
                            default: 0x1::account::CoinRegisterEvent
                            example:
                            - 0x6d138096fb880d1c16b48f10686b98a96000c0ac18501425378f784c6b81c34d::eragon_lucky_wheel::EragonLuckyWheelEvent
                            - 0x1::coin::CoinDeposit
                          eventAccountAddress:
                            type: string
                            description: |
                              The address that emits the event you want to monitor.
                              > 📘 Must eventAccountAddress be 0x0 for Module Events?
                              > Yes. When eventType is "Module Events", you must set eventAccountAddress to "0x0". For "Event-Handler Events", enter the account address that emitted the event. For more details on event types, see the [Aptos official documentation](https://aptos.dev/en/network/blockchain/events).
                            default: "0x0"
                            example:
                            - "0x1"
                            - "0x6d138096fb880d1c16b48f10686b98a96000c0ac18501425378f784c6b81c34d"
                          eventData:
                            type: string
                            format: json
                            description: Object specifying event data filtering conditions. Use this field to filter for specific events by specifying key-value pairs. Supports JSON object format with up to 3 levels of nesting. Filtering applies only when the specified keys and values exactly match the event data.
                            example:
                            - '{ transfer: { sender: "0xcafe", receiver: "0xface" } }'
                      - title: function and event condition set
                        required:
                        - payloadFunction
                        - eventType
                        - eventAccountAddress
                        properties:
                          payloadFunction:
                            type: string
                            description: The function to monitor. Enter in the format `module_address::module_name::function_name`.
                            default: 0x6d138096fb880d1c16b48f10686b98a96000c0ac18501425378f784c6b81c34d::eragon_lucky_wheel::roll_premium
                            example:
                            - 0x1::aptos_account::transfer
                            - 0x1::aptos_account::transfer_coins
                            - 0x1::primary_fungible_store::transfer
                          eventType:
                            type: string
                            description: |
                              The event type to monitor. Event types refer to the name of the event struct defined in the module. Enter in the format `module_address::module_name::event_name`.
                              > 📘 Can't `0x1::transaction_fee::FeeStatement` be used in eventType?
                              > No. This event is included in all user transactions that consume gas fees.
                              > Therefore, there is no need to subscribe to it as a separate event. We recommend subscribing to the Transaction event instead.
                            default: 0x1::account::CoinRegisterEvent
                            example:
                            - 0x6d138096fb880d1c16b48f10686b98a96000c0ac18501425378f784c6b81c34d::eragon_lucky_wheel::EragonLuckyWheelEvent
                            - 0x1::coin::CoinDeposit
                          eventAccountAddress:
                            type: string
                            description: |
                              The address that emits the event you want to monitor.
                              > 📘 Must eventAccountAddress be 0x0 for Module Events?
                              > Yes. When eventType is "Module Events", you must set eventAccountAddress to "0x0". For "Event-Handler Events", enter the account address that emitted the event. For more details on event types, see the [Aptos official documentation](https://aptos.dev/en/network/blockchain/events).
                            default: "0x0"
                            example:
                            - "0x1"
                            - "0x6d138096fb880d1c16b48f10686b98a96000c0ac18501425378f784c6b81c34d"
                          eventData:
                            type: string
                            format: json
                            description: Object specifying event data filtering conditions. Use this field to filter for specific events by specifying key-value pairs. Supports JSON object format with up to 3 levels of nesting. Filtering applies only when the specified keys and values exactly match the event data.
                            example:
                            - '{ transfer: { sender: "0xcafe", receiver: "0xface" } }'
                  - title: Tron
                    type: object
                    description: Field for defining detailed conditions of the events you want to subscribe to. Available conditions vary by event type, so refer to the Webhook Types page for usage.
                    oneOf:
                    - title: ADDRESS_ACTIVITY
                      description: 'Monitors activity of the Tron addresses you specify. This event sends a notification whenever these accounts are involved as either sender (from) or recipient (to) in a transaction, i.e., when a TRX transfer (when `withNative` is true), token transfer (TRC-20), or NFT transfer (TRC-721, TRC-1155) occurs. Specify the addresses to monitor using **only one** of two methods: list them directly in `addresses`, or specify the `addressSetId` of a set created in advance with the Address Set API (with `addressFormat` `TRON`). Providing both returns 400 `INVALID_PARAMETER`, and providing neither returns 400 `MISSING_REQUIRED_PARAMETER`.'
                      type: object
                      oneOf:
                      - required:
                        - addresses
                      - required:
                        - addressSetId
                      properties:
                        addresses:
                          type: array
                          description: List of addresses to monitor for events. Each address is a 34-character Base58 string starting with "T" and is case-sensitive. Cannot be used together with `addressSetId`.
                          items:
                            type: string
                            pattern: ^T[1-9A-HJ-NP-Za-km-z]{33}$
                            example: TLZSucJRjnqBKwvQz6n5hd29gbS4P7u7w8
                        addressSetId:
                          type: string
                          description: The addressSetId of the Address Set whose addresses are to be monitored. Specify a set created in advance with the Address Set API; it cannot be used together with `addresses`. The set must be in `READY` status (otherwise 409 `ADDRESS_SET_NOT_READY`), and its `addressFormat` must be `TRON` (otherwise 422 `ADDRESS_SET_FORMAT_MISMATCH`). Specifying a set that does not exist, or one that belongs to another account or project, returns 404 `RESOURCE_NOT_FOUND`. Pass the 19-digit number as a string.
                          example: "1788439512345678901"
                    - title: TOKEN_TRANSFER
                      description: Provides a notification when a token (TRC-20) transfer or NFT (TRC-721, TRC-1155) transfer occurs. Users can specify a contract address to monitor token movements from that contract. For NFTs under the TRC-721 and TRC-1155 standards, you can also set a specific token ID as a condition to track transfers of only that token.
                      type: object
                      required:
                      - tokens
                      properties:
                        tokens:
                          type: array
                          description: Token information object for monitoring transfer events
                          items:
                            type: object
                            required:
                            - contractAddress
                            properties:
                              contractAddress:
                                type: string
                                description: Contract address of the TRC-20, TRC-721, or TRC-1155 token to monitor. A 34-character Base58 string starting with "T".
                                pattern: ^T[1-9A-HJ-NP-Za-km-z]{33}$
                                example: TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t
                              tokenId:
                                type: string
                                description: Token ID when monitoring transfer events for a specific token in the TRC-721 or TRC-1155 contract only
                                pattern: ^[0-9]+$
                                example: "1"
                    - title: LOG
                      description: Provides a notification when a transaction containing specified smart contract event logs is created. Users can specify the account address (address) to monitor and event identifier information (topics) as filter conditions. For example, configuring monitoring for the TRC-20 standard token transfer event Transfer(address,address,uint256) captures all transaction logs matching that event signature (ddf252ad...).
                      type: object
                      required:
                      - address
                      - topics
                      properties:
                        address:
                          type: string
                          description: Target address to monitor for event logs. A 34-character Base58 string starting with "T".
                          pattern: ^T[1-9A-HJ-NP-Za-km-z]{33}$
                          example: TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t
                        topics:
                          type: array
                          description: |
                            Array of topics for the Event Log to monitor. Can contain up to 4 strings, and each topic is entered as a hex string without the `0x` prefix.

                            > 📘 **topics[0]: Event Signature**
                            > - topics[0] is the Keccak256 hash of the event signature. For example, the event signature of the Transfer(address,address,uint256) event is `ddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef`.
                            >
                            > **topics[1], topics[2], topics[3]: Indexed Parameters**
                            > - From topics[1] onward, each topic corresponds to an indexed parameter of the event. Only event parameters declared with the indexed keyword in the smart contract are included in topics.
                          items:
                            type: string
                            pattern: ^[0-9a-fA-F]{64}$
                          example:
                          - ddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef
                          minItems: 1
                          maxItems: 4
              required:
              - eventType
              - notification
              - condition
            example:
              eventType: ADDRESS_ACTIVITY
              description: Your webhook description
              notification:
                webhookUrl: https://your-webhook-url.com
              condition:
                addresses:
                - "0xd8dA6BF26964aF9D7eEd9e03E53415D37aA96045"
              isInstant: false
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  subscriptionId:
                    type: string
                    description: Field representing the subscriptionId assigned to the Webhook. subscriptionId is a unique value that identifies the Webhook and is used to query, update, or delete the Webhook.
                  description:
                    type: string
                    description: Field representing the Webhook description.
                  protocol:
                    type: string
                    description: Field representing the chain subscribed to via this Webhook. (e.g., ETHEREUM, POLYGON, OPTIMISM, ...)
                  network:
                    type: string
                    description: Field representing the network subscribed to via this Webhook. (e.g., MAINNET, SEPOLIA, MUMBAI, ...)
                  eventType:
                    type: string
                    description: Field representing the event type subscribed to by this Webhook.
                  notification:
                    type: object
                    required:
                    - webhookUrl
                    description: Field representing the information for receiving notifications via Webhook.
                    properties:
                      webhookUrl:
                        type: string
                        description: Field representing the URL for receiving Webhook notifications.
                  signingKey:
                    type: string
                    description: Field representing the signing key for authenticating Webhook notifications. After receiving a Webhook notification, use the signing key to verify the validity of the notification. The signing key is automatically generated when the Webhook is created and cannot be changed when updating the Webhook.
                  isInstant:
                    type: boolean
                    description: |-
                      Field that specifies whether the Instant Webhook option is enabled.
                      - true: When enabled, you can receive Webhook messages immediately when the monitored event is detected, regardless of block confirmation status.
                      - false: When disabled, messages are sent only after the block containing the event transaction has been confirmed.
                  condition:
                    type: object
                    description: Field representing the Webhook subscription conditions. Conditions may vary by event type.
                  createdAt:
                    type: string
                    description: Indicates when the webhook event occurred and the log was created. This field is returned in ISO 8601 format.
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                    enum:
                    - MISSING_REQUIRED_PARAMETER
                    - INVALID_PARAMETER
                    - WRONG_RANGE_PARAMETER
                    - DEPRECATED_OPERATION
                    description: Code that identifies the cause of the error.
                  message:
                    type: string
                    description: Detailed message including the cause of the error.
              examples:
                MISSING_REQUIRED_PARAMETER:
                  summary: A required parameter is missing. This includes an `ADDRESS_ACTIVITY` request with neither `addresses` nor `addressSetId`
                  value:
                    code: MISSING_REQUIRED_PARAMETER
                    message: Required parameter missing for condition. { addresses } or { addressSetId }
                INVALID_PARAMETER:
                  summary: 'A parameter has an invalid value. This includes an `ADDRESS_ACTIVITY` request with both `addresses` and `addressSetId`, and `addressSetId` given for an event type other than `ADDRESS_ACTIVITY` (`Invalid parameter: { addressSetId = ''…'' }.`)'
                  value:
                    code: INVALID_PARAMETER
                    message: condition takes either { addresses } or { addressSetId }, not both.
                WRONG_RANGE_PARAMETER:
                  summary: A value is outside the allowed range
                  value:
                    code: WRONG_RANGE_PARAMETER
                    message: 'Wrong range parameter: { PARAMETER_NAME }'
                DEPRECATED_OPERATION:
                  summary: The requested API is no longer supported
                  value:
                    code: DEPRECATED_OPERATION
                    message: Deprecated operation
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "404":
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                    enum:
                    - WRONG_ENDPOINT
                    - NOT_SUPPORTED_CHAIN
                    - RESOURCE_NOT_FOUND
                    description: Code that identifies the cause of the error.
                  message:
                    type: string
                    description: Detailed message including the cause of the error.
              examples:
                WRONG_ENDPOINT:
                  summary: The requested API path does not exist
                  value:
                    code: WRONG_ENDPOINT
                    message: Wrong endpoint
                NOT_SUPPORTED_CHAIN:
                  summary: The requested chain is not supported
                  value:
                    code: NOT_SUPPORTED_CHAIN
                    message: Not supported chain
                RESOURCE_NOT_FOUND:
                  summary: The requested resource does not exist. This includes an `addressSetId` that does not exist, belongs to another account, or belongs to a project other than the one creating the Webhook (the three cases are not distinguished)
                  value:
                    code: RESOURCE_NOT_FOUND
                    message: 'Resource not found: addressSetId=1788439512345678901'
        "405":
          $ref: '#/components/responses/405'
        "408":
          $ref: '#/components/responses/408'
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                    enum:
                    - RESOURCE_ALREADY_EXISTS
                    - REJECTED
                    - ADDRESS_SET_NOT_READY
                    description: Code that identifies the cause of the error.
                  message:
                    type: string
                    description: Detailed message including the cause of the error.
              examples:
                RESOURCE_ALREADY_EXISTS:
                  summary: The request tries to create a resource that already exists
                  value:
                    code: RESOURCE_ALREADY_EXISTS
                    message: Resource already exists
                REJECTED:
                  summary: The server rejected the request
                  value:
                    code: REJECTED
                    message: Request rejected
                ADDRESS_SET_NOT_READY:
                  summary: The specified Address Set is not `READY` (it is `IMPORTING`)
                  value:
                    code: ADDRESS_SET_NOT_READY
                    message: 'Address set is not ready: status=IMPORTING'
        "413":
          $ref: '#/components/responses/413'
        "414":
          $ref: '#/components/responses/414'
        "422":
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                    enum:
                    - ADDRESS_SET_FORMAT_MISMATCH
                    description: Code that identifies the cause of the error.
                  message:
                    type: string
                    description: Detailed message including the cause of the error.
              examples:
                ADDRESS_SET_FORMAT_MISMATCH:
                  summary: The `addressFormat` of the specified Address Set differs from the chain's address format (for example, attaching a TRON set to an EVM chain)
                  value:
                    code: ADDRESS_SET_FORMAT_MISMATCH
