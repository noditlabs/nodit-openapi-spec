  /webhook/address-sets/{addressSetId}/imports:
    post:
      security:
      - api_key: []
      operationId: importAddressSetAddresses
      summary: Import Addresses into Address Set
      description: |
        API for **replacing (overwriting) the entire address list** of an Address Set by uploading a CSV file. Send the request as `multipart/form-data` with the file field named `file`. Once accepted, a 202 response with an `importId` is returned and the import proceeds asynchronously. Check the progress with the Get Address Set Import API.

        > **Caution: an import overwrites, it does not append.** The uploaded file becomes the set's entire address list, and all previously stored addresses are deleted. To keep existing addresses, include them in the file. To add or remove only some addresses, use the Update Addresses in Address Set API.

        **Processing rules**

        - If the number of addresses in the file exceeds the plan limit, the upload is rejected at upload time (422 `ADDRESS_LIMIT_EXCEEDED`) and the set is left unchanged.
        - If the import ends as `FAILED`, the set is left empty.
        - A set with an import in progress (`IMPORTING`) cannot accept another upload, and its addresses cannot be changed or attached to a Webhook.
        - CSV import is not available for a set that has ever been attached to a Webhook.
        - `totalCount` in the response is the number of address lines in the file, and its final value is already present in the 202 response. `addedCount` is the number of distinct addresses stored in the set; it is smaller than `totalCount` when the file contains duplicates.

        **CSV format**

        - The first column is the address; any following columns are ignored. If the first line is `address`, it is treated as a header.
        - UTF-8 BOM, CRLF line endings, blank lines, and quoted values are accepted.
        - Each line must be at most 1,024 characters, and the file at most 256MB.
        - Every line must be an address matching the set's `addressFormat`. If any line cannot be read as an address, the upload is rejected at upload time with 400 `INVALID_FORMAT` (the message shows the line number); no import is created and the set is left unchanged. A file is either accepted as a whole or rejected as a whole.

        > This API requires a file upload, so Try it is not supported in the documentation. Refer to the code snippet and call it directly.
      x-seo-description: Upload a CSV file that replaces the entire address list of an address set asynchronously. This import overwrites all existing addresses; it does not append.
      x-hide-try-it: true
      tags:
      - ADDRESS_SET
      parameters:
      - name: addressSetId
        in: path
        required: true
        description: Parameter that specifies the addressSetId assigned to the Address Set. Use the addressSetId returned when the Address Set was created. It is a 19-digit number but is returned as a string in JSON. Parsing it as a number in JavaScript or similar environments loses precision, so always handle it as a string.
        schema:
          type: string
          example: "1788439512345678901"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                  description: CSV file to upload. The first column is the address, and a first line of `address` is treated as a header. Each line must be at most 1,024 characters and the file at most 256MB. The address list in this file replaces the set's entire list.
            example:
              file: addresses.csv
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                description: CSV import job object.
                required:
                - importId
                - status
                - totalCount
                - processedCount
                - addedCount
                - errorMessage
                - createdAt
                - startedAt
                - finishedAt
                properties:
                  importId:
                    type: integer
                    description: Field indicating the importId assigned to the import job. An integer that increments sequentially from 1; used to check the import progress.
                    example: 42
                  status:
                    type: string
                    enum:
                    - PENDING
                    - IN_PROGRESS
                    - DONE
                    - FAILED
                    description: Field indicating the status of the import job. `PENDING` means accepted and waiting to load, `IN_PROGRESS` means loading, `DONE` means completed, and `FAILED` means failed. When an import ends as `FAILED`, the set is left empty.
                    example: IN_PROGRESS
                  totalCount:
                    type: integer
                    description: Number of address lines in the uploaded CSV file. The final value is already present in the 202 response and does not change while loading.
                    example: 2000000
                  processedCount:
                    type: integer
                    description: Number of address lines processed so far. Updated while loading; compare with `totalCount` to calculate progress.
                    example: 1250000
                  addedCount:
                    type: integer
                    description: Number of distinct addresses stored in the set. Updated while loading; smaller than `totalCount` when the file contains the same address more than once.
                    example: 1240000
                  errorMessage:
                    type:
                    - string
                    - "null"
                    description: Indicates the failure reason when the import status is `FAILED`. Otherwise null. Lines that are not addresses of the set's `addressFormat` are rejected at upload time with 400 `INVALID_FORMAT`, so they do not appear in this field.
                    example: null
                  createdAt:
                    type: string
                    format: date-time
                    description: Indicates when the import request was accepted. This field is returned in ISO 8601 format.
                    example: '2026-07-01T00:00:00.000Z'
                  startedAt:
                    type:
                    - string
                    - "null"
                    format: date-time
                    description: Indicates when loading started. null while the status is `PENDING`. This field is returned in ISO 8601 format.
                    example: '2026-07-01T00:00:05.000Z'
                  finishedAt:
                    type:
                    - string
                    - "null"
                    format: date-time
                    description: Indicates when the import ended as `DONE` or `FAILED`. null while in progress. This field is returned in ISO 8601 format.
                    example: null
              example:
                importId: 42
                status: PENDING
                totalCount: 2000000
                processedCount: 0
                addedCount: 0
                errorMessage: null
                createdAt: '2026-07-01T00:00:00.000Z'
                startedAt: null
                finishedAt: null
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                    enum:
                    - MISSING_REQUIRED_PARAMETER
                    - INVALID_FORMAT
                    description: Code that identifies the cause of the error.
                  message:
                    type: string
                    description: Detailed message including the cause of the error.
              examples:
                MISSING_REQUIRED_PARAMETER:
                  summary: The multipart request has no `file` field
                  value:
                    code: MISSING_REQUIRED_PARAMETER
