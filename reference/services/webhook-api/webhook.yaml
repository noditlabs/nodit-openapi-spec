      tags:
      - ADDRESS_SET
      parameters:
      - name: addressSetId
        in: path
        required: true
        description: Parameter that specifies the addressSetId assigned to the Address Set. Use the addressSetId returned when the Address Set was created. It is a 19-digit number but is returned as a string in JSON. Parsing it as a number in JavaScript or similar environments loses precision, so always handle it as a string.
        schema:
          type: string
          example: "1788439512345678901"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: At least one of `add` or `remove` must be non-empty. The total must be 1,000 or fewer.
              properties:
                add:
                  type: array
                  description: List of addresses to add.
                  items:
                    type: string
                    description: An address matching the set's `addressFormat`. EVM addresses (0x + 40 hex) are case-insensitive and normalized to lowercase for storage. TRON addresses (Base58, 34 characters starting with `T`) are case-sensitive.
                    example: "0xabc0000000000000000000000000000000000001"
                remove:
                  type: array
                  description: List of addresses to remove.
                  items:
                    type: string
                    description: An address matching the set's `addressFormat`. EVM addresses (0x + 40 hex) are case-insensitive and normalized to lowercase for storage. TRON addresses (Base58, 34 characters starting with `T`) are case-sensitive.
                    example: "0xdef0000000000000000000000000000000000009"
            example:
              add:
              - "0xabc0000000000000000000000000000000000001"
              - "0xabc0000000000000000000000000000000000002"
              remove:
              - "0xdef0000000000000000000000000000000000009"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                required:
                - added
                - skipped
                - removed
                - notFound
                - totalCount
                properties:
                  added:
                    type: integer
                    description: Number of addresses actually added.
                    example: 2
                  skipped:
                    type: integer
                    description: Number of `add` items not added. Counts addresses already in the set and addresses included in both `add` and `remove`, to which nothing happened.
                    example: 0
                  removed:
                    type: integer
                    description: Number of addresses actually removed.
                    example: 1
                  notFound:
                    type: integer
                    description: Number of `remove` items not removed. Counts addresses not in the set and addresses included in both `add` and `remove`, to which nothing happened.
                    example: 0
                  totalCount:
                    type: integer
                    description: Total number of addresses in the set after applying the change.
                    example: 100001
              example:
                added: 2
                skipped: 0
                removed: 1
                notFound: 0
                totalCount: 100001
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                    enum:
                    - MISSING_REQUIRED_PARAMETER
                    - INVALID_PARAMETER
                    description: Code that identifies the cause of the error.
                  message:
                    type: string
                    description: Detailed message including the cause of the error.
              examples:
