      tags:
      - ADDRESS_SET
      parameters:
      - name: addressSetId
        in: path
        required: true
        description: Parameter that specifies the addressSetId assigned to the Address Set. Use the addressSetId returned when the Address Set was created. It is a 19-digit number but is returned as a string in JSON. Parsing it as a number in JavaScript or similar environments loses precision, so always handle it as a string.
        schema:
          type: string
          example: "1788439512345678901"
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          example: eyJhZGRyZXNzIjoiMHhhYmMwLi4uMDAwMiJ9
        description: The `cursor` value from the previous response. Omit when fetching the first page.
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
          example: 100
        description: Specifies the number of addresses to return per request. The valid range is 1 to 1,000. The default is 100.
      - name: search
        in: query
        required: false
        schema:
          type: string
          example: "0xabc"
        description: Address prefix matching. For `EVM` sets the input is normalized to lowercase before matching; for `TRON` sets matching is case-sensitive.
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                required:
                - addresses
                properties:
                  addresses:
                    type: array
                    description: List of retrieved addresses. Each item is an object that currently has only an `address` field. The registration time (`createdAt`) is not included.
                    items:
                      type: object
                      required:
                      - address
                      properties:
                        address:
                          type: string
                          description: An address matching the set's `addressFormat`. EVM addresses (0x + 40 hex) are case-insensitive and normalized to lowercase for storage. TRON addresses (Base58, 34 characters starting with `T`) are case-sensitive.
                          example: "0xabc0000000000000000000000000000000000001"
                  cursor:
                    type: string
                    description: Value to pass as the `cursor` parameter to fetch the next page. On the last page this field is absent from the response (the field itself is missing, not null).
                    example: eyJhZGRyZXNzIjoiMHhhYmMwLi4uMDAwMiJ9
              example:
                addresses:
                - address: "0xabc0000000000000000000000000000000000001"
                - address: "0xabc0000000000000000000000000000000000002"
                cursor: eyJhZGRyZXNzIjoiMHhhYmMwLi4uMDAwMiJ9
        "400":
          $ref: '#/components/responses/400'
        "401":
