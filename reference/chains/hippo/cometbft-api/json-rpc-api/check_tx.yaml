openapi: 3.1.0
info:
  title: Hippo Protocol - CheckTx
  version: 1.0.0
servers:
- url: https://rpc-hippo-mainnet.nodit.io
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
paths:
  /:
    post:
      security:
      - api_key: []
      operationId: check_tx
      summary: CheckTx
      description: Validates a transaction without executing it.
      tags:
      - json-rpc-api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - jsonrpc
              - id
              - method
              properties:
                jsonrpc:
                  description: JSON-RPC protocol version. Always `2.0`.
                  type: string
                  const: "2.0"
                id:
                  description: Identifier of the request. Returned unchanged as `id` in the response.
                  type: integer
                method:
                  description: Name of the JSON-RPC method to call.
                  type: string
                  const: check_tx
                params:
                  description: Parameters passed to the method.
                  type: object
                  additionalProperties: false
                  required:
                  - tx
                  properties:
                    tx:
                      type: string
                      description: Encoded transaction.
            example:
              jsonrpc: "2.0"
              id: 1
              method: check_tx
              params:
                tx: a/encoded_tx/c
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - jsonrpc
                - id
                - result
                properties:
                  jsonrpc:
                    description: JSON-RPC protocol version. Always `2.0`.
                    type: string
                    const: "2.0"
                  id:
                    description: The request ID, echoed back unchanged.
                    type: integer
                  error:
                    description: Error information returned when the request fails.
                    type: string
                  result:
                    description: Result of the method call.
                    type: object
                    additionalProperties: false
                    properties:
                      code:
                        description: Result code. `0` means success; any other value is an error.
                        type: string
                      data:
                        description: Data returned by CheckTx.
                        type: string
                      log:
                        description: Execution log message.
                        type: string
                      info:
                        description: Additional information.
                        type: string
                      gas_wanted:
                        description: Gas limit requested by the transaction.
                        type: string
                      gas_used:
                        description: Gas actually used.
                        type: string
                      events:
                        description: Events emitted during execution.
                        type: array
                        items:
                          type: object
                          additionalProperties: false
                          properties:
                            type:
                              description: Event type.
                              type: string
                            attributes:
                              description: Event attributes (key-value pairs).
                              type: array
                              items:
                                type: object
                                additionalProperties: false
                                properties:
                                  key:
                                    description: Attribute key.
                                    type: string
                                  value:
                                    description: Attribute value.
                                    type: string
                                  index:
                                    description: Whether the attribute is indexed.
                                    type: boolean
                      codespace:
                        description: Namespace of the result code.
                        type: string
              example:
                jsonrpc: "2.0"
                id: 1
                result:
                  code: "0"
                  data: ""
                  log: '[]'
                  info: ""
                  gas_wanted: "200000"
                  gas_used: "80000"
                  events: []
                  codespace: ""
