openapi: 3.1.0
info:
  title: Hippo Protocol - Genesis
  version: 1.0.0
servers:
- url: https://rpc-hippo-mainnet.nodit.io
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
paths:
  /genesis:
    get:
      security:
      - api_key: []
      operationId: genesis
      summary: Genesis
      description: Retrieves the genesis document of the chain. An error may occur if the response is too large; genesis_chunked is recommended in that case.
      tags:
      - rest-api
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - jsonrpc
                - id
                - result
                properties:
                  jsonrpc:
                    description: JSON-RPC protocol version. Always `2.0`.
                    type: string
                    const: "2.0"
                  id:
                    description: The request ID, echoed back unchanged.
                    type: integer
                  result:
                    description: Result of the method call.
                    type: object
                    additionalProperties: false
                    properties:
                      genesis:
                        description: Genesis document.
                        type: object
                        additionalProperties: true
                        properties:
                          genesis_time:
                            description: Chain start time.
                            type: string
                          chain_id:
                            description: Chain ID.
                            type: string
                          initial_height:
                            description: Height of the chain's first block.
                            type: string
                          consensus_params:
                            description: Consensus parameters.
                            type: object
                            additionalProperties: false
                            properties:
                              block:
                                description: Block-related consensus parameters.
                                type: object
                                additionalProperties: false
                                properties:
                                  max_bytes:
                                    description: Maximum block size in bytes.
                                    type: string
                                  max_gas:
                                    description: Maximum gas per block. `-1` means unlimited.
                                    type: string
                                  time_iota_ms:
                                    description: Minimum time increment between blocks in milliseconds (legacy field).
                                    type: string
                              evidence:
                                description: Evidence-related consensus parameters.
                                type: object
                                additionalProperties: false
                                properties:
                                  max_age:
                                    description: Maximum age of evidence, in blocks.
                                    type: string
                              validator:
                                description: Validator-related consensus parameters.
                                type: object
                                additionalProperties: false
                                properties:
                                  pub_key_types:
                                    description: Public key types validators can use.
                                    type: array
                                    items:
                                      type: string
                          validators:
                            description: Genesis validators.
                            type: array
                            items:
                              type: object
                              additionalProperties: false
                              properties:
                                address:
                                  description: Validator address.
                                  type: string
                                pub_key:
                                  description: Validator public key.
                                  type: object
                                  additionalProperties: false
                                  properties:
                                    type:
                                      description: Public key type (for example, `tendermint/PubKeyEd25519`).
                                      type: string
                                    value:
                                      description: Public key value (Base64).
                                      type: string
                                power:
                                  description: Voting power of the validator.
                                  type: string
                                name:
                                  description: Validator name.
                                  type: string
                          app_hash:
                            description: Application state hash at genesis.
                            type: string
                          app_state:
                            description: Application state at genesis.
                            type: object
              example:
                jsonrpc: "2.0"
                id: 1
                result:
                  genesis:
                    genesis_time: '2019-12-11T16:11:34Z'
                    chain_id: cosmoshub-4
                    initial_height: "1"
                    consensus_params:
                      block:
                        max_bytes: "22020096"
                        max_gas: "-1"
                        time_iota_ms: "1000"
                      evidence:
                        max_age: "100000"
                      validator:
                        pub_key_types:
                        - ed25519
                    validators:
                    - address: B00A6323737F321EB0B8D59C6FD497A14B60938A
                      pub_key:
                        type: tendermint/PubKeyEd25519
                        value: oX8HyvloaslMOq50t0UjM5WkxaB3VJFQ/E3AYkM/GKE=
                      power: "1000000"
                      name: validator-1
                    app_hash: ""
                    app_state: {}
