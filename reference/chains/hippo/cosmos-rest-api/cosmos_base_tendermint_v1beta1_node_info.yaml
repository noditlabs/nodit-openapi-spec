openapi: 3.1.0
info:
  title: Hippo Protocol - cosmos_base_tendermint_v1beta1_node_info
  version: 1.0.0
servers:
- url: https://rest-hippo-mainnet.nodit.io
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
paths:
  /cosmos/base/tendermint/v1beta1/node_info:
    get:
      description: GetNodeInfo queries the current node info.
      operationId: cosmos_base_tendermint_v1beta1_node_info
      tags:
      - base
      responses:
        "200":
          description: Successful Response
          content:
            '*/*':
              schema:
                type: object
                properties:
                  default_node_info:
                    description: Node information.
                    type: object
                    properties:
                      protocol_version:
                        description: Protocol versions.
                        type: object
                        properties:
                          p2p:
                            description: P2P protocol version.
                            type: string
                            format: uint64
                          block:
                            description: Block protocol version.
                            type: string
                            format: uint64
                          app:
                            description: Application protocol version.
                            type: string
                            format: uint64
                      default_node_id:
                        description: Node ID.
                        type: string
                      listen_addr:
                        description: Address accepting incoming P2P connections.
                        type: string
                      network:
                        description: Network (chain ID) the node belongs to.
                        type: string
                      version:
                        description: Node software version.
                        type: string
                      channels:
                        description: P2P channels the node supports (hex).
                        type: string
                        format: byte
                      moniker:
                        description: Node name (moniker).
                        type: string
                      other:
                        description: Other node information.
                        type: object
                        properties:
                          tx_index:
                            description: Whether transaction indexing is enabled (`on` or `off`).
                            type: string
                          rpc_address:
                            description: RPC server address.
                            type: string
                  application_version:
                    type: object
                    properties:
                      name:
                        description: Application name.
                        type: string
                      app_name:
                        description: Application binary name.
                        type: string
                      version:
                        description: Application version.
                        type: string
                      git_commit:
                        description: Git commit the binary was built from.
                        type: string
                      build_tags:
                        description: Build tags.
                        type: string
                      go_version:
                        description: Go version used for the build.
                        type: string
                      build_deps:
                        description: Build dependency modules.
                        type: array
                        items:
                          type: object
                          properties:
                            path:
                              description: Module path.
                              type: string
                              title: module path
                            version:
                              description: Module version.
                              type: string
                              title: module version
                            sum:
                              description: Module checksum.
                              type: string
                              title: checksum
                          title: Module is the type for VersionInfo
                      cosmos_sdk_version:
                        description: Cosmos SDK version.
                        type: string
                    description: VersionInfo is the type for the GetNodeInfoResponse message.
                description: GetNodeInfoResponse is the response type for the Query/GetNodeInfo RPC method.
        default:
          description: An unexpected error response.
          content:
            '*/*':
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: integer
                    format: int32
                  message:
                    type: string
                  details:
                    type: array
                    items:
                      type: object
                      properties:
                        type_url:
                          type: string
                          description: |-
                            직렬화된 프로토콜 버퍼 메시지의 타입을 고유하게 식별하는 URL/리소스 이름. 이 문자열에는 "/" 문자가 최소 하나 포함되어야 하며, URL 경로의 마지막 세그먼트는 타입의 완전한 이름을 나타내야 합니다 (예: `path/google.protobuf.Duration`). 이름은 표준 형식이어야 합니다 (예: 선행 "."은 허용되지 않음).

                            실제로 팀들은 일반적으로 Any 컨텍스트에서 사용될 것으로 예상하는 모든 타입을 바이너리에 미리 컴파일합니다. 단, `http`, `https` 또는 스킴 없는 URL의 경우 다음과 같이 타입 URL을 메시지 정의에 매핑하는 타입 서버를 선택적으로 설정할 수 있습니다:

                            * 스킴이 제공되지 않으면 `https`로 가정합니다.
                            * URL에 대한 HTTP GET은 바이너리 형식의 [google.protobuf.Type][] 값을 반환하거나 오류를 발생시켜야 합니다.
                            * 애플리케이션은 URL을 기반으로 조회 결과를 캐시하거나 바이너리에 미리 컴파일하여 조회를 방지할 수 있습니다. 따라서 타입 변경 시 바이너리 호환성을 유지해야 합니다 (버전이 지정된 타입 이름을 사용하여 호환성 변경 관리).

                            참고: 이 기능은 현재 공식 protobuf 릴리스에서 사용 불가하며, type.googleapis.com으로 시작하는 타입 URL에는 사용되지 않습니다.

                            `http`, `https` (또는 빈 스킴) 이외의 스킴은 구현별 의미를 가질 수 있습니다.
                        value:
                          type: string
                          format: byte
                          description: 위에 지정된 타입의 유효한 직렬화 프로토콜 버퍼 값이어야 합니다.
                      description: |-
                        `Any` contains an arbitrary serialized protocol buffer message along with a
                        URL that describes the type of the serialized message.

                        Protobuf library provides support to pack/unpack Any values in the form
                        of utility functions or additional generated methods of the Any type.

                        Example 1: Pack and unpack a message in C++.

                            Foo foo = ...;
                            Any any;
                            any.PackFrom(foo);
                            ...
                            if (any.UnpackTo(&foo)) {
                              ...
                            }

                        Example 2: Pack and unpack a message in Java.

                            Foo foo = ...;
                            Any any = Any.pack(foo);
                            ...
                            if (any.is(Foo.class)) {
                              foo = any.unpack(Foo.class);
                            }
                            // or ...
                            if (any.isSameTypeAs(Foo.getDefaultInstance())) {
                              foo = any.unpack(Foo.getDefaultInstance());
                            }

                        Example 3: Pack and unpack a message in Python.

                            foo = Foo(...)
                            any = Any()
                            any.Pack(foo)
                            ...
                            if any.Is(Foo.DESCRIPTOR):
                              any.Unpack(foo)
                              ...

                        Example 4: Pack and unpack a message in Go

                             foo := &pb.Foo{...}
                             any, err := anypb.New(foo)
                             if err != nil {
                               ...
                             }
                             ...
                             foo := &pb.Foo{}
                             if err := any.UnmarshalTo(foo); err != nil {
                               ...
                             }

                        The pack methods provided by protobuf library will by default use
                        'type.googleapis.com/full.type.name' as the type URL and the unpack
                        methods only use the fully qualified type name after the last '/'
                        in the type URL, for example "foo.bar.com/x/y.z" will yield type
                        name "y.z".

                        JSON

                        The JSON representation of an `Any` value uses the regular
                        representation of the deserialized, embedded message, with an
                        additional field `@type` which contains the type URL. Example:

                            package google.profile;
                            message Person {
                              string first_name = 1;
                              string last_name = 2;
                            }

                            {
                              "@type": "type.googleapis.com/google.profile.Person",
                              "firstName": <string>,
                              "lastName": <string>
                            }

                        If the embedded message type is well-known and has a custom JSON
                        representation, that representation will be embedded adding a field
                        `value` which holds the custom JSON in addition to the `@type`
                        field. Example (for message [google.protobuf.Duration][]):

                            {
                              "@type": "type.googleapis.com/google.protobuf.Duration",
                              "value": "1.212s"
                            }
      security:
      - api_key: []
      summary: /cosmos/base/tendermint/v1beta1/node_info
