openapi: 3.1.0
info:
  title: XRPL - Data API
  version: 1.0.0
servers:
- url: https://web3.nodit.io/v1
  description: Data API
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  responses:
    "400":
      description: Bad Request
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - MISSING_REQUIRED_PARAMETER
                - INVALID_PARAMETER
                - WRONG_RANGE_PARAMETER
                - DEPRECATED_OPERATION
                description: Code to identify the cause of the bad request
              message:
                type: string
                description: Detailed message including the name, value, etc. of the invalid parameter
            required:
            - code
            - message
          examples:
            MISSING_REQUIRED_PARAMETER:
              summary: A required parameter is missing
              value:
                code: MISSING_REQUIRED_PARAMETER
                message: 'Missing required parameter: { PARAMETER_NAME }'
            INVALID_PARAMETER:
              summary: A parameter has an invalid value
              value:
                code: INVALID_PARAMETER
                message: 'Invalid parameter: { PARAMETER1_NAME = PARAMETER1_VALUE }'
            WRONG_RANGE_PARAMETER:
              summary: A value is outside the allowed range
              value:
                code: WRONG_RANGE_PARAMETER
                message: 'Wrong range parameter: { PARAMETER_NAME }'
            DEPRECATED_OPERATION:
              summary: The requested API is no longer supported
              value:
                code: DEPRECATED_OPERATION
                message: This operation has been deprecated
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - NO_AUTHENTICATION_FOUND
                - AUTHENTICATION_FAILED
                description: Code to identify the cause of authentication failure
              message:
                type: string
                description: Detailed message including the cause of authentication failure
            required:
            - code
            - message
          examples:
            NO_AUTHENTICATION_FOUND:
              summary: The request does not include authentication (API Key)
              value:
                code: NO_AUTHENTICATION_FOUND
                message: No authentication found.
            AUTHENTICATION_FAILED:
              summary: The authentication (API Key) is invalid
              value:
                code: AUTHENTICATION_FAILED
                message: Authentication failed.
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - PERMISSION_DENIED
                description: Code indicating permission denied
              message:
                type: string
                description: Detailed message including information about the denied resource
            required:
            - code
            - message
          examples:
            PERMISSION_DENIED:
              summary: The request accesses a resource it is not authorized for
              value:
                code: PERMISSION_DENIED
                message: Permission denied
    "404":
      description: Not Found
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - WRONG_ENDPOINT
                - NOT_SUPPORTED_CHAIN
                - RESOURCE_NOT_FOUND
                description: Code to identify the cause of the resource not found
              message:
                type: string
                description: Detailed message including the name, value, etc. of the resource not found
            required:
            - code
            - message
          examples:
            WRONG_ENDPOINT:
              summary: The requested API path does not exist
              value:
                code: WRONG_ENDPOINT
                message: Wrong endpoint
            NOT_SUPPORTED_CHAIN:
              summary: The requested chain is not supported
              value:
                code: NOT_SUPPORTED_CHAIN
                message: Not supported chain
            RESOURCE_NOT_FOUND:
              summary: The requested resource does not exist
              value:
                code: RESOURCE_NOT_FOUND
                message: 'Resource not found: { RESOURCE_NAME = RESOURCE_VALUE }'
    "405":
      description: Method Not Allowed
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - METHOD_NOT_ALLOWED
                description: Code indicating a disallowed HTTP method
              message:
                type: string
                description: Detailed message about the disallowed HTTP method
            required:
            - code
            - message
          examples:
            METHOD_NOT_ALLOWED:
              summary: The request uses an unsupported HTTP method
              value:
                code: METHOD_NOT_ALLOWED
                message: Method not allowed
    "408":
      description: Request Timeout
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TIMEOUT
                description: Code indicating request timeout
              message:
                type: string
                description: Detailed message including the cause of the timeout
            required:
            - code
            - message
          examples:
            TIMEOUT:
              summary: Processing did not finish within the time limit
              value:
                code: TIMEOUT
                message: Request timeout
    "409":
      description: Conflict
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - RESOURCE_ALREADY_EXISTS
                - REJECTED
                description: Code to identify the cause of the request conflict
              message:
                type: string
                description: Detailed message including information about the conflicting resource
            required:
            - code
            - message
          examples:
            RESOURCE_ALREADY_EXISTS:
              summary: The request tries to create a resource that already exists
              value:
                code: RESOURCE_ALREADY_EXISTS
                message: Resource already exists
            REJECTED:
              summary: The server rejected the request
              value:
                code: REJECTED
                message: Request rejected
    "413":
      description: Payload Too Large
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - CONTENTS_TOO_LARGE
                description: Code indicating payload size exceeded
              message:
                type: string
                description: Detailed message including the maximum allowed payload size
            required:
            - code
            - message
          examples:
            CONTENTS_TOO_LARGE:
              summary: The payload exceeds the server's maximum size
              value:
                code: CONTENTS_TOO_LARGE
                message: Contents too large
    "414":
      description: URI Too Long
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_LONG_URI
                description: Code indicating URI length exceeded
              message:
                type: string
                description: Detailed message including the maximum allowed URI length
            required:
            - code
            - message
          examples:
            TOO_LONG_URI:
              summary: The request URI exceeds the server's maximum length
              value:
                code: TOO_LONG_URI
                message: URI too long
    "429":
      description: Too Many Requests
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_MANY_REQUESTS
                - EXCEEDED_QUOTA_LIMIT
                description: Code identifying the cause of the request limit exceeded
              message:
                type: string
                description: Detailed message including the exceeded limit type and allowed threshold
            required:
            - code
            - message
          examples:
            TOO_MANY_REQUESTS:
              summary: The rate limit was exceeded
              value:
                code: TOO_MANY_REQUESTS
                message: Too many requests
            EXCEEDED_QUOTA_LIMIT:
              summary: The quota limit was exceeded
              value:
                code: EXCEEDED_QUOTA_LIMIT
                message: Exceeded quota limit
    "500":
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - INTERNAL_SERVER_ERROR
                - INTERRUPTED
                description: Code to identify the cause of the internal server error
              message:
                type: string
                description: Detailed message including the cause of the server error
            required:
            - code
            - message
          examples:
            INTERNAL_SERVER_ERROR:
              summary: An internal server error occurred
              value:
                code: INTERNAL_SERVER_ERROR
                message: Internal server error
            INTERRUPTED:
              summary: Processing failed temporarily due to server load
              value:
                code: INTERRUPTED
                message: Request interrupted
    "503":
      description: Service Unavailable
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - UNAVAILABLE
                description: Code indicating service unavailability
              message:
                type: string
                description: Detailed message including the cause of the service outage
            required:
            - code
            - message
          examples:
            UNAVAILABLE:
              summary: The service is unavailable due to infrastructure downtime or an upgrade
              value:
                code: UNAVAILABLE
                message: Service unavailable
paths:
  /{chain}/{network}/token/getTokenBalanceChangesByAccount:
    post:
      security:
      - api_key: []
      operationId: xrpl-getTokenBalanceChangesByAccount
      summary: Get Token Balance Changes by Account
      description: |
        Retrieves the IOU token balance change history for a specific account.
      x-seo-description: Track ERC20 token balance changes for a specific account over a block or time range.
      tags:
      - Token API
      parameters:
      - name: chain
        in: path
        required: true
        schema:
          type: string
          enum:
          - xrpl
          default: xrpl
        description: Parameter to specify the target chain for the query.
      - name: network
        in: path
        required: true
        schema:
          type: string
          enum:
          - mainnet
          default: mainnet
        description: Parameter to specify the network of the target chain.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - type: object
                required:
                - accountAddress
                properties:
                  accountAddress:
                    type: string
                    description: Parameter specifying the account address for balance query. It is a Base58-encoded string of 25-35 characters, always starting with "r".
                    pattern: ^r[1-9A-HJ-NP-Za-km-z]{25,35}$
                  currency:
                    type: string
                    description: Parameter specifying the currency symbol to query. Can be entered as an ISO-4217 format string such as "USD" or "EUR".
                    default: USD
                  issuer:
                    type: string
                    description: Parameter specifying the issuer of the currency to query. Enter the issuer account address using a Base58-encoded string of 25-35 characters (starting with "r").
                    default: rhub8VRN55s94qWKDv6jmDy1pUykJzF3wq
                  fromLedger:
                    type: string
                    description: |-
                      Parameter specifying the starting ledger for the query. You can enter one of the following formats:
                      - **ledger index**: Enter ledger number as a decimal string
                      - **ledger hash**: 64-character hexadecimal string (excluding 0x prefix)
                      - **ledger tag**: Enter "earliest" or "latest" (oldest or most recent ledger)

                      Notes:
                      - If provided without toLedger, results are queried from this ledger to the latest ledger.
                      - fromLedger value cannot be greater than toLedger value.
                      - If fromLedger and toLedger have the same value, only that ledger is queried.
                      - "latest" for fromLedger is only allowed when toLedger is "latest".
                    pattern: ^[0-9]+$|^0[xX][0-9a-fA-F]{64}|latest|earliest
                  toLedger:
                    type: string
                    description: |-
                      Parameter specifying the ending ledger for the query. You can enter one of the following formats:
                      - **ledger index**: Enter ledger number as a decimal string
                      - **ledger hash**: 64-character hexadecimal string (excluding 0x prefix)
                      - **ledger tag**: Enter "earliest" or "latest" (oldest or most recent ledger)

                      Notes:
                      - If provided without fromLedger, results are queried from genesis ledger to this ledger.
                      - toLedger value cannot be less than fromLedger value.
                      - If fromLedger and toLedger have the same value, only that ledger is queried.
                      - "earliest" for toLedger is only allowed when fromLedger is "earliest".
                    pattern: ^[0-9]+$|^0[xX][0-9a-fA-F]{64}|latest|earliest
                  fromDate:
                    type: string
                    description: |-
                      Parameter specifying the start date for the query. Date must follow ISO 8601 format (YYYY-MM-DDThh:mm:ss{time zone}) including seconds.

                      Notes:
                      - If provided without toDate, results are queried from this date to the latest block.
                      - fromDate value must be equal to or earlier than toDate value.
                      - If fromDate and toDate have the same value, only blocks from that date are queried.
                      - This field cannot be used together with fromBlock and toBlock.  
                      - If `fromDate` and `toDate` are not provided, the API queries data from the latest 30 days.
                    pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\.[0-9]{1,3})?(?:Z|[+-][0-9]{2}:[0-9]{2})$
                    example: '2025-01-01T00:00:00+00:00'
                  toDate:
                    type: string
                    description: |-
                      Parameter specifying the end date for the query. Date must follow ISO 8601 format (YYYY-MM-DDThh:mm:ss{time zone}) including seconds.

                      Notes:
                      - If provided without fromDate, results are queried from genesis block to this date.
                      - toDate value must be equal to or later than fromDate value.
                      - If fromDate and toDate have the same value, only blocks from that date are queried.
                      - This field cannot be used together with fromBlock and toBlock.  
                      - If `fromDate` and `toDate` are not provided, the API queries data from the latest 30 days.
                    pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(?:\.[0-9]{1,3})?(?:Z|[+-][0-9]{2}:[0-9]{2})$
                    example: '2025-01-31T00:00:00+00:00'
              - type: object
                properties:
                  page:
                    type: integer
                    description: |-
                      The page parameter specifies the data page to query. It accepts values up to 100; for pages exceeding 100, use the cursor pagination method.

                      The page and cursor parameters cannot be used together. If both page and cursor are empty, cursor pagination is used.
                    pattern: ^(?:[1-9][0-9]?|100)$
                  rpp:
                    type: integer
                    description: rpp stands for results per page and specifies the page size. You can specify a number greater than 0 and up to 100.
                    pattern: ^(?:[1-9][0-9]{0,2}?|100)$
                  cursor:
                    type: string
                    description: |-
                      The cursor parameter supports pagination and data navigation between pages. Provide the cursor value from the previous page in the next request to load the next page of data.

                      The page and cursor parameters cannot be used together. If both page and cursor are empty, cursor pagination is used.
                  withCount:
                    type: boolean
                    description: Parameter specifying whether to include the count field in the response. The count field indicates the total number of requested data items. When set to true, the count field is included and response speed may be slower.
                    default: false
            example:
              accountAddress: rf1BiGeXwwQoi8Z2ueFYTEXSwuJYfV2Jpn
              currency: USD
              issuer: rhub8VRN55s94qWKDv6jmDy1pUykJzF3wq
              fromDate: '2026-01-01T00:00:00Z'
              toDate: '2026-02-01T00:00:00Z'
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  required:
                  - items
                  properties:
                    page:
                      type: integer
                      description: Field representing the page number specified in the page parameter. This field is only included in the response when a value greater than 0 is specified for the page parameter.
                    rpp:
                      type: integer
                      description: Field representing the number of results per page specified in the rpp parameter.
                    cursor:
                      type: string
                      description: A field for cursor pagination. This value must be provided in the next request to load the next page of data.
                    count:
                      type: integer
                      description: Field representing the total count of requested data. This field is only included in the response when true is set for the withCount parameter.
                    range:
                      type: object
                      description: Field representing the actual range applied to the query. The same kind of values used in the request's range parameters are returned. A Date-based request returns fromDate and toDate, a Block-based request returns fromBlock and toBlock, and a Ledger-based request returns fromLedger and toLedger; different kinds are never mixed in a single response. When all range parameters are omitted, a default window of the last 30 days is applied and fromDate, toDate are returned. Block and Ledger values are always returned as heights (numbers), even if a hash or tag (latest, earliest) was provided in the request.
                      properties:
                        fromDate:
                          type: string
                          description: Field representing the start of the query range in Date mode. Returned in ISO 8601 format.
                        toDate:
                          type: string
                          description: Field representing the end of the query range in Date mode. Returned in ISO 8601 format.
                        fromBlock:
                          type: integer
                          description: Field representing the start block height of the query range in Block mode.
                        toBlock:
                          type: integer
                          description: Field representing the end block height of the query range in Block mode.
                        fromLedger:
                          type: integer
                          description: Field representing the start ledger index of the query range in Ledger mode.
                        toLedger:
                          type: integer
                          description: Field representing the end ledger index of the query range in Ledger mode.
                    items:
                      type: array
                      description: Field representing the list of queried data.
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        type: object
                        required:
                        - ledgerIndex
                        - ledgerTimestamp
                        - transactionIndex
                        - transactionHash
                        - transactionType
                        - affectedNodesIndex
                        - account
                        - currency
                        - issuer
                        - previousBalance
                        - finalBalance
                        - balanceChange
                        example:
                          ledgerIndex: 95444296
                          ledgerTimestamp: 1744608171
                          transactionIndex: 2
                          transactionHash: 8BAD7583234AC463E09D6CF160E352DFF5B008FC071DD5226A53809D89E7F409
                          transactionType: OfferCreate
                          affectedNodesIndex: 1
                          account: rf1BiGeXwwQoi8Z2ueFYTEXSwuJYfV2Jpn
                          currency: USD
                          issuer: rhub8VRN55s94qWKDv6jmDy1pUykJzF3wq
                          previousBalance: "1000.34"
                          finalBalance: "900.12"
                          balanceChange: "-100.22"
                        properties:
                          ledgerIndex:
                            type: integer
                            description: Integer value indicating the creation order of the ledger, used to identify its position (sequence number) on the network. Required field in the Balance Changes query API.
                            example: 95444296
                          ledgerTimestamp:
                            type: integer
                            description: The ledger's close time converted to a Unix timestamp. The close time recorded in the ledger header is expressed in seconds since the Ripple Epoch (January 1, 2000 00:00 UTC), which differs from the Unix Epoch (January 1, 1970 00:00 UTC) by 946,684,800 seconds. Thus ledgerTimestamp is the recorded close time plus 946,684,800 seconds. Required field in the Transfer query API.
                            example: 1744608171
                          transactionIndex:
                            type: integer
                            description: Index indicating the processing order of the transaction within the ledger. Used to determine the order of transactions in the ledger. Required field in the Balance Changes query API.
                            example: 2
                          transactionHash:
                            type: string
                            description: A 256-bit (64-digit hexadecimal) cryptographic hash that uniquely identifies the transaction. Used for transaction data integrity and identification. Required field in the Balance Changes query API.
                            example: 8BAD7583234AC463E09D6CF160E352DFF5B008FC071DD5226A53809D89E7F409
                          transactionType:
                            type: string
                            description: String indicating the transaction type (Payment, OfferCreate, EscrowCreate, etc.). Required field in the Transfer query API.
                            example: OfferCreate
                          affectedNodesIndex:
                            type: integer
                            description: Index of the node within the AffectedNodes array.
                            example: 1
                          account:
                            type: string
                            description: Account address whose balance was changed by the transaction. The account address is a Base58-encoded string 25-35 characters in length, starting with 'r'.
                            example: rf1BiGeXwwQoi8Z2ueFYTEXSwuJYfV2Jpn
                          currency:
                            type: string
                            description: 'Indicates the currency code of the asset. Typically uses ISO 4217 standard codes (e.g. "USD", "EUR"), but 160-bit custom codes may also be used. Custom codes are expressed as 40-character hexadecimal strings and are used for proprietary assets defined by specific projects or platforms (e.g. "SOLO"). For XRP, the fixed string "XRP" is used in the currency field and is returned in the same structure as IOU assets. '
                            example: USD
                          issuer:
                            type: string
                            description: The address of the account that issued the asset. Even with the same currency code, asset credibility and risk may vary by issuer. Thus, the XRP Ledger uniquely identifies assets by the combination of currency code and issuer. Each asset's trustworthiness largely depends on the issuer's reputation. This field is a Base58-encoded string 25-35 characters in length, always starting with 'r'. XRP is a native asset with no issuer; in that case, issuer is shown as an empty string ("").
                            example: rhub8VRN55s94qWKDv6jmDy1pUykJzF3wq
                          previousBalance:
                            type: string
                            description: Amount of the asset before the change. For XRP, expressed in XRP units where 1 XRP equals 1,000,000 drops.
                            example: "1000.34"
                          finalBalance:
                            type: string
                            description: Amount of the asset after the change. For XRP, expressed in XRP units where 1 XRP equals 1,000,000 drops.
                            example: "900.12"
                          balanceChange:
                            type: string
                            description: Amount changed by the transaction, including whether it increased or decreased. For XRP, expressed in XRP units where 1 XRP equals 1,000,000 drops.
                            example: "-100.22"
        "400":
          $ref: '#/components/responses/400'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "404":
          $ref: '#/components/responses/404'
        "405":
          $ref: '#/components/responses/405'
        "408":
          $ref: '#/components/responses/408'
        "409":
          $ref: '#/components/responses/409'
        "413":
          $ref: '#/components/responses/413'
        "414":
          $ref: '#/components/responses/414'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
        "503":
          $ref: '#/components/responses/503'
  /{chain}/{network}/token/getTokenTransfersByAccount:
    post:
      security:
      - api_key: []
      operationId: xrpl-getTokenTransfersByAccount
      summary: Get Token Transfers by Account
      description: |+
        Retrieves the list of ERC20 token transfers sent or received by a specific address. Results include token contract metadata and the transferred token amount.

      x-seo-description: Get a paginated list of ERC20 token transfers sent or received by a specific account address.
      tags:
      - Token API
      parameters:
      - name: chain
        in: path
        required: true
        schema:
          type: string
          enum:
          - xrpl
          default: xrpl
        description: Parameter to specify the target chain for the query.
      - name: network
        in: path
        required: true
        schema:
          type: string
          enum:
          - mainnet
          default: mainnet
        description: Parameter to specify the network of the target chain.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - type: object
                required:
                - accountAddress
                properties:
                  accountAddress:
                    type: string
                    description: Parameter specifying the account address for balance query. It is a Base58-encoded string of 25-35 characters, always starting with "r".
                    pattern: ^r[1-9A-HJ-NP-Za-km-z]{25,35}$
                  relation:
                    type: string
                    description: |-
                      Parameter for filtering transactions where the queried account address is the sender or recipient.
                      - from: Filter by sender only.
                      - to: Filter by recipient only.
                      - both (default): Returns all transactions where the queried address appears in from or to.
                    enum:
                    - from
                    - to
                    - both
                    pattern: from|to|both
                    default: both
                  currency:
                    type: string
                    description: Parameter specifying the currency symbol to query. Can be entered as an ISO-4217 format string such as "USD" or "EUR".
                    default: USD
                  issuer:
                    type: string
                    description: Parameter specifying the issuer of the currency to query. Enter the issuer account address using a Base58-encoded string of 25-35 characters (starting with "r").
                    default: rhub8VRN55s94qWKDv6jmDy1pUykJzF3wq
                  fromLedger:
                    type: string
                    description: |-
                      Parameter specifying the starting ledger for the query. You can enter one of the following formats:
                      - **ledger index**: Enter ledger number as a decimal string
                      - **ledger hash**: 64-character hexadecimal string (excluding 0x prefix)
                      - **ledger tag**: Enter "earliest" or "latest" (oldest or most recent ledger)

                      Notes:
                      - If provided without toLedger, results are queried from this ledger to the latest ledger.
                      - fromLedger value cannot be greater than toLedger value.
                      - If fromLedger and toLedger have the same value, only that ledger is queried.
                      - "latest" for fromLedger is only allowed when toLedger is "latest".
                    pattern: ^[0-9]+$|^0[xX][0-9a-fA-F]{64}|latest|earliest
                  toLedger:
                    type: string
                    description: |-
                      Parameter specifying the ending ledger for the query. You can enter one of the following formats:
                      - **ledger index**: Enter ledger number as a decimal string
                      - **ledger hash**: 64-character hexadecimal string (excluding 0x prefix)
                      - **ledger tag**: Enter "earliest" or "latest" (oldest or most recent ledger)

                      Notes:
                      - If provided without fromLedger, results are queried from genesis ledger to this ledger.
                      - toLedger value cannot be less than fromLedger value.
                      - If fromLedger and toLedger have the same value, only that ledger is queried.
                      - "earliest" for toLedger is only allowed when fromLedger is "earliest".
