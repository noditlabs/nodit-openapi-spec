openapi: 3.1.0
info:
  title: XRPL - account_lines
  version: 1.0.0
servers:
- url: https://xrpl-mainnet.nodit.io
  description: XRP Ledger Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  schemas:
    AccountLinesResult:
      allOf:
      - type: object
        description: The result of looking up an account's trust lines.
        properties:
          account:
            type: string
            description: The account the request was made from the perspective of.
          lines:
            type: array
            description: The list of trust lines.
            items:
              type: object
              description: Trust line data.
              properties:
                account:
                  type: string
                  description: The address of the counterparty on this trust line.
                balance:
                  type: string
                  description: |
                    The current balance. A positive value is owed to this account by the counterparty; a negative value is owed by this account.
                currency:
                  type: string
                  description: The currency code of the token this trust line holds.
                limit:
                  type: string
                  description: The maximum amount this account is willing to owe the counterparty.
                limit_peer:
                  type: string
                  description: The maximum amount the counterparty is willing to owe this account.
                quality_in:
                  type: integer
                  description: The valuation ratio applied to incoming balances.
                quality_out:
                  type: integer
                  description: The valuation ratio applied to outgoing balances.
                no_ripple:
                  type: boolean
                  description: Whether this account has enabled the No Ripple flag.
                no_ripple_peer:
                  type: boolean
                  description: Whether the counterparty has enabled the No Ripple flag.
                authorized:
                  type: boolean
                  description: Whether this account has authorized the trust line.
                peer_authorized:
                  type: boolean
                  description: Whether the counterparty has authorized the trust line.
                freeze:
                  type: boolean
                  description: Whether this account has frozen the trust line.
                freeze_peer:
                  type: boolean
                  description: Whether the counterparty has frozen the trust line.
          limit:
            type: integer
            description: The limit value used in the request.
          marker:
            $ref: '#/components/schemas/Marker'
      - $ref: '#/components/schemas/LedgerContext'
    LedgerContext:
      type: object
      description: Common fields that indicate which ledger version the response was derived from.
      properties:
        ledger_hash:
          type: string
          description: The hash of the ledger version used. Returned when a validated ledger version was queried.
        ledger_index:
          type: integer
          description: The ledger index of the version used. Returned when a validated ledger version was queried.
        ledger_current_index:
          type: integer
          description: The ledger index of the in-progress ledger. Returned when the `current` ledger was queried.
        validated:
          type: boolean
          description: Whether the response was derived from a validated ledger version.
    LedgerIndex:
      description: |
        Specifies the ledger version to use. Pass a ledger index as an integer, or use one of the shortcut strings below.
        - `validated`: Uses the most recent ledger version validated by the network.
        - `closed`: Uses the most recent ledger version the server has closed. It may not be validated.
        - `current`: Uses the in-progress ledger version the server is currently building.
      oneOf:
      - title: Ledger Index
        type: integer
        description: The ledger index of the version to use.
      - title: Shortcut
        type: string
        description: A shortcut string that specifies the ledger version to use.
        enum:
        - validated
        - closed
        - current
    Marker:
      description: |
        A value that marks a pagination position. Pass the `marker` value from a previous response to retrieve the next page.
        Its format depends on the server implementation, so use it verbatim without interpreting its contents.
  responses:
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - NO_AUTHENTICATION_FOUND
                - AUTHENTICATION_FAILED
                description: Code to identify the cause of authentication failure
              message:
                type: string
                description: Detailed message including the cause of authentication failure
            required:
            - code
            - message
          examples:
            NO_AUTHENTICATION_FOUND:
              summary: The request does not include authentication (API Key)
              value:
                code: NO_AUTHENTICATION_FOUND
                message: No authentication found.
            AUTHENTICATION_FAILED:
              summary: The authentication (API Key) is invalid
              value:
                code: AUTHENTICATION_FAILED
                message: Authentication failed.
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - PERMISSION_DENIED
                description: Code indicating permission denied
              message:
                type: string
                description: Detailed message including information about the denied resource
            required:
            - code
            - message
          examples:
            PERMISSION_DENIED:
              summary: The request accesses a resource it is not authorized for
              value:
                code: PERMISSION_DENIED
                message: Permission denied
    "404":
      description: Not Found
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - WRONG_ENDPOINT
                - NOT_SUPPORTED_CHAIN
                - RESOURCE_NOT_FOUND
                description: Code to identify the cause of the resource not found
              message:
                type: string
                description: Detailed message including the name, value, etc. of the resource not found
            required:
            - code
            - message
          examples:
            WRONG_ENDPOINT:
              summary: The requested API path does not exist
              value:
                code: WRONG_ENDPOINT
                message: Wrong endpoint
            NOT_SUPPORTED_CHAIN:
              summary: The requested chain is not supported
              value:
                code: NOT_SUPPORTED_CHAIN
                message: Not supported chain
            RESOURCE_NOT_FOUND:
              summary: The requested resource does not exist
              value:
                code: RESOURCE_NOT_FOUND
                message: 'Resource not found: { RESOURCE_NAME = RESOURCE_VALUE }'
    "405":
      description: Method Not Allowed
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - METHOD_NOT_ALLOWED
                description: Code indicating a disallowed HTTP method
              message:
                type: string
                description: Detailed message about the disallowed HTTP method
            required:
            - code
            - message
          examples:
            METHOD_NOT_ALLOWED:
              summary: The request uses an unsupported HTTP method
              value:
                code: METHOD_NOT_ALLOWED
                message: Method not allowed
    "408":
      description: Request Timeout
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TIMEOUT
                description: Code indicating request timeout
              message:
                type: string
                description: Detailed message including the cause of the timeout
            required:
            - code
            - message
          examples:
            TIMEOUT:
              summary: Processing did not finish within the time limit
              value:
                code: TIMEOUT
                message: Request timeout
    "409":
      description: Conflict
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - RESOURCE_ALREADY_EXISTS
                - REJECTED
                description: Code to identify the cause of the request conflict
              message:
                type: string
                description: Detailed message including information about the conflicting resource
            required:
            - code
            - message
          examples:
            RESOURCE_ALREADY_EXISTS:
              summary: The request tries to create a resource that already exists
              value:
                code: RESOURCE_ALREADY_EXISTS
                message: Resource already exists
            REJECTED:
              summary: The server rejected the request
              value:
                code: REJECTED
                message: Request rejected
    "413":
      description: Payload Too Large
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - CONTENTS_TOO_LARGE
                description: Code indicating payload size exceeded
              message:
                type: string
                description: Detailed message including the maximum allowed payload size
            required:
            - code
            - message
          examples:
            CONTENTS_TOO_LARGE:
              summary: The payload exceeds the server's maximum size
              value:
                code: CONTENTS_TOO_LARGE
                message: Contents too large
    "414":
      description: URI Too Long
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_LONG_URI
                description: Code indicating URI length exceeded
              message:
                type: string
                description: Detailed message including the maximum allowed URI length
            required:
            - code
            - message
          examples:
            TOO_LONG_URI:
              summary: The request URI exceeds the server's maximum length
              value:
                code: TOO_LONG_URI
                message: URI too long
    "429":
      description: Too Many Requests
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_MANY_REQUESTS
                - EXCEEDED_QUOTA_LIMIT
                description: Code identifying the cause of the request limit exceeded
              message:
                type: string
                description: Detailed message including the exceeded limit type and allowed threshold
            required:
            - code
            - message
          examples:
            TOO_MANY_REQUESTS:
              summary: The rate limit was exceeded
              value:
                code: TOO_MANY_REQUESTS
                message: Too many requests
            EXCEEDED_QUOTA_LIMIT:
              summary: The quota limit was exceeded
              value:
                code: EXCEEDED_QUOTA_LIMIT
                message: Exceeded quota limit
    "500":
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - INTERNAL_SERVER_ERROR
                - INTERRUPTED
                description: Code to identify the cause of the internal server error
              message:
                type: string
                description: Detailed message including the cause of the server error
            required:
            - code
            - message
          examples:
            INTERNAL_SERVER_ERROR:
              summary: An internal server error occurred
              value:
                code: INTERNAL_SERVER_ERROR
                message: Internal server error
            INTERRUPTED:
              summary: Processing failed temporarily due to server load
              value:
                code: INTERRUPTED
                message: Request interrupted
    "503":
      description: Service Unavailable
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - UNAVAILABLE
                description: Code indicating service unavailability
              message:
                type: string
                description: Detailed message including the cause of the service outage
            required:
            - code
            - message
          examples:
            UNAVAILABLE:
              summary: The service is unavailable due to infrastructure downtime or an upgrade
              value:
                code: UNAVAILABLE
                message: Service unavailable
paths:
  /:
    post:
      security:
      - api_key: []
      operationId: xrpl-account_lines
      summary: account_lines
      description: |
        Returns information about an account's trust lines.
        It lets you check the balance and limit of every non-XRP token, along with its freeze and authorization state.
      x-seo-description: Returns information about an account's trust lines, including token balances and limits.
      tags:
      - account
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - method
              - params
              properties:
                method:
                  type: string
                  example: account_lines
                params:
                  type: array
                  description: |-
                    It contains following parameters as a single object in the `params` array.
                    1. `account`: The account to look up, as a string. (required)
                    2. `peer`: To return only the trust lines with a specific counterparty, pass that address as a string. (optional)
                    3. `ignore_default`: Whether to exclude trust lines in their default state, as a boolean. (optional, default `false`)
                    4. `limit`: The number of trust lines to return, as an integer between 10 and 400. (optional, default `200`)
                    5. `marker`: Pass the `marker` value from a previous response to retrieve the next page. (optional)
                    - `ledger_hash`: The hash of the ledger version to use, as a string. (optional)
                    - `ledger_index`: The ledger index or a shortcut string. (optional)
                  minItems: 1
                  maxItems: 1
                  items:
                    title: Parameters
                    type: object
                    required:
                    - account
                    properties:
                      account:
                        type: string
                        description: The account to look up.
                        example: r9cZA1mLK5R5Am25ArfXFmqgNwjZgnfk59
                      peer:
                        type: string
                        description: Returns only the trust lines connected to the specified account.
                      ignore_default:
                        type: boolean
                        description: Whether to exclude trust lines in their default state from the results.
                        example: false
                      limit:
                        type: integer
                        description: The number of trust lines to return. Pass a value between 10 and 400.
                        example: 200
                      marker:
                        $ref: '#/components/schemas/Marker'
                      ledger_hash:
                        type: string
                        description: The hash of the ledger version to use. Pass a 32-byte hex string.
                      ledger_index:
                        $ref: '#/components/schemas/LedgerIndex'
                  example:
                  - account: r9cZA1mLK5R5Am25ArfXFmqgNwjZgnfk59
                    ledger_index: validated
                    limit: 200
              example:
                method: account_lines
                params:
                - account: r9cZA1mLK5R5Am25ArfXFmqgNwjZgnfk59
                  ledger_index: validated
                  limit: 200
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              example:
                result:
                  account: r9cZA1mLK5R5Am25ArfXFmqgNwjZgnfk59
                  lines:
                  - account: rMwjYedjc7qqtKYVLiAccJSmCwih4LnE2q
                    balance: "150.5"
                    currency: USD
                    limit: "1000"
                    limit_peer: "0"
                    no_ripple: false
                    no_ripple_peer: false
                    quality_in: 0
                    quality_out: 0
                  ledger_hash: 17ACB57A0F73B5160713E81FE72B2AC9F6064541004E272BD09F257D57C30C02
                  ledger_index: 98765432
                  validated: true
              schema:
                $ref: '#/components/schemas/AccountLinesResult'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "404":
          $ref: '#/components/responses/404'
        "405":
          $ref: '#/components/responses/405'
        "408":
          $ref: '#/components/responses/408'
        "409":
          $ref: '#/components/responses/409'
        "413":
          $ref: '#/components/responses/413'
        "414":
          $ref: '#/components/responses/414'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
        "503":
          $ref: '#/components/responses/503'
