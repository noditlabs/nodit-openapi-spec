paths:
  /:
    post:
      security:
      - api_key: []
      operationId: xrpl-account_nfts
      summary: account_nfts
      description: |
        Returns the list of NFTokens held by an account.
        It lets you check the issuer, identifier, taxon and URI of each token.
      x-seo-description: Returns a list of NFToken objects owned by the specified account.
      tags:
      - account
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - method
              - params
              properties:
                method:
                  type: string
                  example: account_nfts
                params:
                  type: array
                  description: |-
                    It contains following parameters as a single object in the `params` array.
                    1. `account`: The account to look up, as a string. (required)
                    2. `limit`: The number of token pages to return, as an integer between 20 and 400. (optional, default `100`)
                    3. `marker`: Pass the `marker` value from a previous response to retrieve the next page. (optional)
                    - `ledger_hash`: The hash of the ledger version to use, as a string. (optional)
                    - `ledger_index`: The ledger index or a shortcut string. (optional)
                  minItems: 1
                  maxItems: 1
                  items:
                    title: Parameters
                    type: object
                    required:
                    - account
                    properties:
                      account:
                        type: string
                        description: The address of the account that owns the NFTokens.
                        example: r9cZA1mLK5R5Am25ArfXFmqgNwjZgnfk59
                      limit:
                        type: integer
                        description: The number of token pages to return. Pass a value between 20 and 400.
                        example: 100
                      marker:
                        $ref: '#/components/schemas/Marker'
                      ledger_hash:
                        type: string
                        description: The hash of the ledger version to use. Pass a 32-byte hex string.
                      ledger_index:
                        $ref: '#/components/schemas/LedgerIndex'
                  example:
                  - account: r9cZA1mLK5R5Am25ArfXFmqgNwjZgnfk59
                    ledger_index: validated
                    limit: 100
              example:
                method: account_nfts
                params:
                - account: r9cZA1mLK5R5Am25ArfXFmqgNwjZgnfk59
                  ledger_index: validated
                  limit: 100
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              example:
                result:
                  account: r9cZA1mLK5R5Am25ArfXFmqgNwjZgnfk59
                  account_nfts:
                  - Flags: 8
                    Issuer: rMwjYedjc7qqtKYVLiAccJSmCwih4LnE2q
                    NFTokenID: 000800006203F49C21D5D6E022CB16DE3538F248662FC73C00000E39
                    NFTokenTaxon: 0
                    URI: 697066733A2F2F62616679626569676479727A
                    nft_serial: 3641
                  ledger_hash: 17ACB57A0F73B5160713E81FE72B2AC9F6064541004E272BD09F257D57C30C02
                  ledger_index: 98765432
                  validated: true
              schema:
                $ref: '#/components/schemas/AccountNftsResult'
