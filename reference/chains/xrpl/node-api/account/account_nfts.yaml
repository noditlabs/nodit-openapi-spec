        close_time:
          type: number
          description: The time the ledger closed, in seconds since the Ripple Epoch.
        hash:
          type: string
          description: The unique hash that identifies the ledger version.
        reserve_base:
          type: number
          description: The minimum reserve required to keep an account, in XRP.
        reserve_inc:
          type: number
          description: The additional reserve required per ledger object, in XRP.
        seq:
          type: integer
          description: The ledger index.
    ServerStateResult:
      type: object
      description: Server state information in a machine-readable form.
      properties:
        state:
          type: object
          description: Detailed server state information.
