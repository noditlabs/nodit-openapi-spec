              description: Consensus information from the previous ledger close.
              properties:
                converge_time:
                  type: integer
                  description: The time taken to reach consensus, in milliseconds.
                proposers:
                  type: integer
                  description: The number of validators that participated in consensus.
            load_base:
              type: integer
              description: The baseline server load used for cost calculations.
            load_factor:
              type: integer
              description: The load multiplier currently in effect.
            load_factor_fee_escalation:
              type: integer
              description: The cost multiplier for inclusion in the open ledger.
            load_factor_fee_queue:
              type: integer
              description: The cost multiplier for entering the queue.
            load_factor_fee_reference:
              type: integer
              description: The reference transaction cost without any multiplier applied.
            load_factor_server:
              type: integer
              description: The load multiplier the server enforces.
            peers:
              type: integer
              description: The number of connected peer servers.
            ports:
              type: array
              description: The list of ports the server is listening on.
              items:
                type: object
                description: Port information.
                properties:
                  port:
                    type: string
                    description: The port number the server is listening on.
                  protocol:
                    type: array
                    description: The list of protocols served on that port.
                    items:
                      type: string
                      description: The protocol name.
            pubkey_node:
              type: string
              description: The public key used to verify peer-to-peer communication.
            server_state:
              type: string
              description: The server's level of participation in the network.
            server_state_duration_us:
              type: string
              description: The time spent in the current state, in microseconds.
            state_accounting:
              type: object
              description: The accumulated duration and transition count for each server state.
              additionalProperties:
                type: object
                description: Statistics for an individual state.
                properties:
                  duration_us:
                    type: string
                    description: The total time spent in that state, in microseconds.
                  transitions:
                    type: string
                    description: The number of transitions into that state.
            time:
              type: string
              description: The server's current time in UTC.
            uptime:
              type: integer
              description: The time the server has been operating continuously, in seconds.
            validated_ledger:
              $ref: '#/components/schemas/ServerLedgerInfo'
            validation_quorum:
              type: integer
              description: The number of trusted validations required to validate a ledger version.
    SimulateResult:
      type: object
      description: The result of simulating a transaction. It is not committed to the ledger.
      properties:
        tx_json:
          type: object
          description: The simulated transaction with the values the server filled in. Returned when `binary` is `false`.
        tx_blob:
          type: string
          description: The simulated transaction, hex-encoded. Returned when `binary` is `true`.
        ledger_index:
          type: integer
          description: The ledger index the transaction would have been included in.
        meta:
          type: object
          description: The metadata describing the simulation results. Returned when `binary` is `false`.
        meta_blob:
          type: string
          description: The metadata, hex-encoded. Returned when `binary` is `true`.
        engine_result:
          type: string
          description: The result code of the transaction. (e.g.) `tesSUCCESS`
        engine_result_code:
          type: integer
          description: The numeric value corresponding to the result code.
        engine_result_message:
          type: string
          description: A human-readable explanation of the result.
        applied:
          type: boolean
          description: Whether the transaction was applied to the ledger. Because this is a simulation, nothing is actually committed.
    SubmitMultisignedResult:
      type: object
      description: The result of submitting a multi-signed transaction. It is a preliminary result, not the final outcome.
      properties:
        engine_result:
          type: string
          description: The preliminary result code of the transaction. (e.g.) `tesSUCCESS`
        engine_result_code:
          type: integer
          description: The numeric value corresponding to the preliminary result code.
        engine_result_message:
          type: string
          description: A human-readable explanation of the preliminary result.
        tx_blob:
          type: string
          description: The submitted transaction, hex-encoded.
        tx_json:
          type: object
          description: The submitted transaction data.
    SubmitResult:
      type: object
      description: The result of submitting a transaction. It is a preliminary result, not the final outcome.
      properties:
        engine_result:
          type: string
          description: The preliminary result code of the transaction. (e.g.) `tesSUCCESS`
        engine_result_code:
          type: integer
          description: The numeric value corresponding to the preliminary result code.
        engine_result_message:
          type: string
          description: A human-readable explanation of the preliminary result.
        tx_blob:
          type: string
          description: The submitted transaction, hex-encoded.
        tx_json:
          type: object
          description: The submitted transaction data.
        accepted:
          type: boolean
          description: Whether the transaction was applied, queued, broadcast or kept.
        account_sequence_available:
          type: integer
          description: The next sequence number available once pending transactions are taken into account.
        account_sequence_next:
          type: integer
          description: The sequence number to use after the provisionally applied transactions.
        applied:
          type: boolean
          description: Whether the transaction was applied to the open ledger.
        broadcast:
          type: boolean
          description: Whether the transaction was broadcast to peer servers.
        kept:
          type: boolean
          description: Whether the transaction was kept for a later retry.
        queued:
          type: boolean
          description: Whether the transaction was queued for a future ledger version.
        open_ledger_cost:
          type: string
          description: The cost of the open ledger before this transaction was processed, in drops.
        validated_ledger_index:
          type: integer
          description: The index of the most recent validated ledger version at submission time.
    TransactionEntryResult:
      type: object
      description: The result of looking up a single transaction in a specific ledger version.
      properties:
        hash:
          type: string
          description: The unique hash that identifies the transaction.
        ledger_index:
          type: integer
          description: The ledger index where the transaction was found.
        ledger_hash:
          type: string
          description: The hash of the ledger version used.
        close_time_iso:
          type: string
          description: The time the ledger containing the transaction closed, in ISO 8601 format.
        tx_json:
          type: object
          description: The transaction data.
        meta:
          type: object
          description: The metadata describing the results of the transaction.
        validated:
          type: boolean
          description: Whether the response was derived from a validated ledger version.
    TxResult:
      type: object
      description: The result of looking up a single transaction.
      properties:
        ctid:
          type: string
          description: The compact transaction identifier of the transaction.
        close_time_iso:
          type: string
          description: The time the ledger containing the transaction closed, in ISO 8601 format.
        date:
          type: integer
          description: The time the ledger containing the transaction closed, in seconds since the Ripple Epoch.
        hash:
          type: string
          description: The unique hash that identifies the transaction.
        ledger_index:
          type: integer
          description: The ledger index of the ledger containing the transaction.
        ledger_hash:
          type: string
          description: The hash of the ledger containing the transaction.
        meta:
          type: object
          description: The metadata describing the results of the transaction. Returned when `binary` is `false`.
        meta_blob:
          type: string
          description: The metadata, hex-encoded. Returned when `binary` is `true`.
        tx_json:
          type: object
          description: The transaction data. Returned when `binary` is `false`.
        tx_blob:
          type: string
          description: The transaction, hex-encoded. Returned when `binary` is `true`.
        validated:
          type: boolean
          description: Whether the transaction is included in a validated ledger version.
    VaultInfoResult:
      allOf:
      - type: object
        description: The result of looking up a vault.
        properties:
          vault:
            type: object
            description: Detailed vault information.
            properties:
              Account:
                type: string
                description: The pseudo-account address of the vault.
              Asset:
                type: object
                description: Information about the asset the vault handles.
                properties:
                  currency:
                    type: string
                    description: The currency code. Omitted for MPTs.
                  issuer:
                    type: string
                    description: The address of the asset issuer. Omitted for XRP and MPTs.
                  mpt_issuance_id:
                    type: string
                    description: The MPT identifier. Omitted for XRP and trust line tokens.
              AssetsAvailable:
                type: string
                description: The amount of assets available in the vault.
              AssetsMaximum:
                type: string
                description: The maximum amount of assets the vault can hold. A value of 0 means there is no cap.
              AssetsTotal:
                type: string
                description: The total amount of assets in the vault.
              Flags:
                type: integer
                description: A bit-map of flags set on the vault.
              LossUnrealized:
                type: string
                description: The amount of loss that has not been realized yet.
              ShareMPTID:
                type: string
                description: The identifier of the MPTokenIssuance that represents the vault shares.
              WithdrawalPolicy:
                type: string
                description: The withdrawal policy of the vault.
              Scale:
                type: integer
                description: |
                  The number of decimal places used to calculate shares.
                  For trust line tokens it is between 0 and 18; for XRP and MPTs it is fixed at 0.
              index:
                type: string
                description: The ID that identifies the vault ledger entry.
              shares:
                type: object
                description: Issuance information for the vault shares.
                properties:
                  DomainID:
                    type: string
                    description: The ID of the permissioned domain the shares belong to. Omitted for public vaults.
                  Flags:
                    type: integer
                    description: A bit-map of flags set on the share issuance.
                  Issuer:
                    type: string
                    description: The address of the share issuer. It is the same as the vault's pseudo-account.
                  LedgerEntryType:
                    type: string
                    description: The ledger entry type. Always returns `MPTokenIssuance`.
                  OutstandingAmount:
                    type: string
                    description: The total amount of shares issued.
                  OwnerNode:
                    type: string
                    description: The reference page in the owner directory.
                  PreviousTxnID:
                    type: string
                    description: The ID of the transaction that most recently modified this entry.
                  PreviousTxnLgrSeq:
                    type: integer
                    description: The ledger index of the ledger containing the transaction that most recently modified this entry.
                  Sequence:
                    type: integer
                    description: The sequence number of the transaction that created the shares.
                  AssetScale:
                    type: integer
                    description: The number of decimal places used to calculate shares.
                  mpt_issuance_id:
                    type: string
                    description: The MPT identifier. It is the same as the vault's `ShareMPTID`.
                  index:
                    type: string
                    description: The ID that identifies the share ledger entry.
      - $ref: '#/components/schemas/LedgerContext'
    VersionResult:
      type: object
      description: Information about the API versions the server supports.
      properties:
        version:
          type: object
          description: Detailed API version information.
          properties:
            first:
              type: string
              description: The lowest API version the server supports.
            good:
              type: string
              description: The default version used when the request does not specify an API version.
            last:
