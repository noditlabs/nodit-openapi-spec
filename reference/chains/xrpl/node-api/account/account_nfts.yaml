openapi: 3.1.0
info:
  title: XRPL - account_nfts
  version: 1.0.0
servers:
- url: https://xrpl-mainnet.nodit.io
  description: XRP Ledger Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  schemas:
    AccountChannelsResult:
      allOf:
      - type: object
        description: The result of looking up the Payment Channels owned by an account.
        properties:
          account:
            type: string
            description: The address of the account that owns and funds the channel.
          channels:
            type: array
            description: The list of Payment Channels owned by the account.
            items:
              type: object
              description: Payment Channel data.
              properties:
                account:
                  type: string
                  description: The address of the channel owner.
                amount:
                  type: string
                  description: The total amount held in the channel, in drops.
                balance:
                  type: string
                  description: The amount already paid out to the destination, in drops.
                channel_id:
                  type: string
                  description: The 64-character hex string that identifies the channel.
                destination_account:
                  type: string
                  description: The address of the channel's destination account.
                settle_delay:
                  type: integer
                  description: The time the channel stays open after a close request, in seconds.
                public_key:
                  type: string
                  description: The base58-encoded public key.
                public_key_hex:
                  type: string
                  description: The hex-encoded public key.
                expiration:
                  type: integer
                  description: The mutable expiration time of the channel, in seconds since the Ripple Epoch.
                cancel_after:
                  type: integer
                  description: The immutable expiration time of the channel, in seconds since the Ripple Epoch.
                source_tag:
                  type: integer
                  description: The 32-bit tag that identifies the payment source.
                destination_tag:
                  type: integer
                  description: The 32-bit tag that identifies the payment destination.
          limit:
            type: integer
            description: The number of channel objects returned.
          marker:
            $ref: '#/components/schemas/Marker'
      - $ref: '#/components/schemas/LedgerContext'
    AccountCurrenciesResult:
      allOf:
      - type: object
        description: The result of looking up the currencies an account can send or receive.
        properties:
          receive_currencies:
            type: array
            description: The list of currency codes this account can receive.
            items:
              type: string
              description: The currency code.
          send_currencies:
            type: array
            description: The list of currency codes this account can send.
            items:
              type: string
              description: The currency code.
      - $ref: '#/components/schemas/LedgerContext'
    AccountInfoResult:
      allOf:
      - type: object
        description: The result of looking up account information.
        properties:
          account_data:
            type: object
            description: The AccountRoot ledger object for the account.
            properties:
              Account:
                type: string
                description: The account address.
              Balance:
                type: string
                description: The XRP balance of the account, in drops.
              Flags:
                type: integer
                description: A bit-map of boolean flags enabled for the account.
              LedgerEntryType:
                type: string
                description: The ledger entry type. Always returns `AccountRoot`.
              OwnerCount:
                type: integer
                description: The number of ledger objects owned by the account that count toward its reserve.
              PreviousTxnID:
                type: string
                description: The ID of the transaction that most recently modified this object.
              PreviousTxnLgrSeq:
                type: integer
                description: The ledger index of the ledger containing the transaction that most recently modified this object.
              Sequence:
                type: integer
                description: The next sequence number the account will use for a transaction.
              index:
                type: string
                description: The ID that identifies this ledger entry.
          account_flags:
            type: object
            description: The enabled state of each account flag.
            properties:
              defaultRipple:
                type: boolean
                description: Whether rippling is enabled by default for tokens issued by this account.
              depositAuth:
                type: boolean
                description: Whether Deposit Authorization is enabled.
              disableMasterKey:
                type: boolean
                description: Whether use of the master key is disabled.
              disallowIncomingCheck:
                type: boolean
                description: Whether incoming Checks are blocked.
              disallowIncomingNFTokenOffer:
                type: boolean
                description: Whether incoming NFToken offers are blocked.
              disallowIncomingPayChan:
                type: boolean
                description: Whether incoming Payment Channels are blocked.
              disallowIncomingTrustline:
                type: boolean
                description: Whether incoming trust lines are blocked.
              disallowIncomingXRP:
                type: boolean
                description: Whether the account is marked as discouraging incoming XRP.
              globalFreeze:
                type: boolean
                description: Whether all tokens issued by this account are frozen.
              noFreeze:
                type: boolean
                description: Whether the ability to freeze has been permanently given up.
              passwordSpent:
                type: boolean
                description: Whether the free key change has been used.
              requireAuthorization:
                type: boolean
                description: Whether the issuer's authorization is required to use a trust line.
              requireDestinationTag:
                type: boolean
                description: Whether incoming payments require a destination tag.
          signer_lists:
            type: array
            description: |
              The list of SignerList objects associated with the account.
              In API v1 it is returned under `account_data`; in API v2 and Clio it is returned at the root level.
            items:
              type: object
              description: A SignerList ledger object.
          queue_data:
            type: object
            description: Data on this account's queued transactions. Returned when `queue` is set to `true` in the request.
            properties:
              txn_count:
                type: integer
                description: The number of queued transactions.
              auth_change_queued:
                type: boolean
                description: Whether any queued transaction changes signing authority.
              lowest_sequence:
                type: integer
                description: The lowest sequence number among the queued transactions.
              highest_sequence:
                type: integer
                description: The highest sequence number among the queued transactions.
              max_spend_drops_total:
                type: string
                description: The maximum total XRP the queued transactions could debit, in drops.
              transactions:
                type: array
                description: Data for an individual queued transaction.
                items:
                  type: object
                  description: Data for a queued transaction.
      - $ref: '#/components/schemas/LedgerContext'
    AccountLinesResult:
      allOf:
      - type: object
        description: The result of looking up an account's trust lines.
        properties:
          account:
            type: string
            description: The account the request was made from the perspective of.
          lines:
            type: array
            description: The list of trust lines.
            items:
              type: object
              description: Trust line data.
              properties:
                account:
                  type: string
                  description: The address of the counterparty on this trust line.
                balance:
                  type: string
                  description: |
                    The current balance. A positive value is owed to this account by the counterparty; a negative value is owed by this account.
                currency:
                  type: string
                  description: The currency code of the token this trust line holds.
                limit:
                  type: string
                  description: The maximum amount this account is willing to owe the counterparty.
                limit_peer:
                  type: string
                  description: The maximum amount the counterparty is willing to owe this account.
                quality_in:
                  type: integer
                  description: The valuation ratio applied to incoming balances.
                quality_out:
                  type: integer
                  description: The valuation ratio applied to outgoing balances.
                no_ripple:
                  type: boolean
                  description: Whether this account has enabled the No Ripple flag.
                no_ripple_peer:
                  type: boolean
                  description: Whether the counterparty has enabled the No Ripple flag.
                authorized:
                  type: boolean
                  description: Whether this account has authorized the trust line.
                peer_authorized:
                  type: boolean
                  description: Whether the counterparty has authorized the trust line.
                freeze:
                  type: boolean
                  description: Whether this account has frozen the trust line.
                freeze_peer:
                  type: boolean
                  description: Whether the counterparty has frozen the trust line.
          limit:
            type: integer
            description: The limit value used in the request.
          marker:
            $ref: '#/components/schemas/Marker'
      - $ref: '#/components/schemas/LedgerContext'
    AccountNftsResult:
      allOf:
      - type: object
        description: The result of looking up the NFTokens held by an account.
        properties:
          account:
            type: string
            description: The address of the account that owns the NFTokens.
          account_nfts:
            type: array
            description: The list of NFTokens held by the account.
            items:
              type: object
              description: NFToken data.
              properties:
                Flags:
                  type: integer
                  description: A bit-map of boolean flags enabled for the NFToken.
                Issuer:
                  type: string
                  description: The address of the account that issued the NFToken.
                NFTokenID:
                  type: string
                  description: The hex string that identifies the NFToken.
                NFTokenTaxon:
                  type: integer
                  description: The taxon assigned by the issuer. Tokens sharing a taxon may belong to the same series.
                URI:
                  type: string
                  description: The URI of the NFToken, hex-encoded.
                nft_serial:
                  type: integer
                  description: The serial number of the NFToken, unique to its issuer.
          limit:
            type: integer
            description: The limit value used in the request.
          marker:
            $ref: '#/components/schemas/Marker'
      - $ref: '#/components/schemas/LedgerContext'
    AccountObjectsResult:
      allOf:
      - type: object
        description: The result of looking up the ledger entries owned by an account.
        properties:
          account:
            type: string
            description: The account the request was made from the perspective of.
          account_objects:
            type: array
            description: |
              The list of ledger entries owned by the account. The field composition varies by entry type.
              Entries shared between two accounts, such as trust lines, may include ones owned by the counterparty.
            items:
              type: object
              description: A ledger entry.
              properties:
                LedgerEntryType:
                  type: string
                  description: The type of the ledger entry.
                index:
                  type: string
                  description: The ID that identifies the ledger entry.
                PreviousTxnID:
                  type: string
                  description: The ID of the transaction that most recently modified this entry.
                PreviousTxnLgrSeq:
                  type: integer
                  description: The ledger index of the ledger containing the transaction that most recently modified this entry.
          limit:
            type: integer
            description: The limit value used in the request.
          marker:
            $ref: '#/components/schemas/Marker'
      - $ref: '#/components/schemas/LedgerContext'
    AccountOffersResult:
      allOf:
      - type: object
        description: The result of looking up the outstanding offers created by an account.
        properties:
          account:
            type: string
            description: The address of the account that created the offer.
          offers:
            type: array
            description: The list of outstanding offers.
            items:
              type: object
              description: Offer data.
              properties:
                flags:
                  type: integer
                  description: A bit-map of flags enabled for the offer.
                seq:
                  type: integer
                  description: The sequence number of the transaction that created the offer.
                taker_gets:
                  $ref: '#/components/schemas/CurrencyAmount'
                taker_pays:
                  $ref: '#/components/schemas/CurrencyAmount'
                quality:
                  type: string
                  description: The exchange rate of the offer, calculated as `taker_pays` divided by `taker_gets`.
                expiration:
                  type: integer
                  description: The expiration time of the offer, in seconds since the Ripple Epoch. Returned only when an expiration is set.
          limit:
            type: integer
            description: The limit value used in the request.
          marker:
            $ref: '#/components/schemas/Marker'
      - $ref: '#/components/schemas/LedgerContext'
    AccountTxResult:
      type: object
      description: The result of looking up validated transactions involving an account.
      properties:
        account:
          type: string
          description: The account the request was made from the perspective of.
        ledger_index_min:
          type: integer
          description: The oldest ledger index actually searched.
        ledger_index_max:
          type: integer
          description: The most recent ledger index actually searched.
        limit:
          type: integer
          description: The limit value used in the request.
        marker:
          $ref: '#/components/schemas/Marker'
        transactions:
          type: array
          description: The list of transactions that matched the query.
          items:
            type: object
            description: Transaction data.
            properties:
              close_time_iso:
                type: string
                description: The time the ledger containing the transaction closed, in ISO 8601 format.
              hash:
                type: string
                description: The unique hash that identifies the transaction.
              ledger_hash:
                type: string
                description: The hash of the ledger containing the transaction.
              ledger_index:
                type: integer
                description: The ledger index of the ledger containing the transaction.
              tx_json:
                type: object
                description: The transaction data. Returned when `binary` is `false`.
              tx_blob:
                type: string
                description: The transaction, hex-encoded. Returned when `binary` is `true`.
              meta:
                type: object
                description: The metadata describing the results of the transaction. Returned when `binary` is `false`.
              meta_blob:
                type: string
                description: The metadata, hex-encoded. Returned when `binary` is `true`.
              validated:
                type: boolean
                description: Whether the transaction is included in a validated ledger version.
        validated:
          type: boolean
          description: Whether the response was derived from a validated ledger version.
    AggregatePriceResult:
      type: object
      description: The result of aggregating Oracle prices.
      properties:
        entire_set:
          type: object
          description: Statistics computed over every Oracle price collected.
          properties:
            mean:
              type: string
              description: The arithmetic mean.
            size:
              type: integer
              description: The number of data points used to compute the mean.
            standard_deviation:
              type: string
              description: The standard deviation of the price distribution.
        trimmed_set:
          type: object
          description: Statistics computed with outliers excluded. Returned only when `trim` is specified in the request.
          properties:
            mean:
              type: string
              description: The arithmetic mean with outliers excluded.
            size:
              type: integer
              description: The number of data points with outliers excluded.
            standard_deviation:
              type: string
              description: The standard deviation of the price distribution with outliers excluded.
        median:
          type: string
          description: The median of the prices collected.
        time:
          type: integer
          description: The most recent update time among the Oracles used, in Unix timestamp seconds.
    AmmInfoResult:
      allOf:
      - type: object
        description: The result of looking up an AMM instance.
        properties:
          amm:
            type: object
            description: Detailed AMM information.
            properties:
              account:
                type: string
                description: The special account address of the AMM. It is also the issuer of the LP tokens.
              amount:
                $ref: '#/components/schemas/CurrencyAmount'
              amount2:
                $ref: '#/components/schemas/CurrencyAmount'
              asset_frozen:
                type: boolean
                description: Whether the first asset is frozen.
              asset2_frozen:
                type: boolean
                description: Whether the second asset is frozen.
              auction_slot:
                type: object
                description: Information about the trading fee discount auction slot.
                properties:
                  account:
                    type: string
                    description: The address of the account that currently holds the slot.
                  discounted_fee:
                    type: integer
                    description: The discounted fee applied to the slot holder, in units of 1/100,000.
                  price:
                    $ref: '#/components/schemas/CurrencyAmount'
                  time_interval:
                    type: integer
                    description: The current time interval of the auction slot.
                  expiration:
                    type: string
                    description: The time the slot expires, in ISO 8601 format.
                  auth_accounts:
                    type: array
                    description: The list of accounts designated to also receive the discounted fee.
                    items:
                      type: object
                      description: Information about a designated account.
                      properties:
                        account:
                          type: string
                          description: The account address.
              lp_token:
                $ref: '#/components/schemas/CurrencyAmount'
              trading_fee:
                type: integer
                description: The trading fee of the AMM, in units of 1/100,000.
              vote_slots:
                type: array
                description: The current state of trading fee voting.
                items:
                  type: object
                  description: Information about an individual vote.
                  properties:
                    account:
                      type: string
                      description: The address of the account that voted.
                    trading_fee:
                      type: integer
                      description: The trading fee that account voted for, in units of 1/100,000.
                    vote_weight:
                      type: integer
                      description: The weight of the vote.
      - $ref: '#/components/schemas/LedgerContext'
    Asset:
      type: object
      description: Specifies an asset by currency code and issuer. Omit `issuer` for XRP.
      properties:
        currency:
          type: string
          description: The currency code. Pass `XRP` for XRP.
        issuer:
          type: string
          description: The address of the account that issued the token. Omit for XRP.
    BookChangesResult:
      type: object
      description: Information about order book changes compared with the previous ledger version.
      properties:
        changes:
          type: array
          description: The list of order book changes.
          items:
            type: object
            description: Change information for a currency pair.
            properties:
              currency_a:
                type: string
                description: The first currency identifier. XRP uses `XRP_drops`; tokens use the `issuer/currency` format.
              currency_b:
                type: string
                description: The second currency identifier. Only tokens are specified.
              volume_a:
                type: string
                description: The total traded volume of the first currency.
              volume_b:
                type: string
                description: The total traded volume of the second currency.
              high:
                type: string
                description: The highest exchange rate recorded in this ledger version.
              low:
                type: string
                description: The lowest exchange rate recorded in this ledger version.
              open:
                type: string
                description: The exchange rate before the ledger was processed.
              close:
                type: string
                description: The exchange rate after the ledger was processed.
        ledger_hash:
          type: string
          description: The hash of the ledger version used.
        ledger_index:
          type: integer
          description: The ledger index of the version used.
        ledger_time:
          type: integer
          description: The official close time of the ledger, in seconds since the Ripple Epoch.
        type:
          type: string
          description: The response type. Always returns `bookChanges`.
        validated:
          type: boolean
          description: Whether the response was derived from a validated ledger version.
    BookOffersResult:
      allOf:
      - type: object
        description: The result of looking up the order book between two currencies.
        properties:
          offers:
            type: array
            description: The list of offers in the order book.
            items:
              type: object
              description: Offer data.
              properties:
                Account:
                  type: string
                  description: The address of the account that created the offer.
                TakerGets:
                  $ref: '#/components/schemas/CurrencyAmount'
                TakerPays:
                  $ref: '#/components/schemas/CurrencyAmount'
                BookDirectory:
                  type: string
                  description: The ID of the order book directory this offer belongs to.
                Flags:
                  type: integer
                  description: A bit-map of flags enabled for the offer.
                Sequence:
                  type: integer
                  description: The sequence number of the transaction that created the offer.
                index:
                  type: string
                  description: The ID that identifies this offer ledger entry.
                quality:
                  type: string
                  description: The exchange rate of the offer, calculated as `taker_pays` divided by `taker_gets`.
                owner_funds:
                  type: string
                  description: |
                    The tradeable balance held by the offer's creator.
                    It is returned only for the highest-ranked offer among the offers from the same account.
                taker_gets_funded:
                  $ref: '#/components/schemas/CurrencyAmount'
                taker_pays_funded:
                  $ref: '#/components/schemas/CurrencyAmount'
      - $ref: '#/components/schemas/LedgerContext'
    CurrencyAmount:
      description: |
        Represents an amount. XRP is expressed as a string in drops; tokens are expressed as an object.
      oneOf:
      - title: XRP Amount
        type: string
        description: An XRP amount in drops. 1 XRP equals 1,000,000 drops.
        example: "10000000"
      - title: Token Amount
        type: object
        description: A token amount.
        properties:
          currency:
            type: string
            description: The currency code. Either a 3-character code or a 40-character hex string.
          issuer:
            type: string
            description: The address of the account that issued the token.
          value:
            type: string
            description: The amount expressed as a string.
    DepositAuthorizedResult:
      allOf:
      - type: object
        description: The result of checking whether direct payments between accounts are authorized.
        properties:
          deposit_authorized:
            type: boolean
            description: Whether the source account is authorized to send payments directly to the destination account.
          source_account:
            type: string
            description: The source account address from the request.
          destination_account:
            type: string
            description: The destination account address from the request.
          credentials:
            type: array
            description: The credentials from the request. Returned only when they were provided.
            items:
              type: string
              description: The ID of a credential ledger entry.
      - $ref: '#/components/schemas/LedgerContext'
    FeatureResult:
      type: object
      x-map-key-label: amendment ID
      description: |
        Information about the amendments the server knows about, as an object keyed by amendment ID.
        When `feature` is specified in the request, only that amendment is returned.
      additionalProperties:
        type: object
        description: The status of an individual amendment.
        properties:
          enabled:
            type: boolean
            description: Whether the amendment is enabled in the latest ledger version.
          name:
            type: string
            description: |
              The name of the amendment. Omitted when the server does not know the name.
              The name does not strictly indicate what the amendment does, and it can differ between servers.
          supported:
            type: boolean
            description: |
              Whether the server is able to apply this amendment.
              If `enabled` is `true` while this value is `false`, the server may become amendment blocked.
    FeeResult:
      type: object
      description: Information about the transaction cost requirements of the open ledger.
      properties:
        current_ledger_size:
          type: string
          description: The number of transactions provisionally included in the in-progress ledger.
        current_queue_size:
          type: string
          description: The number of transactions queued for the next ledger version.
        drops:
          type: object
          description: The transaction cost expressed in drops.
          properties:
            base_fee:
              type: string
              description: The cost required for a reference transaction to be included in a ledger under minimum load.
            median_fee:
              type: string
              description: An approximation of the median transaction cost from the previous validated ledger version.
            minimum_fee:
              type: string
              description: The minimum cost for a reference transaction to be queued for a later ledger version.
            open_ledger_fee:
              type: string
              description: The minimum cost for a reference transaction to be included in the current open ledger.
        expected_ledger_size:
          type: string
          description: The transaction count anticipated based on the previous ledger version.
        ledger_current_index:
          type: integer
          description: The ledger index of the current open ledger.
        levels:
          type: object
          description: The transaction cost expressed in fee levels.
          properties:
            median_level:
              type: string
              description: The median cost of the previous ledger version expressed in fee levels.
            minimum_level:
              type: string
              description: The minimum cost to be queued expressed in fee levels.
            open_ledger_level:
              type: string
              description: The minimum cost for inclusion in the current ledger expressed in fee levels.
            reference_level:
              type: string
              description: The fee level equivalent to the minimum cost of a reference transaction.
        max_queue_size:
          type: string
          description: The maximum capacity of the transaction queue.
    GatewayBalancesResult:
      allOf:
      - type: object
        description: The result of aggregating the balances issued by an account.
        properties:
          account:
            type: string
            description: The address of the account that issued the balances.
          obligations:
            type: object
            description: |
              The total amounts issued to addresses that were not excluded, as an object keyed by currency code with amount strings as values.
            additionalProperties:
              type: string
              description: The total amount issued in that currency.
          balances:
            type: object
            description: |
              The amounts held by the operational addresses specified as `hotwallet`, as an object keyed by address with amount lists as values.
            additionalProperties:
              type: array
              description: The list of amounts held by that address.
              items:
                type: object
                description: An amount held, by currency.
                properties:
                  currency:
                    type: string
                    description: The currency code.
                  value:
                    type: string
                    description: The amount held.
          assets:
            type: object
            description: |
              The amounts this account holds that were issued by others, as an object keyed by issuer address with amount lists as values.
            additionalProperties:
              type: array
              description: The list of amounts held from that issuer.
              items:
                type: object
                description: An amount held, by currency.
                properties:
                  currency:
                    type: string
                    description: The currency code.
                  value:
                    type: string
                    description: The amount held.
      - $ref: '#/components/schemas/LedgerContext'
    LedgerContext:
      type: object
      description: Common fields that indicate which ledger version the response was derived from.
      properties:
        ledger_hash:
          type: string
          description: The hash of the ledger version used. Returned when a validated ledger version was queried.
        ledger_index:
          type: integer
          description: The ledger index of the version used. Returned when a validated ledger version was queried.
        ledger_current_index:
          type: integer
          description: The ledger index of the in-progress ledger. Returned when the `current` ledger was queried.
        validated:
          type: boolean
          description: Whether the response was derived from a validated ledger version.
    LedgerDataResult:
      allOf:
      - type: object
        description: The result of looking up the ledger state tree.
        properties:
          ledger:
            $ref: '#/components/schemas/LedgerHeader'
          state:
            type: array
            description: The list of entries in the ledger state tree.
            items:
              type: object
              description: |
                A ledger entry. When `binary` is `true`, only `data` and `index` are returned;
                when it is `false`, the fields for the entry type are returned as well.
              properties:
                data:
                  type: string
                  description: The entry, hex-encoded. Returned when `binary` is `true`.
                LedgerEntryType:
                  type: string
                  description: The type of the ledger entry. Returned when `binary` is `false`.
                index:
                  type: string
                  description: The ID that identifies the ledger entry.
          marker:
            $ref: '#/components/schemas/Marker'
      - $ref: '#/components/schemas/LedgerContext'
    LedgerEntryResult:
      type: object
      description: The result of looking up a single ledger entry.
      properties:
        index:
          type: string
          description: The ID that identifies the ledger entry.
        ledger_index:
          type: integer
          description: The ledger index of the version used.
        ledger_hash:
          type: string
          description: The hash of the ledger version used.
        node:
          type: object
          description: The ledger entry expressed as JSON. Omitted when `binary` is `true`.
        node_binary:
          type: string
          description: The ledger entry, hex-encoded. Returned only when `binary` is `true`.
        validated:
          type: boolean
          description: Whether the response was derived from a validated ledger version.
    LedgerHeader:
      type: object
      description: Ledger header information.
      properties:
        account_hash:
          type: string
          description: The hash of the entire account state information.
        close_flags:
          type: integer
          description: A bit-map of the flags applied when the ledger closed.
        close_time:
          type: integer
          description: The time the ledger closed, in seconds since the Ripple Epoch.
        close_time_human:
          type: string
          description: The time the ledger closed, as a human-readable UTC string.
        close_time_iso:
          type: string
          description: The time the ledger closed, in ISO 8601 format.
        close_time_resolution:
          type: integer
          description: The rounding interval applied to ledger close times, in seconds.
        closed:
          type: boolean
          description: Whether the ledger version is closed.
        ledger_hash:
          type: string
          description: The unique hash that identifies the ledger version.
        ledger_index:
          type: string
          description: The ledger index.
        parent_close_time:
          type: integer
          description: The time the previous ledger closed, in seconds since the Ripple Epoch.
        parent_hash:
          type: string
          description: The hash of the previous ledger version.
        total_coins:
          type: string
          description: The total amount of XRP in the network, in drops.
        transaction_hash:
          type: string
          description: The hash of all transactions included in this ledger version.
        transactions:
          type: array
          description: The list of transactions included in the ledger. Returned when `transactions` is set to `true` in the request.
          items:
            description: A transaction hash string or a transaction object.
    LedgerIndex:
      description: |
        Specifies the ledger version to use. Pass a ledger index as an integer, or use one of the shortcut strings below.
        - `validated`: Uses the most recent ledger version validated by the network.
        - `closed`: Uses the most recent ledger version the server has closed. It may not be validated.
        - `current`: Uses the in-progress ledger version the server is currently building.
      oneOf:
      - title: Ledger Index
        type: integer
        description: The ledger index of the version to use.
      - title: Shortcut
        type: string
        description: A shortcut string that specifies the ledger version to use.
        enum:
        - validated
        - closed
        - current
    LedgerResult:
      allOf:
      - type: object
        description: The result of looking up ledger information.
        properties:
          ledger:
            $ref: '#/components/schemas/LedgerHeader'
          queue_data:
            type: array
            description: The list of queued transactions. Returned when `queue` is set to `true` in the request.
            items:
              type: object
              description: Data for a queued transaction.
              properties:
                account:
                  type: string
                  description: The address of the account that submitted the transaction.
                tx:
                  type: object
                  description: The transaction data.
                retries_remaining:
                  type: integer
                  description: The number of retries remaining.
                preflight_result:
                  type: string
                  description: The result code from preliminary validation.
                last_result:
                  type: string
                  description: The result code from the previous attempt.
                auth_change:
                  type: boolean
                  description: Whether the transaction changes the account's signing authority.
                fee:
                  type: string
                  description: The transaction cost, in drops.
                fee_level:
                  type: string
                  description: The transaction cost expressed in fee levels.
                max_spend_drops:
                  type: string
                  description: The maximum amount this transaction could spend, in drops.
      - $ref: '#/components/schemas/LedgerContext'
    ManifestResult:
      type: object
      description: Manifest information for a validator.
      properties:
        details:
          type: object
          description: Detailed manifest data. Omitted when the manifest is unavailable.
          properties:
            domain:
              type: string
              description: The domain name claimed by the validator. Returns an empty string when absent.
            ephemeral_key:
              type: string
              description: The base58-encoded ephemeral public key.
            master_key:
              type: string
              description: The base58-encoded master public key.
            seq:
              type: integer
              description: The sequence number of the manifest. It increments each time the manifest is updated.
        manifest:
          type: string
          description: The full manifest, base64-encoded. Omitted when the manifest is unavailable.
        requested:
          type: string
          description: Echoes the public key provided in the request.
    Marker:
      description: |
        A value that marks a pagination position. Pass the `marker` value from a previous response to retrieve the next page.
        Its format depends on the server implementation, so use it verbatim without interpreting its contents.
    NftOffersResult:
      type: object
      description: The result of looking up the offers on an NFToken.
      properties:
        nft_id:
          type: string
          description: The identifier of the NFToken from the request.
        offers:
          type: array
          description: The list of offers.
          items:
            type: object
            description: Offer data.
            properties:
              amount:
                $ref: '#/components/schemas/CurrencyAmount'
              flags:
                type: integer
                description: A bit-map of flags enabled for the offer.
              nft_offer_index:
                type: string
                description: The ID that identifies this offer ledger entry.
              owner:
                type: string
                description: The address of the account that created the offer.
              destination:
                type: string
                description: The address of the account designated to accept this offer. Returned only when one is designated.
              expiration:
                type: integer
                description: The expiration time of the offer, in seconds since the Ripple Epoch. Returned only when an expiration is set.
        limit:
          type: integer
          description: The limit value used in the request.
        marker:
          $ref: '#/components/schemas/Marker'
    NoRippleCheckResult:
      type: object
      description: The result of checking the Default Ripple setting and the No Ripple flags of an account's trust lines.
      properties:
        ledger_current_index:
          type: integer
          description: The ledger index used for the check.
        problems:
          type: array
          description: |
            The list of problems found, described in human-readable sentences.
            At most one Default Ripple problem is reported; trust line problems are reported up to the request's `limit`.
          items:
            type: string
            description: A problem description.
        transactions:
          type: array
          description: |
            The list of transactions suggested to resolve the problems.
            It is returned when `transactions` is set to `true` in the request, and has the same length as `problems`.
          items:
            type: object
            description: A suggested transaction.
        validated:
          type: boolean
          description: Whether the response was derived from a validated ledger version.
    RipplePathFindResult:
      type: object
      description: The result of finding a payment path.
      properties:
        alternatives:
          type: array
          description: The list of available payment paths.
          items:
            type: object
            description: Information about an individual payment path.
            properties:
              paths_computed:
                type: array
                description: The list of step arrays that make up the payment paths.
                items:
                  type: array
                  description: The list of steps that make up a single payment path.
                  items:
                    type: object
                    description: A step in a payment path.
                    properties:
                      account:
                        type: string
                        description: The address of the account that intermediates this step.
                      currency:
                        type: string
                        description: The currency code used in this step.
                      issuer:
                        type: string
                        description: The address of the issuer of the currency used in this step.
                      type:
                        type: integer
                        description: A bit-map that indicates the step type.
              source_amount:
                $ref: '#/components/schemas/CurrencyAmount'
              destination_amount:
                $ref: '#/components/schemas/CurrencyAmount'
        destination_account:
          type: string
          description: The destination account address from the request.
        destination_currencies:
          type: array
          description: The list of currency codes the destination account can receive.
          items:
            type: string
            description: The currency code. Either a 3-character code or a 40-character hex string.
        ledger_current_index:
          type: integer
          description: The ledger index of the version used.
        validated:
          type: boolean
          description: Whether the response was derived from a validated ledger version.
    ServerDefinitionsResult:
      type: object
      description: |
        The `definitions.json` data in SDK-compatible form. Use it to serialize and deserialize binary data.
      properties:
        FIELDS:
          type: array
          description: The list of field definitions. Each item consists of a field name and its serialization metadata.
          items:
            description: An item consisting of a field name and its metadata.
        TRANSACTION_FORMATS:
          type: object
          description: The structure definition for each transaction type.
        LEDGER_ENTRY_FORMATS:
          type: object
          description: The structure definition for each ledger entry type.
        TRANSACTION_FLAGS:
          type: object
          description: The flag values for each transaction type.
        LEDGER_ENTRY_FLAGS:
          type: object
          description: The flag values for ledger entries.
        ACCOUNT_SET_FLAGS:
          type: object
          description: The flag values for the AccountSet transaction.
        TRANSACTION_RESULTS:
          type: object
          description: The mapping between transaction result codes and their numeric values.
        TYPES:
          type: object
          description: The mapping between serialization type names and their numeric values.
        hash:
          type: string
          description: The hash of this set of definitions. The body is omitted when it matches the `hash` in the request.
    ServerInfoResult:
      type: object
      description: Server state information in a human-readable form.
      properties:
        info:
          type: object
          description: Detailed server state information.
          properties:
            amendment_blocked:
              type: boolean
              description: Whether the server is amendment blocked. Returned only in that state.
            build_version:
              type: string
              description: The version of the running server.
            closed_ledger:
              $ref: '#/components/schemas/ServerLedgerInfo'
            complete_ledgers:
              type: string
              description: The range of ledger indexes the server holds. Returns `empty` when it holds none.
            hostid:
              type: string
              description: The server's hostname, or an RFC-1751 word derived from the node public key.
            io_latency_ms:
              type: integer
              description: The I/O wait time, in milliseconds.
            jq_trans_overflow:
              type: string
              description: The number of times the transaction queue has overflowed since the server started.
            last_close:
              type: object
              description: Consensus information from the previous ledger close.
              properties:
                converge_time_s:
                  type: number
                  description: The time taken to reach consensus, in seconds.
                proposers:
                  type: integer
                  description: The number of validators that participated in consensus.
            load_factor:
              type: number
              description: The transaction cost multiplier currently in effect.
            load_factor_fee_escalation:
              type: number
              description: The cost multiplier for inclusion in the open ledger.
            load_factor_fee_queue:
              type: number
              description: The cost multiplier for entering the queue.
            load_factor_fee_reference:
              type: number
              description: The reference transaction cost without any multiplier applied.
            load_factor_local:
              type: number
              description: The cost multiplier caused by this server's load.
            load_factor_net:
              type: number
              description: The cost multiplier caused by network-wide load.
            load_factor_cluster:
              type: number
              description: The cost multiplier caused by cluster load.
            load_factor_server:
              type: number
              description: The cost multiplier the server enforces.
            network_ledger:
              type: string
              description: Returns `waiting` while the server is syncing with the network.
            peers:
              type: integer
              description: The number of connected peer servers.
            ports:
              type: array
              description: The list of ports the server is listening on.
              items:
                type: object
                description: Port information.
                properties:
                  port:
                    type: string
                    description: The port number the server is listening on.
                  protocol:
                    type: array
                    description: The list of protocols served on that port.
                    items:
                      type: string
                      description: The protocol name.
            pubkey_node:
              type: string
              description: The public key used to verify peer-to-peer communication.
            server_state:
              type: string
              description: The server's level of participation in the network.
            server_state_duration_us:
              type: string
              description: The time spent in the current state, in microseconds.
            state_accounting:
              type: object
              description: The accumulated duration and transition count for each server state.
              additionalProperties:
                type: object
                description: Statistics for an individual state.
                properties:
                  duration_us:
                    type: string
                    description: The total time spent in that state, in microseconds.
                  transitions:
                    type: string
                    description: The number of transitions into that state.
            time:
              type: string
              description: The server's current time in UTC.
            uptime:
              type: integer
              description: The time the server has been operating continuously, in seconds.
            validated_ledger:
              $ref: '#/components/schemas/ServerLedgerInfo'
            validation_quorum:
              type: integer
              description: The number of trusted validations required to validate a ledger version.
            counters:
              type: object
              description: RPC and job queue performance metrics. Returned when `counters` is set to `true` in the request.
            current_activity:
              type: object
              description: Information about the job queue items and API methods currently running. Returned when `counters` is set to `true` in the request.
    ServerLedgerInfo:
      type: object
