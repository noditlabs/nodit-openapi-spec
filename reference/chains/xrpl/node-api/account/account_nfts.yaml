openapi: 3.1.0
info:
  title: XRPL - account_nfts
  version: 1.0.0
servers:
- url: https://xrpl-mainnet.nodit.io
  description: XRP Ledger Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  schemas:
    AccountNftsResult:
      allOf:
      - type: object
        description: The result of looking up the NFTokens held by an account.
        properties:
          account:
            type: string
            description: The address of the account that owns the NFTokens.
          account_nfts:
            type: array
            description: The list of NFTokens held by the account.
            items:
              type: object
              description: NFToken data.
              properties:
                Flags:
                  type: integer
                  description: A bit-map of boolean flags enabled for the NFToken.
                Issuer:
                  type: string
                  description: The address of the account that issued the NFToken.
                NFTokenID:
                  type: string
                  description: The hex string that identifies the NFToken.
                NFTokenTaxon:
                  type: integer
                  description: The taxon assigned by the issuer. Tokens sharing a taxon may belong to the same series.
                URI:
                  type: string
                  description: The URI of the NFToken, hex-encoded.
                nft_serial:
                  type: integer
                  description: The serial number of the NFToken, unique to its issuer.
          limit:
            type: integer
            description: The limit value used in the request.
          marker:
            $ref: '#/components/schemas/Marker'
      - $ref: '#/components/schemas/LedgerContext'
    LedgerContext:
      type: object
      description: Common fields that indicate which ledger version the response was derived from.
      properties:
        ledger_hash:
          type: string
          description: The hash of the ledger version used. Returned when a validated ledger version was queried.
        ledger_index:
          type: integer
          description: The ledger index of the version used. Returned when a validated ledger version was queried.
        ledger_current_index:
          type: integer
          description: The ledger index of the in-progress ledger. Returned when the `current` ledger was queried.
        validated:
          type: boolean
          description: Whether the response was derived from a validated ledger version.
    LedgerIndex:
      description: |
        Specifies the ledger version to use. Pass a ledger index as an integer, or use one of the shortcut strings below.
        - `validated`: Uses the most recent ledger version validated by the network.
        - `closed`: Uses the most recent ledger version the server has closed. It may not be validated.
        - `current`: Uses the in-progress ledger version the server is currently building.
      oneOf:
      - title: Ledger Index
        type: integer
        description: The ledger index of the version to use.
      - title: Shortcut
        type: string
        description: A shortcut string that specifies the ledger version to use.
        enum:
        - validated
        - closed
        - current
    Marker:
      description: |
        A value that marks a pagination position. Pass the `marker` value from a previous response to retrieve the next page.
        Its format depends on the server implementation, so use it verbatim without interpreting its contents.
  responses:
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - NO_AUTHENTICATION_FOUND
                - AUTHENTICATION_FAILED
                description: Code to identify the cause of authentication failure
              message:
                type: string
                description: Detailed message including the cause of authentication failure
            required:
            - code
            - message
          examples:
            NO_AUTHENTICATION_FOUND:
              summary: The request does not include authentication (API Key)
              value:
                code: NO_AUTHENTICATION_FOUND
                message: No authentication found.
            AUTHENTICATION_FAILED:
              summary: The authentication (API Key) is invalid
              value:
                code: AUTHENTICATION_FAILED
                message: Authentication failed.
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - PERMISSION_DENIED
                description: Code indicating permission denied
              message:
                type: string
                description: Detailed message including information about the denied resource
            required:
            - code
            - message
          examples:
            PERMISSION_DENIED:
              summary: The request accesses a resource it is not authorized for
              value:
                code: PERMISSION_DENIED
                message: Permission denied
    "429":
      description: Too Many Requests
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_MANY_REQUESTS
                - EXCEEDED_QUOTA_LIMIT
                description: Code identifying the cause of the request limit exceeded
              message:
                type: string
                description: Detailed message including the exceeded limit type and allowed threshold
            required:
            - code
            - message
          examples:
            TOO_MANY_REQUESTS:
              summary: The rate limit was exceeded
              value:
                code: TOO_MANY_REQUESTS
                message: Too many requests
            EXCEEDED_QUOTA_LIMIT:
              summary: The quota limit was exceeded
              value:
                code: EXCEEDED_QUOTA_LIMIT
                message: Exceeded quota limit
    "500":
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - INTERNAL_SERVER_ERROR
                - INTERRUPTED
                description: Code to identify the cause of the internal server error
              message:
                type: string
                description: Detailed message including the cause of the server error
            required:
            - code
            - message
          examples:
            INTERNAL_SERVER_ERROR:
              summary: An internal server error occurred
              value:
                code: INTERNAL_SERVER_ERROR
                message: Internal server error
            INTERRUPTED:
              summary: Processing failed temporarily due to server load
              value:
                code: INTERRUPTED
                message: Request interrupted
paths:
  /:
    post:
      security:
      - api_key: []
      operationId: xrpl-account_nfts
      summary: account_nfts
      description: |
        Returns the list of NFTokens held by an account.
        It lets you check the issuer, identifier, taxon and URI of each token.
      x-seo-description: Returns a list of NFToken objects owned by the specified account.
      tags:
      - account
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - method
              - params
              properties:
                method:
                  type: string
                  example: account_nfts
                params:
                  type: array
                  description: |-
                    It contains following parameters as a single object in the `params` array.
                    1. `account`: The account to look up, as a string. (required)
                    2. `limit`: The number of token pages to return, as an integer between 20 and 400. (optional, default `100`)
                    3. `marker`: Pass the `marker` value from a previous response to retrieve the next page. (optional)
                    - `ledger_hash`: The hash of the ledger version to use, as a string. (optional)
                    - `ledger_index`: The ledger index or a shortcut string. (optional)
                  minItems: 1
                  maxItems: 1
                  items:
                    title: Parameters
                    type: object
                    required:
                    - account
                    properties:
                      account:
                        type: string
                        description: The address of the account that owns the NFTokens.
                        example: r9cZA1mLK5R5Am25ArfXFmqgNwjZgnfk59
                      limit:
                        type: integer
                        description: The number of token pages to return. Pass a value between 20 and 400.
                        example: 100
                      marker:
                        $ref: '#/components/schemas/Marker'
                      ledger_hash:
                        type: string
                        description: The hash of the ledger version to use. Pass a 32-byte hex string.
                      ledger_index:
                        $ref: '#/components/schemas/LedgerIndex'
                  example:
                  - account: r9cZA1mLK5R5Am25ArfXFmqgNwjZgnfk59
                    ledger_index: validated
                    limit: 100
              example:
                method: account_nfts
                params:
                - account: r9cZA1mLK5R5Am25ArfXFmqgNwjZgnfk59
                  ledger_index: validated
                  limit: 100
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              example:
                result:
                  account: r9cZA1mLK5R5Am25ArfXFmqgNwjZgnfk59
                  account_nfts:
                  - Flags: 8
                    Issuer: rMwjYedjc7qqtKYVLiAccJSmCwih4LnE2q
                    NFTokenID: 000800006203F49C21D5D6E022CB16DE3538F248662FC73C00000E39
                    NFTokenTaxon: 0
                    URI: 697066733A2F2F62616679626569676479727A
                    nft_serial: 3641
                  ledger_hash: 17ACB57A0F73B5160713E81FE72B2AC9F6064541004E272BD09F257D57C30C02
                  ledger_index: 98765432
                  validated: true
              schema:
                $ref: '#/components/schemas/AccountNftsResult'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
