openapi: 3.1.0
info:
  title: XRPL - account_info
  version: 1.0.0
servers:
- url: https://xrpl-mainnet.nodit.io
  description: XRP Ledger Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  schemas:
    AccountInfoResult:
      allOf:
      - type: object
        description: The result of looking up account information.
        properties:
          account_data:
            type: object
            description: The AccountRoot ledger object for the account.
            properties:
              Account:
                type: string
                description: The account address.
              Balance:
                type: string
                description: The XRP balance of the account, in drops.
              Flags:
                type: integer
                description: A bit-map of boolean flags enabled for the account.
              LedgerEntryType:
                type: string
                description: The ledger entry type. Always returns `AccountRoot`.
              OwnerCount:
                type: integer
                description: The number of ledger objects owned by the account that count toward its reserve.
              PreviousTxnID:
                type: string
                description: The ID of the transaction that most recently modified this object.
              PreviousTxnLgrSeq:
                type: integer
                description: The ledger index of the ledger containing the transaction that most recently modified this object.
              Sequence:
                type: integer
                description: The next sequence number the account will use for a transaction.
              index:
                type: string
                description: The ID that identifies this ledger entry.
          account_flags:
            type: object
            description: The enabled state of each account flag.
            properties:
              defaultRipple:
                type: boolean
                description: Whether rippling is enabled by default for tokens issued by this account.
              depositAuth:
                type: boolean
                description: Whether Deposit Authorization is enabled.
              disableMasterKey:
                type: boolean
                description: Whether use of the master key is disabled.
              disallowIncomingCheck:
                type: boolean
                description: Whether incoming Checks are blocked.
              disallowIncomingNFTokenOffer:
                type: boolean
                description: Whether incoming NFToken offers are blocked.
              disallowIncomingPayChan:
                type: boolean
                description: Whether incoming Payment Channels are blocked.
              disallowIncomingTrustline:
                type: boolean
                description: Whether incoming trust lines are blocked.
              disallowIncomingXRP:
                type: boolean
                description: Whether the account is marked as discouraging incoming XRP.
              globalFreeze:
                type: boolean
                description: Whether all tokens issued by this account are frozen.
              noFreeze:
                type: boolean
                description: Whether the ability to freeze has been permanently given up.
              passwordSpent:
                type: boolean
                description: Whether the free key change has been used.
              requireAuthorization:
                type: boolean
                description: Whether the issuer's authorization is required to use a trust line.
              requireDestinationTag:
                type: boolean
                description: Whether incoming payments require a destination tag.
          signer_lists:
            type: array
            description: |
              The list of SignerList objects associated with the account.
              In API v1 it is returned under `account_data`; in API v2 and Clio it is returned at the root level.
            items:
              type: object
              description: A SignerList ledger object.
          queue_data:
            type: object
            description: Data on this account's queued transactions. Returned when `queue` is set to `true` in the request.
            properties:
              txn_count:
                type: integer
                description: The number of queued transactions.
              auth_change_queued:
                type: boolean
                description: Whether any queued transaction changes signing authority.
              lowest_sequence:
                type: integer
                description: The lowest sequence number among the queued transactions.
              highest_sequence:
                type: integer
                description: The highest sequence number among the queued transactions.
              max_spend_drops_total:
                type: string
                description: The maximum total XRP the queued transactions could debit, in drops.
              transactions:
                type: array
                description: Data for an individual queued transaction.
                items:
                  type: object
                  description: Data for a queued transaction.
      - $ref: '#/components/schemas/LedgerContext'
    LedgerContext:
      type: object
      description: Common fields that indicate which ledger version the response was derived from.
      properties:
        ledger_hash:
          type: string
          description: The hash of the ledger version used. Returned when a validated ledger version was queried.
        ledger_index:
          type: integer
          description: The ledger index of the version used. Returned when a validated ledger version was queried.
        ledger_current_index:
          type: integer
          description: The ledger index of the in-progress ledger. Returned when the `current` ledger was queried.
        validated:
          type: boolean
          description: Whether the response was derived from a validated ledger version.
    LedgerIndex:
      description: |
        Specifies the ledger version to use. Pass a ledger index as an integer, or use one of the shortcut strings below.
        - `validated`: Uses the most recent ledger version validated by the network.
        - `closed`: Uses the most recent ledger version the server has closed. It may not be validated.
        - `current`: Uses the in-progress ledger version the server is currently building.
      oneOf:
      - title: Ledger Index
        type: integer
        description: The ledger index of the version to use.
      - title: Shortcut
        type: string
        description: A shortcut string that specifies the ledger version to use.
        enum:
        - validated
        - closed
        - current
  responses:
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - NO_AUTHENTICATION_FOUND
                - AUTHENTICATION_FAILED
                description: Code to identify the cause of authentication failure
              message:
                type: string
                description: Detailed message including the cause of authentication failure
            required:
            - code
            - message
          examples:
            NO_AUTHENTICATION_FOUND:
              summary: The request does not include authentication (API Key)
              value:
                code: NO_AUTHENTICATION_FOUND
                message: No authentication found.
            AUTHENTICATION_FAILED:
              summary: The authentication (API Key) is invalid
              value:
                code: AUTHENTICATION_FAILED
                message: Authentication failed.
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - PERMISSION_DENIED
                description: Code indicating permission denied
              message:
                type: string
                description: Detailed message including information about the denied resource
            required:
            - code
            - message
          examples:
            PERMISSION_DENIED:
              summary: The request accesses a resource it is not authorized for
              value:
                code: PERMISSION_DENIED
                message: Permission denied
    "404":
      description: Not Found
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - WRONG_ENDPOINT
                - NOT_SUPPORTED_CHAIN
                - RESOURCE_NOT_FOUND
                description: Code to identify the cause of the resource not found
              message:
                type: string
                description: Detailed message including the name, value, etc. of the resource not found
            required:
            - code
            - message
          examples:
            WRONG_ENDPOINT:
              summary: The requested API path does not exist
              value:
                code: WRONG_ENDPOINT
                message: Wrong endpoint
            NOT_SUPPORTED_CHAIN:
              summary: The requested chain is not supported
              value:
                code: NOT_SUPPORTED_CHAIN
                message: Not supported chain
            RESOURCE_NOT_FOUND:
              summary: The requested resource does not exist
              value:
                code: RESOURCE_NOT_FOUND
                message: 'Resource not found: { RESOURCE_NAME = RESOURCE_VALUE }'
    "405":
      description: Method Not Allowed
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - METHOD_NOT_ALLOWED
                description: Code indicating a disallowed HTTP method
              message:
                type: string
                description: Detailed message about the disallowed HTTP method
            required:
            - code
            - message
          examples:
            METHOD_NOT_ALLOWED:
              summary: The request uses an unsupported HTTP method
              value:
                code: METHOD_NOT_ALLOWED
                message: Method not allowed
    "408":
      description: Request Timeout
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TIMEOUT
                description: Code indicating request timeout
              message:
                type: string
                description: Detailed message including the cause of the timeout
            required:
            - code
            - message
          examples:
            TIMEOUT:
              summary: Processing did not finish within the time limit
              value:
                code: TIMEOUT
                message: Request timeout
    "409":
      description: Conflict
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - RESOURCE_ALREADY_EXISTS
                - REJECTED
                description: Code to identify the cause of the request conflict
              message:
                type: string
                description: Detailed message including information about the conflicting resource
            required:
            - code
            - message
          examples:
            RESOURCE_ALREADY_EXISTS:
              summary: The request tries to create a resource that already exists
              value:
                code: RESOURCE_ALREADY_EXISTS
                message: Resource already exists
            REJECTED:
              summary: The server rejected the request
              value:
                code: REJECTED
                message: Request rejected
    "413":
      description: Payload Too Large
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - CONTENTS_TOO_LARGE
                description: Code indicating payload size exceeded
              message:
                type: string
                description: Detailed message including the maximum allowed payload size
            required:
            - code
            - message
          examples:
            CONTENTS_TOO_LARGE:
              summary: The payload exceeds the server's maximum size
              value:
                code: CONTENTS_TOO_LARGE
                message: Contents too large
    "414":
      description: URI Too Long
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_LONG_URI
                description: Code indicating URI length exceeded
              message:
                type: string
                description: Detailed message including the maximum allowed URI length
            required:
            - code
            - message
          examples:
            TOO_LONG_URI:
              summary: The request URI exceeds the server's maximum length
              value:
                code: TOO_LONG_URI
                message: URI too long
    "429":
      description: Too Many Requests
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_MANY_REQUESTS
                - EXCEEDED_QUOTA_LIMIT
                description: Code identifying the cause of the request limit exceeded
              message:
                type: string
                description: Detailed message including the exceeded limit type and allowed threshold
            required:
            - code
            - message
          examples:
            TOO_MANY_REQUESTS:
              summary: The rate limit was exceeded
              value:
                code: TOO_MANY_REQUESTS
                message: Too many requests
            EXCEEDED_QUOTA_LIMIT:
              summary: The quota limit was exceeded
              value:
                code: EXCEEDED_QUOTA_LIMIT
                message: Exceeded quota limit
    "500":
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - INTERNAL_SERVER_ERROR
                - INTERRUPTED
                description: Code to identify the cause of the internal server error
              message:
                type: string
                description: Detailed message including the cause of the server error
            required:
            - code
            - message
          examples:
            INTERNAL_SERVER_ERROR:
              summary: An internal server error occurred
              value:
                code: INTERNAL_SERVER_ERROR
                message: Internal server error
            INTERRUPTED:
              summary: Processing failed temporarily due to server load
              value:
                code: INTERRUPTED
                message: Request interrupted
    "503":
      description: Service Unavailable
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - UNAVAILABLE
                description: Code indicating service unavailability
              message:
                type: string
                description: Detailed message including the cause of the service outage
            required:
            - code
            - message
          examples:
            UNAVAILABLE:
              summary: The service is unavailable due to infrastructure downtime or an upgrade
              value:
                code: UNAVAILABLE
                message: Service unavailable
paths:
  /:
    post:
      security:
      - api_key: []
      operationId: xrpl-account_info
      summary: account_info
      description: |
        Returns core information about an account.
        It lets you check the XRP balance, the sequence number, the account flags and the number of owned objects.

        > 📘 If the account does not exist in the ledger, an `actNotFound` error is returned.
      x-seo-description: Returns core information about the specified XRPL account, including its XRP balance and sequence number.
      tags:
      - account
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - method
              - params
              properties:
                method:
                  type: string
                  example: account_info
                params:
                  type: array
                  description: |-
                    It contains following parameters as a single object in the `params` array.
                    1. `account`: The account to look up, as a string. (required)
                    2. `queue`: Whether to also return queue statistics, as a boolean. (optional, requires `ledger_index` to be `current`)
                    3. `signer_lists`: Whether to also return the SignerLists associated with the account, as a boolean. (optional)
                    - `ledger_hash`: The hash of the ledger version to use, as a string. (optional)
                    - `ledger_index`: The ledger index or a shortcut string. (optional)
                  minItems: 1
                  maxItems: 1
                  items:
                    title: Parameters
                    type: object
                    required:
                    - account
                    properties:
                      account:
                        type: string
                        description: The account to look up.
                        example: r9cZA1mLK5R5Am25ArfXFmqgNwjZgnfk59
                      queue:
                        type: boolean
                        description: |
                          Whether to also return the statistics for this account's queued transactions.
                          It can be used only when `ledger_index` is set to `current`.
                        example: false
                      signer_lists:
                        type: boolean
                        description: Whether to also return the SignerList objects associated with the account.
                        example: false
                      ledger_hash:
                        type: string
                        description: The hash of the ledger version to use. Pass a 32-byte hex string.
                      ledger_index:
                        $ref: '#/components/schemas/LedgerIndex'
                  example:
                  - account: r9cZA1mLK5R5Am25ArfXFmqgNwjZgnfk59
                    ledger_index: validated
              example:
                method: account_info
                params:
                - account: r9cZA1mLK5R5Am25ArfXFmqgNwjZgnfk59
                  ledger_index: validated
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              example:
                result:
                  account_data:
                    Account: r9cZA1mLK5R5Am25ArfXFmqgNwjZgnfk59
                    Balance: "9977"
                    Flags: 0
                    LedgerEntryType: AccountRoot
                    OwnerCount: 0
                    PreviousTxnID: 4E6A8C0D2F4B6A8C0E1D3F5A7B9C0E2D4F6A8B0C2E4D6F8A0B1C3D5E7F9A0B2C
                    PreviousTxnLgrSeq: 98765000
                    Sequence: 42
                    index: 5F7A9C0E2D4F6B8A0C1E3D5F7A9B0C2E4D6F8A0B1C3E5D7F9A0B2C4E6D8F0A1B
                  account_flags:
                    defaultRipple: false
                    depositAuth: false
                    disableMasterKey: false
                    globalFreeze: false
                    noFreeze: false
                    passwordSpent: false
                    requireAuthorization: false
                    requireDestinationTag: false
                  ledger_hash: 17ACB57A0F73B5160713E81FE72B2AC9F6064541004E272BD09F257D57C30C02
                  ledger_index: 98765432
                  validated: true
              schema:
                $ref: '#/components/schemas/AccountInfoResult'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "404":
          $ref: '#/components/responses/404'
        "405":
          $ref: '#/components/responses/405'
        "408":
          $ref: '#/components/responses/408'
        "409":
          $ref: '#/components/responses/409'
        "413":
          $ref: '#/components/responses/413'
        "414":
          $ref: '#/components/responses/414'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
        "503":
          $ref: '#/components/responses/503'
