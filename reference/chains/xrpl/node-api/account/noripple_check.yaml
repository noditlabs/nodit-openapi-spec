openapi: 3.1.0
info:
  title: XRPL - noripple_check
  version: 1.0.0
servers:
- url: https://xrpl-mainnet.nodit.io
  description: XRP Ledger Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  schemas:
    LedgerIndex:
      description: |
        Specifies the ledger version to use. Pass a ledger index as an integer, or use one of the shortcut strings below.
        - `validated`: Uses the most recent ledger version validated by the network.
        - `closed`: Uses the most recent ledger version the server has closed. It may not be validated.
        - `current`: Uses the in-progress ledger version the server is currently building.
      oneOf:
      - title: Ledger Index
        type: integer
        description: The ledger index of the version to use.
      - title: Shortcut
        type: string
        description: A shortcut string that specifies the ledger version to use.
        enum:
        - validated
        - closed
        - current
    NoRippleCheckResult:
      type: object
      description: The result of checking the Default Ripple setting and the No Ripple flags of an account's trust lines.
      properties:
        ledger_current_index:
          type: integer
          description: The ledger index used for the check.
        problems:
          type: array
          description: |
            The list of problems found, described in human-readable sentences.
            At most one Default Ripple problem is reported; trust line problems are reported up to the request's `limit`.
          items:
            type: string
            description: A problem description.
        transactions:
          type: array
          description: |
            The list of transactions suggested to resolve the problems.
            It is returned when `transactions` is set to `true` in the request, and has the same length as `problems`.
          items:
            type: object
            description: A suggested transaction.
        validated:
          type: boolean
          description: Whether the response was derived from a validated ledger version.
  responses:
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - NO_AUTHENTICATION_FOUND
                - AUTHENTICATION_FAILED
                description: Code to identify the cause of authentication failure
              message:
                type: string
                description: Detailed message including the cause of authentication failure
            required:
            - code
            - message
          examples:
            NO_AUTHENTICATION_FOUND:
              summary: The request does not include authentication (API Key)
              value:
                code: NO_AUTHENTICATION_FOUND
                message: No authentication found.
            AUTHENTICATION_FAILED:
              summary: The authentication (API Key) is invalid
              value:
                code: AUTHENTICATION_FAILED
                message: Authentication failed.
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - PERMISSION_DENIED
                description: Code indicating permission denied
              message:
                type: string
                description: Detailed message including information about the denied resource
            required:
            - code
            - message
          examples:
            PERMISSION_DENIED:
              summary: The request accesses a resource it is not authorized for
              value:
                code: PERMISSION_DENIED
                message: Permission denied
    "404":
      description: Not Found
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - WRONG_ENDPOINT
                - NOT_SUPPORTED_CHAIN
                - RESOURCE_NOT_FOUND
                description: Code to identify the cause of the resource not found
              message:
                type: string
                description: Detailed message including the name, value, etc. of the resource not found
            required:
            - code
            - message
          examples:
            WRONG_ENDPOINT:
              summary: The requested API path does not exist
              value:
                code: WRONG_ENDPOINT
                message: Wrong endpoint
            NOT_SUPPORTED_CHAIN:
              summary: The requested chain is not supported
              value:
                code: NOT_SUPPORTED_CHAIN
                message: Not supported chain
            RESOURCE_NOT_FOUND:
              summary: The requested resource does not exist
              value:
                code: RESOURCE_NOT_FOUND
                message: 'Resource not found: { RESOURCE_NAME = RESOURCE_VALUE }'
    "405":
      description: Method Not Allowed
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - METHOD_NOT_ALLOWED
                description: Code indicating a disallowed HTTP method
              message:
                type: string
                description: Detailed message about the disallowed HTTP method
            required:
            - code
            - message
          examples:
            METHOD_NOT_ALLOWED:
              summary: The request uses an unsupported HTTP method
              value:
                code: METHOD_NOT_ALLOWED
                message: Method not allowed
    "408":
      description: Request Timeout
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TIMEOUT
                description: Code indicating request timeout
              message:
                type: string
                description: Detailed message including the cause of the timeout
            required:
            - code
            - message
          examples:
            TIMEOUT:
              summary: Processing did not finish within the time limit
              value:
                code: TIMEOUT
                message: Request timeout
    "409":
      description: Conflict
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - RESOURCE_ALREADY_EXISTS
                - REJECTED
                description: Code to identify the cause of the request conflict
              message:
                type: string
                description: Detailed message including information about the conflicting resource
            required:
            - code
            - message
          examples:
            RESOURCE_ALREADY_EXISTS:
              summary: The request tries to create a resource that already exists
              value:
                code: RESOURCE_ALREADY_EXISTS
                message: Resource already exists
            REJECTED:
              summary: The server rejected the request
              value:
                code: REJECTED
                message: Request rejected
    "413":
      description: Payload Too Large
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - CONTENTS_TOO_LARGE
                description: Code indicating payload size exceeded
              message:
                type: string
                description: Detailed message including the maximum allowed payload size
            required:
            - code
            - message
          examples:
            CONTENTS_TOO_LARGE:
              summary: The payload exceeds the server's maximum size
              value:
                code: CONTENTS_TOO_LARGE
                message: Contents too large
    "414":
      description: URI Too Long
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_LONG_URI
                description: Code indicating URI length exceeded
              message:
                type: string
                description: Detailed message including the maximum allowed URI length
            required:
            - code
            - message
          examples:
            TOO_LONG_URI:
              summary: The request URI exceeds the server's maximum length
              value:
                code: TOO_LONG_URI
                message: URI too long
    "429":
      description: Too Many Requests
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_MANY_REQUESTS
                - EXCEEDED_QUOTA_LIMIT
                description: Code identifying the cause of the request limit exceeded
              message:
                type: string
                description: Detailed message including the exceeded limit type and allowed threshold
            required:
            - code
            - message
          examples:
            TOO_MANY_REQUESTS:
              summary: The rate limit was exceeded
              value:
                code: TOO_MANY_REQUESTS
                message: Too many requests
            EXCEEDED_QUOTA_LIMIT:
              summary: The quota limit was exceeded
              value:
                code: EXCEEDED_QUOTA_LIMIT
                message: Exceeded quota limit
    "500":
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - INTERNAL_SERVER_ERROR
                - INTERRUPTED
                description: Code to identify the cause of the internal server error
              message:
                type: string
                description: Detailed message including the cause of the server error
            required:
            - code
            - message
          examples:
            INTERNAL_SERVER_ERROR:
              summary: An internal server error occurred
              value:
                code: INTERNAL_SERVER_ERROR
                message: Internal server error
            INTERRUPTED:
              summary: Processing failed temporarily due to server load
              value:
                code: INTERRUPTED
                message: Request interrupted
    "503":
      description: Service Unavailable
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - UNAVAILABLE
                description: Code indicating service unavailability
              message:
                type: string
                description: Detailed message including the cause of the service outage
            required:
            - code
            - message
          examples:
            UNAVAILABLE:
              summary: The service is unavailable due to infrastructure downtime or an upgrade
              value:
                code: UNAVAILABLE
                message: Service unavailable
paths:
  /:
    post:
      security:
      - api_key: []
      operationId: xrpl-noripple_check
      summary: noripple_check
      description: |
        Checks an account's Default Ripple setting and the No Ripple flag state of its trust lines.
        When a problem is found, it returns a human-readable description and suggests a transaction to resolve it.
      x-seo-description: Checks an account's Default Ripple setting and the No Ripple flags of its trust lines.
      tags:
      - account
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - method
              - params
              properties:
                method:
                  type: string
                  example: noripple_check
                params:
                  type: array
                  description: |-
                    It contains following parameters as a single object in the `params` array.
                    1. `account`: The account to check, as a string. (required)
                    2. `role`: The role of the account, either `gateway` or `user`. (required)
                    3. `transactions`: Whether to also return transactions that resolve the problems, as a boolean. (optional, default `false`)
                    4. `limit`: The number of trust line problems to report, as an integer. (optional, default `300`)
                    - `ledger_hash`: The hash of the ledger version to use, as a string. (optional)
                    - `ledger_index`: The ledger index or a shortcut string. (optional)
                  minItems: 1
                  maxItems: 1
                  items:
                    title: Parameters
                    type: object
                    required:
                    - account
                    - role
                    properties:
                      account:
                        type: string
                        description: The account to check.
                        example: r9cZA1mLK5R5Am25ArfXFmqgNwjZgnfk59
                      role:
                        type: string
                        description: |
                          The role of the account. The recommended settings differ by role.
                          - `gateway`: Treats the account as one that issues tokens.
                          - `user`: Treats the account as a regular account that holds tokens.
                        enum:
                        - gateway
                        - user
                        example: gateway
                      transactions:
                        type: boolean
                        description: Whether to also return transactions that resolve the problems found.
                        example: false
                      limit:
                        type: integer
                        description: The maximum number of trust line problems to report.
                        example: 300
                      ledger_hash:
                        type: string
                        description: The hash of the ledger version to use. Pass a 32-byte hex string.
                      ledger_index:
                        $ref: '#/components/schemas/LedgerIndex'
                  example:
                  - account: r9cZA1mLK5R5Am25ArfXFmqgNwjZgnfk59
                    role: gateway
                    transactions: false
                    limit: 300
              example:
                method: noripple_check
                params:
                - account: r9cZA1mLK5R5Am25ArfXFmqgNwjZgnfk59
                  role: gateway
                  transactions: false
                  limit: 300
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              example:
                result:
                  ledger_current_index: 98765433
                  problems:
                  - You should immediately set your default ripple flag
                  - You should clear the no ripple flag on your XAU line to rMwjYedjc7qqtKYVLiAccJSmCwih4LnE2q
                  validated: false
              schema:
                $ref: '#/components/schemas/NoRippleCheckResult'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "404":
          $ref: '#/components/responses/404'
        "405":
          $ref: '#/components/responses/405'
        "408":
          $ref: '#/components/responses/408'
        "409":
          $ref: '#/components/responses/409'
        "413":
          $ref: '#/components/responses/413'
        "414":
          $ref: '#/components/responses/414'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
        "503":
          $ref: '#/components/responses/503'
