openapi: 3.1.0
info:
  title: XRPL - channel_verify
  version: 1.0.0
servers:
- url: https://xrpl-mainnet.nodit.io
  description: XRP Ledger Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  responses:
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - NO_AUTHENTICATION_FOUND
                - AUTHENTICATION_FAILED
                description: Code to identify the cause of authentication failure
              message:
                type: string
                description: Detailed message including the cause of authentication failure
            required:
            - code
            - message
          examples:
            NO_AUTHENTICATION_FOUND:
              summary: The request does not include authentication (API Key)
              value:
                code: NO_AUTHENTICATION_FOUND
                message: No authentication found.
            AUTHENTICATION_FAILED:
              summary: The authentication (API Key) is invalid
              value:
                code: AUTHENTICATION_FAILED
                message: Authentication failed.
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - PERMISSION_DENIED
                description: Code indicating permission denied
              message:
                type: string
                description: Detailed message including information about the denied resource
            required:
            - code
            - message
          examples:
            PERMISSION_DENIED:
              summary: The request accesses a resource it is not authorized for
              value:
                code: PERMISSION_DENIED
                message: Permission denied
    "429":
      description: Too Many Requests
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_MANY_REQUESTS
                - EXCEEDED_QUOTA_LIMIT
                description: Code identifying the cause of the request limit exceeded
              message:
                type: string
                description: Detailed message including the exceeded limit type and allowed threshold
            required:
            - code
            - message
          examples:
            TOO_MANY_REQUESTS:
              summary: The rate limit was exceeded
              value:
                code: TOO_MANY_REQUESTS
                message: Too many requests
            EXCEEDED_QUOTA_LIMIT:
              summary: The quota limit was exceeded
              value:
                code: EXCEEDED_QUOTA_LIMIT
                message: Exceeded quota limit
    "500":
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - INTERNAL_SERVER_ERROR
                - INTERRUPTED
                description: Code to identify the cause of the internal server error
              message:
                type: string
                description: Detailed message including the cause of the server error
            required:
            - code
            - message
          examples:
            INTERNAL_SERVER_ERROR:
              summary: An internal server error occurred
              value:
                code: INTERNAL_SERVER_ERROR
                message: Internal server error
            INTERRUPTED:
              summary: Processing failed temporarily due to server load
              value:
                code: INTERRUPTED
                message: Request interrupted
paths:
  /:
    post:
      security:
      - api_key: []
      operationId: xrpl-channel_verify
      summary: channel_verify
      description: |
        Verifies a signature that can be used to redeem a specific amount from a Payment Channel.
        Use it when the channel's destination wants to check a signature it received before committing it to the ledger.
      x-seo-description: Checks the validity of a signature that can be used to redeem XRP from a payment channel.
      tags:
      - payment-channel
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - method
              - params
              properties:
                method:
                  type: string
                  example: channel_verify
                params:
                  type: array
                  description: |-
                    It contains following parameters as a single object in the `params` array.
                    1. `channel_id`: The channel ID, as a 64-character hex string. (required)
                    2. `amount`: The XRP amount the signature authorizes, as a string in drops. (required)
                    3. `public_key`: The public key used to create the signature, as a hex or base58 string. (required)
                    4. `signature`: The signature to verify, as a hex string. (required)
                  minItems: 1
                  maxItems: 1
                  items:
                    title: Parameters
                    type: object
                    required:
                    - channel_id
                    - amount
                    - public_key
                    - signature
                    properties:
                      channel_id:
                        type: string
                        description: The 64-character hex string that identifies the channel to verify against.
                        example: 8C0E1B3D5F7A9C0E2D4F6B8A0C1E3D5F7A9B0C2E4D6F8A0B1C3E5D7F9A0B2C4E
                      amount:
                        type: string
                        description: The XRP amount the signature authorizes for redemption, in drops.
                        example: "1000000"
                      public_key:
                        type: string
                        description: The public key used to create the signature. Pass it in hex or base58 format.
                        example: aB44YfzW24VDEJQ2UuLPV2PvqcPCSoLnL7y5M1EzhdW4LnK5xoDf
                      signature:
                        type: string
                        description: The signature to verify. Pass it in hex format.
                        example: 304402204E7052F7614C6C4A9F0E2B1D3F5A7C9E0B2D4F6A8C0E1B3D5F7A9C0E2D4F6B8A
                  example:
                  - channel_id: 8C0E1B3D5F7A9C0E2D4F6B8A0C1E3D5F7A9B0C2E4D6F8A0B1C3E5D7F9A0B2C4E
                    amount: "1000000"
                    public_key: aB44YfzW24VDEJQ2UuLPV2PvqcPCSoLnL7y5M1EzhdW4LnK5xoDf
                    signature: 304402204E7052F7614C6C4A9F0E2B1D3F5A7C9E0B2D4F6A8C0E1B3D5F7A9C0E2D4F6B8A
              example:
                method: channel_verify
                params:
                - channel_id: 8C0E1B3D5F7A9C0E2D4F6B8A0C1E3D5F7A9B0C2E4D6F8A0B1C3E5D7F9A0B2C4E
                  amount: "1000000"
                  public_key: aB44YfzW24VDEJQ2UuLPV2PvqcPCSoLnL7y5M1EzhdW4LnK5xoDf
                  signature: 304402204E7052F7614C6C4A9F0E2B1D3F5A7C9E0B2D4F6A8C0E1B3D5F7A9C0E2D4F6B8A
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              example:
                result:
                  signature_verified: true
              schema:
                type: object
                description: The signature verification result.
                properties:
                  signature_verified:
                    type: boolean
                    description: |
                      Whether the signature is valid for the stated amount, channel and public key.
                      A value of `true` means the signature is valid.
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
