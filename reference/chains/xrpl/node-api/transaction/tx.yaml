openapi: 3.1.0
info:
  title: XRPL - tx
  version: 1.0.0
servers:
- url: https://xrpl-mainnet.nodit.io
  description: XRP Ledger Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  schemas:
    TxResult:
      type: object
      description: The result of looking up a single transaction.
      properties:
        ctid:
          type: string
          description: The compact transaction identifier of the transaction.
        close_time_iso:
          type: string
          description: The time the ledger containing the transaction closed, in ISO 8601 format.
        date:
          type: integer
          description: The time the ledger containing the transaction closed, in seconds since the Ripple Epoch.
        hash:
          type: string
          description: The unique hash that identifies the transaction.
        ledger_index:
          type: integer
          description: The ledger index of the ledger containing the transaction.
        ledger_hash:
          type: string
          description: The hash of the ledger containing the transaction.
        meta:
          type: object
          description: The metadata describing the results of the transaction. Returned when `binary` is `false`.
        meta_blob:
          type: string
          description: The metadata, hex-encoded. Returned when `binary` is `true`.
        tx_json:
          type: object
          description: The transaction data. Returned when `binary` is `false`.
        tx_blob:
          type: string
          description: The transaction, hex-encoded. Returned when `binary` is `true`.
        validated:
          type: boolean
          description: Whether the transaction is included in a validated ledger version.
  responses:
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - NO_AUTHENTICATION_FOUND
                - AUTHENTICATION_FAILED
                description: Code to identify the cause of authentication failure
              message:
                type: string
                description: Detailed message including the cause of authentication failure
            required:
            - code
            - message
          examples:
            NO_AUTHENTICATION_FOUND:
              summary: The request does not include authentication (API Key)
              value:
                code: NO_AUTHENTICATION_FOUND
                message: No authentication found.
            AUTHENTICATION_FAILED:
              summary: The authentication (API Key) is invalid
              value:
                code: AUTHENTICATION_FAILED
                message: Authentication failed.
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - PERMISSION_DENIED
                description: Code indicating permission denied
              message:
                type: string
                description: Detailed message including information about the denied resource
            required:
            - code
            - message
          examples:
            PERMISSION_DENIED:
              summary: The request accesses a resource it is not authorized for
              value:
                code: PERMISSION_DENIED
                message: Permission denied
    "404":
      description: Not Found
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - WRONG_ENDPOINT
                - NOT_SUPPORTED_CHAIN
                - RESOURCE_NOT_FOUND
                description: Code to identify the cause of the resource not found
              message:
                type: string
                description: Detailed message including the name, value, etc. of the resource not found
            required:
            - code
            - message
          examples:
            WRONG_ENDPOINT:
              summary: The requested API path does not exist
              value:
                code: WRONG_ENDPOINT
                message: Wrong endpoint
            NOT_SUPPORTED_CHAIN:
              summary: The requested chain is not supported
              value:
                code: NOT_SUPPORTED_CHAIN
                message: Not supported chain
            RESOURCE_NOT_FOUND:
              summary: The requested resource does not exist
              value:
                code: RESOURCE_NOT_FOUND
                message: 'Resource not found: { RESOURCE_NAME = RESOURCE_VALUE }'
    "405":
      description: Method Not Allowed
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - METHOD_NOT_ALLOWED
                description: Code indicating a disallowed HTTP method
              message:
                type: string
                description: Detailed message about the disallowed HTTP method
            required:
            - code
            - message
          examples:
            METHOD_NOT_ALLOWED:
              summary: The request uses an unsupported HTTP method
              value:
                code: METHOD_NOT_ALLOWED
                message: Method not allowed
    "408":
      description: Request Timeout
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TIMEOUT
                description: Code indicating request timeout
              message:
                type: string
                description: Detailed message including the cause of the timeout
            required:
            - code
            - message
          examples:
            TIMEOUT:
              summary: Processing did not finish within the time limit
              value:
                code: TIMEOUT
                message: Request timeout
    "409":
      description: Conflict
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - RESOURCE_ALREADY_EXISTS
                - REJECTED
                description: Code to identify the cause of the request conflict
              message:
                type: string
                description: Detailed message including information about the conflicting resource
            required:
            - code
            - message
          examples:
            RESOURCE_ALREADY_EXISTS:
              summary: The request tries to create a resource that already exists
              value:
                code: RESOURCE_ALREADY_EXISTS
                message: Resource already exists
            REJECTED:
              summary: The server rejected the request
              value:
                code: REJECTED
                message: Request rejected
    "413":
      description: Payload Too Large
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - CONTENTS_TOO_LARGE
                description: Code indicating payload size exceeded
              message:
                type: string
                description: Detailed message including the maximum allowed payload size
            required:
            - code
            - message
          examples:
            CONTENTS_TOO_LARGE:
              summary: The payload exceeds the server's maximum size
              value:
                code: CONTENTS_TOO_LARGE
                message: Contents too large
    "414":
      description: URI Too Long
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_LONG_URI
                description: Code indicating URI length exceeded
              message:
                type: string
                description: Detailed message including the maximum allowed URI length
            required:
            - code
            - message
          examples:
            TOO_LONG_URI:
              summary: The request URI exceeds the server's maximum length
              value:
                code: TOO_LONG_URI
                message: URI too long
    "429":
      description: Too Many Requests
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_MANY_REQUESTS
                - EXCEEDED_QUOTA_LIMIT
                description: Code identifying the cause of the request limit exceeded
              message:
                type: string
                description: Detailed message including the exceeded limit type and allowed threshold
            required:
            - code
            - message
          examples:
            TOO_MANY_REQUESTS:
              summary: The rate limit was exceeded
              value:
                code: TOO_MANY_REQUESTS
                message: Too many requests
            EXCEEDED_QUOTA_LIMIT:
              summary: The quota limit was exceeded
              value:
                code: EXCEEDED_QUOTA_LIMIT
                message: Exceeded quota limit
    "500":
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - INTERNAL_SERVER_ERROR
                - INTERRUPTED
                description: Code to identify the cause of the internal server error
              message:
                type: string
                description: Detailed message including the cause of the server error
            required:
            - code
            - message
          examples:
            INTERNAL_SERVER_ERROR:
              summary: An internal server error occurred
              value:
                code: INTERNAL_SERVER_ERROR
                message: Internal server error
            INTERRUPTED:
              summary: Processing failed temporarily due to server load
              value:
                code: INTERRUPTED
                message: Request interrupted
    "503":
      description: Service Unavailable
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - UNAVAILABLE
                description: Code indicating service unavailability
              message:
                type: string
                description: Detailed message including the cause of the service outage
            required:
            - code
            - message
          examples:
            UNAVAILABLE:
              summary: The service is unavailable due to infrastructure downtime or an upgrade
              value:
                code: UNAVAILABLE
                message: Service unavailable
paths:
  /:
    post:
      security:
      - api_key: []
      operationId: xrpl-tx
      summary: tx
      description: |
        Returns a single transaction by its identifying hash or CTID.
        It returns the transaction data along with the metadata describing the results.

        > 📘 The range of history you can query depends on the range of ledger versions the server holds.
        > When looking up older transactions, narrow the range with `min_ledger` and `max_ledger`.
      x-seo-description: Retrieves information on a single transaction by its identifying hash or CTID.
      tags:
      - transaction
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - method
              - params
              properties:
                method:
                  type: string
                  example: tx
                params:
                  type: array
                  description: |-
                    It contains following parameters as a single object in the `params` array.
                    Provide exactly one of `transaction` and `ctid`.
                    1. `transaction`: The hash of the transaction to look up, as a hex string.
                    2. `ctid`: The CTID of the transaction to look up, as an uppercase hex string.
                    3. `binary`: Whether to return the transaction as a hex string, as a boolean. (optional, default `false`)
                    4. `min_ledger`: The start index of the ledger range to search, as an integer. (optional)
                    5. `max_ledger`: The end index of the ledger range to search, as an integer. (optional)
                  minItems: 1
                  maxItems: 1
                  items:
                    title: Parameters
                    type: object
                    properties:
                      transaction:
                        type: string
                        description: The 256-bit hash of the transaction to look up.
                        example: E08D6E9754025BA2534A78707605E0601F03ACE063687A0CA1BDDACFCD1698C7
                      ctid:
                        type: string
                        description: |
                          The compact transaction identifier of the transaction to look up. Only uppercase hex can be used.
                          It is not supported on Clio v2.0 and earlier.
                      binary:
                        type: boolean
                        description: Whether to return the transaction and its metadata as hex strings.
                        example: false
                      min_ledger:
                        type: integer
                        description: |
                          The start index of the ledger range to search. Use it together with `max_ledger`.
                          The range can span at most 1000 ledger versions.
                      max_ledger:
                        type: integer
                        description: |
                          The end index of the ledger range to search. Use it together with `min_ledger`.
                          The range can span at most 1000 ledger versions.
                  example:
                  - transaction: E08D6E9754025BA2534A78707605E0601F03ACE063687A0CA1BDDACFCD1698C7
                    binary: false
              example:
                method: tx
                params:
                - transaction: E08D6E9754025BA2534A78707605E0601F03ACE063687A0CA1BDDACFCD1698C7
                  binary: false
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              example:
                result:
                  close_time_iso: '2026-09-02T04:00:00Z'
                  ctid: C05E2A6800030000
                  date: 810900000
                  hash: E08D6E9754025BA2534A78707605E0601F03ACE063687A0CA1BDDACFCD1698C7
                  ledger_hash: 17ACB57A0F73B5160713E81FE72B2AC9F6064541004E272BD09F257D57C30C02
                  ledger_index: 98765000
                  meta:
                    TransactionIndex: 3
                    TransactionResult: tesSUCCESS
                    delivered_amount: "1000000"
                  tx_json:
                    Account: r9cZA1mLK5R5Am25ArfXFmqgNwjZgnfk59
                    Amount: "1000000"
                    Destination: rMwjYedjc7qqtKYVLiAccJSmCwih4LnE2q
                    Fee: "12"
                    Sequence: 41
                    SigningPubKey: 032D2471DB0F0F1B0D1E2C3D4E5F60718293A4B5C6D7E8F90A1B2C3D4E5F60718
                    TransactionType: Payment
                    TxnSignature: 3045022100A1B2C3D4E5F60718293A4B5C6D7E8F90A1B2C3D4E5F6071829
                  validated: true
              schema:
                $ref: '#/components/schemas/TxResult'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "404":
          $ref: '#/components/responses/404'
        "405":
          $ref: '#/components/responses/405'
        "408":
          $ref: '#/components/responses/408'
        "409":
          $ref: '#/components/responses/409'
        "413":
          $ref: '#/components/responses/413'
        "414":
          $ref: '#/components/responses/414'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
        "503":
          $ref: '#/components/responses/503'
