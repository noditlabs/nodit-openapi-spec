openapi: 3.1.0
info:
  title: XRPL - submit
  version: 1.0.0
servers:
- url: https://xrpl-mainnet.nodit.io
  description: XRP Ledger Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  schemas:
    SubmitResult:
      type: object
      description: The result of submitting a transaction. It is a preliminary result, not the final outcome.
      properties:
        engine_result:
          type: string
          description: The preliminary result code of the transaction. (e.g.) `tesSUCCESS`
        engine_result_code:
          type: integer
          description: The numeric value corresponding to the preliminary result code.
        engine_result_message:
          type: string
          description: A human-readable explanation of the preliminary result.
        tx_blob:
          type: string
          description: The submitted transaction, hex-encoded.
        tx_json:
          type: object
          description: The submitted transaction data.
        accepted:
          type: boolean
          description: Whether the transaction was applied, queued, broadcast or kept.
        account_sequence_available:
          type: integer
          description: The next sequence number available once pending transactions are taken into account.
        account_sequence_next:
          type: integer
          description: The sequence number to use after the provisionally applied transactions.
        applied:
          type: boolean
          description: Whether the transaction was applied to the open ledger.
        broadcast:
          type: boolean
          description: Whether the transaction was broadcast to peer servers.
        kept:
          type: boolean
          description: Whether the transaction was kept for a later retry.
        queued:
          type: boolean
          description: Whether the transaction was queued for a future ledger version.
        open_ledger_cost:
          type: string
          description: The cost of the open ledger before this transaction was processed, in drops.
        validated_ledger_index:
          type: integer
          description: The index of the most recent validated ledger version at submission time.
  responses:
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - NO_AUTHENTICATION_FOUND
                - AUTHENTICATION_FAILED
                description: Code to identify the cause of authentication failure
              message:
                type: string
                description: Detailed message including the cause of authentication failure
            required:
            - code
            - message
          examples:
            NO_AUTHENTICATION_FOUND:
              summary: The request does not include authentication (API Key)
              value:
                code: NO_AUTHENTICATION_FOUND
                message: No authentication found.
            AUTHENTICATION_FAILED:
              summary: The authentication (API Key) is invalid
              value:
                code: AUTHENTICATION_FAILED
                message: Authentication failed.
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - PERMISSION_DENIED
                description: Code indicating permission denied
              message:
                type: string
                description: Detailed message including information about the denied resource
            required:
            - code
            - message
          examples:
            PERMISSION_DENIED:
              summary: The request accesses a resource it is not authorized for
              value:
                code: PERMISSION_DENIED
                message: Permission denied
    "404":
      description: Not Found
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - WRONG_ENDPOINT
                - NOT_SUPPORTED_CHAIN
                - RESOURCE_NOT_FOUND
                description: Code to identify the cause of the resource not found
              message:
                type: string
                description: Detailed message including the name, value, etc. of the resource not found
            required:
            - code
            - message
          examples:
            WRONG_ENDPOINT:
              summary: The requested API path does not exist
              value:
                code: WRONG_ENDPOINT
                message: Wrong endpoint
            NOT_SUPPORTED_CHAIN:
              summary: The requested chain is not supported
              value:
                code: NOT_SUPPORTED_CHAIN
                message: Not supported chain
            RESOURCE_NOT_FOUND:
              summary: The requested resource does not exist
              value:
                code: RESOURCE_NOT_FOUND
                message: 'Resource not found: { RESOURCE_NAME = RESOURCE_VALUE }'
    "405":
      description: Method Not Allowed
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - METHOD_NOT_ALLOWED
                description: Code indicating a disallowed HTTP method
              message:
                type: string
                description: Detailed message about the disallowed HTTP method
            required:
            - code
            - message
          examples:
            METHOD_NOT_ALLOWED:
              summary: The request uses an unsupported HTTP method
              value:
                code: METHOD_NOT_ALLOWED
                message: Method not allowed
    "408":
      description: Request Timeout
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TIMEOUT
                description: Code indicating request timeout
              message:
                type: string
                description: Detailed message including the cause of the timeout
            required:
            - code
            - message
          examples:
            TIMEOUT:
              summary: Processing did not finish within the time limit
              value:
                code: TIMEOUT
                message: Request timeout
    "409":
      description: Conflict
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - RESOURCE_ALREADY_EXISTS
                - REJECTED
                description: Code to identify the cause of the request conflict
              message:
                type: string
                description: Detailed message including information about the conflicting resource
            required:
            - code
            - message
          examples:
            RESOURCE_ALREADY_EXISTS:
              summary: The request tries to create a resource that already exists
              value:
                code: RESOURCE_ALREADY_EXISTS
                message: Resource already exists
            REJECTED:
              summary: The server rejected the request
              value:
                code: REJECTED
                message: Request rejected
    "413":
      description: Payload Too Large
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - CONTENTS_TOO_LARGE
                description: Code indicating payload size exceeded
              message:
                type: string
                description: Detailed message including the maximum allowed payload size
            required:
            - code
            - message
          examples:
            CONTENTS_TOO_LARGE:
              summary: The payload exceeds the server's maximum size
              value:
                code: CONTENTS_TOO_LARGE
                message: Contents too large
    "414":
      description: URI Too Long
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_LONG_URI
                description: Code indicating URI length exceeded
              message:
                type: string
                description: Detailed message including the maximum allowed URI length
            required:
            - code
            - message
          examples:
            TOO_LONG_URI:
              summary: The request URI exceeds the server's maximum length
              value:
                code: TOO_LONG_URI
                message: URI too long
    "429":
      description: Too Many Requests
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_MANY_REQUESTS
                - EXCEEDED_QUOTA_LIMIT
                description: Code identifying the cause of the request limit exceeded
              message:
                type: string
                description: Detailed message including the exceeded limit type and allowed threshold
            required:
            - code
            - message
          examples:
            TOO_MANY_REQUESTS:
              summary: The rate limit was exceeded
              value:
                code: TOO_MANY_REQUESTS
                message: Too many requests
            EXCEEDED_QUOTA_LIMIT:
              summary: The quota limit was exceeded
              value:
                code: EXCEEDED_QUOTA_LIMIT
                message: Exceeded quota limit
    "500":
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - INTERNAL_SERVER_ERROR
                - INTERRUPTED
                description: Code to identify the cause of the internal server error
              message:
                type: string
                description: Detailed message including the cause of the server error
            required:
            - code
            - message
          examples:
            INTERNAL_SERVER_ERROR:
              summary: An internal server error occurred
              value:
                code: INTERNAL_SERVER_ERROR
                message: Internal server error
            INTERRUPTED:
              summary: Processing failed temporarily due to server load
              value:
                code: INTERRUPTED
                message: Request interrupted
    "503":
      description: Service Unavailable
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - UNAVAILABLE
                description: Code indicating service unavailability
              message:
                type: string
                description: Detailed message including the cause of the service outage
            required:
            - code
            - message
          examples:
            UNAVAILABLE:
              summary: The service is unavailable due to infrastructure downtime or an upgrade
              value:
                code: UNAVAILABLE
                message: Service unavailable
paths:
  /:
    post:
      security:
      - api_key: []
      operationId: xrpl-submit
      summary: submit
      description: |
        Submits a signed transaction to the local node and the network.
        The result code in the response is preliminary; check the final outcome with `tx` after the transaction is included in a ledger version.

        > 🚧 A submitted transaction cannot be cancelled!
        >
        > Previewing the results with `simulate` before submitting is recommended.
        > Even when `engine_result` is `tesSUCCESS`, the final outcome can differ.
      x-seo-description: Applies a signed transaction and sends it to the XRP Ledger network.
      tags:
      - transaction
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - method
              - params
              properties:
                method:
                  type: string
                  example: submit
                params:
                  type: array
                  description: |-
                    It contains following parameters as a single object in the `params` array.
                    1. `tx_blob`: The signed transaction, as a hex string. (required)
                    2. `fail_hard`: Whether to skip retrying and relaying when local validation fails, as a boolean. (optional, default `false`)
                  minItems: 1
                  maxItems: 1
                  items:
                    title: Parameters
                    type: object
                    required:
                    - tx_blob
                    properties:
                      tx_blob:
                        type: string
                        description: The signed transaction, hex-encoded.
                        example: 1200002280000000240000001B61400000000098968068400000000000000C7321ED
                      fail_hard:
                        type: boolean
                        description: |
                          Whether to skip retrying or relaying to other nodes when local validation fails.
                        example: false
                  example:
                  - tx_blob: 1200002280000000240000001B61400000000098968068400000000000000C7321ED
                    fail_hard: false
              example:
                method: submit
                params:
                - tx_blob: 1200002280000000240000001B61400000000098968068400000000000000C7321ED
                  fail_hard: false
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              example:
                result:
                  accepted: true
                  account_sequence_available: 42
                  account_sequence_next: 42
                  applied: true
                  broadcast: true
                  engine_result: tesSUCCESS
                  engine_result_code: 0
                  engine_result_message: The transaction was applied. Only final in a validated ledger.
                  kept: true
                  open_ledger_cost: "10"
                  queued: false
                  tx_blob: 1200002280000000240000001B61400000000098968068400000000000000C7321ED
                  tx_json:
                    Account: r9cZA1mLK5R5Am25ArfXFmqgNwjZgnfk59
                    Amount: "1000000"
                    Destination: rMwjYedjc7qqtKYVLiAccJSmCwih4LnE2q
                    Fee: "12"
                    Sequence: 41
                    TransactionType: Payment
                    hash: E08D6E9754025BA2534A78707605E0601F03ACE063687A0CA1BDDACFCD1698C7
                  validated_ledger_index: 98765432
              schema:
                $ref: '#/components/schemas/SubmitResult'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "404":
          $ref: '#/components/responses/404'
        "405":
          $ref: '#/components/responses/405'
        "408":
          $ref: '#/components/responses/408'
        "409":
          $ref: '#/components/responses/409'
        "413":
          $ref: '#/components/responses/413'
        "414":
          $ref: '#/components/responses/414'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
        "503":
          $ref: '#/components/responses/503'
