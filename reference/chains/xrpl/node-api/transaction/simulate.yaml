openapi: 3.1.0
info:
  title: XRPL - simulate
  version: 1.0.0
servers:
- url: https://xrpl-mainnet.nodit.io
  description: XRP Ledger Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  schemas:
    SimulateResult:
      type: object
      description: The result of simulating a transaction. It is not committed to the ledger.
      properties:
        tx_json:
          type: object
          description: The simulated transaction with the values the server filled in. Returned when `binary` is `false`.
        tx_blob:
          type: string
          description: The simulated transaction, hex-encoded. Returned when `binary` is `true`.
        ledger_index:
          type: integer
          description: The ledger index the transaction would have been included in.
        meta:
          type: object
          description: The metadata describing the simulation results. Returned when `binary` is `false`.
        meta_blob:
          type: string
          description: The metadata, hex-encoded. Returned when `binary` is `true`.
        engine_result:
          type: string
          description: The result code of the transaction. (e.g.) `tesSUCCESS`
        engine_result_code:
          type: integer
          description: The numeric value corresponding to the result code.
        engine_result_message:
          type: string
          description: A human-readable explanation of the result.
        applied:
          type: boolean
          description: Whether the transaction was applied to the ledger. Because this is a simulation, nothing is actually committed.
  responses:
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - NO_AUTHENTICATION_FOUND
                - AUTHENTICATION_FAILED
                description: Code to identify the cause of authentication failure
              message:
                type: string
                description: Detailed message including the cause of authentication failure
            required:
            - code
            - message
          examples:
            NO_AUTHENTICATION_FOUND:
              summary: The request does not include authentication (API Key)
              value:
                code: NO_AUTHENTICATION_FOUND
                message: No authentication found.
            AUTHENTICATION_FAILED:
              summary: The authentication (API Key) is invalid
              value:
                code: AUTHENTICATION_FAILED
                message: Authentication failed.
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - PERMISSION_DENIED
                description: Code indicating permission denied
              message:
                type: string
                description: Detailed message including information about the denied resource
            required:
            - code
            - message
          examples:
            PERMISSION_DENIED:
              summary: The request accesses a resource it is not authorized for
              value:
                code: PERMISSION_DENIED
                message: Permission denied
    "429":
      description: Too Many Requests
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_MANY_REQUESTS
                - EXCEEDED_QUOTA_LIMIT
                description: Code identifying the cause of the request limit exceeded
              message:
                type: string
                description: Detailed message including the exceeded limit type and allowed threshold
            required:
            - code
            - message
          examples:
            TOO_MANY_REQUESTS:
              summary: The rate limit was exceeded
              value:
                code: TOO_MANY_REQUESTS
                message: Too many requests
            EXCEEDED_QUOTA_LIMIT:
              summary: The quota limit was exceeded
              value:
                code: EXCEEDED_QUOTA_LIMIT
                message: Exceeded quota limit
    "500":
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - INTERNAL_SERVER_ERROR
                - INTERRUPTED
                description: Code to identify the cause of the internal server error
              message:
                type: string
                description: Detailed message including the cause of the server error
            required:
            - code
            - message
          examples:
            INTERNAL_SERVER_ERROR:
              summary: An internal server error occurred
              value:
                code: INTERNAL_SERVER_ERROR
                message: Internal server error
            INTERRUPTED:
              summary: Processing failed temporarily due to server load
              value:
                code: INTERRUPTED
                message: Request interrupted
paths:
  /:
    post:
      security:
      - api_key: []
      operationId: xrpl-simulate
      summary: simulate
      description: |
        Previews the results and metadata of a transaction without committing it to the ledger.
        It works for every transaction type and is used as a pre-flight check before submitting.

        > 📘 Passing a signed transaction returns a `transactionSigned` error.
      x-seo-description: Executes a dry run of a transaction to preview its results without committing to the ledger.
      tags:
      - transaction
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - method
              - params
              properties:
                method:
                  type: string
                  example: simulate
                params:
                  type: array
                  description: |-
                    It contains following parameters as a single object in the `params` array.
                    Provide exactly one of `tx_json` and `tx_blob`.
                    1. `tx_json`: The transaction to simulate, as a JSON object.
                    2. `tx_blob`: The transaction to simulate, as a hex string.
                    3. `binary`: Whether to return the result and metadata as hex strings, as a boolean. (optional, default `false`)
                  minItems: 1
                  maxItems: 1
                  items:
                    title: Parameters
                    type: object
                    properties:
                      tx_json:
                        type: object
                        description: |
                          The transaction to simulate. It must be unsigned.
                          If `Fee`, `Sequence`, `SigningPubKey` or `NetworkID` are omitted, the server fills them in automatically.
                      tx_blob:
                        type: string
                        description: The transaction to simulate, hex-encoded. It must be unsigned.
                      binary:
                        type: boolean
                        description: Whether to return the transaction and its metadata as hex strings.
                        example: false
                  example:
                  - tx_json:
                      Account: r9cZA1mLK5R5Am25ArfXFmqgNwjZgnfk59
                      Amount: "1000000"
                      Destination: rMwjYedjc7qqtKYVLiAccJSmCwih4LnE2q
                      TransactionType: Payment
                    binary: false
              example:
                method: simulate
                params:
                - tx_json:
                    Account: r9cZA1mLK5R5Am25ArfXFmqgNwjZgnfk59
                    Amount: "1000000"
                    Destination: rMwjYedjc7qqtKYVLiAccJSmCwih4LnE2q
                    TransactionType: Payment
                  binary: false
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              example:
                result:
                  applied: false
                  engine_result: tesSUCCESS
                  engine_result_code: 0
                  engine_result_message: The simulated transaction would have been applied.
                  ledger_index: 98765433
                  meta:
                    TransactionIndex: 0
                    TransactionResult: tesSUCCESS
                    delivered_amount: "1000000"
                  tx_json:
                    Account: r9cZA1mLK5R5Am25ArfXFmqgNwjZgnfk59
                    Amount: "1000000"
                    Destination: rMwjYedjc7qqtKYVLiAccJSmCwih4LnE2q
                    Fee: "12"
                    Sequence: 42
                    SigningPubKey: ""
                    TransactionType: Payment
              schema:
                $ref: '#/components/schemas/SimulateResult'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
