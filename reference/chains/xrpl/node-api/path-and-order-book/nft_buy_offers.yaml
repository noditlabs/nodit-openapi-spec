openapi: 3.1.0
info:
  title: XRPL - nft_buy_offers
  version: 1.0.0
servers:
- url: https://xrpl-mainnet.nodit.io
  description: XRP Ledger Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  schemas:
    CurrencyAmount:
      description: |
        Represents an amount. XRP is expressed as a string in drops; tokens are expressed as an object.
      oneOf:
      - title: XRP Amount
        type: string
        description: An XRP amount in drops. 1 XRP equals 1,000,000 drops.
        example: "10000000"
      - title: Token Amount
        type: object
        description: A token amount.
        properties:
          currency:
            type: string
            description: The currency code. Either a 3-character code or a 40-character hex string.
          issuer:
            type: string
            description: The address of the account that issued the token.
          value:
            type: string
            description: The amount expressed as a string.
    LedgerIndex:
      description: |
        Specifies the ledger version to use. Pass a ledger index as an integer, or use one of the shortcut strings below.
        - `validated`: Uses the most recent ledger version validated by the network.
        - `closed`: Uses the most recent ledger version the server has closed. It may not be validated.
        - `current`: Uses the in-progress ledger version the server is currently building.
      oneOf:
      - title: Ledger Index
        type: integer
        description: The ledger index of the version to use.
      - title: Shortcut
        type: string
        description: A shortcut string that specifies the ledger version to use.
        enum:
        - validated
        - closed
        - current
    Marker:
      description: |
        A value that marks a pagination position. Pass the `marker` value from a previous response to retrieve the next page.
        Its format depends on the server implementation, so use it verbatim without interpreting its contents.
    NftOffersResult:
      type: object
      description: The result of looking up the offers on an NFToken.
      properties:
        nft_id:
          type: string
          description: The identifier of the NFToken from the request.
        offers:
          type: array
          description: The list of offers.
          items:
            type: object
            description: Offer data.
            properties:
              amount:
                $ref: '#/components/schemas/CurrencyAmount'
              flags:
                type: integer
                description: A bit-map of flags enabled for the offer.
              nft_offer_index:
                type: string
                description: The ID that identifies this offer ledger entry.
              owner:
                type: string
                description: The address of the account that created the offer.
              destination:
                type: string
                description: The address of the account designated to accept this offer. Returned only when one is designated.
              expiration:
                type: integer
                description: The expiration time of the offer, in seconds since the Ripple Epoch. Returned only when an expiration is set.
        limit:
          type: integer
          description: The limit value used in the request.
        marker:
          $ref: '#/components/schemas/Marker'
  responses:
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - NO_AUTHENTICATION_FOUND
                - AUTHENTICATION_FAILED
                description: Code to identify the cause of authentication failure
              message:
                type: string
                description: Detailed message including the cause of authentication failure
            required:
            - code
            - message
          examples:
            NO_AUTHENTICATION_FOUND:
              summary: The request does not include authentication (API Key)
              value:
                code: NO_AUTHENTICATION_FOUND
                message: No authentication found.
            AUTHENTICATION_FAILED:
              summary: The authentication (API Key) is invalid
              value:
                code: AUTHENTICATION_FAILED
                message: Authentication failed.
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - PERMISSION_DENIED
                description: Code indicating permission denied
              message:
                type: string
                description: Detailed message including information about the denied resource
            required:
            - code
            - message
          examples:
            PERMISSION_DENIED:
              summary: The request accesses a resource it is not authorized for
              value:
                code: PERMISSION_DENIED
                message: Permission denied
    "404":
      description: Not Found
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - WRONG_ENDPOINT
                - NOT_SUPPORTED_CHAIN
                - RESOURCE_NOT_FOUND
                description: Code to identify the cause of the resource not found
              message:
                type: string
                description: Detailed message including the name, value, etc. of the resource not found
            required:
            - code
            - message
          examples:
            WRONG_ENDPOINT:
              summary: The requested API path does not exist
              value:
                code: WRONG_ENDPOINT
                message: Wrong endpoint
            NOT_SUPPORTED_CHAIN:
              summary: The requested chain is not supported
              value:
                code: NOT_SUPPORTED_CHAIN
                message: Not supported chain
            RESOURCE_NOT_FOUND:
              summary: The requested resource does not exist
              value:
                code: RESOURCE_NOT_FOUND
                message: 'Resource not found: { RESOURCE_NAME = RESOURCE_VALUE }'
    "405":
      description: Method Not Allowed
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - METHOD_NOT_ALLOWED
                description: Code indicating a disallowed HTTP method
              message:
                type: string
                description: Detailed message about the disallowed HTTP method
            required:
            - code
            - message
          examples:
            METHOD_NOT_ALLOWED:
              summary: The request uses an unsupported HTTP method
              value:
                code: METHOD_NOT_ALLOWED
                message: Method not allowed
    "408":
      description: Request Timeout
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TIMEOUT
                description: Code indicating request timeout
              message:
                type: string
                description: Detailed message including the cause of the timeout
            required:
            - code
            - message
          examples:
            TIMEOUT:
              summary: Processing did not finish within the time limit
              value:
                code: TIMEOUT
                message: Request timeout
    "409":
      description: Conflict
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - RESOURCE_ALREADY_EXISTS
                - REJECTED
                description: Code to identify the cause of the request conflict
              message:
                type: string
                description: Detailed message including information about the conflicting resource
            required:
            - code
            - message
          examples:
            RESOURCE_ALREADY_EXISTS:
              summary: The request tries to create a resource that already exists
              value:
                code: RESOURCE_ALREADY_EXISTS
                message: Resource already exists
            REJECTED:
              summary: The server rejected the request
              value:
                code: REJECTED
                message: Request rejected
    "413":
      description: Payload Too Large
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - CONTENTS_TOO_LARGE
                description: Code indicating payload size exceeded
              message:
                type: string
                description: Detailed message including the maximum allowed payload size
            required:
            - code
            - message
          examples:
            CONTENTS_TOO_LARGE:
              summary: The payload exceeds the server's maximum size
              value:
                code: CONTENTS_TOO_LARGE
                message: Contents too large
    "414":
      description: URI Too Long
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_LONG_URI
                description: Code indicating URI length exceeded
              message:
                type: string
                description: Detailed message including the maximum allowed URI length
            required:
            - code
            - message
          examples:
            TOO_LONG_URI:
              summary: The request URI exceeds the server's maximum length
              value:
                code: TOO_LONG_URI
                message: URI too long
    "429":
      description: Too Many Requests
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_MANY_REQUESTS
                - EXCEEDED_QUOTA_LIMIT
                description: Code identifying the cause of the request limit exceeded
              message:
                type: string
                description: Detailed message including the exceeded limit type and allowed threshold
            required:
            - code
            - message
          examples:
            TOO_MANY_REQUESTS:
              summary: The rate limit was exceeded
              value:
                code: TOO_MANY_REQUESTS
                message: Too many requests
            EXCEEDED_QUOTA_LIMIT:
              summary: The quota limit was exceeded
              value:
                code: EXCEEDED_QUOTA_LIMIT
                message: Exceeded quota limit
    "500":
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - INTERNAL_SERVER_ERROR
                - INTERRUPTED
                description: Code to identify the cause of the internal server error
              message:
                type: string
                description: Detailed message including the cause of the server error
            required:
            - code
            - message
          examples:
            INTERNAL_SERVER_ERROR:
              summary: An internal server error occurred
              value:
                code: INTERNAL_SERVER_ERROR
                message: Internal server error
            INTERRUPTED:
              summary: Processing failed temporarily due to server load
              value:
                code: INTERRUPTED
                message: Request interrupted
    "503":
      description: Service Unavailable
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - UNAVAILABLE
                description: Code indicating service unavailability
              message:
                type: string
                description: Detailed message including the cause of the service outage
            required:
            - code
            - message
          examples:
            UNAVAILABLE:
              summary: The service is unavailable due to infrastructure downtime or an upgrade
              value:
                code: UNAVAILABLE
                message: Service unavailable
paths:
  /:
    post:
      security:
      - api_key: []
      operationId: xrpl-nft_buy_offers
      summary: nft_buy_offers
      description: |
        Returns the list of buy offers on a given NFToken.
        It lets you check the offered amount and the creator of each offer.

        > 📘 If the NFToken has no buy offers, an `objectNotFound` error is returned.
      x-seo-description: Returns a list of buy offers for a given NFToken object.
      tags:
      - path-and-order-book
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - method
              - params
              properties:
                method:
                  type: string
                  example: nft_buy_offers
                params:
                  type: array
                  description: |-
                    It contains following parameters as a single object in the `params` array.
                    1. `nft_id`: The identifier of the NFToken to look up, as a string. (required)
                    2. `limit`: The number of offers to return, as an integer between 50 and 500. (optional, default `250`)
                    3. `marker`: Pass the `marker` value from a previous response to retrieve the next page. (optional)
                    - `ledger_hash`: The hash of the ledger version to use, as a string. (optional)
                    - `ledger_index`: The ledger index or a shortcut string. (optional)
                  minItems: 1
                  maxItems: 1
                  items:
                    title: Parameters
                    type: object
                    required:
                    - nft_id
                    properties:
                      nft_id:
                        type: string
                        description: The identifier of the NFToken to look up.
                        example: 000800006203F49C21D5D6E022CB16DE3538F248662FC73C00000E39
                      limit:
                        type: integer
                        description: The number of offers to return. Pass a value between 50 and 500.
                        example: 250
                      marker:
                        $ref: '#/components/schemas/Marker'
                      ledger_hash:
                        type: string
                        description: The hash of the ledger version to use. Pass a 32-byte hex string.
                      ledger_index:
                        $ref: '#/components/schemas/LedgerIndex'
                  example:
                  - nft_id: 000800006203F49C21D5D6E022CB16DE3538F248662FC73C00000E39
                    limit: 250
              example:
                method: nft_buy_offers
                params:
                - nft_id: 000800006203F49C21D5D6E022CB16DE3538F248662FC73C00000E39
                  limit: 250
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              example:
                result:
                  nft_id: 000800006203F49C21D5D6E022CB16DE3538F248662FC73C00000E39
                  offers:
                  - amount: "1000000"
                    flags: 1
                    nft_offer_index: 3D5F7A9B1C2E4A6C8D0F2B4D6E8A0C1E3F5B7D9A0C2E4F6B8D0A1C3E5F7B9D0A
                    owner: r9cZA1mLK5R5Am25ArfXFmqgNwjZgnfk59
                  limit: 250
              schema:
                $ref: '#/components/schemas/NftOffersResult'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "404":
          $ref: '#/components/responses/404'
        "405":
          $ref: '#/components/responses/405'
        "408":
          $ref: '#/components/responses/408'
        "409":
          $ref: '#/components/responses/409'
        "413":
          $ref: '#/components/responses/413'
        "414":
          $ref: '#/components/responses/414'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
        "503":
          $ref: '#/components/responses/503'
