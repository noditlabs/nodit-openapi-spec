openapi: 3.1.0
info:
  title: XRPL - get_aggregate_price
  version: 1.0.0
servers:
- url: https://xrpl-mainnet.nodit.io
  description: XRP Ledger Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  schemas:
    AggregatePriceResult:
      type: object
      description: The result of aggregating Oracle prices.
      properties:
        entire_set:
          type: object
          description: Statistics computed over every Oracle price collected.
          properties:
            mean:
              type: string
              description: The arithmetic mean.
            size:
              type: integer
              description: The number of data points used to compute the mean.
            standard_deviation:
              type: string
              description: The standard deviation of the price distribution.
        trimmed_set:
          type: object
          description: Statistics computed with outliers excluded. Returned only when `trim` is specified in the request.
          properties:
            mean:
              type: string
              description: The arithmetic mean with outliers excluded.
            size:
              type: integer
              description: The number of data points with outliers excluded.
            standard_deviation:
              type: string
              description: The standard deviation of the price distribution with outliers excluded.
        median:
          type: string
          description: The median of the prices collected.
        time:
          type: integer
          description: The most recent update time among the Oracles used, in Unix timestamp seconds.
  responses:
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - NO_AUTHENTICATION_FOUND
                - AUTHENTICATION_FAILED
                description: Code to identify the cause of authentication failure
              message:
                type: string
                description: Detailed message including the cause of authentication failure
            required:
            - code
            - message
          examples:
            NO_AUTHENTICATION_FOUND:
              summary: The request does not include authentication (API Key)
              value:
                code: NO_AUTHENTICATION_FOUND
                message: No authentication found.
            AUTHENTICATION_FAILED:
              summary: The authentication (API Key) is invalid
              value:
                code: AUTHENTICATION_FAILED
                message: Authentication failed.
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - PERMISSION_DENIED
                description: Code indicating permission denied
              message:
                type: string
                description: Detailed message including information about the denied resource
            required:
            - code
            - message
          examples:
            PERMISSION_DENIED:
              summary: The request accesses a resource it is not authorized for
              value:
                code: PERMISSION_DENIED
                message: Permission denied
    "429":
      description: Too Many Requests
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_MANY_REQUESTS
                - EXCEEDED_QUOTA_LIMIT
                description: Code identifying the cause of the request limit exceeded
              message:
                type: string
                description: Detailed message including the exceeded limit type and allowed threshold
            required:
            - code
            - message
          examples:
            TOO_MANY_REQUESTS:
              summary: The rate limit was exceeded
              value:
                code: TOO_MANY_REQUESTS
                message: Too many requests
            EXCEEDED_QUOTA_LIMIT:
              summary: The quota limit was exceeded
              value:
                code: EXCEEDED_QUOTA_LIMIT
                message: Exceeded quota limit
    "500":
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - INTERNAL_SERVER_ERROR
                - INTERRUPTED
                description: Code to identify the cause of the internal server error
              message:
                type: string
                description: Detailed message including the cause of the server error
            required:
            - code
            - message
          examples:
            INTERNAL_SERVER_ERROR:
              summary: An internal server error occurred
              value:
                code: INTERNAL_SERVER_ERROR
                message: Internal server error
            INTERRUPTED:
              summary: Processing failed temporarily due to server load
              value:
                code: INTERRUPTED
                message: Request interrupted
paths:
  /:
    post:
      security:
      - api_key: []
      operationId: xrpl-get_aggregate_price
      summary: get_aggregate_price
      description: |
        Aggregates the prices from multiple Price Oracles and returns the mean, median and trimmed mean.
        Specify `trim` to obtain statistics with outliers excluded.
      x-seo-description: Retrieves the aggregate price of specified Oracle objects, returning mean, median, and trimmed mean.
      tags:
      - path-and-order-book
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - method
              - params
              properties:
                method:
                  type: string
                  example: get_aggregate_price
                params:
                  type: array
                  description: |-
                    It contains following parameters as a single object in the `params` array.
                    1. `base_asset`: The currency code of the asset being priced, as a string. (required)
                    2. `quote_asset`: The currency code used to quote the base asset price, as a string. (required)
                    3. `oracles`: The Oracles to aggregate, as an array of objects. (required, between 1 and 200)
                    4. `trim`: The percentage of outliers to remove, as an integer between 1 and 25. (optional)
                    5. `trim_threshold`: The time range in seconds used to exclude older prices, as an integer. (optional, default `0`)
                  minItems: 1
                  maxItems: 1
                  items:
                    title: Parameters
                    type: object
                    required:
                    - base_asset
                    - quote_asset
                    - oracles
                    properties:
                      base_asset:
                        type: string
                        description: The currency code of the asset being priced.
                        example: XRP
                      quote_asset:
                        type: string
                        description: The currency code used to quote the base asset price.
                        example: USD
                      oracles:
                        type: array
                        description: The Oracles to aggregate. Pass between 1 and 200 of them.
                        items:
                          type: object
                          description: Oracle identification data.
                          required:
                          - account
                          - oracle_document_id
                          properties:
                            account:
                              type: string
                              description: The address of the account that owns the Oracle.
                              example: r9cZA1mLK5R5Am25ArfXFmqgNwjZgnfk59
                            oracle_document_id:
                              type: integer
                              description: The number that identifies the Oracle within the account.
                              example: 1
                      trim:
                        type: integer
                        description: |
                          The percentage of outliers to remove. Pass a value between 1 and 25.
                          Providing this value adds `trimmed_set` to the response.
                        example: 20
                      trim_threshold:
                        type: integer
                        description: |
                          The cutoff time used to exclude older prices from the aggregation, in seconds.
                          Pass `0` to apply no time-based filter.
                        example: 0
                  example:
                  - base_asset: XRP
                    quote_asset: USD
                    oracles:
                    - account: r9cZA1mLK5R5Am25ArfXFmqgNwjZgnfk59
                      oracle_document_id: 1
                    trim: 20
              example:
                method: get_aggregate_price
                params:
                - base_asset: XRP
                  quote_asset: USD
                  oracles:
                  - account: r9cZA1mLK5R5Am25ArfXFmqgNwjZgnfk59
                    oracle_document_id: 1
                  trim: 20
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              example:
                result:
                  entire_set:
                    mean: "0.00051"
                    size: 3
                    standard_deviation: "0.0000115"
                  median: "0.00051"
                  time: 1772000000
                  trimmed_set:
                    mean: "0.00051"
                    size: 1
                    standard_deviation: "0"
              schema:
                $ref: '#/components/schemas/AggregatePriceResult'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
