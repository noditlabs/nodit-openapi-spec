openapi: 3.1.0
info:
  title: XRPL - book_offers
  version: 1.0.0
servers:
- url: https://xrpl-mainnet.nodit.io
  description: XRP Ledger Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  schemas:
    BookOffersResult:
      allOf:
      - type: object
        description: The result of looking up the order book between two currencies.
        properties:
          offers:
            type: array
            description: The list of offers in the order book.
            items:
              type: object
              description: Offer data.
              properties:
                Account:
                  type: string
                  description: The address of the account that created the offer.
                TakerGets:
                  $ref: '#/components/schemas/CurrencyAmount'
                TakerPays:
                  $ref: '#/components/schemas/CurrencyAmount'
                BookDirectory:
                  type: string
                  description: The ID of the order book directory this offer belongs to.
                Flags:
                  type: integer
                  description: A bit-map of flags enabled for the offer.
                Sequence:
                  type: integer
                  description: The sequence number of the transaction that created the offer.
                index:
                  type: string
                  description: The ID that identifies this offer ledger entry.
                quality:
                  type: string
                  description: The exchange rate of the offer, calculated as `taker_pays` divided by `taker_gets`.
                owner_funds:
                  type: string
                  description: |
                    The tradeable balance held by the offer's creator.
                    It is returned only for the highest-ranked offer among the offers from the same account.
                taker_gets_funded:
                  $ref: '#/components/schemas/CurrencyAmount'
                taker_pays_funded:
                  $ref: '#/components/schemas/CurrencyAmount'
      - $ref: '#/components/schemas/LedgerContext'
    CurrencyAmount:
      description: |
        Represents an amount. XRP is expressed as a string in drops; tokens are expressed as an object.
      oneOf:
      - title: XRP Amount
        type: string
        description: An XRP amount in drops. 1 XRP equals 1,000,000 drops.
        example: "10000000"
      - title: Token Amount
        type: object
        description: A token amount.
        properties:
          currency:
            type: string
            description: The currency code. Either a 3-character code or a 40-character hex string.
          issuer:
            type: string
            description: The address of the account that issued the token.
          value:
            type: string
            description: The amount expressed as a string.
    LedgerContext:
      type: object
      description: Common fields that indicate which ledger version the response was derived from.
      properties:
        ledger_hash:
          type: string
          description: The hash of the ledger version used. Returned when a validated ledger version was queried.
        ledger_index:
          type: integer
          description: The ledger index of the version used. Returned when a validated ledger version was queried.
        ledger_current_index:
          type: integer
          description: The ledger index of the in-progress ledger. Returned when the `current` ledger was queried.
        validated:
          type: boolean
          description: Whether the response was derived from a validated ledger version.
    LedgerIndex:
      description: |
        Specifies the ledger version to use. Pass a ledger index as an integer, or use one of the shortcut strings below.
        - `validated`: Uses the most recent ledger version validated by the network.
        - `closed`: Uses the most recent ledger version the server has closed. It may not be validated.
        - `current`: Uses the in-progress ledger version the server is currently building.
      oneOf:
      - title: Ledger Index
        type: integer
        description: The ledger index of the version to use.
      - title: Shortcut
        type: string
        description: A shortcut string that specifies the ledger version to use.
        enum:
        - validated
        - closed
        - current
  responses:
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - NO_AUTHENTICATION_FOUND
                - AUTHENTICATION_FAILED
                description: Code to identify the cause of authentication failure
              message:
                type: string
                description: Detailed message including the cause of authentication failure
            required:
            - code
            - message
          examples:
            NO_AUTHENTICATION_FOUND:
              summary: The request does not include authentication (API Key)
              value:
                code: NO_AUTHENTICATION_FOUND
                message: No authentication found.
            AUTHENTICATION_FAILED:
              summary: The authentication (API Key) is invalid
              value:
                code: AUTHENTICATION_FAILED
                message: Authentication failed.
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - PERMISSION_DENIED
                description: Code indicating permission denied
              message:
                type: string
                description: Detailed message including information about the denied resource
            required:
            - code
            - message
          examples:
            PERMISSION_DENIED:
              summary: The request accesses a resource it is not authorized for
              value:
                code: PERMISSION_DENIED
                message: Permission denied
    "404":
      description: Not Found
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - WRONG_ENDPOINT
                - NOT_SUPPORTED_CHAIN
                - RESOURCE_NOT_FOUND
                description: Code to identify the cause of the resource not found
              message:
                type: string
                description: Detailed message including the name, value, etc. of the resource not found
            required:
            - code
            - message
          examples:
            WRONG_ENDPOINT:
              summary: The requested API path does not exist
              value:
                code: WRONG_ENDPOINT
                message: Wrong endpoint
            NOT_SUPPORTED_CHAIN:
              summary: The requested chain is not supported
              value:
                code: NOT_SUPPORTED_CHAIN
                message: Not supported chain
            RESOURCE_NOT_FOUND:
              summary: The requested resource does not exist
              value:
                code: RESOURCE_NOT_FOUND
                message: 'Resource not found: { RESOURCE_NAME = RESOURCE_VALUE }'
    "405":
      description: Method Not Allowed
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - METHOD_NOT_ALLOWED
                description: Code indicating a disallowed HTTP method
              message:
                type: string
                description: Detailed message about the disallowed HTTP method
            required:
            - code
            - message
          examples:
            METHOD_NOT_ALLOWED:
              summary: The request uses an unsupported HTTP method
              value:
                code: METHOD_NOT_ALLOWED
                message: Method not allowed
    "408":
      description: Request Timeout
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TIMEOUT
                description: Code indicating request timeout
              message:
                type: string
                description: Detailed message including the cause of the timeout
            required:
            - code
            - message
          examples:
            TIMEOUT:
              summary: Processing did not finish within the time limit
              value:
                code: TIMEOUT
                message: Request timeout
    "409":
      description: Conflict
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - RESOURCE_ALREADY_EXISTS
                - REJECTED
                description: Code to identify the cause of the request conflict
              message:
                type: string
                description: Detailed message including information about the conflicting resource
            required:
            - code
            - message
          examples:
            RESOURCE_ALREADY_EXISTS:
              summary: The request tries to create a resource that already exists
              value:
                code: RESOURCE_ALREADY_EXISTS
                message: Resource already exists
            REJECTED:
              summary: The server rejected the request
              value:
                code: REJECTED
                message: Request rejected
    "413":
      description: Payload Too Large
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - CONTENTS_TOO_LARGE
                description: Code indicating payload size exceeded
              message:
                type: string
                description: Detailed message including the maximum allowed payload size
            required:
            - code
            - message
          examples:
            CONTENTS_TOO_LARGE:
              summary: The payload exceeds the server's maximum size
              value:
                code: CONTENTS_TOO_LARGE
                message: Contents too large
    "414":
      description: URI Too Long
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_LONG_URI
                description: Code indicating URI length exceeded
              message:
                type: string
                description: Detailed message including the maximum allowed URI length
            required:
            - code
            - message
          examples:
            TOO_LONG_URI:
              summary: The request URI exceeds the server's maximum length
              value:
                code: TOO_LONG_URI
                message: URI too long
    "429":
      description: Too Many Requests
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_MANY_REQUESTS
                - EXCEEDED_QUOTA_LIMIT
                description: Code identifying the cause of the request limit exceeded
              message:
                type: string
                description: Detailed message including the exceeded limit type and allowed threshold
            required:
            - code
            - message
          examples:
            TOO_MANY_REQUESTS:
              summary: The rate limit was exceeded
              value:
                code: TOO_MANY_REQUESTS
                message: Too many requests
            EXCEEDED_QUOTA_LIMIT:
              summary: The quota limit was exceeded
              value:
                code: EXCEEDED_QUOTA_LIMIT
                message: Exceeded quota limit
    "500":
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - INTERNAL_SERVER_ERROR
                - INTERRUPTED
                description: Code to identify the cause of the internal server error
              message:
                type: string
                description: Detailed message including the cause of the server error
            required:
            - code
            - message
          examples:
            INTERNAL_SERVER_ERROR:
              summary: An internal server error occurred
              value:
                code: INTERNAL_SERVER_ERROR
                message: Internal server error
            INTERRUPTED:
              summary: Processing failed temporarily due to server load
              value:
                code: INTERRUPTED
                message: Request interrupted
    "503":
      description: Service Unavailable
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - UNAVAILABLE
                description: Code indicating service unavailability
              message:
                type: string
                description: Detailed message including the cause of the service outage
            required:
            - code
            - message
          examples:
            UNAVAILABLE:
              summary: The service is unavailable due to infrastructure downtime or an upgrade
              value:
                code: UNAVAILABLE
                message: Service unavailable
paths:
  /:
    post:
      security:
      - api_key: []
      operationId: xrpl-book_offers
      summary: book_offers
      description: |
        Returns the list of offers in the order book between two currencies.
        It lets you check the exchange rate and the funding status of each offer.
      x-seo-description: Retrieves a list of offers between two currencies, also known as an order book.
      tags:
      - path-and-order-book
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - method
              - params
              properties:
                method:
                  type: string
                  example: book_offers
                params:
                  type: array
                  description: |-
                    It contains following parameters as a single object in the `params` array.
                    1. `taker_gets`: The asset the offer taker would receive, as an object. (required)
                    2. `taker_pays`: The asset the offer taker would pay, as an object. (required)
                    3. `taker`: The account address to use as the perspective, as a string. (optional)
                    4. `limit`: The number of offers to return, as an integer. (optional)
                    5. `domain`: The domain ledger entry ID of the Permissioned DEX, as a string. (optional)
                    - `ledger_hash`: The hash of the ledger version to use, as a string. (optional)
                    - `ledger_index`: The ledger index or a shortcut string. (optional)
                  minItems: 1
                  maxItems: 1
                  items:
                    title: Parameters
                    type: object
                    required:
                    - taker_gets
                    - taker_pays
                    properties:
                      taker_gets:
                        type: object
                        description: Specifies an asset by currency code and issuer. No amount is included.
                        properties:
                          currency:
                            type: string
                            description: The currency code. Pass `XRP` for XRP.
                          issuer:
                            type: string
                            description: The address of the account that issued the token. Required for anything other than XRP.
                      taker_pays:
                        type: object
                        description: Specifies an asset by currency code and issuer. No amount is included.
                        properties:
                          currency:
                            type: string
                            description: The currency code. Pass `XRP` for XRP.
                          issuer:
                            type: string
                            description: The address of the account that issued the token. Required for anything other than XRP.
                      taker:
                        type: string
                        description: |
                          The account address used as the perspective for the order book.
                          When specified, the unfunded offers from that account are also included in the results.
                      limit:
                        type: integer
                        description: The number of offers to return.
                        example: 10
                      domain:
                        type: string
                        description: |
                          The domain ledger entry ID of the Permissioned DEX.
                          It can be used only when the PermissionedDEX amendment is enabled.
                      ledger_hash:
                        type: string
                        description: The hash of the ledger version to use. Pass a 32-byte hex string.
                      ledger_index:
                        $ref: '#/components/schemas/LedgerIndex'
                  example:
                  - taker_gets:
                      currency: XRP
                    taker_pays:
                      currency: USD
                      issuer: rMwjYedjc7qqtKYVLiAccJSmCwih4LnE2q
                    limit: 10
              example:
                method: book_offers
                params:
                - taker_gets:
                    currency: XRP
                  taker_pays:
                    currency: USD
                    issuer: rMwjYedjc7qqtKYVLiAccJSmCwih4LnE2q
                  limit: 10
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              example:
                result:
                  ledger_current_index: 98765433
                  offers:
                  - Account: r9cZA1mLK5R5Am25ArfXFmqgNwjZgnfk59
                    BookDirectory: 8C0E1B3D5F7A9C0E2D4F6B8A0C1E3D5F7A9B0C2E4D6F8A0B4E1F3A5C7E9B0D2F
                    Flags: 0
                    Sequence: 40
                    TakerGets: "1000000"
                    TakerPays:
                      currency: USD
                      issuer: rMwjYedjc7qqtKYVLiAccJSmCwih4LnE2q
                      value: "0.015"
                    index: 9D0F2A4C6E8B0D1F3A5C7E9B0D2F4A6C8E0B1D3F5A7C9E0B2D4F6A8C0E1B3D5F
                    owner_funds: "5000000"
                    quality: "0.000000015"
                  validated: false
              schema:
                $ref: '#/components/schemas/BookOffersResult'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "404":
          $ref: '#/components/responses/404'
        "405":
          $ref: '#/components/responses/405'
        "408":
          $ref: '#/components/responses/408'
        "409":
          $ref: '#/components/responses/409'
        "413":
          $ref: '#/components/responses/413'
        "414":
          $ref: '#/components/responses/414'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
        "503":
          $ref: '#/components/responses/503'
