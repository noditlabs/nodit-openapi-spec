openapi: 3.1.0
info:
  title: XRPL - amm_info
  version: 1.0.0
servers:
- url: https://xrpl-mainnet.nodit.io
  description: XRP Ledger Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  schemas:
    AmmInfoResult:
      allOf:
      - type: object
        description: The result of looking up an AMM instance.
        properties:
          amm:
            type: object
            description: Detailed AMM information.
            properties:
              account:
                type: string
                description: The special account address of the AMM. It is also the issuer of the LP tokens.
              amount:
                $ref: '#/components/schemas/CurrencyAmount'
              amount2:
                $ref: '#/components/schemas/CurrencyAmount'
              asset_frozen:
                type: boolean
                description: Whether the first asset is frozen.
              asset2_frozen:
                type: boolean
                description: Whether the second asset is frozen.
              auction_slot:
                type: object
                description: Information about the trading fee discount auction slot.
                properties:
                  account:
                    type: string
                    description: The address of the account that currently holds the slot.
                  discounted_fee:
                    type: integer
                    description: The discounted fee applied to the slot holder, in units of 1/100,000.
                  price:
                    $ref: '#/components/schemas/CurrencyAmount'
                  time_interval:
                    type: integer
                    description: The current time interval of the auction slot.
                  expiration:
                    type: string
                    description: The time the slot expires, in ISO 8601 format.
                  auth_accounts:
                    type: array
                    description: The list of accounts designated to also receive the discounted fee.
                    items:
                      type: object
                      description: Information about a designated account.
                      properties:
                        account:
                          type: string
                          description: The account address.
              lp_token:
                $ref: '#/components/schemas/CurrencyAmount'
              trading_fee:
                type: integer
                description: The trading fee of the AMM, in units of 1/100,000.
              vote_slots:
                type: array
                description: The current state of trading fee voting.
                items:
                  type: object
                  description: Information about an individual vote.
                  properties:
                    account:
                      type: string
                      description: The address of the account that voted.
                    trading_fee:
                      type: integer
                      description: The trading fee that account voted for, in units of 1/100,000.
                    vote_weight:
                      type: integer
                      description: The weight of the vote.
      - $ref: '#/components/schemas/LedgerContext'
    Asset:
      type: object
      description: Specifies an asset by currency code and issuer. Omit `issuer` for XRP.
      properties:
        currency:
          type: string
          description: The currency code. Pass `XRP` for XRP.
        issuer:
          type: string
          description: The address of the account that issued the token. Omit for XRP.
    CurrencyAmount:
      description: |
        Represents an amount. XRP is expressed as a string in drops; tokens are expressed as an object.
      oneOf:
      - title: XRP Amount
        type: string
        description: An XRP amount in drops. 1 XRP equals 1,000,000 drops.
        example: "10000000"
      - title: Token Amount
        type: object
        description: A token amount.
        properties:
          currency:
            type: string
            description: The currency code. Either a 3-character code or a 40-character hex string.
          issuer:
            type: string
            description: The address of the account that issued the token.
          value:
            type: string
            description: The amount expressed as a string.
    LedgerContext:
      type: object
      description: Common fields that indicate which ledger version the response was derived from.
      properties:
        ledger_hash:
          type: string
          description: The hash of the ledger version used. Returned when a validated ledger version was queried.
        ledger_index:
          type: integer
          description: The ledger index of the version used. Returned when a validated ledger version was queried.
        ledger_current_index:
          type: integer
          description: The ledger index of the in-progress ledger. Returned when the `current` ledger was queried.
        validated:
          type: boolean
          description: Whether the response was derived from a validated ledger version.
    LedgerIndex:
      description: |
        Specifies the ledger version to use. Pass a ledger index as an integer, or use one of the shortcut strings below.
        - `validated`: Uses the most recent ledger version validated by the network.
        - `closed`: Uses the most recent ledger version the server has closed. It may not be validated.
        - `current`: Uses the in-progress ledger version the server is currently building.
      oneOf:
      - title: Ledger Index
        type: integer
        description: The ledger index of the version to use.
      - title: Shortcut
        type: string
        description: A shortcut string that specifies the ledger version to use.
        enum:
        - validated
        - closed
        - current
  responses:
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - NO_AUTHENTICATION_FOUND
                - AUTHENTICATION_FAILED
                description: Code to identify the cause of authentication failure
              message:
                type: string
                description: Detailed message including the cause of authentication failure
            required:
            - code
            - message
          examples:
            NO_AUTHENTICATION_FOUND:
              summary: The request does not include authentication (API Key)
              value:
                code: NO_AUTHENTICATION_FOUND
                message: No authentication found.
            AUTHENTICATION_FAILED:
              summary: The authentication (API Key) is invalid
              value:
                code: AUTHENTICATION_FAILED
                message: Authentication failed.
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - PERMISSION_DENIED
                description: Code indicating permission denied
              message:
                type: string
                description: Detailed message including information about the denied resource
            required:
            - code
            - message
          examples:
            PERMISSION_DENIED:
              summary: The request accesses a resource it is not authorized for
              value:
                code: PERMISSION_DENIED
                message: Permission denied
    "404":
      description: Not Found
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - WRONG_ENDPOINT
                - NOT_SUPPORTED_CHAIN
                - RESOURCE_NOT_FOUND
                description: Code to identify the cause of the resource not found
              message:
                type: string
                description: Detailed message including the name, value, etc. of the resource not found
            required:
            - code
            - message
          examples:
            WRONG_ENDPOINT:
              summary: The requested API path does not exist
              value:
                code: WRONG_ENDPOINT
                message: Wrong endpoint
            NOT_SUPPORTED_CHAIN:
              summary: The requested chain is not supported
              value:
                code: NOT_SUPPORTED_CHAIN
                message: Not supported chain
            RESOURCE_NOT_FOUND:
              summary: The requested resource does not exist
              value:
                code: RESOURCE_NOT_FOUND
                message: 'Resource not found: { RESOURCE_NAME = RESOURCE_VALUE }'
    "405":
      description: Method Not Allowed
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - METHOD_NOT_ALLOWED
                description: Code indicating a disallowed HTTP method
              message:
                type: string
                description: Detailed message about the disallowed HTTP method
            required:
            - code
            - message
          examples:
            METHOD_NOT_ALLOWED:
              summary: The request uses an unsupported HTTP method
              value:
                code: METHOD_NOT_ALLOWED
                message: Method not allowed
    "408":
      description: Request Timeout
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TIMEOUT
                description: Code indicating request timeout
              message:
                type: string
                description: Detailed message including the cause of the timeout
            required:
            - code
            - message
          examples:
            TIMEOUT:
              summary: Processing did not finish within the time limit
              value:
                code: TIMEOUT
                message: Request timeout
    "409":
      description: Conflict
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - RESOURCE_ALREADY_EXISTS
                - REJECTED
                description: Code to identify the cause of the request conflict
              message:
                type: string
                description: Detailed message including information about the conflicting resource
            required:
            - code
            - message
          examples:
            RESOURCE_ALREADY_EXISTS:
              summary: The request tries to create a resource that already exists
              value:
                code: RESOURCE_ALREADY_EXISTS
                message: Resource already exists
            REJECTED:
              summary: The server rejected the request
              value:
                code: REJECTED
                message: Request rejected
    "413":
      description: Payload Too Large
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - CONTENTS_TOO_LARGE
                description: Code indicating payload size exceeded
              message:
                type: string
                description: Detailed message including the maximum allowed payload size
            required:
            - code
            - message
          examples:
            CONTENTS_TOO_LARGE:
              summary: The payload exceeds the server's maximum size
              value:
                code: CONTENTS_TOO_LARGE
                message: Contents too large
    "414":
      description: URI Too Long
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_LONG_URI
                description: Code indicating URI length exceeded
              message:
                type: string
                description: Detailed message including the maximum allowed URI length
            required:
            - code
            - message
          examples:
            TOO_LONG_URI:
              summary: The request URI exceeds the server's maximum length
              value:
                code: TOO_LONG_URI
                message: URI too long
    "429":
      description: Too Many Requests
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_MANY_REQUESTS
                - EXCEEDED_QUOTA_LIMIT
                description: Code identifying the cause of the request limit exceeded
              message:
                type: string
                description: Detailed message including the exceeded limit type and allowed threshold
            required:
            - code
            - message
          examples:
            TOO_MANY_REQUESTS:
              summary: The rate limit was exceeded
              value:
                code: TOO_MANY_REQUESTS
                message: Too many requests
            EXCEEDED_QUOTA_LIMIT:
              summary: The quota limit was exceeded
              value:
                code: EXCEEDED_QUOTA_LIMIT
                message: Exceeded quota limit
    "500":
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - INTERNAL_SERVER_ERROR
                - INTERRUPTED
                description: Code to identify the cause of the internal server error
              message:
                type: string
                description: Detailed message including the cause of the server error
            required:
            - code
            - message
          examples:
            INTERNAL_SERVER_ERROR:
              summary: An internal server error occurred
              value:
                code: INTERNAL_SERVER_ERROR
                message: Internal server error
            INTERRUPTED:
              summary: Processing failed temporarily due to server load
              value:
                code: INTERRUPTED
                message: Request interrupted
    "503":
      description: Service Unavailable
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - UNAVAILABLE
                description: Code indicating service unavailability
              message:
                type: string
                description: Detailed message including the cause of the service outage
            required:
            - code
            - message
          examples:
            UNAVAILABLE:
              summary: The service is unavailable due to infrastructure downtime or an upgrade
              value:
                code: UNAVAILABLE
                message: Service unavailable
paths:
  /:
    post:
      security:
      - api_key: []
      operationId: xrpl-amm_info
      summary: amm_info
      description: |
        Returns information about an Automated Market Maker (AMM) instance.
        It lets you check the deposited asset amounts, the LP token supply, the trading fee and the auction slot state.

        > 📘 You must provide either `amm_account`, or both `asset` and `asset2`.
      x-seo-description: Gets information about an Automated Market Maker (AMM) instance on the XRP Ledger.
      tags:
      - path-and-order-book
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - method
              - params
              properties:
                method:
                  type: string
                  example: amm_info
                params:
                  type: array
                  description: |-
                    It contains following parameters as a single object in the `params` array.
                    Provide either `amm_account`, or both `asset` and `asset2`.
                    1. `amm_account`: The account address of the AMM, as a string.
                    2. `asset`: One of the AMM's assets, as an object.
                    3. `asset2`: The other AMM asset, as an object.
                    4. `account`: To check the LP tokens held by a specific liquidity provider, pass that account address as a string. (optional)
                    - `ledger_hash`: The hash of the ledger version to use, as a string. (optional)
                    - `ledger_index`: The ledger index or a shortcut string. (optional)
                  minItems: 1
                  maxItems: 1
                  items:
                    title: Parameters
                    type: object
                    properties:
                      amm_account:
                        type: string
                        description: The special account address of the AMM. It is also the issuer of the LP tokens.
                      asset:
                        $ref: '#/components/schemas/Asset'
                      asset2:
                        $ref: '#/components/schemas/Asset'
                      account:
                        type: string
                        description: Also returns the amount of LP tokens held by this account.
                      ledger_hash:
                        type: string
                        description: The hash of the ledger version to use. Pass a 32-byte hex string.
                      ledger_index:
                        $ref: '#/components/schemas/LedgerIndex'
                  example:
                  - asset:
                      currency: XRP
                    asset2:
                      currency: USD
                      issuer: rMwjYedjc7qqtKYVLiAccJSmCwih4LnE2q
              example:
                method: amm_info
                params:
                - asset:
                    currency: XRP
                  asset2:
                    currency: USD
                    issuer: rMwjYedjc7qqtKYVLiAccJSmCwih4LnE2q
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              example:
                result:
                  amm:
                    account: rE54zDvgnghAoPopCgvtiqWNq3dU5y836S
                    amount: "296890496"
                    amount2:
                      currency: USD
                      issuer: rMwjYedjc7qqtKYVLiAccJSmCwih4LnE2q
                      value: "25.5"
                    asset2_frozen: false
                    asset_frozen: false
                    auction_slot:
                      account: rPzwM2JfCSDjhbesdThqWzMBGKAzHnAdCH
                      discounted_fee: 60
                      expiration: '2026-09-03T04:00:00Z'
                      price:
                        currency: 039C79FE0EFEC1B9F0EDB4F4E6F0E4C8C7B4E2A1
                        issuer: rE54zDvgnghAoPopCgvtiqWNq3dU5y836S
                        value: "0.8696"
                      time_interval: 0
                    lp_token:
                      currency: 039C79FE0EFEC1B9F0EDB4F4E6F0E4C8C7B4E2A1
                      issuer: rE54zDvgnghAoPopCgvtiqWNq3dU5y836S
                      value: "87500"
                    trading_fee: 600
                    vote_slots:
                    - account: rPzwM2JfCSDjhbesdThqWzMBGKAzHnAdCH
                      trading_fee: 600
                      vote_weight: 100000
                  ledger_current_index: 98765433
                  validated: false
              schema:
                $ref: '#/components/schemas/AmmInfoResult'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "404":
          $ref: '#/components/responses/404'
        "405":
          $ref: '#/components/responses/405'
        "408":
          $ref: '#/components/responses/408'
        "409":
          $ref: '#/components/responses/409'
        "413":
          $ref: '#/components/responses/413'
        "414":
          $ref: '#/components/responses/414'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
        "503":
          $ref: '#/components/responses/503'
