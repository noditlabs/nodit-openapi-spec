openapi: 3.1.0
info:
  title: XRPL - ledger_entry
  version: 1.0.0
servers:
- url: https://xrpl-mainnet.nodit.io
  description: XRP Ledger Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  schemas:
    Asset:
      type: object
      description: Specifies an asset by currency code and issuer. Omit `issuer` for XRP.
      properties:
        currency:
          type: string
          description: The currency code. Pass `XRP` for XRP.
        issuer:
          type: string
          description: The address of the account that issued the token. Omit for XRP.
    LedgerEntryResult:
      type: object
      description: The result of looking up a single ledger entry.
      properties:
        index:
          type: string
          description: The ID that identifies the ledger entry.
        ledger_index:
          type: integer
          description: The ledger index of the version used.
        ledger_hash:
          type: string
          description: The hash of the ledger version used.
        node:
          type: object
          description: The ledger entry expressed as JSON. Omitted when `binary` is `true`.
        node_binary:
          type: string
          description: The ledger entry, hex-encoded. Returned only when `binary` is `true`.
        validated:
          type: boolean
          description: Whether the response was derived from a validated ledger version.
    LedgerIndex:
      description: |
        Specifies the ledger version to use. Pass a ledger index as an integer, or use one of the shortcut strings below.
        - `validated`: Uses the most recent ledger version validated by the network.
        - `closed`: Uses the most recent ledger version the server has closed. It may not be validated.
        - `current`: Uses the in-progress ledger version the server is currently building.
      oneOf:
      - title: Ledger Index
        type: integer
        description: The ledger index of the version to use.
      - title: Shortcut
        type: string
        description: A shortcut string that specifies the ledger version to use.
        enum:
        - validated
        - closed
        - current
  responses:
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - NO_AUTHENTICATION_FOUND
                - AUTHENTICATION_FAILED
                description: Code to identify the cause of authentication failure
              message:
                type: string
                description: Detailed message including the cause of authentication failure
            required:
            - code
            - message
          examples:
            NO_AUTHENTICATION_FOUND:
              summary: The request does not include authentication (API Key)
              value:
                code: NO_AUTHENTICATION_FOUND
                message: No authentication found.
            AUTHENTICATION_FAILED:
              summary: The authentication (API Key) is invalid
              value:
                code: AUTHENTICATION_FAILED
                message: Authentication failed.
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - PERMISSION_DENIED
                description: Code indicating permission denied
              message:
                type: string
                description: Detailed message including information about the denied resource
            required:
            - code
            - message
          examples:
            PERMISSION_DENIED:
              summary: The request accesses a resource it is not authorized for
              value:
                code: PERMISSION_DENIED
                message: Permission denied
    "404":
      description: Not Found
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - WRONG_ENDPOINT
                - NOT_SUPPORTED_CHAIN
                - RESOURCE_NOT_FOUND
                description: Code to identify the cause of the resource not found
              message:
                type: string
                description: Detailed message including the name, value, etc. of the resource not found
            required:
            - code
            - message
          examples:
            WRONG_ENDPOINT:
              summary: The requested API path does not exist
              value:
                code: WRONG_ENDPOINT
                message: Wrong endpoint
            NOT_SUPPORTED_CHAIN:
              summary: The requested chain is not supported
              value:
                code: NOT_SUPPORTED_CHAIN
                message: Not supported chain
            RESOURCE_NOT_FOUND:
              summary: The requested resource does not exist
              value:
                code: RESOURCE_NOT_FOUND
                message: 'Resource not found: { RESOURCE_NAME = RESOURCE_VALUE }'
    "405":
      description: Method Not Allowed
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - METHOD_NOT_ALLOWED
                description: Code indicating a disallowed HTTP method
              message:
                type: string
                description: Detailed message about the disallowed HTTP method
            required:
            - code
            - message
          examples:
            METHOD_NOT_ALLOWED:
              summary: The request uses an unsupported HTTP method
              value:
                code: METHOD_NOT_ALLOWED
                message: Method not allowed
    "408":
      description: Request Timeout
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TIMEOUT
                description: Code indicating request timeout
              message:
                type: string
                description: Detailed message including the cause of the timeout
            required:
            - code
            - message
          examples:
            TIMEOUT:
              summary: Processing did not finish within the time limit
              value:
                code: TIMEOUT
                message: Request timeout
    "409":
      description: Conflict
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - RESOURCE_ALREADY_EXISTS
                - REJECTED
                description: Code to identify the cause of the request conflict
              message:
                type: string
                description: Detailed message including information about the conflicting resource
            required:
            - code
            - message
          examples:
            RESOURCE_ALREADY_EXISTS:
              summary: The request tries to create a resource that already exists
              value:
                code: RESOURCE_ALREADY_EXISTS
                message: Resource already exists
            REJECTED:
              summary: The server rejected the request
              value:
                code: REJECTED
                message: Request rejected
    "413":
      description: Payload Too Large
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - CONTENTS_TOO_LARGE
                description: Code indicating payload size exceeded
              message:
                type: string
                description: Detailed message including the maximum allowed payload size
            required:
            - code
            - message
          examples:
            CONTENTS_TOO_LARGE:
              summary: The payload exceeds the server's maximum size
              value:
                code: CONTENTS_TOO_LARGE
                message: Contents too large
    "414":
      description: URI Too Long
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_LONG_URI
                description: Code indicating URI length exceeded
              message:
                type: string
                description: Detailed message including the maximum allowed URI length
            required:
            - code
            - message
          examples:
            TOO_LONG_URI:
              summary: The request URI exceeds the server's maximum length
              value:
                code: TOO_LONG_URI
                message: URI too long
    "429":
      description: Too Many Requests
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_MANY_REQUESTS
                - EXCEEDED_QUOTA_LIMIT
                description: Code identifying the cause of the request limit exceeded
              message:
                type: string
                description: Detailed message including the exceeded limit type and allowed threshold
            required:
            - code
            - message
          examples:
            TOO_MANY_REQUESTS:
              summary: The rate limit was exceeded
              value:
                code: TOO_MANY_REQUESTS
                message: Too many requests
            EXCEEDED_QUOTA_LIMIT:
              summary: The quota limit was exceeded
              value:
                code: EXCEEDED_QUOTA_LIMIT
                message: Exceeded quota limit
    "500":
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - INTERNAL_SERVER_ERROR
                - INTERRUPTED
                description: Code to identify the cause of the internal server error
              message:
                type: string
                description: Detailed message including the cause of the server error
            required:
            - code
            - message
          examples:
            INTERNAL_SERVER_ERROR:
              summary: An internal server error occurred
              value:
                code: INTERNAL_SERVER_ERROR
                message: Internal server error
            INTERRUPTED:
              summary: Processing failed temporarily due to server load
              value:
                code: INTERRUPTED
                message: Request interrupted
    "503":
      description: Service Unavailable
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - UNAVAILABLE
                description: Code indicating service unavailability
              message:
                type: string
                description: Detailed message including the cause of the service outage
            required:
            - code
            - message
          examples:
            UNAVAILABLE:
              summary: The service is unavailable due to infrastructure downtime or an upgrade
              value:
                code: UNAVAILABLE
                message: Service unavailable
paths:
  /:
    post:
      security:
      - api_key: []
      operationId: xrpl-ledger_entry
      summary: ledger_entry
      description: |
        Returns a single entry from the ledger in its raw format.
        The way you specify the target differs by entry type, and you must provide **exactly one** of the selectors below.

        > 🚧 Provide only one selector!
        >
        > Providing two or more selectors at once returns an `invalidParams` error.
      x-seo-description: Returns a single ledger entry from the XRP Ledger in its raw format.
      tags:
      - ledger
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - method
              - params
              properties:
                method:
                  type: string
                  example: ledger_entry
                params:
                  type: array
                  description: |-
                    It contains following parameters as a single object in the `params` array.
                    Provide exactly one of the selectors below to specify the target.
                    1. `index`: The ID of the ledger entry to look up, as a string.
                    2. `account_root`: The account address to look up, as a string.
                    3. `offer`: Specify the offer with an `account` and `seq` object, or pass the entry ID as a string.
                    4. `ripple_state`: Specify the trust line with an `accounts` and `currency` object.
                    5. `directory`, `escrow`, `check`, `payment_channel`, `deposit_preauth`, `ticket`, `nft_page`, `did`, `oracle`, `amm`, `credential`, `permissioned_domain`, `mptoken`, `mpt_issuance`, `vault`, `signer_list`: Looks up an entry of that type.

                    The ledger version and the response format are controlled with the following parameters.
                    - `binary`: Whether to return the entry as a hex string, as a boolean. (optional, default `false`)
                    - `ledger_hash`: The hash of the ledger version to use, as a string. (optional)
                    - `ledger_index`: The ledger index or a shortcut string. (optional)
                  minItems: 1
                  maxItems: 1
                  items:
                    title: Parameters
                    type: object
                    properties:
                      index:
                        type: string
                        description: The ID of the ledger entry to look up. Pass a 64-character hex string.
                      account_root:
                        type: string
                        description: Specifies the AccountRoot entry to look up by account address.
                        example: r9cZA1mLK5R5Am25ArfXFmqgNwjZgnfk59
                      offer:
                        description: Specifies an offer entry.
                        oneOf:
                        - title: Offer Object
                          type: object
                          description: Specifies the offer by the account that created it and its sequence number.
                          properties:
                            account:
                              type: string
                              description: The address of the account that created the offer.
                            seq:
                              type: integer
                              description: The sequence number of the transaction that created the offer.
                        - title: Offer Entry ID
                          type: string
                          description: The ID of the offer ledger entry.
                      ripple_state:
                        type: object
                        description: Specifies a trust line (RippleState) entry between two accounts.
                        properties:
                          accounts:
                            type: array
                            description: The addresses of the two accounts that share the trust line.
                            items:
                              type: string
                              description: The account address.
                          currency:
                            type: string
                            description: The currency code of the trust line.
                      directory:
                        description: Specifies a directory entry. Pass an object or the entry ID as a string.
                        oneOf:
                        - title: Directory Object
                          type: object
                          properties:
                            owner:
                              type: string
                              description: The account address of the directory owner.
                            dir_root:
                              type: string
                              description: The root ID of the directory.
                            sub_index:
                              type: integer
                              description: The sub-page number of the directory.
                        - title: Directory Entry ID
                          type: string
                          description: The ID of the directory ledger entry.
                      escrow:
                        description: Specifies an Escrow entry. Pass an object or the entry ID as a string.
                        oneOf:
                        - title: Escrow Object
                          type: object
                          properties:
                            owner:
                              type: string
                              description: The account address that created the Escrow.
                            seq:
                              type: integer
                              description: The sequence number of the transaction that created the Escrow.
                        - title: Escrow Entry ID
                          type: string
                          description: The ID of the Escrow ledger entry.
                      check:
                        type: string
                        description: The ID of the Check ledger entry.
                      payment_channel:
                        type: string
                        description: The ID of the Payment Channel ledger entry.
                      deposit_preauth:
                        description: Specifies a DepositPreauth entry. Pass an object or the entry ID as a string.
                        oneOf:
                        - title: Deposit Preauth Object
                          type: object
                          properties:
                            owner:
                              type: string
                              description: The account address that set up the preauthorization.
                            authorized:
                              type: string
                              description: The preauthorized account address.
                            authorized_credentials:
                              type: array
                              description: The list of credentials used for the preauthorization.
                              items:
                                type: object
                                description: Credential data.
                        - title: Deposit Preauth Entry ID
                          type: string
                          description: The ID of the DepositPreauth ledger entry.
                      ticket:
                        description: Specifies a Ticket entry. Pass an object or the entry ID as a string.
                        oneOf:
                        - title: Ticket Object
                          type: object
                          properties:
                            account:
                              type: string
                              description: The account address that created the Ticket.
                            ticket_seq:
                              type: integer
                              description: The sequence number of the Ticket.
                        - title: Ticket Entry ID
                          type: string
                          description: The ID of the Ticket ledger entry.
                      nft_page:
                        type: string
                        description: The ID of the NFTokenPage ledger entry.
                      did:
                        type: string
                        description: Specifies a DID entry by account address.
                      oracle:
                        type: object
                        description: Specifies a Price Oracle entry.
                        properties:
                          account:
                            type: string
                            description: The address of the account that owns the Oracle.
                          oracle_document_id:
                            type: integer
                            description: The number that identifies the Oracle within the account.
                      amm:
                        description: Specifies an AMM entry. Pass an asset pair object or the entry ID as a string.
                        oneOf:
                        - title: AMM Object
                          type: object
                          properties:
                            asset:
                              $ref: '#/components/schemas/Asset'
                            asset2:
                              $ref: '#/components/schemas/Asset'
                        - title: AMM Entry ID
                          type: string
                          description: The ID of the AMM ledger entry.
                      credential:
                        description: Specifies a Credential entry. Pass an object or the entry ID as a string.
                        oneOf:
                        - title: Credential Object
                          type: object
                          properties:
                            subject:
                              type: string
                              description: The account address the credential applies to.
                            issuer:
                              type: string
                              description: The account address that issued the credential.
                            credential_type:
                              type: string
                              description: The credential type, hex-encoded.
                        - title: Credential Entry ID
                          type: string
                          description: The ID of the Credential ledger entry.
                      permissioned_domain:
                        description: Specifies a PermissionedDomain entry. Pass an object or the entry ID as a string.
                        oneOf:
                        - title: Permissioned Domain Object
                          type: object
                          properties:
                            account:
                              type: string
                              description: The account address that owns the domain.
                            seq:
                              type: integer
                              description: The sequence number of the transaction that created the domain.
                        - title: Permissioned Domain Entry ID
                          type: string
                          description: The ID of the PermissionedDomain ledger entry.
                      mptoken:
                        description: Specifies an MPToken entry. Pass an object or the entry ID as a string.
                        oneOf:
                        - title: MPToken Object
                          type: object
                          properties:
                            mpt_issuance_id:
                              type: string
                              description: The identifier of the MPTokenIssuance.
                            account:
                              type: string
                              description: The account address that holds the MPToken.
                        - title: MPToken Entry ID
                          type: string
                          description: The ID of the MPToken ledger entry.
                      mpt_issuance:
                        type: string
                        description: The identifier of the MPTokenIssuance.
                      vault:
                        type: string
                        description: The ID of a Vault ledger entry.
                      signer_list:
                        type: string
                        description: The ID of the SignerList ledger entry.
                      binary:
                        type: boolean
                        description: Whether to return the entry as a hex string.
                        example: false
                      ledger_hash:
                        type: string
                        description: The hash of the ledger version to use. Pass a 32-byte hex string.
                        example: 17ACB57A0F73B5160713E81FE72B2AC9F6064541004E272BD09F257D57C30C02
                      ledger_index:
                        $ref: '#/components/schemas/LedgerIndex'
                  example:
                  - account_root: r9cZA1mLK5R5Am25ArfXFmqgNwjZgnfk59
                    ledger_index: validated
              example:
                method: ledger_entry
                params:
                - account_root: r9cZA1mLK5R5Am25ArfXFmqgNwjZgnfk59
                  ledger_index: validated
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              example:
                result:
                  index: 5F7A9C0E2D4F6B8A0C1E3D5F7A9B0C2E4D6F8A0B1C3E5D7F9A0B2C4E6D8F0A1B
                  ledger_hash: 17ACB57A0F73B5160713E81FE72B2AC9F6064541004E272BD09F257D57C30C02
                  ledger_index: 98765432
                  node:
                    Account: r9cZA1mLK5R5Am25ArfXFmqgNwjZgnfk59
                    Balance: "9977"
                    Flags: 0
                    LedgerEntryType: AccountRoot
                    OwnerCount: 0
                    PreviousTxnID: 4E6A8C0D2F4B6A8C0E1D3F5A7B9C0E2D4F6A8B0C2E4D6F8A0B1C3D5E7F9A0B2C
                    PreviousTxnLgrSeq: 98765000
                    Sequence: 42
                    index: 5F7A9C0E2D4F6B8A0C1E3D5F7A9B0C2E4D6F8A0B1C3E5D7F9A0B2C4E6D8F0A1B
                  validated: true
              schema:
                $ref: '#/components/schemas/LedgerEntryResult'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "404":
          $ref: '#/components/responses/404'
        "405":
          $ref: '#/components/responses/405'
        "408":
          $ref: '#/components/responses/408'
        "409":
          $ref: '#/components/responses/409'
        "413":
          $ref: '#/components/responses/413'
        "414":
          $ref: '#/components/responses/414'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
        "503":
          $ref: '#/components/responses/503'
