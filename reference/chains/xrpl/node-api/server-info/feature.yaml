openapi: 3.1.0
info:
  title: XRPL - feature
  version: 1.0.0
servers:
- url: https://xrpl-mainnet.nodit.io
  description: XRP Ledger Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  schemas:
    FeatureResult:
      type: object
      x-map-key-label: amendment ID
      description: |
        Information about the amendments the server knows about, as an object keyed by amendment ID.
        When `feature` is specified in the request, only that amendment is returned.
      additionalProperties:
        type: object
        description: The status of an individual amendment.
        properties:
          enabled:
            type: boolean
            description: Whether the amendment is enabled in the latest ledger version.
          name:
            type: string
            description: |
              The name of the amendment. Omitted when the server does not know the name.
              The name does not strictly indicate what the amendment does, and it can differ between servers.
          supported:
            type: boolean
            description: |
              Whether the server is able to apply this amendment.
              If `enabled` is `true` while this value is `false`, the server may become amendment blocked.
  responses:
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - NO_AUTHENTICATION_FOUND
                - AUTHENTICATION_FAILED
                description: Code to identify the cause of authentication failure
              message:
                type: string
                description: Detailed message including the cause of authentication failure
            required:
            - code
            - message
          examples:
            NO_AUTHENTICATION_FOUND:
              summary: The request does not include authentication (API Key)
              value:
                code: NO_AUTHENTICATION_FOUND
                message: No authentication found.
            AUTHENTICATION_FAILED:
              summary: The authentication (API Key) is invalid
              value:
                code: AUTHENTICATION_FAILED
                message: Authentication failed.
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - PERMISSION_DENIED
                description: Code indicating permission denied
              message:
                type: string
                description: Detailed message including information about the denied resource
            required:
            - code
            - message
          examples:
            PERMISSION_DENIED:
              summary: The request accesses a resource it is not authorized for
              value:
                code: PERMISSION_DENIED
                message: Permission denied
    "429":
      description: Too Many Requests
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_MANY_REQUESTS
                - EXCEEDED_QUOTA_LIMIT
                description: Code identifying the cause of the request limit exceeded
              message:
                type: string
                description: Detailed message including the exceeded limit type and allowed threshold
            required:
            - code
            - message
          examples:
            TOO_MANY_REQUESTS:
              summary: The rate limit was exceeded
              value:
                code: TOO_MANY_REQUESTS
                message: Too many requests
            EXCEEDED_QUOTA_LIMIT:
              summary: The quota limit was exceeded
              value:
                code: EXCEEDED_QUOTA_LIMIT
                message: Exceeded quota limit
    "500":
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - INTERNAL_SERVER_ERROR
                - INTERRUPTED
                description: Code to identify the cause of the internal server error
              message:
                type: string
                description: Detailed message including the cause of the server error
            required:
            - code
            - message
          examples:
            INTERNAL_SERVER_ERROR:
              summary: An internal server error occurred
              value:
                code: INTERNAL_SERVER_ERROR
                message: Internal server error
            INTERRUPTED:
              summary: Processing failed temporarily due to server load
              value:
                code: INTERRUPTED
                message: Request interrupted
paths:
  /:
    post:
      security:
      - api_key: []
      operationId: xrpl-feature
      summary: feature
      description: |
        Returns information about the amendments the server knows about.
        It lets you check whether each amendment is enabled and whether the server is able to apply it.

        > 📘 Depending on the server configuration, some fields are returned only on administrative connections.
      x-seo-description: Returns information about amendments the server knows about and whether they are enabled.
      tags:
      - server-info
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - method
              - params
              properties:
                method:
                  type: string
                  example: feature
                params:
                  type: array
                  description: |-
                    It contains following parameter as a single object in the `params` array.
                    1. `feature`: The ID or name of the amendment to look up, as a string. (optional, every amendment is returned when omitted)
                  minItems: 1
                  maxItems: 1
                  items:
                    title: Parameters
                    type: object
                    properties:
                      feature:
                        type: string
                        description: |
                          The hex ID or the name of the amendment to look up.
                          When omitted, every amendment the server knows about is returned.
                        example: DisallowIncoming
                  example:
                  - feature: DisallowIncoming
              example:
                method: feature
                params:
                - feature: DisallowIncoming
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              example:
                result:
                  4C97EBA926031A7CF7D7B36FDE3ED66DDA5421192D63DE53FFB46E43B9DC8373:
                    enabled: false
                    name: MultiSign
                    supported: true
              schema:
                $ref: '#/components/schemas/FeatureResult'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
