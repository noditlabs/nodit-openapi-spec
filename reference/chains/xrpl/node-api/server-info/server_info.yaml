openapi: 3.1.0
info:
  title: XRPL - server_info
  version: 1.0.0
servers:
- url: https://xrpl-mainnet.nodit.io
  description: XRP Ledger Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  schemas:
    ServerInfoResult:
      type: object
      description: Server state information in a human-readable form.
      properties:
        info:
          type: object
          description: Detailed server state information.
          properties:
            amendment_blocked:
              type: boolean
              description: Whether the server is amendment blocked. Returned only in that state.
            build_version:
              type: string
              description: The version of the running server.
            closed_ledger:
              $ref: '#/components/schemas/ServerLedgerInfo'
            complete_ledgers:
              type: string
              description: The range of ledger indexes the server holds. Returns `empty` when it holds none.
            hostid:
              type: string
              description: The server's hostname, or an RFC-1751 word derived from the node public key.
            io_latency_ms:
              type: integer
              description: The I/O wait time, in milliseconds.
            jq_trans_overflow:
              type: string
              description: The number of times the transaction queue has overflowed since the server started.
            last_close:
              type: object
              description: Consensus information from the previous ledger close.
              properties:
                converge_time_s:
                  type: number
                  description: The time taken to reach consensus, in seconds.
                proposers:
                  type: integer
                  description: The number of validators that participated in consensus.
            load_factor:
              type: number
              description: The transaction cost multiplier currently in effect.
            load_factor_fee_escalation:
              type: number
              description: The cost multiplier for inclusion in the open ledger.
            load_factor_fee_queue:
              type: number
              description: The cost multiplier for entering the queue.
            load_factor_fee_reference:
              type: number
              description: The reference transaction cost without any multiplier applied.
            load_factor_local:
              type: number
              description: The cost multiplier caused by this server's load.
            load_factor_net:
              type: number
              description: The cost multiplier caused by network-wide load.
            load_factor_cluster:
              type: number
              description: The cost multiplier caused by cluster load.
            load_factor_server:
              type: number
              description: The cost multiplier the server enforces.
            network_ledger:
              type: string
              description: Returns `waiting` while the server is syncing with the network.
            peers:
              type: integer
              description: The number of connected peer servers.
            ports:
              type: array
              description: The list of ports the server is listening on.
              items:
                type: object
                description: Port information.
                properties:
                  port:
                    type: string
                    description: The port number the server is listening on.
                  protocol:
                    type: array
                    description: The list of protocols served on that port.
                    items:
                      type: string
                      description: The protocol name.
            pubkey_node:
              type: string
              description: The public key used to verify peer-to-peer communication.
            server_state:
              type: string
              description: The server's level of participation in the network.
            server_state_duration_us:
              type: string
              description: The time spent in the current state, in microseconds.
            state_accounting:
              type: object
              description: The accumulated duration and transition count for each server state.
              additionalProperties:
                type: object
                description: Statistics for an individual state.
                properties:
                  duration_us:
                    type: string
                    description: The total time spent in that state, in microseconds.
                  transitions:
                    type: string
                    description: The number of transitions into that state.
            time:
              type: string
              description: The server's current time in UTC.
            uptime:
              type: integer
              description: The time the server has been operating continuously, in seconds.
            validated_ledger:
              $ref: '#/components/schemas/ServerLedgerInfo'
            validation_quorum:
              type: integer
              description: The number of trusted validations required to validate a ledger version.
            counters:
              type: object
              description: RPC and job queue performance metrics. Returned when `counters` is set to `true` in the request.
            current_activity:
              type: object
              description: Information about the job queue items and API methods currently running. Returned when `counters` is set to `true` in the request.
    ServerLedgerInfo:
      type: object
      description: A summary of a ledger version as the server sees it.
      properties:
        base_fee:
          type: number
          description: The reference transaction cost, in XRP.
        close_time:
          type: number
          description: The time the ledger closed, in seconds since the Ripple Epoch.
        hash:
          type: string
          description: The unique hash that identifies the ledger version.
        reserve_base:
          type: number
          description: The minimum reserve required to keep an account, in XRP.
        reserve_inc:
          type: number
          description: The additional reserve required per ledger object, in XRP.
        seq:
          type: integer
          description: The ledger index.
  responses:
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - NO_AUTHENTICATION_FOUND
                - AUTHENTICATION_FAILED
                description: Code to identify the cause of authentication failure
              message:
                type: string
                description: Detailed message including the cause of authentication failure
            required:
            - code
            - message
          examples:
            NO_AUTHENTICATION_FOUND:
              summary: The request does not include authentication (API Key)
              value:
                code: NO_AUTHENTICATION_FOUND
                message: No authentication found.
            AUTHENTICATION_FAILED:
              summary: The authentication (API Key) is invalid
              value:
                code: AUTHENTICATION_FAILED
                message: Authentication failed.
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - PERMISSION_DENIED
                description: Code indicating permission denied
              message:
                type: string
                description: Detailed message including information about the denied resource
            required:
            - code
            - message
          examples:
            PERMISSION_DENIED:
              summary: The request accesses a resource it is not authorized for
              value:
                code: PERMISSION_DENIED
                message: Permission denied
    "404":
      description: Not Found
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - WRONG_ENDPOINT
                - NOT_SUPPORTED_CHAIN
                - RESOURCE_NOT_FOUND
                description: Code to identify the cause of the resource not found
              message:
                type: string
                description: Detailed message including the name, value, etc. of the resource not found
            required:
            - code
            - message
          examples:
            WRONG_ENDPOINT:
              summary: The requested API path does not exist
              value:
                code: WRONG_ENDPOINT
                message: Wrong endpoint
            NOT_SUPPORTED_CHAIN:
              summary: The requested chain is not supported
              value:
                code: NOT_SUPPORTED_CHAIN
                message: Not supported chain
            RESOURCE_NOT_FOUND:
              summary: The requested resource does not exist
              value:
                code: RESOURCE_NOT_FOUND
                message: 'Resource not found: { RESOURCE_NAME = RESOURCE_VALUE }'
    "405":
      description: Method Not Allowed
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - METHOD_NOT_ALLOWED
                description: Code indicating a disallowed HTTP method
              message:
                type: string
                description: Detailed message about the disallowed HTTP method
            required:
            - code
            - message
          examples:
            METHOD_NOT_ALLOWED:
              summary: The request uses an unsupported HTTP method
              value:
                code: METHOD_NOT_ALLOWED
                message: Method not allowed
    "408":
      description: Request Timeout
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TIMEOUT
                description: Code indicating request timeout
              message:
                type: string
                description: Detailed message including the cause of the timeout
            required:
            - code
            - message
          examples:
            TIMEOUT:
              summary: Processing did not finish within the time limit
              value:
                code: TIMEOUT
                message: Request timeout
    "409":
      description: Conflict
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - RESOURCE_ALREADY_EXISTS
                - REJECTED
                description: Code to identify the cause of the request conflict
              message:
                type: string
                description: Detailed message including information about the conflicting resource
            required:
            - code
            - message
          examples:
            RESOURCE_ALREADY_EXISTS:
              summary: The request tries to create a resource that already exists
              value:
                code: RESOURCE_ALREADY_EXISTS
                message: Resource already exists
            REJECTED:
              summary: The server rejected the request
              value:
                code: REJECTED
                message: Request rejected
    "413":
      description: Payload Too Large
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - CONTENTS_TOO_LARGE
                description: Code indicating payload size exceeded
              message:
                type: string
                description: Detailed message including the maximum allowed payload size
            required:
            - code
            - message
          examples:
            CONTENTS_TOO_LARGE:
              summary: The payload exceeds the server's maximum size
              value:
                code: CONTENTS_TOO_LARGE
                message: Contents too large
    "414":
      description: URI Too Long
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_LONG_URI
                description: Code indicating URI length exceeded
              message:
                type: string
                description: Detailed message including the maximum allowed URI length
            required:
            - code
            - message
          examples:
            TOO_LONG_URI:
              summary: The request URI exceeds the server's maximum length
              value:
                code: TOO_LONG_URI
                message: URI too long
    "429":
      description: Too Many Requests
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_MANY_REQUESTS
                - EXCEEDED_QUOTA_LIMIT
                description: Code identifying the cause of the request limit exceeded
              message:
                type: string
                description: Detailed message including the exceeded limit type and allowed threshold
            required:
            - code
            - message
          examples:
            TOO_MANY_REQUESTS:
              summary: The rate limit was exceeded
              value:
                code: TOO_MANY_REQUESTS
                message: Too many requests
            EXCEEDED_QUOTA_LIMIT:
              summary: The quota limit was exceeded
              value:
                code: EXCEEDED_QUOTA_LIMIT
                message: Exceeded quota limit
    "500":
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - INTERNAL_SERVER_ERROR
                - INTERRUPTED
                description: Code to identify the cause of the internal server error
              message:
                type: string
                description: Detailed message including the cause of the server error
            required:
            - code
            - message
          examples:
            INTERNAL_SERVER_ERROR:
              summary: An internal server error occurred
              value:
                code: INTERNAL_SERVER_ERROR
                message: Internal server error
            INTERRUPTED:
              summary: Processing failed temporarily due to server load
              value:
                code: INTERRUPTED
                message: Request interrupted
    "503":
      description: Service Unavailable
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - UNAVAILABLE
                description: Code indicating service unavailability
              message:
                type: string
                description: Detailed message including the cause of the service outage
            required:
            - code
            - message
          examples:
            UNAVAILABLE:
              summary: The service is unavailable due to infrastructure downtime or an upgrade
              value:
                code: UNAVAILABLE
                message: Service unavailable
paths:
  /:
    post:
      security:
      - api_key: []
      operationId: xrpl-server_info
      summary: server_info
      description: |
        Returns server state information in a human-readable form.
        It lets you check the server version, the range of ledgers held, the sync state and the load multipliers.
      x-seo-description: Returns human-readable information about the XRP Ledger server being queried.
      tags:
      - server-info
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - method
              - params
              properties:
                method:
                  type: string
                  example: server_info
                params:
                  type: array
                  description: |-
                    It contains following parameter as a single object in the `params` array.
                    1. `counters`: Whether to also return job queue and API method metrics, as a boolean. (optional, default `false`)
                  minItems: 1
                  maxItems: 1
                  items:
                    title: Parameters
                    type: object
                    properties:
                      counters:
                        type: boolean
                        description: Whether to also return metrics about the job queue, the ledger store and API method calls.
                        example: false
                  example:
                  - counters: false
              example:
                method: server_info
                params:
                - counters: false
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              example:
                result:
                  info:
                    build_version: 2.5.0
                    complete_ledgers: 32570-98765432
                    hostid: ATOM
                    io_latency_ms: 1
                    jq_trans_overflow: "0"
                    last_close:
                      converge_time_s: 3.002
                      proposers: 35
                    load_factor: 1
                    peers: 21
                    pubkey_node: n9KUjqxCr5FKThSNXdzb7oqN8rYwScB2dUnNqxQxbEA17JkaWy5x
                    server_state: full
                    server_state_duration_us: "8004784090"
                    time: 2026-Sep-02 04:12:33.482745 UTC
                    uptime: 8005
                    validated_ledger:
                      base_fee: 1.0e-05
                      close_time: 810900000
                      hash: 17ACB57A0F73B5160713E81FE72B2AC9F6064541004E272BD09F257D57C30C02
                      reserve_base: 1
                      reserve_inc: 0.2
                      seq: 98765432
                    validation_quorum: 28
              schema:
                $ref: '#/components/schemas/ServerInfoResult'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "404":
          $ref: '#/components/responses/404'
        "405":
          $ref: '#/components/responses/405'
        "408":
          $ref: '#/components/responses/408'
        "409":
          $ref: '#/components/responses/409'
        "413":
          $ref: '#/components/responses/413'
        "414":
          $ref: '#/components/responses/414'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
        "503":
          $ref: '#/components/responses/503'
