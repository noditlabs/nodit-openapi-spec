openapi: 3.1.0
info:
  title: XRPL - server_definitions
  version: 1.0.0
servers:
- url: https://xrpl-mainnet.nodit.io
  description: XRP Ledger Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  schemas:
    ServerDefinitionsResult:
      type: object
      description: |
        The `definitions.json` data in SDK-compatible form. Use it to serialize and deserialize binary data.
      properties:
        FIELDS:
          type: array
          description: The list of field definitions. Each item consists of a field name and its serialization metadata.
          items:
            description: An item consisting of a field name and its metadata.
        TRANSACTION_FORMATS:
          type: object
          description: The structure definition for each transaction type.
        LEDGER_ENTRY_FORMATS:
          type: object
          description: The structure definition for each ledger entry type.
        TRANSACTION_FLAGS:
          type: object
          description: The flag values for each transaction type.
        LEDGER_ENTRY_FLAGS:
          type: object
          description: The flag values for ledger entries.
        ACCOUNT_SET_FLAGS:
          type: object
          description: The flag values for the AccountSet transaction.
        TRANSACTION_RESULTS:
          type: object
          description: The mapping between transaction result codes and their numeric values.
        TYPES:
          type: object
          description: The mapping between serialization type names and their numeric values.
        hash:
          type: string
          description: The hash of this set of definitions. The body is omitted when it matches the `hash` in the request.
  responses:
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - NO_AUTHENTICATION_FOUND
                - AUTHENTICATION_FAILED
                description: Code to identify the cause of authentication failure
              message:
                type: string
                description: Detailed message including the cause of authentication failure
            required:
            - code
            - message
          examples:
            NO_AUTHENTICATION_FOUND:
              summary: The request does not include authentication (API Key)
              value:
                code: NO_AUTHENTICATION_FOUND
                message: No authentication found.
            AUTHENTICATION_FAILED:
              summary: The authentication (API Key) is invalid
              value:
                code: AUTHENTICATION_FAILED
                message: Authentication failed.
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - PERMISSION_DENIED
                description: Code indicating permission denied
              message:
                type: string
                description: Detailed message including information about the denied resource
            required:
            - code
            - message
          examples:
            PERMISSION_DENIED:
              summary: The request accesses a resource it is not authorized for
              value:
                code: PERMISSION_DENIED
                message: Permission denied
    "429":
      description: Too Many Requests
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_MANY_REQUESTS
                - EXCEEDED_QUOTA_LIMIT
                description: Code identifying the cause of the request limit exceeded
              message:
                type: string
                description: Detailed message including the exceeded limit type and allowed threshold
            required:
            - code
            - message
          examples:
            TOO_MANY_REQUESTS:
              summary: The rate limit was exceeded
              value:
                code: TOO_MANY_REQUESTS
                message: Too many requests
            EXCEEDED_QUOTA_LIMIT:
              summary: The quota limit was exceeded
              value:
                code: EXCEEDED_QUOTA_LIMIT
                message: Exceeded quota limit
    "500":
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - INTERNAL_SERVER_ERROR
                - INTERRUPTED
                description: Code to identify the cause of the internal server error
              message:
                type: string
                description: Detailed message including the cause of the server error
            required:
            - code
            - message
          examples:
            INTERNAL_SERVER_ERROR:
              summary: An internal server error occurred
              value:
                code: INTERNAL_SERVER_ERROR
                message: Internal server error
            INTERRUPTED:
              summary: Processing failed temporarily due to server load
              value:
                code: INTERRUPTED
                message: Request interrupted
paths:
  /:
    post:
      security:
      - api_key: []
      operationId: xrpl-server_definitions
      summary: server_definitions
      description: |
        Returns the `definitions.json` data the server uses.
        It provides the definitions needed to serialize and deserialize transactions and ledger entries in SDK-compatible form.
      x-seo-description: Returns an SDK-compatible definitions.json generated from the running server.
      tags:
      - server-info
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - method
              - params
              properties:
                method:
                  type: string
                  example: server_definitions
                params:
                  type: array
                  description: |-
                    It contains following parameter as a single object in the `params` array.
                    1. `hash`: The hash of a set of definitions you already hold, as a string. (optional)
                  minItems: 1
                  maxItems: 1
                  items:
                    title: Parameters
                    type: object
                    properties:
                      hash:
                        type: string
                        description: |
                          The hash of a set of definitions you already hold.
                          When it matches the server's hash, the body is omitted and only the hash is returned, reducing unnecessary transfer.
                  example:
                  - {}
              example:
                method: server_definitions
                params:
                - {}
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              example:
                result:
                  hash: 409A6F1C1D6B9F0E5A4B3C2D1E0F9A8B7C6D5E4F3A2B1C0D9E8F7A6B5C4D3E2F
                  TYPES:
                    Validation: 10003
                    Done: -1
                    Hash128: 4
                  LEDGER_ENTRY_TYPES:
                    Any: 0
                    AccountRoot: 97
                  TRANSACTION_RESULTS:
                    tesSUCCESS: 0
                    temMALFORMED: -299
                  TRANSACTION_TYPES:
                    Payment: 0
                    OfferCreate: 7
              schema:
                $ref: '#/components/schemas/ServerDefinitionsResult'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
