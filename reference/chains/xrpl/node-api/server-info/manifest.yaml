openapi: 3.1.0
info:
  title: XRPL - manifest
  version: 1.0.0
servers:
- url: https://xrpl-mainnet.nodit.io
  description: XRP Ledger Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  schemas:
    ManifestResult:
      type: object
      description: Manifest information for a validator.
      properties:
        details:
          type: object
          description: Detailed manifest data. Omitted when the manifest is unavailable.
          properties:
            domain:
              type: string
              description: The domain name claimed by the validator. Returns an empty string when absent.
            ephemeral_key:
              type: string
              description: The base58-encoded ephemeral public key.
            master_key:
              type: string
              description: The base58-encoded master public key.
            seq:
              type: integer
              description: The sequence number of the manifest. It increments each time the manifest is updated.
        manifest:
          type: string
          description: The full manifest, base64-encoded. Omitted when the manifest is unavailable.
        requested:
          type: string
          description: Echoes the public key provided in the request.
  responses:
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - NO_AUTHENTICATION_FOUND
                - AUTHENTICATION_FAILED
                description: Code to identify the cause of authentication failure
              message:
                type: string
                description: Detailed message including the cause of authentication failure
            required:
            - code
            - message
          examples:
            NO_AUTHENTICATION_FOUND:
              summary: The request does not include authentication (API Key)
              value:
                code: NO_AUTHENTICATION_FOUND
                message: No authentication found.
            AUTHENTICATION_FAILED:
              summary: The authentication (API Key) is invalid
              value:
                code: AUTHENTICATION_FAILED
                message: Authentication failed.
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - PERMISSION_DENIED
                description: Code indicating permission denied
              message:
                type: string
                description: Detailed message including information about the denied resource
            required:
            - code
            - message
          examples:
            PERMISSION_DENIED:
              summary: The request accesses a resource it is not authorized for
              value:
                code: PERMISSION_DENIED
                message: Permission denied
    "429":
      description: Too Many Requests
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_MANY_REQUESTS
                - EXCEEDED_QUOTA_LIMIT
                description: Code identifying the cause of the request limit exceeded
              message:
                type: string
                description: Detailed message including the exceeded limit type and allowed threshold
            required:
            - code
            - message
          examples:
            TOO_MANY_REQUESTS:
              summary: The rate limit was exceeded
              value:
                code: TOO_MANY_REQUESTS
                message: Too many requests
            EXCEEDED_QUOTA_LIMIT:
              summary: The quota limit was exceeded
              value:
                code: EXCEEDED_QUOTA_LIMIT
                message: Exceeded quota limit
    "500":
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - INTERNAL_SERVER_ERROR
                - INTERRUPTED
                description: Code to identify the cause of the internal server error
              message:
                type: string
                description: Detailed message including the cause of the server error
            required:
            - code
            - message
          examples:
            INTERNAL_SERVER_ERROR:
              summary: An internal server error occurred
              value:
                code: INTERNAL_SERVER_ERROR
                message: Internal server error
            INTERRUPTED:
              summary: Processing failed temporarily due to server load
              value:
                code: INTERRUPTED
                message: Request interrupted
paths:
  /:
    post:
      security:
      - api_key: []
      operationId: xrpl-manifest
      summary: manifest
      description: |
        Reports the manifest information for a given validator public key.
        A manifest is the data that proves a validator's master key has authorized an ephemeral signing key.
      x-seo-description: Reports the current manifest information for a given validator public key.
      tags:
      - server-info
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - method
              - params
              properties:
                method:
                  type: string
                  example: manifest
                params:
                  type: array
                  description: |-
                    It contains following parameter as a single object in the `params` array.
                    1. `public_key`: The public key of the validator to look up, as a base58 string. (required)
                  minItems: 1
                  maxItems: 1
                  items:
                    title: Parameters
                    type: object
                    required:
                    - public_key
                    properties:
                      public_key:
                        type: string
                        description: |
                          The base58-encoded public key of the validator to look up.
                          Both the master public key and the ephemeral public key can be used.
                        example: nHUFE9prPXPrHcG3SkwP1UzAQbSphqyQkQK9ATXLZsfkezhhda3p
                  example:
                  - public_key: nHUFE9prPXPrHcG3SkwP1UzAQbSphqyQkQK9ATXLZsfkezhhda3p
              example:
                method: manifest
                params:
                - public_key: nHUFE9prPXPrHcG3SkwP1UzAQbSphqyQkQK9ATXLZsfkezhhda3p
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              example:
                result:
                  details:
                    domain: ""
                    ephemeral_key: n9J1GJHtua77TBEzirncYsSkkFBnKaC5Zn1Bzt7pi5PQKcqTnRJP
                    master_key: nHUFE9prPXPrHcG3SkwP1UzAQbSphqyQkQK9ATXLZsfkezhhda3p
                    seq: 1
                  manifest: JAAAAAFxIe1FtqmSSDzsoP2RvMBhF6ULLbBpNhLmMPzGtjEIkwGYaXMh...
                  requested: nHUFE9prPXPrHcG3SkwP1UzAQbSphqyQkQK9ATXLZsfkezhhda3p
              schema:
                $ref: '#/components/schemas/ManifestResult'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
