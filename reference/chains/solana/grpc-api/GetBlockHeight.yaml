openapi: 3.1.0
info:
  title: Solana - GetBlockHeight
  version: 1.0.0
servers:
- url: https://solana-mainnet.grpc.nodit.io:443
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  schemas: {}
  responses: {}
paths:
  /geyser.Geyser/GetBlockHeight:
    post:
      security:
      - api_key: []
      operationId: solana-grpc-GetBlockHeight
      summary: GetBlockHeight
      description: |
        Returns the current block height at the given commitment level. Block height counts produced blocks and excludes skipped slots.
      x-seo-description: 지정한 커밋먼트 레벨 기준의 현재 블록 높이를 조회합니다. 블록 높이는 건너뛴 슬롯을 제외하고 실제로 생성된 블록 수를 나타냅니다.
      x-grpc-method: geyser.Geyser/GetBlockHeight
      x-proto: geyser.proto
      x-protocol: grpc
      x-grpc:
        service: geyser.Geyser
        method: GetBlockHeight
        streaming: unary
        proto: geyser.proto
        protoRepo: https://github.com/rpcpool/yellowstone-grpc/tree/master/yellowstone-grpc-proto/proto
      x-hide-try-it: true
      tags:
      - Geyser
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                commitment:
                  type: string
                  description: Commitment level for the query. One of `PROCESSED`, `CONFIRMED`, or `FINALIZED`. Defaults to `PROCESSED` when omitted.
                  enum:
                  - PROCESSED
                  - CONFIRMED
                  - FINALIZED
                  example: CONFIRMED
            example:
              commitment: CONFIRMED
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  block_height:
                    type: string
                    format: uint64
                    description: Current block height.
              example:
                block_height: "350391118"
