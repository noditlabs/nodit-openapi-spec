openapi: 3.1.0
info:
  title: Solana - GetSlot
  version: 1.0.0
servers:
- url: https://solana-mainnet.grpc.nodit.io:443
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  schemas: {}
  responses: {}
paths:
  /geyser.Geyser/GetSlot:
    post:
      security:
      - api_key: []
      operationId: solana-grpc-GetSlot
      summary: GetSlot
      description: |
        Returns the current slot number at the given commitment level.
      x-seo-description: 지정한 커밋먼트 레벨 기준의 현재 슬롯 번호를 조회합니다.
      x-grpc-method: geyser.Geyser/GetSlot
      x-proto: geyser.proto
      x-protocol: grpc
      x-grpc:
        service: geyser.Geyser
        method: GetSlot
        streaming: unary
        proto: geyser.proto
        protoRepo: https://github.com/rpcpool/yellowstone-grpc/tree/master/yellowstone-grpc-proto/proto
      x-hide-try-it: true
      tags:
      - Geyser
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                commitment:
                  type: string
                  description: Commitment level for the query. One of `PROCESSED`, `CONFIRMED`, or `FINALIZED`. Defaults to `PROCESSED` when omitted.
                  enum:
                  - PROCESSED
                  - CONFIRMED
                  - FINALIZED
                  example: CONFIRMED
            example:
              commitment: CONFIRMED
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  slot:
                    type: string
                    format: uint64
                    description: Current slot number.
              example:
                slot: "372215930"
