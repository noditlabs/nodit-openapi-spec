openapi: 3.1.0
info:
  title: Solana - IsBlockhashValid
  version: 1.0.0
servers:
- url: https://solana-mainnet.grpc.nodit.io:443
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  schemas: {}
  responses: {}
paths:
  /geyser.Geyser/IsBlockhashValid:
    post:
      security:
      - api_key: []
      operationId: solana-grpc-IsBlockhashValid
      summary: IsBlockhashValid
      description: |
        Checks whether a blockhash is still valid. Use it to confirm that a signed transaction's blockhash has not expired before sending it.
      x-seo-description: 블록해시가 아직 유효한지 확인합니다. 서명한 트랜잭션을 전송하기 전에 블록해시 만료 여부를 확인할 때 사용합니다.
      x-grpc-method: geyser.Geyser/IsBlockhashValid
      x-proto: geyser.proto
      x-protocol: grpc
      x-grpc:
        service: geyser.Geyser
        method: IsBlockhashValid
        streaming: unary
        proto: geyser.proto
        protoRepo: https://github.com/rpcpool/yellowstone-grpc/tree/master/yellowstone-grpc-proto/proto
      x-hide-try-it: true
      tags:
      - Geyser
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - blockhash
              properties:
                blockhash:
                  type: string
                  description: Blockhash to check (Base58).
                commitment:
                  type: string
                  description: Commitment level used for the check. One of `PROCESSED`, `CONFIRMED`, or `FINALIZED`. Defaults to `PROCESSED` when omitted.
                  enum:
                  - PROCESSED
                  - CONFIRMED
                  - FINALIZED
                  example: CONFIRMED
            example:
              blockhash: 8ZPbuZ5Y3iuhyBuUNKFxa8bW8Z6nb9gpwNFWmMjXZVsZ
              commitment: CONFIRMED
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  slot:
                    type: string
                    format: uint64
                    description: Current slot number used for the check.
                  valid:
                    type: boolean
                    description: '`true` if the blockhash is valid, `false` if it has expired or is unknown.'
              example:
                slot: "372215930"
                valid: true
