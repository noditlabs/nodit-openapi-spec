openapi: 3.1.0
info:
  title: Solana - GetLatestBlockhash
  version: 1.0.0
servers:
- url: https://solana-mainnet.grpc.nodit.io:443
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  schemas: {}
  responses: {}
paths:
  /geyser.Geyser/GetLatestBlockhash:
    post:
      security:
      - api_key: []
      operationId: solana-grpc-GetLatestBlockhash
      summary: GetLatestBlockhash
      description: |
        Returns the latest blockhash at the given commitment level, together with the last block height at which the blockhash is valid, for use as a transaction's recent blockhash.
      x-seo-description: 지정한 커밋먼트 레벨 기준의 최신 블록해시를 조회합니다. 트랜잭션에 넣을 최근 블록해시와 그 블록해시가 유효한 마지막 블록 높이를 함께 반환합니다.
      x-grpc-method: geyser.Geyser/GetLatestBlockhash
      x-proto: geyser.proto
      x-protocol: grpc
      x-grpc:
        service: geyser.Geyser
        method: GetLatestBlockhash
        streaming: unary
        proto: geyser.proto
        protoRepo: https://github.com/rpcpool/yellowstone-grpc/tree/master/yellowstone-grpc-proto/proto
      x-hide-try-it: true
      tags:
      - Geyser
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                commitment:
                  type: string
                  description: Commitment level for the query. One of `PROCESSED`, `CONFIRMED`, or `FINALIZED`. Defaults to `PROCESSED` when omitted.
                  enum:
                  - PROCESSED
                  - CONFIRMED
                  - FINALIZED
                  example: CONFIRMED
            example:
              commitment: CONFIRMED
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  slot:
                    type: string
                    format: uint64
                    description: Slot number of the block the blockhash was taken from.
                  blockhash:
                    type: string
                    description: Latest blockhash (Base58).
                  last_valid_block_height:
                    type: string
                    format: uint64
                    description: Last block height at which a transaction using this blockhash is valid. Equals the current block height plus 300.
              example:
                slot: "372215930"
                blockhash: 8ZPbuZ5Y3iuhyBuUNKFxa8bW8Z6nb9gpwNFWmMjXZVsZ
                last_valid_block_height: "350391418"
