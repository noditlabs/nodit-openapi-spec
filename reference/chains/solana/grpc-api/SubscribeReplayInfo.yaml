openapi: 3.1.0
info:
  title: Solana - SubscribeReplayInfo
  version: 1.0.0
servers:
- url: https://solana-mainnet.grpc.nodit.io:443
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  schemas: {}
  responses: {}
paths:
  /geyser.Geyser/SubscribeReplayInfo:
    post:
      security:
      - api_key: []
      operationId: solana-grpc-SubscribeReplayInfo
      summary: SubscribeReplayInfo
      description: |
        Returns the earliest slot that can be replayed with `from_slot` in `Subscribe`. Use it to determine how far back you can recover when resubscribing after a disconnection.
      x-seo-description: '`Subscribe`의 `from_slot`으로 재전송받을 수 있는 가장 이른 슬롯을 조회합니다. 연결이 끊긴 뒤 다시 구독할 때 어디부터 복구할 수 있는지 확인하는 데 사용합니다.'
      x-grpc-method: geyser.Geyser/SubscribeReplayInfo
      x-proto: geyser.proto
      x-protocol: grpc
      x-grpc:
        service: geyser.Geyser
        method: SubscribeReplayInfo
        streaming: unary
        proto: geyser.proto
        protoRepo: https://github.com/rpcpool/yellowstone-grpc/tree/master/yellowstone-grpc-proto/proto
      x-hide-try-it: true
      tags:
      - Geyser
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example: {}
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  first_available:
                    type: string
                    format: uint64
                    description: Earliest slot number available for replay. Absent when replay is disabled on the server.
              example:
                first_available: "372214930"
