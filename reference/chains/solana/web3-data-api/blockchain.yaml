                          type: integer
                          description: A field representing the start slot number of the query in slot mode.
                          example: 462000000
                        toSlot:
                          type: integer
                          description: A field representing the end slot number of the query in slot mode.
                          example: 462833902
                      example:
                        fromDate: '2026-09-29T09:40:23.000Z'
                        toDate: '2026-10-29T09:40:21.000Z'
