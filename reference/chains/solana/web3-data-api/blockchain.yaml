                                nullable: true
                                example: "100000"
                              computeUnitLimit:
                                type: integer
                                nullable: true
                                description: A field representing the compute unit limit set on the transaction. It has a value within the u32 range.
                                example: 200000
                              loadedAccountsDataSizeLimit:
                                type: integer
                                nullable: true
                                description: A field representing the total size limit of the account data loaded by the transaction, in bytes. It has a value within the u32 range.
                                example: 65536
                              heapSize:
                                type: integer
                                nullable: true
                                description: A field representing the size of the heap memory used for dynamic allocation while the program runs inside the VM, in bytes. It has a value within the u32 range and is a multiple of 1KiB between 32KiB and 256KiB.
                                example: 32768
