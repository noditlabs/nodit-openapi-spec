                        - transactionIndex
                        - instructionIndex
                        - subInstructionIndex
                        - programId
                        - instructionType
                        - mintAddress
                        - from
                        - fromTokenAccount
                        - to
                        - toTokenAccount
                        - value
                        - decimals
                        properties:
                          slotHeight:
                            type: integer
                            description: A field representing the slot number in which the token transfer is included.
                            example: 235157119
                          blockHeight:
                            type: integer
                            description: A field representing the block height to which the slot is mapped.
                            example: 214567890
                          blockTimestamp:
                            type: integer
                            description: A field representing the time the block (slot) was created, as a Unix timestamp (seconds).
                            example: 1746479684
                          transactionSignature:
                            type: string
                            description: A field representing the signature of the transaction in which the token transfer occurred. It is Base58-encoded.
                            example: 5XXN7L7cMGYTvckcaNeTXxhJgxeT1JTa9auwa2yXCFR1NXzwXrXNAWx4SaAw48S5186VzvXiXVEsWJu1WFR5AAmg
                          transactionIndex:
                            type: integer
                            description: A field representing the order of the transaction within the same slot.
                            example: 7
                          instructionIndex:
                            type: integer
                            description: A field representing the index of the top-level instruction within the transaction. (0-based)
                            example: 2
                          subInstructionIndex:
                            type: integer
                            description: A field representing the index of the inner (sub) instruction that occurred via CPI, etc. It is 0 for a top-level instruction. (0-based)
                            example: 0
                          batchIndex:
                            type: integer
                            description: Field indicating the order of an individual transfer executed within a P-token batch instruction. Included only for transfers executed by a P-token batch instruction. (0-based)
                            example: 0
