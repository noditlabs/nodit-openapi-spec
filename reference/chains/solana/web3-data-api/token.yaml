                            type: string
                            description: A field representing the address of the receiving Token Account whose actual token balance increased. For SOL, an empty string ("") is returned.
                            example: 9qkU8bqgYwR3c6qS9m4X2C1xL7oQ7kL8U7s7o7h7j7k7
                          value:
                            type: string
                            description: A field representing the amount of the transferred token as a raw integer string. The actual amount is calculated as value / 10^decimals.
                            example: "100000"
                          decimals:
                            type: integer
                            description: A field representing the number of decimal places of the token.
                            example: 6
