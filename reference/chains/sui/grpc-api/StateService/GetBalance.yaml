openapi: 3.1.0
info:
  title: Sui - GetBalance
  version: 1.0.0
servers:
- url: https://sui-mainnet.nodit.io:443
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  schemas: {}
  responses: {}
paths:
  /sui.rpc.v2.StateService/GetBalance:
    post:
      security:
      - api_key: []
      operationId: sui-grpc-GetBalance
      summary: GetBalance
      description: |
        Retrieves the balance of a specific coin type for the specified address.
      x-seo-description: 지정한 주소의 특정 코인 타입 잔액을 조회합니다.
      x-grpc-method: sui.rpc.v2.StateService/GetBalance
      x-proto: sui/rpc/v2/state_service.proto
      x-protocol: grpc
      x-grpc:
        service: sui.rpc.v2.StateService
        method: GetBalance
        streaming: unary
        proto: sui/rpc/v2/state_service.proto
        transports:
        - grpc
        - grpc-web
        protoRepo: https://github.com/MystenLabs/sui-apis/tree/main/proto
      x-hide-try-it: true
      tags:
      - StateService
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - owner
              - coin_type
              properties:
                owner:
                  type: string
                  description: ' Required. The owner''s Sui address.'
                coin_type:
                  type: string
                  description: ' Required. The type name for the coin (e.g., 0x2::sui::SUI).'
            example:
              owner: ""
              coin_type: 0x2::sui::SUI
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  balance:
                    type: object
                    description: Balance information for the requested coin type.
                    properties:
                      coin_type:
                        type: string
                        description: Coin type.
                      balance:
                        type: integer
                        description: Total balance.
                      address_balance:
                        type: integer
                        description: Address balance portion.
                      coin_balance:
                        type: integer
                        description: Coin<T> balance portion.
              example:
                balance: {}
