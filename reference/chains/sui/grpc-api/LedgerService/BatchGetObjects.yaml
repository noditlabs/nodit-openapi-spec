openapi: 3.1.0
info:
  title: Sui - BatchGetObjects
  version: 1.0.0
servers:
- url: https://sui-mainnet.nodit.io:443
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  schemas: {}
  responses: {}
paths:
  /sui.rpc.v2.LedgerService/BatchGetObjects:
    post:
      security:
      - api_key: []
      operationId: sui-grpc-BatchGetObjects
      summary: BatchGetObjects
      description: |
        Retrieves the information of multiple objects in a single request.
      x-seo-description: 여러 오브젝트의 정보를 한 번의 요청으로 일괄 조회합니다.
      x-grpc-method: sui.rpc.v2.LedgerService/BatchGetObjects
      x-proto: sui/rpc/v2/ledger_service.proto
      x-protocol: grpc
      x-grpc:
        service: sui.rpc.v2.LedgerService
        method: BatchGetObjects
        streaming: unary
        proto: sui/rpc/v2/ledger_service.proto
        transports:
        - grpc
        - grpc-web
        protoRepo: https://github.com/MystenLabs/sui-apis/tree/main/proto
      x-hide-try-it: true
      tags:
      - LedgerService
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                requests:
                  type: array
                  items:
                    type: object
                  description: The individual object requests.
                read_mask:
                  type: object
                  description: Mask specifying which fields to read. If no mask is specified, defaults to `object_id,version,digest`.
                  properties:
                    paths:
                      type: array
                      items:
                        type: string
                      description: The set of field mask paths (e.g. "object_id", "version", "digest").
            example:
              requests: []
              read_mask:
                paths: []
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  objects:
                    type: array
                    description: The object retrieval results.
                    items:
                      type: object
                      properties:
                        object:
                          type: object
                          description: The retrieved object.
                          properties:
                            bcs:
                              type: object
                              description: This Object serialized as BCS.
                              properties:
                                name:
                                  type: string
                                  description: Name that identifies the type of the serialized value.
                                value:
                                  type: string
                                  description: Bytes of a BCS serialized value.
                            object_id:
                              type: string
                              description: ObjectId of the object.
                            version:
                              type: integer
                              description: Version of the object.
                            digest:
                              type: string
                              description: The digest of this Object.
                            owner:
                              type: object
                              description: Owner of the object.
                              properties:
                                kind:
                                  type: string
                                  description: Kind of ownership.
                                address:
                                  type: string
                                  description: Address or ObjectId of the owner.
                                version:
                                  type: integer
                                  description: The `initial_shared_version` if kind is `SHARED` or `start_version` if kind is `CONSENSUS_ADDRESS`.
                            object_type:
                              type: string
                              description: Type of the object.
                            has_public_transfer:
                              type: boolean
                              description: DEPRECATED. Whether the object has public transfer.
                            contents:
                              type: object
                              description: BCS bytes of a Move struct value. Only set for Move structs.
                              properties:
                                name:
                                  type: string
                                  description: Name that identifies the type of the serialized value.
                                value:
                                  type: string
                                  description: Bytes of a BCS serialized value.
                            package:
                              type: object
                              description: Package data if the object is a package.
                              properties:
                                storage_id:
                                  type: string
                                  description: Package ObjectId (storage ID).
                                original_id:
                                  type: string
                                  description: ID of the first published version.
                                version:
                                  type: integer
                                  description: Version of the package.
                                modules:
                                  type: array
                                  description: Modules in the package.
                                  items:
                                    type: object
                                    properties:
                                      name:
                                        type: string
                                        description: Name of the module.
                                      contents:
                                        type: string
                                        description: Serialized bytecode.
                                      datatypes:
                                        type: array
                                        description: Datatypes defined in the module.
                                        items:
                                          type: object
                                          properties:
                                            type_name:
                                              type: string
                                              description: Fully qualified type name.
                                            defining_id:
                                              type: string
                                              description: Package storage ID that defines the type.
                                            module:
                                              type: string
                                              description: Module name.
                                            name:
                                              type: string
                                              description: Datatype name.
                                            abilities:
                                              type: array
                                              items:
