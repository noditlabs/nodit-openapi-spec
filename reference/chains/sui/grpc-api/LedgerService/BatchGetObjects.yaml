                                              description: Generic type parameters.
                                              items:
                                                type: object
                                                properties:
                                                  constraints:
                                                    type: array
                                                    items:
                                                      type: string
                                                    description: Ability constraints on the parameter.
                                                  is_phantom:
                                                    type: boolean
                                                    description: Whether the parameter is phantom.
                                            kind:
                                              type: string
                                              description: Whether it is a struct or enum.
                                            fields:
                                              type: array
                                              description: Fields of the datatype.
                                              items:
                                                type: object
                                                properties:
                                                  name:
                                                    type: string
                                                    description: Name of the field.
                                                  position:
                                                    type: integer
                                                    description: Position in definition order.
                                                  type:
                                                    type: object
                                                    description: Type of the field.
                                                    properties:
                                                      type:
                                                        type: object
                                                        description: The type.
                                                      type_name:
                                                        type: string
                                                        description: Fully qualified datatype name.
                                                      type_parameter_instantiation:
                                                        type: array
                                                        items:
                                                          type: object
                                                        description: Instantiation of type parameters.
                                                      type_parameter:
                                                        type: integer
                                                        description: Type parameter position.
                                            variants:
                                              type: array
                                              description: Variants if the datatype is an enum.
                                              items:
                                                type: object
                                                properties:
                                                  name:
                                                    type: string
                                                    description: Name of the variant.
                                                  position:
                                                    type: integer
                                                    description: Position in definition order.
                                                  fields:
                                                    type: array
                                                    description: Fields of the variant.
                                                    items:
                                                      type: object
                                                      properties:
                                                        name:
                                                          type: string
                                                          description: Name of the field.
                                                        position:
                                                          type: integer
                                                          description: Position in definition order.
                                                        type:
                                                          type: object
                                                          description: Type of the field.
                                                          properties:
                                                            type:
                                                              type: object
                                                              description: The type.
                                                            type_name:
                                                              type: string
                                                              description: Fully qualified datatype name.
                                                            type_parameter_instantiation:
                                                              type: array
                                                              items:
                                                                type: object
                                                              description: Instantiation of type parameters.
                                                            type_parameter:
                                                              type: integer
                                                              description: Type parameter position.
                                      functions:
                                        type: array
                                        description: Functions defined in the module.
                                        items:
                                          type: object
                                          properties:
                                            name:
                                              type: string
                                              description: Name of the function.
                                            visibility:
                                              type: string
                                              description: Visibility (public/private/public(friend)).
                                            is_entry:
                                              type: boolean
                                              description: Whether the function is an entry function.
                                            type_parameters:
                                              type: array
                                              description: Generic type parameters.
                                              items:
                                                type: object
                                                properties:
                                                  constraints:
                                                    type: array
                                                    items:
                                                      type: string
                                                    description: Ability constraints on the parameter.
                                                  is_phantom:
                                                    type: boolean
                                                    description: Whether the parameter is phantom.
                                            parameters:
                                              type: array
                                              description: Parameter types.
                                              items:
                                                type: object
                                                properties:
                                                  reference:
                                                    type: object
                                                    description: Reference kind, if the type is a reference.
                                                  body:
                                                    type: object
                                                    description: The signature body.
                                                    properties:
                                                      type:
                                                        type: object
                                                        description: The type.
                                                      type_name:
                                                        type: string
                                                        description: Fully qualified datatype name.
                                                      type_parameter_instantiation:
                                                        type: array
                                                        items:
                                                          type: object
                                                        description: Instantiation of type parameters.
                                                      type_parameter:
                                                        type: integer
                                                        description: Type parameter position.
                                            returns:
                                              type: array
                                              description: Return types.
                                              items:
                                                type: object
                                                properties:
                                                  reference:
                                                    type: object
                                                    description: Reference kind, if the type is a reference.
                                                  body:
                                                    type: object
                                                    description: The signature body.
                                                    properties:
                                                      type:
                                                        type: object
                                                        description: The type.
                                                      type_name:
                                                        type: string
                                                        description: Fully qualified datatype name.
                                                      type_parameter_instantiation:
                                                        type: array
                                                        items:
                                                          type: object
                                                        description: Instantiation of type parameters.
                                                      type_parameter:
                                                        type: integer
                                                        description: Type parameter position.
                                type_origins:
                                  type: array
                                  description: Type origins for the package's types.
                                  items:
                                    type: object
                                    properties:
                                      module_name:
                                        type: string
                                        description: Name of the defining module.
                                      datatype_name:
                                        type: string
                                        description: Name of the datatype.
                                      package_id:
                                        type: string
                                        description: Package ID where the type originated.
                                linkage:
                                  type: array
                                  description: Transitive dependencies (linkage table).
                                  items:
                                    type: object
                                    properties:
                                      original_id:
                                        type: string
                                        description: Original package ID.
                                      upgraded_id:
                                        type: string
                                        description: Upgraded package ID.
                                      upgraded_version:
                                        type: integer
                                        description: Upgraded package version.
                            previous_transaction:
                              type: string
                              description: Digest of the transaction that created or last mutated this object.
                            storage_rebate:
                              type: integer
                              description: Storage rebate for the object.
                            json:
                              type: object
                              description: JSON rendering of the object.
                            balance:
                              type: integer
                              description: Current balance if this object is a `0x2::coin::Coin<T>`.
                            display:
                              type: object
                              description: Template-based display rendering.
                              properties:
                                output:
                                  type: object
                                  description: Substituted display fields.
                                errors:
                                  type: object
                                  description: Fields that failed to render.
                        error:
                          type: object
                          description: Error status, if any.
              example:
                objects: []
