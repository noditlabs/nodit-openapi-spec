                                                    type: string
                                                    description: Kind of the argument.
                                                  input:
                                                    type: integer
                                                    description: Index of an input when `kind` is `INPUT`.
                                                  result:
                                                    type: integer
                                                    description: Index of a result when `kind` is `RESULT`.
                                                  subresult:
                                                    type: integer
                                                    description: Used to access a sub-result when `kind` is `RESULT`.
