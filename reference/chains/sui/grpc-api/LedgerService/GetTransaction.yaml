                                        pure:
                                          type: string
                                          description: Move value serialized as BCS.
                                        object_id:
                                          type: string
                                          description: ObjectId of the input object.
                                        version:
                                          type: integer
                                          description: Requested version of the object.
                                        digest:
                                          type: string
                                          description: Digest of the object.
                                        mutable:
                                          type: boolean
                                          description: Whether a mutable reference is requested.
                                        mutability:
                                          type: string
                                          description: Mutability of the reference.
                                        funds_withdrawal:
