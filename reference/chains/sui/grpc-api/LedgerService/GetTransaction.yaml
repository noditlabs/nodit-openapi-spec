                                          description: Fund withdrawal input.
                                          properties:
                                            amount:
                                              type: integer
                                              description: Amount to withdraw.
                                            coin_type:
                                              type: string
                                              description: Coin type of the withdrawal.
                                            source:
                                              type: string
                                              description: Source of the funds.
                                        literal:
                                          type: object
                                          description: Literal value.
                                  commands:
                                    type: array
                                    description: Commands to execute.
                                    items:
                                      type: object
                                      properties:
                                        move_call:
