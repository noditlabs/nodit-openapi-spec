                                            package:
                                              type: string
                                              description: Package containing the function.
                                            module:
                                              type: string
                                              description: Module containing the function.
                                            function:
                                              type: string
                                              description: Name of the function to call.
                                            type_arguments:
                                              type: array
                                              items:
                                                type: string
