openapi: 3.1.0
info:
  title: Sui - GetTransaction
  version: 1.0.0
servers:
- url: https://sui-mainnet.nodit.io:443
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  schemas: {}
  responses: {}
paths:
  /sui.rpc.v2.LedgerService/GetTransaction:
    post:
      security:
      - api_key: []
      operationId: sui-grpc-GetTransaction
      summary: GetTransaction
      description: |
        Retrieves the transaction information for the specified digest.
      x-seo-description: 지정한 다이제스트로 트랜잭션 정보를 조회합니다.
      x-grpc-method: sui.rpc.v2.LedgerService/GetTransaction
      x-proto: sui/rpc/v2/ledger_service.proto
      x-protocol: grpc
      x-grpc:
        service: sui.rpc.v2.LedgerService
        method: GetTransaction
        streaming: unary
        proto: sui/rpc/v2/ledger_service.proto
        transports:
        - grpc
        - grpc-web
        protoRepo: https://github.com/MystenLabs/sui-apis/tree/main/proto
      x-hide-try-it: true
      tags:
      - LedgerService
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - digest
              properties:
                digest:
                  type: string
                  description: ' Required. The digest of the requested transaction.'
                read_mask:
                  type: object
                  description: Mask specifying which fields to read. If no mask is specified, defaults to `digest`.
                  properties:
                    paths:
                      type: array
                      items:
                        type: string
                      description: The set of field mask paths (e.g. "object_id", "version", "digest").
            example:
              digest: 7Gy9UsHEyJm1m1ANwLzpMPpFVGt3XoMMfbVgsCuFZHNN
              read_mask:
                paths: []
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  transaction:
                    type: object
                    description: The requested transaction.
                    properties:
                      digest:
                        type: string
                        description: Transaction digest.
                      transaction:
                        type: object
                        description: The transaction itself.
                        properties:
                          bcs:
                            type: object
                            description: Transaction serialized as BCS.
                            properties:
                              name:
                                type: string
                                description: Name that identifies the type of the serialized value.
                              value:
                                type: string
                                description: Bytes of a BCS serialized value.
                          digest:
                            type: string
                            description: Transaction digest.
                          version:
                            type: integer
                            description: Version of the transaction structure.
                          kind:
                            type: object
                            description: Kind of the transaction.
                            properties:
                              kind:
                                type: string
                                description: Kind discriminator.
                              programmable_transaction:
