openapi: 3.1.0
info:
  title: Celestia - Tx Search
  version: 1.0.0
servers:
- url: https://rpc-celestia-mainnet.nodit.io
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
paths:
  /:
    post:
      security:
      - api_key: []
      operationId: tx_search
      summary: Tx Search
      description: Searches for transactions matching the query conditions.
      tags:
      - json-rpc-api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - jsonrpc
              - id
              - method
              properties:
                jsonrpc:
                  description: JSON-RPC protocol version. Always `2.0`.
                  type: string
                  const: "2.0"
                id:
                  description: Identifier of the request. Returned unchanged as `id` in the response.
                  type: integer
                method:
                  description: Name of the JSON-RPC method to call.
                  type: string
                  const: tx_search
                params:
                  description: Parameters passed to the method.
                  type: object
                  additionalProperties: false
                  required:
                  - query
                  properties:
                    query:
                      type: string
                      description: Transaction search query string.
                    prove:
                      type: string
                      description: String boolean indicating whether to include the transaction's block inclusion proof in the result.
                    page:
                      type: string
                      description: Page number (starting from 1).
                    per_page:
                      type: string
                      description: Number of items to return per page (maximum 100).
                    order_by:
                      type: string
                      description: Sort order. "asc" or "desc". Defaults to the default sort order if omitted.
            example:
              jsonrpc: "2.0"
              id: 1
              method: tx_search
              params:
                query: tx.height=1000
                prove: "false"
                page: "1"
                per_page: "30"
                order_by: asc
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - jsonrpc
                - id
                - result
                properties:
                  jsonrpc:
                    description: JSON-RPC protocol version. Always `2.0`.
                    type: string
                    const: "2.0"
                  id:
                    description: The request ID, echoed back unchanged.
                    type: integer
                  result:
                    description: Result of the method call.
                    type: object
                    additionalProperties: false
                    required:
                    - txs
                    - total_count
                    properties:
                      txs:
                        description: Transactions matching the search query.
                        type: array
                        items:
                          type: object
                          additionalProperties: false
                          properties:
                            hash:
                              description: Transaction hash.
                              type: string
                            height:
                              description: Height of the block containing the transaction.
                              type: string
                            index:
                              description: Index of the transaction within the block.
                              type: integer
                            tx_result:
                              description: Transaction execution result.
                              type: object
                              additionalProperties: false
                              properties:
                                log:
                                  description: Execution log message.
                                  type: string
                                gas_wanted:
                                  description: Gas limit requested by the transaction.
                                  type: string
                                gas_used:
                                  description: Gas actually used.
                                  type: string
                                tags:
                                  description: Tags recorded during transaction execution.
                                  type: array
                                  items:
                                    type: object
                                    additionalProperties: false
                                    properties:
                                      key:
                                        description: Tag key.
                                        type: string
                                      value:
                                        description: Tag value.
                                        type: string
                                      index:
                                        description: Whether the tag is indexed.
                                        type: boolean
                            tx:
                              description: Raw transaction (Base64).
                              type: string
                            proof:
                              description: Merkle proof that the transaction is included in the block.
                              type: object
                              additionalProperties: false
                              properties:
                                RootHash:
                                  description: Root hash of the block's transaction Merkle tree.
                                  type: string
                                Data:
                                  description: The raw transaction being proven.
                                  type: string
                                Proof:
                                  description: Merkle proof.
                                  type: object
                                  additionalProperties: false
                                  properties:
                                    total:
                                      description: Total number of leaves in the Merkle tree.
                                      type: string
                                    index:
                                      description: Index of the proven leaf.
                                      type: string
                                    leaf_hash:
                                      description: Hash of the proven leaf.
                                      type: string
                                    aunts:
                                      description: Hashes of the sibling nodes on the path to the root.
                                      type: array
                                      items:
                                        type: string
                      total_count:
                        description: Total number of results matching the query.
                        type: string
              example:
                jsonrpc: "2.0"
                id: 1
                result:
                  txs:
                  - hash: D70952032620CC4E2737EB8AC379806359D8E0B17B0488F627997A0B043ABDED
                    height: "1000"
                    index: 0
                    tx_result:
                      log: '[{"msg_index":"0","success":true,"log":""}]'
                      gas_wanted: "200000"
                      gas_used: "28596"
                      tags:
                      - key: action
                        value: send
                        index: true
                    tx: a/encoded_tx/c
                  total_count: "1"
