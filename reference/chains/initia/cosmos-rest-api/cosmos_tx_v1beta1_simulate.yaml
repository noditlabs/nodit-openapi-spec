openapi: 3.1.0
info:
  title: Initia - cosmos_tx_v1beta1_simulate
  version: 1.0.0
servers:
- url: https://rest-initia-mainnet.nodit.io
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
paths:
  /cosmos/tx/v1beta1/simulate:
    post:
      description: Simulate simulates executing a transaction for estimating gas usage.
      operationId: cosmos_tx_v1beta1_simulate
      tags:
      - tx
      responses:
        "200":
          description: Successful Response
          content:
            '*/*':
              schema:
                type: object
                properties:
                  gas_info:
                    description: gas_info is the information about gas used in the simulation.
                    type: object
                    properties:
                      gas_wanted:
                        type: string
                        format: uint64
                        description: GasWanted is the maximum units of work we allow this tx to perform.
                      gas_used:
                        type: string
                        format: uint64
                        description: GasUsed is the amount of gas actually consumed.
                  result:
                    description: result is the result of the simulation.
                    type: object
                    properties:
                      data:
                        type: string
                        format: byte
                        description: |-
                          Data is any data returned from message or handler execution. It MUST be
                          length prefixed in order to separate data from multiple message executions.
                          Deprecated. This field is still populated, but prefer msg_response instead
                          because it also contains the Msg response typeURL.
                      log:
                        type: string
                        description: Log contains the log information from message or handler execution.
                      events:
                        type: array
                        items:
                          type: object
                          properties:
                            type:
                              description: Event type.
                              type: string
                            attributes:
                              description: Event attributes (key-value pairs).
                              type: array
                              items:
                                type: object
                                properties:
                                  key:
                                    description: Attribute key.
                                    type: string
                                  value:
                                    description: Attribute value.
                                    type: string
                                  index:
                                    description: Whether the attribute is indexed.
                                    type: boolean
                                description: EventAttribute is a single key-value pair, associated with an event.
                          description: |-
                            Event allows application developers to attach additional information to
                            ResponseFinalizeBlock and ResponseCheckTx.
                            Later, transactions may be queried using these events.
                        description: |-
                          Events contains a slice of Event objects that were emitted during message
                          or handler execution.
                      msg_responses:
                        type: array
                        items:
                          type: object
                          properties:
                            type_url:
                              type: string
                              description: |-
                                A URL/resource name that uniquely identifies the type of the serialized
                                protocol buffer message. This string must contain at least
                                one "/" character. The last segment of the URL's path must represent
                                the fully qualified name of the type (as in
                                `path/google.protobuf.Duration`). The name should be in a canonical form
                                (e.g., leading "." is not accepted).

                                In practice, teams usually precompile into the binary all types that they
                                expect it to use in the context of Any. However, for URLs which use the
                                scheme `http`, `https`, or no scheme, one can optionally set up a type
                                server that maps type URLs to message definitions as follows:

                                * If no scheme is provided, `https` is assumed.
                                * An HTTP GET on the URL must yield a [google.protobuf.Type][]
                                  value in binary format, or produce an error.
                                * Applications are allowed to cache lookup results based on the
                                  URL, or have them precompiled into a binary to avoid any
                                  lookup. Therefore, binary compatibility needs to be preserved
                                  on changes to types. (Use versioned type names to manage
                                  breaking changes.)

                                Note: this functionality is not currently available in the official
                                protobuf release, and it is not used for type URLs beginning with
                                type.googleapis.com.

                                Schemes other than `http`, `https` (or the empty scheme) might be
                                used with implementation specific semantics.
                            value:
                              type: string
                              format: byte
                              description: Must be a valid serialized protocol buffer of the above specified type.
                          description: |-
                            `Any` contains an arbitrary serialized protocol buffer message along with a
                            URL that describes the type of the serialized message.

                            Protobuf library provides support to pack/unpack Any values in the form
                            of utility functions or additional generated methods of the Any type.

                            Example 1: Pack and unpack a message in C++.

                                Foo foo = ...;
                                Any any;
                                any.PackFrom(foo);
                                ...
                                if (any.UnpackTo(&foo)) {
                                  ...
                                }

                            Example 2: Pack and unpack a message in Java.

                                Foo foo = ...;
                                Any any = Any.pack(foo);
                                ...
                                if (any.is(Foo.class)) {
                                  foo = any.unpack(Foo.class);
                                }
                                // or ...
                                if (any.isSameTypeAs(Foo.getDefaultInstance())) {
                                  foo = any.unpack(Foo.getDefaultInstance());
                                }

                            Example 3: Pack and unpack a message in Python.

                                foo = Foo(...)
