openapi: 3.1.0
info:
  title: World Chain - web3_sha3
  version: 1.0.0
servers:
- url: https://worldchain-mainnet.nodit.io
  description: World Chain Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  schemas:
    HexString:
      type: string
      description: A hexadecimal string prefixed with 0x.
      pattern: ^0[xX][0-9a-fA-F]*$
      example: "0x1"
  responses:
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - NO_AUTHENTICATION_FOUND
                - AUTHENTICATION_FAILED
                description: Code to identify the cause of authentication failure
              message:
                type: string
                description: Detailed message including the cause of authentication failure
            required:
            - code
            - message
          examples:
            NO_AUTHENTICATION_FOUND:
              summary: The request does not include authentication (API Key)
              value:
                code: NO_AUTHENTICATION_FOUND
                message: No authentication found.
            AUTHENTICATION_FAILED:
              summary: The authentication (API Key) is invalid
              value:
                code: AUTHENTICATION_FAILED
                message: Authentication failed.
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - PERMISSION_DENIED
                description: Code indicating permission denied
              message:
                type: string
                description: Detailed message including information about the denied resource
            required:
            - code
            - message
          examples:
            PERMISSION_DENIED:
              summary: The request accesses a resource it is not authorized for
              value:
                code: PERMISSION_DENIED
                message: Permission denied
    "429":
      description: Too Many Requests
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_MANY_REQUESTS
                - EXCEEDED_QUOTA_LIMIT
                description: Code identifying the cause of the request limit exceeded
              message:
                type: string
                description: Detailed message including the exceeded limit type and allowed threshold
            required:
            - code
            - message
          examples:
            TOO_MANY_REQUESTS:
              summary: The rate limit was exceeded
              value:
                code: TOO_MANY_REQUESTS
                message: Too many requests
            EXCEEDED_QUOTA_LIMIT:
              summary: The quota limit was exceeded
              value:
                code: EXCEEDED_QUOTA_LIMIT
                message: Exceeded quota limit
    "500":
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - INTERNAL_SERVER_ERROR
                - INTERRUPTED
                description: Code to identify the cause of the internal server error
              message:
                type: string
                description: Detailed message including the cause of the server error
            required:
            - code
            - message
          examples:
            INTERNAL_SERVER_ERROR:
              summary: An internal server error occurred
              value:
                code: INTERNAL_SERVER_ERROR
                message: Internal server error
            INTERRUPTED:
              summary: Processing failed temporarily due to server load
              value:
                code: INTERRUPTED
                message: Request interrupted
paths:
  /:
    post:
      security:
      - api_key: []
      operationId: worldchain-web3_sha3
      summary: web3_sha3
      description: Applies the SHA3 (Keccak-256) hash function to the input data and returns the result. This method is primarily used to verify data integrity or generate unique identifiers for specific data. For example, it can be used to hash input data for storage on the blockchain or to compute unique hash values.
      x-seo-description: Compute the Keccak-256 hash of the given data using the Ethereum hashing algorithm.
      tags:
      - web3
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - jsonrpc
              - method
              properties:
                id:
                  type: integer
                  example: 1
                jsonrpc:
                  type: string
                  example: "2.0"
                method:
                  type: string
                  example: web3_sha3
                params:
                  type: array
                  items:
                    oneOf:
                    - title: Input data
                      type: string
                      pattern: ^0[xX][0-9a-fA-F]+$
                      example: "0x68656c6c6f204e4f444954"
                      description: Data to apply the SHA3 hash to. This value must be a hex-encoded string with a '0x' prefix. For example, "0x68656c6c6f204e4f444954" represents "hello NODIT".
                  example:
                  - "0x68656c6c6f204e4f444954"
                  description: |-
                    Enter the following parameters as an array with the appropriate types.

                    1. data in hex: Data to apply the SHA3 hash to. This value must be a hex-encoded string with a '0x' prefix.
              example:
                id: 1
                jsonrpc: "2.0"
                method: web3_sha3
                params:
                - "0x68656c6c6f204e4f444954"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              example:
                jsonrpc: "2.0"
                id: 1
                result: "0x274020d2b9b210b079f3898f94123f710f5ab65525f23c7ad9e04e425d3648bd"
              schema:
                $ref: '#/components/schemas/HexString'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
