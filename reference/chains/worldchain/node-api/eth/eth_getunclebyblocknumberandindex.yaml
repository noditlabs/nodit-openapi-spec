paths:
  /:
    post:
      security:
      - api_key: []
      operationId: worldchain-eth_getunclebyblocknumberandindex
      summary: eth_getUncleByBlockNumberAndIndex
      description: Returns the uncle block information for the specified block number and uncle index.
      x-seo-description: Returns information about an uncle block by block number and uncle index position.
      tags:
      - eth
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - jsonrpc
              - method
              - params
              properties:
                id:
                  type: integer
                  example: 1
                jsonrpc:
                  type: string
                  example: "2.0"
                method:
                  type: string
                  example: eth_getUncleByBlockNumberAndIndex
                params:
                  type: array
                  items:
                    oneOf:
                    - title: Block Number or Tag
                      type: string
                      pattern: ^0[xX][0-9a-fA-F]+$|^(latest|earliest|pending|safe|finalized)$
                      description: |
                        Use one of block number or block tag to specify a block.
                        * Block number: hex string (ex. "0x1")
                        * Block tag: enum string (ex. "latest", "earliest", "pending")
                          * `earliest`: The oldest available block on the chain.
                          * `finalized`: A recently finalized block that can no longer be changed. Primarily used in proof-of-stake (PoS) blockchains.
                          * `safe`: A recent block considered safe by the network (immune to reorgs).
                          * `latest`: The most recent block on the chain (may be subject to reorgs).
                          * `pending`: The next block to be mined, including pending transactions in the mempool.
                      example: latest
                    - title: Transaction Index
                      type: string
                      pattern: ^0[xX][0-9a-fA-F]+$
                      example: "0x0"
                      description: The uncle index indicates the position of the uncle block within the block. Expressed as a hexadecimal string.
                  example:
                  - "0x5BAD54"
                  - "0x0"
                  description: |-
                    Pass the following parameters as an array with the appropriate types.
                    1. `block number or block tag`: Block number as hex string, or block tag such as "earliest", "latest", "pending".
                    2. `uncle index`: The uncle index as a hex string.
              example:
                id: 1
                jsonrpc: "2.0"
                method: eth_getUncleByBlockNumberAndIndex
                params:
                - "0x5BAD54"
                - "0x0"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              example:
                jsonrpc: "2.0"
                id: 1
                result:
                  difficulty: "0xbf93d9424b943"
                  extraData: "0x73656f33"
                  gasLimit: "0x7a121d"
                  gasUsed: "0x7936f4"
                  hash: "0x407116a0f58ad370ac6c45813665988903f4c60ecc2f112d55cbf43a8c33f48e"
                  logsBloom: ""
                  miner: "0xb2930b35844a230f00e51431acae96fe543a0347"
                  mixHash: "0xb1266ba0d3c68a5561e6f62a819d214d9eaa293312f674f3a44ad7fae5e6740d"
                  nonce: "0x6b5afb9416a32721"
                  number: "0x5bad53"
                  parentHash: "0xd2f7edf95b79d2a7e994f698d1ea1737642de0bd49138d183bcc3d1ecf9792e4"
                  receiptsRoot: "0xc2798ebd620a7dee020ba272d4396a60a68de6ce5f52b22770e9fee2e14ff15a"
                  sha3Uncles: "0x1dcc4de8dec75d7aab85b567b6ccd41ad312451b948a7413f0a142fd40d49347"
                  size: "0x20d"
                  stateRoot: "0x9a57583eeb63556158cdda05f188ff1dffa1a1cfde194d026f2719e69edf2a9d"
                  timestamp: "0x5b541431"
                  transactionsRoot: "0x11447f3cc960e33ecca21d2b1ca08b6b5a7e478c35920ad1159c9332c0f9332c"
                  uncles: []
              schema:
                $ref: '#/components/schemas/Block'
