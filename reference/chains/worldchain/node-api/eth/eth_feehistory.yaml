openapi: 3.1.0
info:
  title: World Chain - eth_feeHistory
  version: 1.0.0
servers:
- url: https://worldchain-mainnet.nodit.io
  description: World Chain Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  schemas:
    FeeHistory:
      type: object
      description: Historical gas fee data for a range of blocks.
      properties:
        oldestBlock:
          type: string
          description: Oldest block number in the returned range (hex)
        reward:
          type: array
          description: Array of priority fees at requested percentiles for each block (in wei, hex)
          items:
            type: array
            items:
              type: string
        baseFeePerGas:
          type: array
          description: Array of base fees per gas for each block (in wei, hex). Last element is the next block's expected value.
          items:
            type: string
        gasUsedRatio:
          type: array
          description: Array of gas utilization ratios per block (0 to 1)
          items:
            type: number
  responses:
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - NO_AUTHENTICATION_FOUND
                - AUTHENTICATION_FAILED
                description: Code to identify the cause of authentication failure
              message:
                type: string
                description: Detailed message including the cause of authentication failure
            required:
            - code
            - message
          examples:
            NO_AUTHENTICATION_FOUND:
              summary: The request does not include authentication (API Key)
              value:
                code: NO_AUTHENTICATION_FOUND
                message: No authentication found.
            AUTHENTICATION_FAILED:
              summary: The authentication (API Key) is invalid
              value:
                code: AUTHENTICATION_FAILED
                message: Authentication failed.
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - PERMISSION_DENIED
                description: Code indicating permission denied
              message:
                type: string
                description: Detailed message including information about the denied resource
            required:
            - code
            - message
          examples:
            PERMISSION_DENIED:
              summary: The request accesses a resource it is not authorized for
              value:
                code: PERMISSION_DENIED
                message: Permission denied
    "429":
      description: Too Many Requests
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_MANY_REQUESTS
                - EXCEEDED_QUOTA_LIMIT
                description: Code identifying the cause of the request limit exceeded
              message:
                type: string
                description: Detailed message including the exceeded limit type and allowed threshold
            required:
            - code
            - message
          examples:
            TOO_MANY_REQUESTS:
              summary: The rate limit was exceeded
              value:
                code: TOO_MANY_REQUESTS
                message: Too many requests
            EXCEEDED_QUOTA_LIMIT:
              summary: The quota limit was exceeded
              value:
                code: EXCEEDED_QUOTA_LIMIT
                message: Exceeded quota limit
    "500":
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - INTERNAL_SERVER_ERROR
                - INTERRUPTED
                description: Code to identify the cause of the internal server error
              message:
                type: string
                description: Detailed message including the cause of the server error
            required:
            - code
            - message
          examples:
            INTERNAL_SERVER_ERROR:
              summary: An internal server error occurred
              value:
                code: INTERNAL_SERVER_ERROR
                message: Internal server error
            INTERRUPTED:
              summary: Processing failed temporarily due to server load
              value:
                code: INTERRUPTED
                message: Request interrupted
paths:
  /:
    post:
      security:
      - api_key: []
      operationId: worldchain-eth_feehistory
      summary: eth_feeHistory
      description: Returns gas fee history for the requested block range. Use this to set appropriate values for maxFeePerGas and maxPriorityFeePerGas when creating transactions.
      x-seo-description: Retrieve historical gas fee data including base fee and priority fee per block for EVM networks.
      tags:
      - eth
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - jsonrpc
              - method
              - params
              properties:
                id:
                  type: integer
                  example: 1
                jsonrpc:
                  type: string
                  example: "2.0"
                method:
                  type: string
                  example: eth_feeHistory
                params:
                  type: array
                  items:
                    oneOf:
                    - title: Block Count
                      description: The number of blocks to query. Enter an integer from 1 to 1024. Fewer blocks than requested may be returned if not all blocks are available.
                      type: integer
                      minimum: 1
                      maximum: 1024
                      example: 2
                    - title: Block Number or Tag
                      type: string
                      pattern: ^(?:0[xX][0-9a-fA-F]+|(?:latest|earliest|pending|safe|finalized))$
                      description: |
                        Use one of block number or block tag to specify a block.
                        * Block number: hex string (ex. "0x1")
                        * Block tag: enum string (ex. "latest", "earliest", "pending")
                          * `earliest`: The oldest available block on the chain.
                          * `finalized`: A recently finalized block that can no longer be changed. Primarily used in proof-of-stake (PoS) blockchains.
                          * `safe`: A recent block considered safe by the network (immune to reorgs).
                          * `latest`: The most recent block on the chain (may be subject to reorgs).
                          * `pending`: The next block to be mined, including pending transactions in the mempool.
                      example: latest
                    - title: Reward Percentiles
                      description: An array of percentile values used to sample priority fees. Percentiles are weighted by the gas used in each block. Enter integers from 0 to 100 in ascending order.
                      type: array
                      items:
                        type: integer
                        minimum: 0
                        maximum: 100
                      example:
                      - 0
                      - 100
                  description: |-
                    Pass the following parameters as an array with the appropriate types.
                    1. `block count`: Number of blocks to query (1-1024). Fewer blocks may be returned if not all are available.
                    2. `newest block`: The reference block for the query. Block number as hex string or "latest".
                    3. `reward percentiles`: Integer array for sampling priority fee percentiles. Percentiles are weighted by gas used per block. Values 0-100 in ascending order.
                  example:
                  - 2
                  - latest
                  - - 0
                    - 100
              example:
                id: 1
                jsonrpc: "2.0"
                method: eth_feeHistory
                params:
                - 2
                - latest
                - - 0
                  - 100
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              example:
                jsonrpc: "2.0"
                id: 1
                result:
                  oldestBlock: "0x1249315"
                  reward:
                  - - "0x186a0"
                    - "0x61ac6361c"
                  - - "0x0"
                    - "0xae908e1c8"
                  baseFeePerGas:
                  - "0x589753de4"
                  - "0x5634a5a38"
                  - "0x5a0918fd1"
                  gasUsedRatio:
                  - 0.392293
                  - 0.6777092333333333
              schema:
                $ref: '#/components/schemas/FeeHistory'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
