openapi: 3.1.0
info:
  title: World Chain - debug_traceCall
  version: 1.0.0
servers:
- url: https://worldchain-mainnet.nodit.io
  description: World Chain Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  schemas:
    DebugTraceResult:
      type: object
      description: Debug trace result object. Structure based on the callTracer returned by debug_traceTransaction.
      properties:
        from:
          type: string
          description: Caller address
        gas:
          type: string
          description: Gas limit set for the call (hex)
        gasUsed:
          type: string
          description: Actual gas used (hex)
        to:
          type: string
          description: Callee address
        input:
          type: string
          description: Call input data (hex)
        output:
          type: string
          description: Call return data (hex)
        value:
          type: string
          description: Amount of ETH transferred (hex, in wei)
        type:
          type: string
          description: Call type (CALL, CREATE, STATICCALL, etc.)
        calls:
          type: array
          description: List of internal sub-calls
          items:
            type: object
            description: Internal call entry (same structure as DebugTraceResult)
        error:
          type: string
          description: Error message if execution failed
        revertReason:
          type: string
          description: Revert reason if the transaction was reverted
  responses:
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - NO_AUTHENTICATION_FOUND
                - AUTHENTICATION_FAILED
                description: Code to identify the cause of authentication failure
              message:
                type: string
                description: Detailed message including the cause of authentication failure
            required:
            - code
            - message
          examples:
            NO_AUTHENTICATION_FOUND:
              summary: The request does not include authentication (API Key)
              value:
                code: NO_AUTHENTICATION_FOUND
                message: No authentication found.
            AUTHENTICATION_FAILED:
              summary: The authentication (API Key) is invalid
              value:
                code: AUTHENTICATION_FAILED
                message: Authentication failed.
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - PERMISSION_DENIED
                description: Code indicating permission denied
              message:
                type: string
                description: Detailed message including information about the denied resource
            required:
            - code
            - message
          examples:
            PERMISSION_DENIED:
              summary: The request accesses a resource it is not authorized for
              value:
                code: PERMISSION_DENIED
                message: Permission denied
    "404":
      description: Not Found
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - WRONG_ENDPOINT
                - NOT_SUPPORTED_CHAIN
                - RESOURCE_NOT_FOUND
                description: Code to identify the cause of the resource not found
              message:
                type: string
                description: Detailed message including the name, value, etc. of the resource not found
            required:
            - code
            - message
          examples:
            WRONG_ENDPOINT:
              summary: The requested API path does not exist
              value:
                code: WRONG_ENDPOINT
                message: Wrong endpoint
            NOT_SUPPORTED_CHAIN:
              summary: The requested chain is not supported
              value:
                code: NOT_SUPPORTED_CHAIN
                message: Not supported chain
            RESOURCE_NOT_FOUND:
              summary: The requested resource does not exist
              value:
                code: RESOURCE_NOT_FOUND
                message: 'Resource not found: { RESOURCE_NAME = RESOURCE_VALUE }'
    "405":
      description: Method Not Allowed
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - METHOD_NOT_ALLOWED
                description: Code indicating a disallowed HTTP method
              message:
                type: string
                description: Detailed message about the disallowed HTTP method
            required:
            - code
            - message
          examples:
            METHOD_NOT_ALLOWED:
              summary: The request uses an unsupported HTTP method
              value:
                code: METHOD_NOT_ALLOWED
                message: Method not allowed
    "408":
      description: Request Timeout
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TIMEOUT
                description: Code indicating request timeout
              message:
                type: string
                description: Detailed message including the cause of the timeout
            required:
            - code
            - message
          examples:
            TIMEOUT:
              summary: Processing did not finish within the time limit
              value:
                code: TIMEOUT
                message: Request timeout
    "409":
      description: Conflict
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - RESOURCE_ALREADY_EXISTS
                - REJECTED
                description: Code to identify the cause of the request conflict
              message:
                type: string
                description: Detailed message including information about the conflicting resource
            required:
            - code
            - message
          examples:
            RESOURCE_ALREADY_EXISTS:
              summary: The request tries to create a resource that already exists
              value:
                code: RESOURCE_ALREADY_EXISTS
                message: Resource already exists
            REJECTED:
              summary: The server rejected the request
              value:
                code: REJECTED
                message: Request rejected
    "413":
      description: Payload Too Large
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - CONTENTS_TOO_LARGE
                description: Code indicating payload size exceeded
              message:
                type: string
                description: Detailed message including the maximum allowed payload size
            required:
            - code
            - message
          examples:
            CONTENTS_TOO_LARGE:
              summary: The payload exceeds the server's maximum size
              value:
                code: CONTENTS_TOO_LARGE
                message: Contents too large
    "414":
      description: URI Too Long
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_LONG_URI
                description: Code indicating URI length exceeded
              message:
                type: string
                description: Detailed message including the maximum allowed URI length
            required:
            - code
            - message
          examples:
            TOO_LONG_URI:
              summary: The request URI exceeds the server's maximum length
              value:
                code: TOO_LONG_URI
                message: URI too long
    "429":
      description: Too Many Requests
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_MANY_REQUESTS
                - EXCEEDED_QUOTA_LIMIT
                description: Code identifying the cause of the request limit exceeded
              message:
                type: string
                description: Detailed message including the exceeded limit type and allowed threshold
            required:
            - code
            - message
          examples:
            TOO_MANY_REQUESTS:
              summary: The rate limit was exceeded
              value:
                code: TOO_MANY_REQUESTS
                message: Too many requests
            EXCEEDED_QUOTA_LIMIT:
              summary: The quota limit was exceeded
              value:
                code: EXCEEDED_QUOTA_LIMIT
                message: Exceeded quota limit
    "500":
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - INTERNAL_SERVER_ERROR
                - INTERRUPTED
                description: Code to identify the cause of the internal server error
              message:
                type: string
                description: Detailed message including the cause of the server error
            required:
            - code
            - message
          examples:
            INTERNAL_SERVER_ERROR:
              summary: An internal server error occurred
              value:
                code: INTERNAL_SERVER_ERROR
                message: Internal server error
            INTERRUPTED:
              summary: Processing failed temporarily due to server load
              value:
                code: INTERRUPTED
                message: Request interrupted
    "503":
      description: Service Unavailable
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - UNAVAILABLE
                description: Code indicating service unavailability
              message:
                type: string
                description: Detailed message including the cause of the service outage
            required:
            - code
            - message
          examples:
            UNAVAILABLE:
              summary: The service is unavailable due to infrastructure downtime or an upgrade
              value:
                code: UNAVAILABLE
                message: Service unavailable
paths:
  /:
    post:
      security:
      - api_key: []
      operationId: worldchain-debug_tracecall
      summary: debug_traceCall
      description: Runs eth_call in debugging mode and provides trace functionality. You can trace all stack changes that occur when executing a specific call based on the current block's state.
      x-seo-description: Trace a call execution against a specific block to debug smart contract interactions.
      tags:
      - debug
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - jsonrpc
              - method
              - params
              properties:
                id:
                  type: integer
                  example: 1
                jsonrpc:
                  type: string
                  example: "2.0"
                method:
                  type: string
                  example: debug_traceCall
                params:
                  type: array
                  items:
                    oneOf:
                    - title: Call Object
                      type: object
                      properties:
                        from:
                          type: string
                          description: Enter the transaction's from address as a string.
                        to:
                          type: string
                          description: Enter the transaction's to address as a string.
                          example: "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"
                        gas:
                          type: string
                          description: Enter the gas required to process the transaction as a hex-format string. For smart contract calls, no gas is consumed, so you can enter 0x0.
                        gasPrice:
                          type: string
                          description: Enter the desired cost per gas as a hex-format string.
                        value:
                          type: string
                          description: The value of the transaction.
                        data:
                          type: string
                          description: The method signature hash of the transaction to execute. Can be referenced from the ABI.
                          example: "0x70a08231000000000000000000000000d8dA6BF26964aF9D7eEd9e03E53415D37aA96045"
                      description: |-
                        Call object for transaction simulation. May include the following fields.
                        * `from`: Enter the transaction's from address as a string.
                        * `to`: Enter the transaction's to address as a string.
                        * `gas`: Enter the gas required to process the transaction as a hex-format string. For smart contract calls, no gas is consumed, so you can enter 0x0.
                        * `gasPrice`: Enter the desired cost per gas as a hex-format string.
                        * `value`: The value of the transaction.
                        * `data`: The method signature hash of the transaction to execute. Can be referenced from the ABI.
                    - title: Block Number or Hash or Tag
                      type: string
                      pattern: ^0[xX][0-9a-fA-F]+$|^0[xX][0-9a-fA-F]{64}$|^(latest|earliest|pending|safe|finalized)$
                      description: |
                        Use block hash, block number, or block tag to specify a block.
                        * Block number: Hexadecimal string (ex. "0x1")
                        * Block hash: 64-digit hexadecimal string (ex. "0x39008d07edf93c03bb9d1cfc80598fcf63f441ec86e9de3733fa6a484980ca48")]
                        * Block tag: Enum string (ex. "latest", "earliest", "pending")
                          * `earliest`: The oldest available block on the chain.
                          * `finalized`: A recently finalized block that can no longer be changed. Primarily used in proof-of-stake (PoS) blockchains.
                          * `safe`: A recent block considered safe by the network (immune to reorgs).
                          * `latest`: The most recent block on the chain (may be subject to reorgs).
                          * `pending`: The next block to be mined, including pending transactions in the mempool.
                      example: latest
                    - title: Trace Option Object
                      type: object
                      properties:
                        tracer:
                          type: string
                          enum:
                          - callTracer
                          - prestateTracer
                          example: callTracer
                          description: |-
                            A field that specifies the tracer type, set to either "callTracer" or "prestateTracer".
                            1. `callTracer`: Used to inspect the execution path and results of executed transactions. Provides information such as the call stack, return values, gas consumption, and revert reasons, and can trace the process of function calls and interactions with smart contracts. Depending on the execution option (onlyTopCall), you can trace all nested calls of a specific call.
                            2. `prestateTracer`: A tool that traces the pre-state before a specific transaction or block is executed. Records account state and contract code before transaction execution, allowing you to analyze state changes before and after execution. prestateTracer is used to trace smart contract state changes and interactions between accounts.
                        tracerConfig:
                          type: object
                          properties:
                            onlyTopCall:
                              type: boolean
                              example: true
                          description: Object for tracer configuration. Uses the boolean "onlyTopCall" option; when set to true, traces only the main call. When set to false, traces down to the sub-call level.
                      description: 'Object for trace option configuration. '
                  example:
                  - from: "0xc90d3Ac75D1D36dF0b0a229E73D8409FB7F3c4ab"
                    to: "0xd3CdA913deB6f67967B99D67aCDFa1712C293601"
                    value: "0x186a0"
                  - finalized
                  - tracer: callTracer
                  description: |-
                    Enter the following parameters as an array with the appropriate types.

                    1. `call object` - Enter the contract address to call and the data of the function to execute.
                    2. `block identifier` - Block identifier for the target block: block number, block hash, or block tag.
                    3. `trace option`: Object for trace option configuration.
              example:
                id: 1
                jsonrpc: "2.0"
                method: debug_traceCall
                params:
                - from: "0xc90d3Ac75D1D36dF0b0a229E73D8409FB7F3c4ab"
                  to: "0xd3CdA913deB6f67967B99D67aCDFa1712C293601"
                  value: "0x186a0"
                - finalized
                - tracer: callTracer
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              example:
                jsonrpc: "2.0"
                id: "1"
                result:
                  from: "0x0000000000000000000000000000000000000000"
                  gas: "0x2faf080"
                  gasUsed: "0x5d83"
                  to: "0xa3e0dfbf8dbd86e039f7cdb37682a776d66dae4b"
                  input: "0x70a08231000000000000000000000000a03167de1a56160e4647d77d81e9139af55b63d4"
                  output: "0x000000000000000000000000000000000000000000000000000003c18cd105e2"
                  value: "0x0"
                  type: CALL
              schema:
                $ref: '#/components/schemas/DebugTraceResult'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "404":
          $ref: '#/components/responses/404'
        "405":
          $ref: '#/components/responses/405'
        "408":
          $ref: '#/components/responses/408'
        "409":
          $ref: '#/components/responses/409'
        "413":
          $ref: '#/components/responses/413'
        "414":
          $ref: '#/components/responses/414'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
        "503":
          $ref: '#/components/responses/503'
