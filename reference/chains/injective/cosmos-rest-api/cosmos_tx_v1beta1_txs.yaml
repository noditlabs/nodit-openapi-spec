                                      value:
                                        type: string
                                        description: Must be a valid serialized protocol buffer of the above specified type.
                                        format: byte
                                  mode_info:
                                    type: object
                                    description: ModeInfo describes the signing mode of a single or nested multisig signer.
                                    properties:
                                      single:
                                        type: object
                                        properties:
                                          mode:
                                            type: string
                                            description: |-
                                              SignMode represents a signing mode with its own security guarantees.

                                              This enum should be considered a registry of all known sign modes
                                              in the Cosmos ecosystem. Apps are not expected to support all known
                                              sign modes. Apps that would like to support custom  sign modes are
                                              encouraged to open a small PR against this file to add a new case
                                              to this SignMode enum describing their sign mode so that different
                                              apps have a consistent version of this enum.

                                               - SIGN_MODE_UNSPECIFIED: SIGN_MODE_UNSPECIFIED specifies an unknown signing mode and will be
                                              rejected.
                                               - SIGN_MODE_DIRECT: SIGN_MODE_DIRECT specifies a signing mode which uses SignDoc and is
                                              verified with raw bytes from Tx.
                                               - SIGN_MODE_TEXTUAL: SIGN_MODE_TEXTUAL is a future signing mode that will verify some
                                              human-readable textual representation on top of the binary representation
                                              from SIGN_MODE_DIRECT.

                                              Since: cosmos-sdk 0.50
                                               - SIGN_MODE_DIRECT_AUX: SIGN_MODE_DIRECT_AUX specifies a signing mode which uses
                                              SignDocDirectAux. As opposed to SIGN_MODE_DIRECT, this sign mode does not
                                              require signers signing over other signers' `signer_info`.

                                              Since: cosmos-sdk 0.46
                                               - SIGN_MODE_LEGACY_AMINO_JSON: SIGN_MODE_LEGACY_AMINO_JSON is a backwards compatibility mode which uses
                                              Amino JSON and will be removed in the future.
                                               - SIGN_MODE_EIP_191: SIGN_MODE_EIP_191 specifies the sign mode for EIP 191 signing on the Cosmos
                                              SDK. Ref: https://eips.ethereum.org/EIPS/eip-191

                                              Currently, SIGN_MODE_EIP_191 is registered as a SignMode enum variant,
                                              but is not implemented on the SDK by default. To enable EIP-191, you need
                                              to pass a custom `TxConfig` that has an implementation of
                                              `SignModeHandler` for EIP-191. The SDK may decide to fully support
                                              EIP-191 in the future.

                                              Since: cosmos-sdk 0.45.2
                                            title: mode is the signing mode of the single signer
                                            default: SIGN_MODE_UNSPECIFIED
                                            enum:
                                            - SIGN_MODE_UNSPECIFIED
                                            - SIGN_MODE_DIRECT
                                            - SIGN_MODE_TEXTUAL
                                            - SIGN_MODE_DIRECT_AUX
                                            - SIGN_MODE_LEGACY_AMINO_JSON
                                            - SIGN_MODE_EIP_191
                                        title: single represents a single signer
                                      multi:
                                        type: object
                                        properties:
                                          bitarray:
                                            type: object
                                            description: |-
                                              CompactBitArray is an implementation of a space efficient bit array.
                                              This is used to ensure that the encoded data takes up a minimal amount of
                                              space after proto encoding.
                                              This is not thread safe, and is not intended for concurrent usage.
                                            properties:
                                              extra_bits_stored:
                                                type: integer
                                                format: int64
                                              elems:
                                                type: string
                                                format: byte
                                            title: bitarray specifies which keys within the multisig are signing
                                          mode_infos:
                                            type: array
                                            title: |-
                                              mode_infos is the corresponding modes of the signers of the multisig
                                              which could include nested multisig public keys
                                            items:
                                              type: object
                                        title: Multi is the mode info for a multisig public key
                                  sequence:
                                    type: string
                                    description: |-
                                      sequence is the sequence of the account, which describes the
                                      number of committed transactions signed by a given address. It is used to
                                      prevent replay attacks.
                                    format: uint64
                            fee:
                              type: object
                              description: |-
                                Fee is the fee and gas limit for the transaction. The first signer is the
                                primary signer and the one which pays the fee. The fee can be calculated
                                based on the cost of evaluating the body and doing signature verification
                                of the signers. This can be estimated via simulation.
                              properties:
                                amount:
                                  type: array
                                  title: amount is the amount of coins to be paid as a fee
                                  items:
                                    type: object
                                    description: |-
                                      Coin defines a token with a denomination and an amount.

                                      NOTE: The amount field is an Int which implements the custom method
                                      signatures required by gogoproto.
                                    properties:
                                      denom:
                                        type: string
                                      amount:
                                        type: string
                                gas_limit:
                                  type: string
                                  format: uint64
                                  title: |-
                                    gas_limit is the maximum gas that can be used in transaction processing
                                    before an out of gas error occurs
                                payer:
                                  type: string
                                  description: |-
                                    if unset, the first signer is responsible for paying the fees. If set, the specified account must pay the fees.
                                    the payer must be a tx signer (and thus have signed this field in AuthInfo).
                                    setting this field does *not* change the ordering of required signers for the transaction.
                                granter:
                                  type: string
                                  title: |-
                                    if set, the fee payer (either the first signer or the value of the payer field) requests that a fee grant be used
                                    to pay fees instead of the fee payer's own balance. If an appropriate fee grant does not exist or the chain does
                                    not support fee grants, this will fail
                            tip:
                              type: object
                              description: |-
                                Tip is the optional tip used for transactions fees paid in another denom.

                                This field is ignored if the chain didn't enable tips, i.e. didn't add the
                                `TipDecorator` in its posthandler.

                                Since: cosmos-sdk 0.46
                              properties:
                                amount:
                                  type: array
                                  title: amount is the amount of the tip
                                  items:
                                    type: object
                                    description: |-
                                      Coin defines a token with a denomination and an amount.

                                      NOTE: The amount field is an Int which implements the custom method
                                      signatures required by gogoproto.
                                    properties:
                                      denom:
                                        type: string
                                      amount:
                                        type: string
                                tipper:
                                  type: string
                                  title: tipper is the address of the account paying for the tip
                        signatures:
                          type: array
                          description: |-
                            signatures is a list of signatures that matches the length and order of
                            AuthInfo's signer_infos to allow connecting signature meta information like
                            public key and signing mode by position.
                          items:
                            type: string
                            format: byte
