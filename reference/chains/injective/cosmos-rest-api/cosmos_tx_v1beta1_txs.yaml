                            실제로 팀들은 일반적으로 Any 컨텍스트에서 사용될 것으로 예상하는 모든 타입을 바이너리에 미리 컴파일합니다. 단, `http`, `https` 또는 스킴 없는 URL의 경우 다음과 같이 타입 URL을 메시지 정의에 매핑하는 타입 서버를 선택적으로 설정할 수 있습니다:

                            * 스킴이 제공되지 않으면 `https`로 가정합니다.
                            * URL에 대한 HTTP GET은 바이너리 형식의 [google.protobuf.Type][] 값을 반환하거나 오류를 발생시켜야 합니다.
                            * 애플리케이션은 URL을 기반으로 조회 결과를 캐시하거나 바이너리에 미리 컴파일하여 조회를 방지할 수 있습니다. 따라서 타입 변경 시 바이너리 호환성을 유지해야 합니다 (버전이 지정된 타입 이름을 사용하여 호환성 변경 관리).

                            참고: 이 기능은 현재 공식 protobuf 릴리스에서 사용 불가하며, type.googleapis.com으로 시작하는 타입 URL에는 사용되지 않습니다.

                            `http`, `https` (또는 빈 스킴) 이외의 스킴은 구현별 의미를 가질 수 있습니다.
                        value:
                          type: string
                          format: byte
                          description: 위에 지정된 타입의 유효한 직렬화 프로토콜 버퍼 값이어야 합니다.
                      description: |-
                        `Any` contains an arbitrary serialized protocol buffer message along with a
                        URL that describes the type of the serialized message.

                        Protobuf library provides support to pack/unpack Any values in the form
                        of utility functions or additional generated methods of the Any type.

                        Example 1: Pack and unpack a message in C++.

                            Foo foo = ...;
                            Any any;
                            any.PackFrom(foo);
                            ...
                            if (any.UnpackTo(&foo)) {
                              ...
                            }

                        Example 2: Pack and unpack a message in Java.

                            Foo foo = ...;
                            Any any = Any.pack(foo);
                            ...
                            if (any.is(Foo.class)) {
                              foo = any.unpack(Foo.class);
                            }
                            // or ...
                            if (any.isSameTypeAs(Foo.getDefaultInstance())) {
                              foo = any.unpack(Foo.getDefaultInstance());
                            }

                        Example 3: Pack and unpack a message in Python.

                            foo = Foo(...)
                            any = Any()
                            any.Pack(foo)
                            ...
                            if any.Is(Foo.DESCRIPTOR):
                              any.Unpack(foo)
                              ...

                        Example 4: Pack and unpack a message in Go

                             foo := &pb.Foo{...}
                             any, err := anypb.New(foo)
                             if err != nil {
                               ...
                             }
                             ...
                             foo := &pb.Foo{}
                             if err := any.UnmarshalTo(foo); err != nil {
                               ...
                             }

                        The pack methods provided by protobuf library will by default use
                        'type.googleapis.com/full.type.name' as the type URL and the unpack
                        methods only use the fully qualified type name after the last '/'
                        in the type URL, for example "foo.bar.com/x/y.z" will yield type
                        name "y.z".

                        JSON

                        The JSON representation of an `Any` value uses the regular
                        representation of the deserialized, embedded message, with an
                        additional field `@type` which contains the type URL. Example:

                            package google.profile;
                            message Person {
                              string first_name = 1;
                              string last_name = 2;
                            }

                            {
                              "@type": "type.googleapis.com/google.profile.Person",
                              "firstName": <string>,
                              "lastName": <string>
                            }

                        If the embedded message type is well-known and has a custom JSON
                        representation, that representation will be embedded adding a field
                        `value` which holds the custom JSON in addition to the `@type`
                        field. Example (for message [google.protobuf.Duration][]):

                            {
                              "@type": "type.googleapis.com/google.protobuf.Duration",
                              "value": "1.212s"
                            }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tx_bytes:
                  type: string
                  format: byte
                  description: tx_bytes is the raw transaction.
                mode:
                  type: string
                  enum:
                  - BROADCAST_MODE_UNSPECIFIED
                  - BROADCAST_MODE_BLOCK
                  - BROADCAST_MODE_SYNC
                  - BROADCAST_MODE_ASYNC
                  default: BROADCAST_MODE_UNSPECIFIED
                  description: |-
                    BroadcastMode specifies the broadcast mode for the TxService.Broadcast RPC
                    method.

                     - BROADCAST_MODE_UNSPECIFIED: zero-value for mode ordering
                     - BROADCAST_MODE_BLOCK: DEPRECATED: use BROADCAST_MODE_SYNC instead,
                    BROADCAST_MODE_BLOCK is not supported by the SDK from v0.47.x onwards.
                     - BROADCAST_MODE_SYNC: BROADCAST_MODE_SYNC defines a tx broadcasting mode where the client waits
                    for a CheckTx execution response only.
                     - BROADCAST_MODE_ASYNC: BROADCAST_MODE_ASYNC defines a tx broadcasting mode where the client
                    returns immediately.
              description: |-
                BroadcastTxRequest is the request type for the Service.BroadcastTxRequest
                RPC method.
        required: true
      security:
      - api_key: []
      summary: /cosmos/tx/v1beta1/txs
