info:
  title: Injective - cosmos_tx_v1beta1_txs
  version: 1.0.0
servers:
- url: https://rest-injective-mainnet.nodit.io
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
paths:
  /cosmos/tx/v1beta1/txs:
    get:
      description: GetTxsEvent fetches txs by event.
      operationId: cosmos_tx_v1beta1_txs
      tags:
      - tx
      responses:
        "200":
          description: Successful Response
          content:
            '*/*':
              schema:
                type: object
                description: |-
                  GetTxsEventResponse is the response type for the Service.TxsByEvents
                  RPC method.
                properties:
                  txs:
                    type: array
                    description: txs is the list of queried transactions.
                    items:
                      type: object
                      description: Tx is the standard type used for broadcasting transactions.
                      properties:
                        body:
                          type: object
                          description: TxBody is the body of a transaction that all signers sign over.
                          properties:
                            messages:
                              type: array
                              description: |-
                                messages is a list of messages to be executed. The required signers of
                                those messages define the number and order of elements in AuthInfo's
                                signer_infos and Tx's signatures. Each required signer address is added to
                                the list only the first time it occurs.
                                By convention, the first required signer (usually from the first message)
                                is referred to as the primary signer and pays the fee for the whole
                                transaction.
                              items:
                                type: object
                                description: |-
                                  `Any` contains an arbitrary serialized protocol buffer message along with a
                                  URL that describes the type of the serialized message.

                                  Protobuf library provides support to pack/unpack Any values in the form
                                  of utility functions or additional generated methods of the Any type.

                                  Example 1: Pack and unpack a message in C++.

                                      Foo foo = ...;
                                      Any any;
                                      any.PackFrom(foo);
                                      ...
                                      if (any.UnpackTo(&foo)) {
                                        ...
                                      }

                                  Example 2: Pack and unpack a message in Java.

                                      Foo foo = ...;
                                      Any any = Any.pack(foo);
                                      ...
                                      if (any.is(Foo.class)) {
                                        foo = any.unpack(Foo.class);
                                      }
                                      // or ...
                                      if (any.isSameTypeAs(Foo.getDefaultInstance())) {
                                        foo = any.unpack(Foo.getDefaultInstance());
                                      }

                                  Example 3: Pack and unpack a message in Python.

                                      foo = Foo(...)
                                      any = Any()
                                      any.Pack(foo)
                                      ...
                                      if any.Is(Foo.DESCRIPTOR):
                                        any.Unpack(foo)
                                        ...

                                  Example 4: Pack and unpack a message in Go

                                       foo := &pb.Foo{...}
                                       any, err := anypb.New(foo)
                                       if err != nil {
                                         ...
                                       }
                                       ...
                                       foo := &pb.Foo{}
                                       if err := any.UnmarshalTo(foo); err != nil {
                                         ...
