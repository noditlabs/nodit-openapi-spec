openapi: 3.1.0
info:
  title: Injective - NetInfo
  version: 1.0.0
servers:
- url: https://rpc-injective-mainnet.nodit.io
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
paths:
  /:
    post:
      security:
      - api_key: []
      operationId: net_info
      summary: NetInfo
      description: Retrieves network information.
      tags:
      - json-rpc-api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - jsonrpc
              - id
              - method
              properties:
                jsonrpc:
                  description: JSON-RPC protocol version. Always `2.0`.
                  type: string
                  const: "2.0"
                id:
                  description: Identifier of the request. Returned unchanged as `id` in the response.
                  type: integer
                method:
                  description: Name of the JSON-RPC method to call.
                  type: string
                  const: net_info
            example:
              jsonrpc: "2.0"
              id: 1
              method: net_info
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - jsonrpc
                - id
                - result
                properties:
                  jsonrpc:
                    description: JSON-RPC protocol version. Always `2.0`.
                    type: string
                    const: "2.0"
                  id:
                    description: The request ID, echoed back unchanged.
                    type: integer
                  result:
                    description: Result of the method call.
                    type: object
                    additionalProperties: false
                    properties:
                      listening:
                        description: '`true` if the node is listening for P2P connections.'
                        type: boolean
                      listeners:
                        description: P2P listener addresses.
                        type: array
                        items:
                          type: string
                      n_peers:
                        description: Number of connected peers.
                        type: string
                      peers:
                        description: Connected peers.
                        type: array
                        items:
                          type: object
                          additionalProperties: false
                          properties:
                            node_id:
                              description: Node ID of the peer.
                              type: string
                            url:
                              description: Address of the peer.
                              type: string
              example:
                jsonrpc: "2.0"
                id: 1
                result:
                  listening: true
                  listeners:
                  - Listener(@)
                  n_peers: "2"
                  peers:
                  - node_id: a8019df80d3d32e770e5b32cf98c68b6b16d1a1
                    url: tcp://a8019df80d3d32e770e5b32cf98c68b6b16d1a1@192.168.0.1:26656
                  - node_id: b9129ef91e4e43f881f6c43df99d7c7c27e2b2b
                    url: tcp://b9129ef91e4e43f881f6c43df99d7c7c27e2b2b@192.168.0.2:26656
