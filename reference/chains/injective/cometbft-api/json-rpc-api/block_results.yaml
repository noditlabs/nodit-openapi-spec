openapi: 3.1.0
info:
  title: Injective - BlockResults
  version: 1.0.0
servers:
- url: https://rpc-injective-mainnet.nodit.io
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
paths:
  /:
    post:
      security:
      - api_key: []
      operationId: block_results
      summary: BlockResults
      description: Retrieves the execution results at the specified block height. Returns the latest block results if height is omitted.
      tags:
      - json-rpc-api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - jsonrpc
              - id
              - method
              properties:
                jsonrpc:
                  description: JSON-RPC protocol version. Always `2.0`.
                  type: string
                  const: "2.0"
                id:
                  description: Identifier of the request. Returned unchanged as `id` in the response.
                  type: integer
                method:
                  description: Name of the JSON-RPC method to call.
                  type: string
                  const: block_results
                params:
                  description: Parameters passed to the method.
                  type: object
                  additionalProperties: false
                  properties:
                    height:
                      type: string
                      description: Target block height.
            example:
              jsonrpc: "2.0"
              id: 1
              method: block_results
              params:
                height: "1"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - jsonrpc
                - id
                - result
                properties:
                  jsonrpc:
                    description: JSON-RPC protocol version. Always `2.0`.
                    type: string
                    const: "2.0"
                  id:
                    description: The request ID, echoed back unchanged.
                    type: integer
                  result:
                    description: Result of the method call.
                    type: object
                    additionalProperties: false
                    properties:
                      height:
                        description: Block height.
                        type: string
                      total_gas_used:
                        description: Total gas used by all transactions in the block.
                        type: string
                      txs_results:
                        description: Execution results of each transaction in the block.
                        type: array
                        items:
                          type: object
                          additionalProperties: false
                          properties:
                            code:
                              description: Result code. `0` means success; any other value is an error.
                              type: string
                            data:
                              description: Data returned by transaction execution.
                              type: string
                            log:
                              description: Execution log message.
                              type: string
                            info:
                              description: Additional information.
                              type: string
                            gas_wanted:
                              description: Gas limit requested by the transaction.
                              type: string
                            gas_used:
                              description: Gas actually used.
                              type: string
                            events:
                              description: Events emitted during execution.
                              type: array
                              items:
                                type: object
                                additionalProperties: false
                                properties:
                                  type:
                                    description: Event type.
                                    type: string
                                  attributes:
                                    description: Event attributes (key-value pairs).
                                    type: array
                                    items:
                                      type: object
                                      additionalProperties: false
                                      properties:
                                        key:
                                          description: Attribute key.
                                          type: string
                                        value:
                                          description: Attribute value.
                                          type: string
                                        index:
                                          description: Whether the attribute is indexed.
                                          type: boolean
                            codespace:
                              description: Namespace of the result code.
                              type: string
                      begin_block_events:
                        description: Events emitted during BeginBlock.
                        type: array
                        items:
                          type: object
                          additionalProperties: false
                          properties:
                            type:
                              description: Event type.
                              type: string
                            attributes:
                              description: Event attributes (key-value pairs).
                              type: array
                              items:
                                type: object
                                additionalProperties: false
                                properties:
                                  key:
                                    description: Attribute key.
                                    type: string
                                  value:
                                    description: Attribute value.
                                    type: string
                                  index:
                                    description: Whether the attribute is indexed.
                                    type: boolean
                      end_block:
                        description: Events emitted during EndBlock.
                        type: array
                        items:
                          type: object
                          additionalProperties: false
                          properties:
                            type:
                              description: Event type.
                              type: string
                            attributes:
                              description: Event attributes (key-value pairs).
                              type: array
                              items:
                                type: object
                                additionalProperties: false
                                properties:
                                  key:
                                    description: Attribute key.
                                    type: string
                                  value:
                                    description: Attribute value.
                                    type: string
                                  index:
                                    description: Whether the attribute is indexed.
                                    type: boolean
                      validator_updates:
                        description: Validator set changes in this block.
                        type: array
                        items:
                          type: object
                          additionalProperties: false
                          properties:
                            pub_key:
                              description: Validator public key.
                              type: object
                              additionalProperties: false
                              properties:
                                type:
                                  description: Public key type (for example, `tendermint/PubKeyEd25519`).
                                  type: string
                                value:
                                  description: Public key value (Base64).
                                  type: string
                            power:
                              description: Voting power of the validator.
                              type: string
                      consensus_params_updates:
                        description: Consensus parameter changes in this block.
                        type: object
                        additionalProperties: false
                        properties:
                          block:
                            description: Block-related consensus parameters.
                            type: object
                            additionalProperties: false
                            properties:
                              max_bytes:
                                description: Maximum block size in bytes.
                                type: string
                              max_gas:
                                description: Maximum gas per block. `-1` means unlimited.
                                type: string
                              time_iota_ms:
                                description: Minimum time increment between blocks in milliseconds (legacy field).
                                type: string
                          evidence:
                            description: Evidence-related consensus parameters.
                            type: object
                            additionalProperties: false
                            properties:
                              max_age:
                                description: Maximum age of evidence, in blocks.
                                type: string
                          validator:
                            description: Validator-related consensus parameters.
                            type: object
                            additionalProperties: false
                            properties:
                              pub_key_types:
                                description: Public key types validators can use.
                                type: array
                                items:
                                  type: string
              example:
                jsonrpc: "2.0"
                id: 1
                result:
                  height: "1"
                  total_gas_used: "0"
                  txs_results: []
                  begin_block_events:
                  - type: transfer
                    attributes:
                    - key: recipient
                      value: cosmos1jv65s3grqf6v6jl3dp4t6c9t9rk99cd88lyufl
                      index: true
                  end_block: []
                  validator_updates: []
                  consensus_params_updates:
                    block:
                      max_bytes: "22020096"
                      max_gas: "-1"
                      time_iota_ms: "1000"
                    evidence:
                      max_age: "100000"
                    validator:
                      pub_key_types:
                      - ed25519
