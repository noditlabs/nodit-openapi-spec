                                  items:
                                    type: string
                                receipt_ids:
                                  type: array
                                  description: IDs of the receipts generated by this execution.
                                  items:
                                    $ref: '#/components/schemas/CryptoHash'
                                status:
                                  type: object
                                  description: Execution status. On success it contains `SuccessValue` (the base64-encoded return value) or `SuccessReceiptId` (the ID of the generated receipt); on failure it contains `Failure` (an object describing the cause). It is the string `Unknown` when the result is not known.
                                metadata:
                                  type: object
                                  description: 'Versioned execution metadata. Contains `version`, `gas_profile` (gas used per cost item), and `contracts` (version 4 and later: for each action, the contract attached to the receiver account just before the action ran).'
                            proof:
                              type: array
                              description: The Merkle path that verifies the outcome against the block's outcome root. Each item has a `hash` and a `direction` (`Left` or `Right`).
                              items:
                                type: object
                          description: The execution outcome of a single receipt.
