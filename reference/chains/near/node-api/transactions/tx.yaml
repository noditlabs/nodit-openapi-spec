                    outcome:
                      executor_id: game.hot.tg
                      gas_burnt: 3056367183878
                      logs:
                      - EVENT_JSON:{"standard":"nep141","version":"1.0.0","event":"ft_mint","data":[{"owner_id":"game.hot.tg","amount":"22503","memo":"Gas fee for claim"}]}
                      - 'L2 claim 496938482509560, earned: 22503'
                      metadata:
                        contracts:
                        - local: GH7Zs8zab1YHiTkdveDj18Uu2je6fpiXcHmXkqYNCuew
                        gas_profile:
                        - cost: BASE
                          cost_category: WASM_HOST_COST
                          gas_used: "21181448880"
                        - cost: CONTRACT_LOADING_BASE
                          cost_category: WASM_HOST_COST
                          gas_used: "35445963"
                        version: 4
                      receipt_ids:
                      - 2PMoU3sXmsjgUHrh8HoBo7PZmDUJUGoD8j68CzVCR9Si
                      status:
                        SuccessValue: ""
                      tokens_burnt: "305636718387800000000"
                    proof:
                    - direction: Right
                      hash: 4gEhQVdr1xbfcof2Ps3gwPjPFrMfD9fwdjkc2UedxJJk
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                    description: JSON-RPC version
                  id:
                    type: string
                    description: Request ID
                  result:
                    type: object
                    properties:
                      final_execution_status:
                        type: string
                        description: The execution milestone the transaction has reached. Values have the same meaning as the `wait_until` request parameter.
                        enum:
                        - NONE
                        - INCLUDED
                        - EXECUTED_OPTIMISTIC
                        - INCLUDED_FINAL
                        - EXECUTED
                        - FINAL
                      status:
                        type: object
                        description: The final execution result of the transaction. On success it contains `SuccessValue` (the base64-encoded return value, or an empty string if nothing is returned); on failure it contains `Failure` (an object describing the cause). It is the string `NotStarted` if the transaction has not yet been converted to a receipt, and `Started` while execution is in progress.
                      transaction:
                        type: object
                        description: The signed transaction as submitted.
                        properties:
                          signer_id:
                            $ref: '#/components/schemas/AccountId'
                          public_key:
                            $ref: '#/components/schemas/PublicKey'
                          nonce:
                            type: integer
                            description: The nonce of the access key used for signing.
                          receiver_id:
                            $ref: '#/components/schemas/AccountId'
                          actions:
                            type: array
                            description: The actions in the transaction. Each item is an object keyed by the action name, or a string such as `CreateAccount`. The action name is one of `CreateAccount`, `DeployContract`, `FunctionCall`, `Transfer`, `Stake`, `AddKey`, `DeleteKey`, `DeleteAccount`, `Delegate`, `DelegateV2`, `DeployGlobalContract`, `DeployGlobalContractByAccountId`, `UseGlobalContract`, `UseGlobalContractByAccountId`, `DeterministicStateInit`, `TransferToGasKey`, `WithdrawFromGasKey`, `UniversalStateInit`.
                            items:
                              type: object
                          priority_fee:
                            type: integer
                            description: Deprecated; retained for backward compatibility.
                          signature:
                            type: string
                            description: Transaction signature (base58 with an `ed25519:` or `secp256k1:` prefix)
                          hash:
                            $ref: '#/components/schemas/CryptoHash'
                      transaction_outcome:
                        type: object
                        properties:
                          id:
                            $ref: '#/components/schemas/CryptoHash'
                          block_hash:
                            $ref: '#/components/schemas/CryptoHash'
                          outcome:
                            type: object
                            description: The execution outcome of the transaction.
                            properties:
                              executor_id:
                                type: string
                                description: 'The account ID where execution took place: `signer_id` for a transaction, the receiver account for a receipt.'
                              gas_burnt:
                                type: integer
                                description: The amount of gas burnt by the execution.
                              tokens_burnt:
                                type: string
                                description: The amount of tokens burnt for the gas used (yoctoNEAR, decimal string)
                              logs:
                                type: array
                                description: Logs emitted during execution. NEP standard events are JSON strings prefixed with `EVENT_JSON:`.
                                items:
                                  type: string
                              receipt_ids:
                                type: array
                                description: IDs of the receipts generated by this execution.
                                items:
                                  $ref: '#/components/schemas/CryptoHash'
                              status:
                                type: object
                                description: Execution status. On success it contains `SuccessValue` (the base64-encoded return value) or `SuccessReceiptId` (the ID of the generated receipt); on failure it contains `Failure` (an object describing the cause). It is the string `Unknown` when the result is not known.
                              metadata:
                                type: object
                                description: 'Versioned execution metadata. Contains `version`, `gas_profile` (gas used per cost item), and `contracts` (version 4 and later: for each action, the contract attached to the receiver account just before the action ran).'
                          proof:
                            type: array
                            description: The Merkle path that verifies the outcome against the block's outcome root. Each item has a `hash` and a `direction` (`Left` or `Right`).
                            items:
                              type: object
                        description: The execution outcome of the transaction itself. The transaction is converted to the first receipt, and `id` is the transaction hash.
                      receipts_outcome:
                        type: array
                        description: Execution outcomes of the receipts that followed from the transaction. Each item's `id` is a receipt ID, and the structure is the same as `transaction_outcome`.
                        items:
                          type: object
                          properties:
                            id:
                              $ref: '#/components/schemas/CryptoHash'
                            block_hash:
                              $ref: '#/components/schemas/CryptoHash'
                            outcome:
                              type: object
                              description: The execution outcome of the receipt.
                              properties:
                                executor_id:
                                  type: string
                                  description: 'The account ID where execution took place: `signer_id` for a transaction, the receiver account for a receipt.'
                                gas_burnt:
                                  type: integer
                                  description: The amount of gas burnt by the execution.
                                tokens_burnt:
                                  type: string
                                  description: The amount of tokens burnt for the gas used (yoctoNEAR, decimal string)
