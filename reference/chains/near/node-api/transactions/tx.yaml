openapi: 3.1.0
info:
  title: Near - tx
  version: 1.0.0
servers:
- url: https://near-mainnet.nodit.io
  description: NEAR Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  schemas:
    AccountId:
      type: string
      description: NEAR account ID. A human-readable name (e.g. `wrap.near`) or a 64-character hex implicit account ID.
      example: wrap.near
    PublicKey:
      type: string
      description: Base58-encoded public key prefixed with `ed25519:` or `secp256k1:`.
      example: ed25519:168vdqFUxij2yvsxYgAGoykJMX7tgrPKVCH484A8nHP
    CryptoHash:
      type: string
      description: Base58-encoded 32-byte hash (block hash, chunk hash, transaction hash, etc.).
      example: 8EjuQRnAJiWkRmqxfexQFJWXXonuSMbz5AZziJLCWnWS
    RpcError:
      type: object
      description: |-
        NEAR JSON-RPC error object. Request format errors are returned with HTTP 400, and processing errors with HTTP 200.
        Use `cause.name` to identify the specific cause (e.g. `UNKNOWN_BLOCK`, `UNKNOWN_ACCOUNT`, `TIMEOUT_ERROR`).
      properties:
        name:
          type: string
          description: Error class. `REQUEST_VALIDATION_ERROR` (invalid request), `HANDLER_ERROR` (processing error), `INTERNAL_ERROR` (node internal error)
          enum:
          - REQUEST_VALIDATION_ERROR
          - HANDLER_ERROR
          - INTERNAL_ERROR
        cause:
          type: object
          description: The specific cause of the error.
          properties:
            name:
              type: string
              description: Name of the error cause (e.g. `UNKNOWN_BLOCK`, `UNKNOWN_ACCOUNT`, `PARSE_ERROR`)
            info:
              type: object
              description: Additional information about the error (block hash, height, account ID, etc.)
        code:
          type: integer
          description: Legacy JSON-RPC error code (e.g. `-32000` server error, `-32700` parse error, `-32601` method not found)
        message:
          type: string
          description: Legacy error message
        data:
          type: string
          description: Legacy error details
  responses:
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - NO_AUTHENTICATION_FOUND
                - AUTHENTICATION_FAILED
                description: Code to identify the cause of authentication failure
              message:
                type: string
                description: Detailed message including the cause of authentication failure
            required:
            - code
            - message
          examples:
            NO_AUTHENTICATION_FOUND:
              summary: The request does not include authentication (API Key)
              value:
                code: NO_AUTHENTICATION_FOUND
                message: No authentication found.
            AUTHENTICATION_FAILED:
              summary: The authentication (API Key) is invalid
              value:
                code: AUTHENTICATION_FAILED
                message: Authentication failed.
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - PERMISSION_DENIED
                description: Code indicating permission denied
              message:
                type: string
                description: Detailed message including information about the denied resource
            required:
            - code
            - message
          examples:
            PERMISSION_DENIED:
              summary: The request accesses a resource it is not authorized for
              value:
                code: PERMISSION_DENIED
                message: Permission denied
    "429":
      description: Too Many Requests
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_MANY_REQUESTS
                - EXCEEDED_QUOTA_LIMIT
                description: Code identifying the cause of the request limit exceeded
              message:
                type: string
                description: Detailed message including the exceeded limit type and allowed threshold
            required:
            - code
            - message
          examples:
            TOO_MANY_REQUESTS:
              summary: The rate limit was exceeded
              value:
                code: TOO_MANY_REQUESTS
                message: Too many requests
            EXCEEDED_QUOTA_LIMIT:
              summary: The quota limit was exceeded
              value:
                code: EXCEEDED_QUOTA_LIMIT
                message: Exceeded quota limit
    "500":
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - INTERNAL_SERVER_ERROR
                - INTERRUPTED
                description: Code to identify the cause of the internal server error
              message:
                type: string
                description: Detailed message including the cause of the server error
            required:
            - code
            - message
          examples:
            INTERNAL_SERVER_ERROR:
              summary: An internal server error occurred
              value:
                code: INTERNAL_SERVER_ERROR
                message: Internal server error
            INTERRUPTED:
              summary: Processing failed temporarily due to server load
              value:
                code: INTERRUPTED
                message: Request interrupted
paths:
  /:
    post:
      security:
      - api_key: []
      operationId: near-tx
      summary: tx
      description: |
        Returns a transaction's execution status and result, looked up by transaction hash and signer account.

        `tx` is the method for checking the status of a transaction you have already sent. The `tx_status` and `broadcast_tx_sync` methods are not available. Specify `tx_hash` together with `sender_account_id` (the transaction signer); instead of `tx_hash`, you can also pass the signed transaction itself as `signed_tx_base64`. If `wait_until` is omitted, the call waits until the transaction reaches `EXECUTED_OPTIMISTIC`. With `NONE`, it returns the current status immediately without waiting. The node waits up to 10 seconds for the requested milestone and returns `TIMEOUT_ERROR` if it is not reached in time. If the node has no record of the transaction, it returns `UNKNOWN_TRANSACTION`.
      x-seo-description: Check a NEAR transaction's status by hash and sender with the tx method, returning its execution status, outcome, and receipt outcomes.
      tags:
      - transactions
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - jsonrpc
              - id
              - method
              - params
              properties:
                jsonrpc:
                  type: string
                  example: "2.0"
                id:
                  type: string
                  description: Request ID. Any string; it is returned unchanged in the response.
                  example: dontcare
                method:
                  type: string
                  example: tx
                params:
                  type: object
                  description: Specifies the transaction to look up and the milestone to wait for.
                  required:
                  - tx_hash
                  - sender_account_id
                  properties:
                    tx_hash:
                      $ref: '#/components/schemas/CryptoHash'
                    sender_account_id:
                      $ref: '#/components/schemas/AccountId'
                    wait_until:
                      type: string
                      description: |-
                        The execution milestone to wait for before returning a response. Defaults to `EXECUTED_OPTIMISTIC`. Each value further down is a later milestone.
                        - `NONE`: The transaction is waiting to be included in a block.
                        - `INCLUDED`: The transaction is included in a block (the block may not be finalized yet).
                        - `EXECUTED_OPTIMISTIC`: Included in a block, and all non-refund receipts have executed (the blocks may not be finalized yet).
                        - `INCLUDED_FINAL`: The transaction is included in a finalized block.
                        - `EXECUTED`: Included in a finalized block, and all non-refund receipts have executed.
                        - `FINAL`: Included in a finalized block, and all receipts, including refunds, are finalized.
                      enum:
                      - NONE
                      - INCLUDED
                      - EXECUTED_OPTIMISTIC
                      - INCLUDED_FINAL
                      - EXECUTED
                      - FINAL
                      default: EXECUTED_OPTIMISTIC
                      example: EXECUTED_OPTIMISTIC
              example:
                jsonrpc: "2.0"
                id: dontcare
                method: tx
                params:
                  tx_hash: 5VPiJGhxiKsBk8a8W3NyVPTkEG3QY9y5iZ9PsQpAyYE9
                  sender_account_id: 0here.tg
                  wait_until: EXECUTED_OPTIMISTIC
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              example:
                jsonrpc: "2.0"
                id: dontcare
                result:
                  final_execution_status: FINAL
                  status:
                    SuccessValue: ""
                  transaction:
                    actions:
                    - Delegate:
                        delegate_action:
                          actions:
                          - FunctionCall:
                              args: eyJjaGFyZ2VfZ2FzX2ZlZSI6dHJ1ZSwic2lnbmF0dXJlIjoiMWY3MWMxMzk5OTFjNGUwMDRmNGNhZWJjMjM4NDIyZTk0MzMzNmQwMGNiNzlhZmNjNDg5M2UzZTE2OWI2OWE3NCIsIm1pbmluZ190aW1lIjoiNDUwMDciLCJtYXhfdHMiOiIxNzkyNDg4ODgyNzM2ODgxOTIwIn0=
                              deposit: "0"
                              gas: 20000000000000
                              method_name: l2_claim
                          max_block_height: 221185293
                          nonce: 117245306001780
                          public_key: ed25519:GxKiWi42sV92ijqade5AoTBo9vUpEWoZKUw8i2BmuwaE
