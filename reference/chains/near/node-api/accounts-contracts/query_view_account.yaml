openapi: 3.1.0
info:
  title: Near - view_account
  version: 1.0.0
servers:
- url: https://near-mainnet.nodit.io
  description: NEAR Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  schemas:
    AccountId:
      type: string
      description: NEAR account ID. A human-readable name (e.g. `wrap.near`) or a 64-character hex implicit account ID.
      example: wrap.near
    PublicKey:
      type: string
      description: Base58-encoded public key prefixed with `ed25519:` or `secp256k1:`.
      example: ed25519:168vdqFUxij2yvsxYgAGoykJMX7tgrPKVCH484A8nHP
    CryptoHash:
      type: string
      description: Base58-encoded 32-byte hash (block hash, chunk hash, transaction hash, etc.).
      example: 8EjuQRnAJiWkRmqxfexQFJWXXonuSMbz5AZziJLCWnWS
    BlockId:
      description: |-
        Specifies the block to query by block height (integer) or block hash (base58 string).
        Cannot be used together with `finality`.
      oneOf:
      - title: Block Height
        type: integer
        example: 220785385
      - title: Block Hash
        type: string
        example: 8EjuQRnAJiWkRmqxfexQFJWXXonuSMbz5AZziJLCWnWS
    Finality:
      type: string
      description: |-
        Specifies the block finality. Cannot be used together with `block_id`.
        - `optimistic`: the latest block the node has received (may be reorganized)
        - `near-final`: a Doomslug-final block (not reverted in most cases)
        - `final`: a fully finalized block
      enum:
      - optimistic
      - near-final
      - final
      example: final
    BlockHeight:
      type: integer
      description: Block height.
      example: 220785385
    Amount:
      type: string
      description: Amount in yoctoNEAR as a decimal string (1 NEAR = 10^24 yoctoNEAR).
      example: "100000000"
    RpcError:
      type: object
      description: |-
        NEAR JSON-RPC error object. Request format errors are returned with HTTP 400, and processing errors with HTTP 200.
        Use `cause.name` to identify the specific cause (e.g. `UNKNOWN_BLOCK`, `UNKNOWN_ACCOUNT`, `TIMEOUT_ERROR`).
      properties:
        name:
          type: string
          description: Error class. `REQUEST_VALIDATION_ERROR` (invalid request), `HANDLER_ERROR` (processing error), `INTERNAL_ERROR` (node internal error)
          enum:
          - REQUEST_VALIDATION_ERROR
          - HANDLER_ERROR
          - INTERNAL_ERROR
        cause:
          type: object
          description: The specific cause of the error.
          properties:
            name:
              type: string
              description: Name of the error cause (e.g. `UNKNOWN_BLOCK`, `UNKNOWN_ACCOUNT`, `PARSE_ERROR`)
            info:
              type: object
              description: Additional information about the error (block hash, height, account ID, etc.)
        code:
          type: integer
          description: Legacy JSON-RPC error code (e.g. `-32000` server error, `-32700` parse error, `-32601` method not found)
        message:
          type: string
          description: Legacy error message
        data:
          type: string
          description: Legacy error details
  responses:
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - NO_AUTHENTICATION_FOUND
                - AUTHENTICATION_FAILED
                description: Code to identify the cause of authentication failure
              message:
                type: string
                description: Detailed message including the cause of authentication failure
            required:
            - code
            - message
          examples:
            NO_AUTHENTICATION_FOUND:
              summary: The request does not include authentication (API Key)
              value:
                code: NO_AUTHENTICATION_FOUND
                message: No authentication found.
            AUTHENTICATION_FAILED:
              summary: The authentication (API Key) is invalid
              value:
                code: AUTHENTICATION_FAILED
                message: Authentication failed.
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - PERMISSION_DENIED
                description: Code indicating permission denied
              message:
                type: string
                description: Detailed message including information about the denied resource
            required:
            - code
            - message
          examples:
            PERMISSION_DENIED:
              summary: The request accesses a resource it is not authorized for
              value:
                code: PERMISSION_DENIED
                message: Permission denied
    "429":
      description: Too Many Requests
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_MANY_REQUESTS
                - EXCEEDED_QUOTA_LIMIT
                description: Code identifying the cause of the request limit exceeded
              message:
                type: string
                description: Detailed message including the exceeded limit type and allowed threshold
            required:
            - code
            - message
          examples:
            TOO_MANY_REQUESTS:
              summary: The rate limit was exceeded
              value:
                code: TOO_MANY_REQUESTS
                message: Too many requests
            EXCEEDED_QUOTA_LIMIT:
              summary: The quota limit was exceeded
              value:
                code: EXCEEDED_QUOTA_LIMIT
                message: Exceeded quota limit
    "500":
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - INTERNAL_SERVER_ERROR
                - INTERRUPTED
                description: Code to identify the cause of the internal server error
              message:
                type: string
                description: Detailed message including the cause of the server error
            required:
            - code
            - message
          examples:
            INTERNAL_SERVER_ERROR:
              summary: An internal server error occurred
              value:
                code: INTERNAL_SERVER_ERROR
                message: Internal server error
            INTERRUPTED:
              summary: Processing failed temporarily due to server load
              value:
                code: INTERRUPTED
                message: Request interrupted
paths:
  /:
    post:
      security:
      - api_key: []
      operationId: near-query_view_account
      summary: view_account
      description: |
        Returns an account's balance, the amount locked for staking, storage usage, and the hash of its deployed contract code.

        Call the `query` method with `request_type: "view_account"`. Querying an account that does not exist returns the `UNKNOWN_ACCOUNT` error.
      x-seo-description: View a NEAR account's balance, locked stake, storage usage, and deployed contract code hash with the query method (view_account).
      tags:
      - accounts-contracts
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - jsonrpc
              - id
              - method
              - params
              properties:
                jsonrpc:
                  type: string
                  example: "2.0"
                id:
                  type: string
                  description: Request ID. Any string; it is returned unchanged in the response.
                  example: dontcare
                method:
                  type: string
                  example: query
                params:
                  type: object
                  description: Query parameters. Specify the point in time with either `finality` or `block_id`.
                  required:
                  - request_type
                  - account_id
                  properties:
                    request_type:
                      type: string
                      description: Query type. Fixed to `view_account` for account lookups.
                      enum:
                      - view_account
                      example: view_account
                    finality:
                      $ref: '#/components/schemas/Finality'
                    block_id:
                      $ref: '#/components/schemas/BlockId'
                    account_id:
                      $ref: '#/components/schemas/AccountId'
              example:
                jsonrpc: "2.0"
                id: dontcare
                method: query
                params:
                  request_type: view_account
                  finality: final
                  account_id: wrap.near
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              example:
                jsonrpc: "2.0"
                id: dontcare
                result:
                  amount: "35723815013379603615441870164676"
                  locked: "0"
                  code_hash: DL2f5xmZ44cQRP6vBMt94rvseH5d5KKnAGis2WkTAsh1
                  storage_usage: 166761807
                  storage_paid_at: 0
                  block_height: 220785361
                  block_hash: AyJijzid9yDZcywK9gqC6UHewKxD8msrzJiMtBjw1Q8K
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                    description: JSON-RPC version
                  id:
                    type: string
                    description: Request ID
                  result:
                    type: object
                    properties:
                      amount:
                        type: string
                        description: Liquid (non-staked) balance (yoctoNEAR, decimal string; 1 NEAR = 10^24 yoctoNEAR)
                      locked:
                        type: string
                        description: Amount locked for staking (yoctoNEAR, decimal string)
                      code_hash:
                        type: string
                        description: Hash of the deployed contract code (base58). `11111111111111111111111111111111` for accounts without a contract.
                      global_contract_hash:
                        type: string
                        description: Code hash (base58) of the global contract when the account uses one referenced by hash. Absent otherwise.
                      global_contract_account_id:
                        type: string
                        description: Account ID of the global contract when the account uses one referenced by account ID. Absent otherwise.
                      storage_usage:
                        type: integer
                        description: Storage used by the account (bytes)
                      storage_paid_at:
                        type: integer
                        description: Deprecated field; always `0`.
                      state:
                        type: string
                        description: Whether the account is initialized. Present only for uninitialized universal accounts that have no access keys, code, or data yet; absent for initialized accounts.
                      bootstrap_nonce:
                        type: integer
                        description: The nonce an uninitialized account must use for its first transaction (a self-signed state init). Present only while the account is uninitialized.
                      block_height:
                        $ref: '#/components/schemas/BlockHeight'
                      block_hash:
                        $ref: '#/components/schemas/CryptoHash'
                  error:
                    $ref: '#/components/schemas/RpcError'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
