openapi: 3.1.0
info:
  title: Near - view_access_key
  version: 1.0.0
servers:
- url: https://near-mainnet.nodit.io
  description: NEAR Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  schemas:
    AccountId:
      type: string
      description: NEAR account ID. A human-readable name (e.g. `wrap.near`) or a 64-character hex implicit account ID.
      example: wrap.near
    PublicKey:
      type: string
      description: Base58-encoded public key prefixed with `ed25519:` or `secp256k1:`.
      example: ed25519:168vdqFUxij2yvsxYgAGoykJMX7tgrPKVCH484A8nHP
    CryptoHash:
      type: string
      description: Base58-encoded 32-byte hash (block hash, chunk hash, transaction hash, etc.).
      example: 8EjuQRnAJiWkRmqxfexQFJWXXonuSMbz5AZziJLCWnWS
    BlockId:
      description: |-
        Specifies the block to query by block height (integer) or block hash (base58 string).
        Cannot be used together with `finality`.
      oneOf:
      - title: Block Height
        type: integer
        example: 220785385
      - title: Block Hash
        type: string
        example: 8EjuQRnAJiWkRmqxfexQFJWXXonuSMbz5AZziJLCWnWS
    Finality:
      type: string
      description: |-
        Specifies the block finality. Cannot be used together with `block_id`.
        - `optimistic`: the latest block the node has received (may be reorganized)
        - `near-final`: a Doomslug-final block (not reverted in most cases)
        - `final`: a fully finalized block
      enum:
      - optimistic
      - near-final
      - final
      example: final
    BlockHeight:
      type: integer
      description: Block height.
      example: 220785385
    Amount:
      type: string
      description: Amount in yoctoNEAR as a decimal string (1 NEAR = 10^24 yoctoNEAR).
      example: "100000000"
    RpcError:
      type: object
      description: |-
        NEAR JSON-RPC error object. Request format errors are returned with HTTP 400, and processing errors with HTTP 200.
        Use `cause.name` to identify the specific cause (e.g. `UNKNOWN_BLOCK`, `UNKNOWN_ACCOUNT`, `TIMEOUT_ERROR`).
      properties:
        name:
          type: string
          description: Error class. `REQUEST_VALIDATION_ERROR` (invalid request), `HANDLER_ERROR` (processing error), `INTERNAL_ERROR` (node internal error)
          enum:
          - REQUEST_VALIDATION_ERROR
          - HANDLER_ERROR
          - INTERNAL_ERROR
        cause:
          type: object
          description: The specific cause of the error.
          properties:
            name:
              type: string
              description: Name of the error cause (e.g. `UNKNOWN_BLOCK`, `UNKNOWN_ACCOUNT`, `PARSE_ERROR`)
            info:
              type: object
              description: Additional information about the error (block hash, height, account ID, etc.)
        code:
          type: integer
          description: Legacy JSON-RPC error code (e.g. `-32000` server error, `-32700` parse error, `-32601` method not found)
        message:
          type: string
          description: Legacy error message
        data:
          type: string
          description: Legacy error details
  responses:
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - NO_AUTHENTICATION_FOUND
                - AUTHENTICATION_FAILED
                description: Code to identify the cause of authentication failure
              message:
                type: string
                description: Detailed message including the cause of authentication failure
            required:
            - code
            - message
          examples:
            NO_AUTHENTICATION_FOUND:
              summary: The request does not include authentication (API Key)
              value:
                code: NO_AUTHENTICATION_FOUND
                message: No authentication found.
            AUTHENTICATION_FAILED:
              summary: The authentication (API Key) is invalid
              value:
                code: AUTHENTICATION_FAILED
                message: Authentication failed.
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - PERMISSION_DENIED
                description: Code indicating permission denied
              message:
                type: string
                description: Detailed message including information about the denied resource
            required:
            - code
            - message
          examples:
            PERMISSION_DENIED:
              summary: The request accesses a resource it is not authorized for
              value:
                code: PERMISSION_DENIED
                message: Permission denied
    "429":
      description: Too Many Requests
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_MANY_REQUESTS
                - EXCEEDED_QUOTA_LIMIT
                description: Code identifying the cause of the request limit exceeded
              message:
                type: string
                description: Detailed message including the exceeded limit type and allowed threshold
            required:
            - code
            - message
          examples:
            TOO_MANY_REQUESTS:
              summary: The rate limit was exceeded
              value:
                code: TOO_MANY_REQUESTS
                message: Too many requests
            EXCEEDED_QUOTA_LIMIT:
              summary: The quota limit was exceeded
              value:
                code: EXCEEDED_QUOTA_LIMIT
                message: Exceeded quota limit
    "500":
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - INTERNAL_SERVER_ERROR
                - INTERRUPTED
                description: Code to identify the cause of the internal server error
              message:
                type: string
                description: Detailed message including the cause of the server error
            required:
            - code
            - message
          examples:
            INTERNAL_SERVER_ERROR:
              summary: An internal server error occurred
              value:
                code: INTERNAL_SERVER_ERROR
                message: Internal server error
            INTERRUPTED:
              summary: Processing failed temporarily due to server load
              value:
                code: INTERRUPTED
                message: Request interrupted
paths:
  /:
    post:
      security:
      - api_key: []
      operationId: near-query_view_access_key
      summary: view_access_key
      description: |
        Returns the current nonce and permission (full access, function call, or gas key) of a single access key registered on an account. Use it to pick the next nonce before signing a transaction or to check what a key is allowed to do.

        Call the `query` method with `request_type: "view_access_key"`, passing `account_id` and `public_key`. If the public key is not registered on the account, it returns the `UNKNOWN_ACCESS_KEY` error; querying an account that does not exist returns the `UNKNOWN_ACCOUNT` error.
      x-seo-description: Look up a single NEAR access key's current nonce and permission (full access, function call, or gas key) for an account using the query method (view_access_key).
      tags:
      - access-keys
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - jsonrpc
              - id
              - method
              - params
              properties:
                jsonrpc:
                  type: string
                  example: "2.0"
                id:
                  type: string
                  description: Request ID. Any string; it is returned unchanged in the response.
                  example: dontcare
                method:
                  type: string
                  example: query
                params:
                  type: object
                  description: Query parameters. Specify the point in time with either `finality` or `block_id`.
                  required:
                  - request_type
                  - account_id
                  - public_key
                  properties:
                    request_type:
                      type: string
                      description: Query type. Fixed to `view_access_key` for looking up a single access key.
                      enum:
                      - view_access_key
                      example: view_access_key
                    finality:
                      $ref: '#/components/schemas/Finality'
                    block_id:
                      $ref: '#/components/schemas/BlockId'
                    account_id:
                      $ref: '#/components/schemas/AccountId'
                    public_key:
                      $ref: '#/components/schemas/PublicKey'
              example:
                jsonrpc: "2.0"
                id: dontcare
                method: query
                params:
                  request_type: view_access_key
                  finality: final
                  account_id: relay.aurora
                  public_key: ed25519:168vdqFUxij2yvsxYgAGoykJMX7tgrPKVCH484A8nHP
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              example:
                jsonrpc: "2.0"
                id: dontcare
                result:
                  nonce: 65790930078045
                  permission: FullAccess
                  block_height: 220785373
                  block_hash: 5N3Ea8upbYjawfAEV3inEa5bXG3MxPDMC8jtobdYLG8X
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                    description: JSON-RPC version
                  id:
                    type: string
                    description: Request ID
                  result:
                    type: object
                    properties:
                      nonce:
                        type: integer
                        description: Current nonce of the key. The next transaction signed with this key must use a nonce greater than this value.
                      permission:
                        description: |-
                          Access key permission. The format depends on the key type.
                          - `"FullAccess"`: a key that can perform any action on the account (string)
                          - `{"FunctionCall": {...}}`: a key that can only call methods on the specified contract
                          - `{"GasKeyFullAccess": {...}}`: a gas key that can perform any action (an access key prefunded with NEAR to pay for gas)
                          - `{"GasKeyFunctionCall": {...}}`: a gas key that can only make function calls
                        oneOf:
                        - title: FullAccess
                          type: string
                          enum:
                          - FullAccess
                        - title: FunctionCall
                          type: object
                          properties:
                            FunctionCall:
                              type: object
                              properties:
                                allowance:
                                  type: string
                                  nullable: true
                                  description: Gas fee allowance this key can spend (yoctoNEAR, decimal string). `null` means unlimited.
                                receiver_id:
                                  type: string
                                  description: Contract account ID this key can call
                                method_names:
                                  type: array
                                  description: Method names this key can call. An empty array allows calling any method on `receiver_id`.
                                  items:
                                    type: string
                        - title: GasKeyFullAccess
                          type: object
                          properties:
                            GasKeyFullAccess:
                              type: object
                              properties:
                                balance:
                                  type: string
                                  description: Balance funded to the gas key (yoctoNEAR, decimal string)
                                num_nonces:
                                  type: integer
                                  description: Number of parallel nonce lanes of the gas key (0–65535)
                        - title: GasKeyFunctionCall
                          type: object
                          properties:
                            GasKeyFunctionCall:
                              type: object
                              description: An object with the same `allowance`, `receiver_id`, and `method_names` as `FunctionCall`, plus the gas key's `balance` and `num_nonces`.
                              properties:
                                balance:
                                  type: string
                                  description: Balance funded to the gas key (yoctoNEAR, decimal string)
                                num_nonces:
                                  type: integer
                                  description: Number of parallel nonce lanes of the gas key (0–65535)
                                allowance:
                                  type: string
                                  nullable: true
                                  description: Gas fee allowance this key can spend (yoctoNEAR, decimal string). `null` means unlimited.
                                receiver_id:
                                  type: string
                                  description: Contract account ID this key can call
                                method_names:
                                  type: array
                                  description: Method names this key can call. An empty array allows calling any method on `receiver_id`.
                                  items:
                                    type: string
                      block_height:
                        $ref: '#/components/schemas/BlockHeight'
                      block_hash:
                        $ref: '#/components/schemas/CryptoHash'
                  error:
                    $ref: '#/components/schemas/RpcError'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
