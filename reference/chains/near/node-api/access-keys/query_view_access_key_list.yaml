openapi: 3.1.0
info:
  title: Near - view_access_key_list
  version: 1.0.0
servers:
- url: https://near-mainnet.nodit.io
  description: NEAR Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  schemas:
    AccountId:
      type: string
      description: NEAR account ID. A human-readable name (e.g. `wrap.near`) or a 64-character hex implicit account ID.
      example: wrap.near
    CryptoHash:
      type: string
      description: Base58-encoded 32-byte hash (block hash, chunk hash, transaction hash, etc.).
      example: 8EjuQRnAJiWkRmqxfexQFJWXXonuSMbz5AZziJLCWnWS
    BlockId:
      description: |-
        Specifies the block to query by block height (integer) or block hash (base58 string).
        Cannot be used together with `finality`.
      oneOf:
      - title: Block Height
        type: integer
        example: 220785385
      - title: Block Hash
        type: string
        example: 8EjuQRnAJiWkRmqxfexQFJWXXonuSMbz5AZziJLCWnWS
    Finality:
      type: string
      description: |-
        Specifies the block finality. Cannot be used together with `block_id`.
        - `optimistic`: the latest block the node has received (may be reorganized)
        - `near-final`: a Doomslug-final block (not reverted in most cases)
        - `final`: a fully finalized block
      enum:
      - optimistic
      - near-final
      - final
      example: final
    BlockHeight:
      type: integer
      description: Block height.
      example: 220785385
    RpcError:
      type: object
      description: |-
        NEAR JSON-RPC error object. Request format errors are returned with HTTP 400, and processing errors with HTTP 200.
        Use `cause.name` to identify the specific cause (e.g. `UNKNOWN_BLOCK`, `UNKNOWN_ACCOUNT`, `TIMEOUT_ERROR`).
      properties:
        name:
          type: string
          description: Error class. `REQUEST_VALIDATION_ERROR` (invalid request), `HANDLER_ERROR` (processing error), `INTERNAL_ERROR` (node internal error)
          enum:
          - REQUEST_VALIDATION_ERROR
          - HANDLER_ERROR
          - INTERNAL_ERROR
        cause:
          type: object
          description: The specific cause of the error.
          properties:
            name:
              type: string
              description: Name of the error cause (e.g. `UNKNOWN_BLOCK`, `UNKNOWN_ACCOUNT`, `PARSE_ERROR`)
            info:
              type: object
              description: Additional information about the error (block hash, height, account ID, etc.)
        code:
          type: integer
          description: Legacy JSON-RPC error code (e.g. `-32000` server error, `-32700` parse error, `-32601` method not found)
        message:
          type: string
          description: Legacy error message
        data:
          type: string
          description: Legacy error details
  responses:
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - NO_AUTHENTICATION_FOUND
                - AUTHENTICATION_FAILED
                description: Code to identify the cause of authentication failure
              message:
                type: string
                description: Detailed message including the cause of authentication failure
            required:
            - code
            - message
          examples:
            NO_AUTHENTICATION_FOUND:
              summary: The request does not include authentication (API Key)
              value:
                code: NO_AUTHENTICATION_FOUND
                message: No authentication found.
            AUTHENTICATION_FAILED:
              summary: The authentication (API Key) is invalid
              value:
                code: AUTHENTICATION_FAILED
                message: Authentication failed.
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - PERMISSION_DENIED
                description: Code indicating permission denied
              message:
                type: string
                description: Detailed message including information about the denied resource
            required:
            - code
            - message
          examples:
            PERMISSION_DENIED:
              summary: The request accesses a resource it is not authorized for
              value:
                code: PERMISSION_DENIED
                message: Permission denied
    "429":
      description: Too Many Requests
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_MANY_REQUESTS
                - EXCEEDED_QUOTA_LIMIT
                description: Code identifying the cause of the request limit exceeded
              message:
                type: string
                description: Detailed message including the exceeded limit type and allowed threshold
            required:
            - code
            - message
          examples:
            TOO_MANY_REQUESTS:
              summary: The rate limit was exceeded
              value:
                code: TOO_MANY_REQUESTS
                message: Too many requests
            EXCEEDED_QUOTA_LIMIT:
              summary: The quota limit was exceeded
              value:
                code: EXCEEDED_QUOTA_LIMIT
                message: Exceeded quota limit
    "500":
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - INTERNAL_SERVER_ERROR
                - INTERRUPTED
                description: Code to identify the cause of the internal server error
              message:
                type: string
                description: Detailed message including the cause of the server error
            required:
            - code
            - message
          examples:
            INTERNAL_SERVER_ERROR:
              summary: An internal server error occurred
              value:
                code: INTERNAL_SERVER_ERROR
                message: Internal server error
            INTERRUPTED:
              summary: Processing failed temporarily due to server load
              value:
                code: INTERRUPTED
                message: Request interrupted
paths:
  /:
    post:
      security:
      - api_key: []
      operationId: near-query_view_access_key_list
      summary: view_access_key_list
      description: |
        Returns every access key registered on an account, with each key's public key, nonce, and permission (full access, function call, or gas key).

        Call the `query` method with `request_type: "view_access_key_list"`. Querying an account that does not exist returns the `UNKNOWN_ACCOUNT` error. You can page through the list with `limit` and `after_key`. On nodes that support pagination, querying an account with more keys than the node limit without paging returns the `TOO_MANY_ACCESS_KEYS` error. Nodes that do not support pagination ignore `limit` and return the full list.
      x-seo-description: List every access key registered on a NEAR account with each key's nonce and permission using the query method (view_access_key_list).
      tags:
      - access-keys
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - jsonrpc
              - id
              - method
              - params
              properties:
                jsonrpc:
                  type: string
                  example: "2.0"
                id:
                  type: string
                  description: Request ID. Any string; it is returned unchanged in the response.
                  example: dontcare
                method:
                  type: string
                  example: query
                params:
                  type: object
                  description: Query parameters. Specify the point in time with either `finality` or `block_id`.
                  required:
                  - request_type
                  - account_id
                  properties:
                    request_type:
                      type: string
                      description: Query type. Fixed to `view_access_key_list` for listing access keys.
                      enum:
                      - view_access_key_list
                      example: view_access_key_list
                    finality:
                      $ref: '#/components/schemas/Finality'
                    block_id:
                      $ref: '#/components/schemas/BlockId'
                    account_id:
                      $ref: '#/components/schemas/AccountId'
                    after_key:
                      type: string
                      description: Resume listing after this public key (exclusive). Pass the `last_key` from the previous response.
                      example: ed25519:132zsRazNn1nE1YnjaKdVHHakbyKzgoZesmbXsVUQUsx
                    limit:
                      type: integer
                      minimum: 1
                      description: Maximum number of access keys to return in one page
                      example: 2
              example:
                jsonrpc: "2.0"
                id: dontcare
                method: query
                params:
                  request_type: view_access_key_list
                  finality: final
                  account_id: relay.aurora
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              example:
                jsonrpc: "2.0"
                id: dontcare
                result:
                  keys:
                  - public_key: ed25519:168vdqFUxij2yvsxYgAGoykJMX7tgrPKVCH484A8nHP
                    access_key:
                      nonce: 65790930078045
                      permission: FullAccess
                  - public_key: ed25519:5sBuVB7SudWfVJhDU4wV7dQdVLJoznL3reuoTaT6NQpg
                    access_key:
                      nonce: 66806870000000
                      permission:
                        FunctionCall:
                          allowance: "250000000000000000000000"
                          method_names: []
                          receiver_id: v2.ref-farming.near
                  block_height: 220785367
                  block_hash: 9qz64F7AVWFKD4poUDuGSZ7CYK74g8xcLH6joVQgThPr
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                    description: JSON-RPC version
                  id:
                    type: string
                    description: Request ID
                  result:
                    type: object
                    properties:
                      keys:
                        type: array
                        description: Access keys registered on the account
                        items:
                          type: object
                          properties:
                            public_key:
                              type: string
                              description: Public key (base58 string prefixed with `ed25519:` or `secp256k1:`)
                            access_key:
                              type: object
                              description: Nonce and permission of the key
                              properties:
                                nonce:
                                  type: integer
                                  description: Current nonce of the key. The next transaction signed with this key must use a nonce greater than this value.
                                permission:
                                  description: |-
                                    Access key permission. The format depends on the key type.
                                    - `"FullAccess"`: a key that can perform any action on the account (string)
                                    - `{"FunctionCall": {...}}`: a key that can only call methods on the specified contract
                                    - `{"GasKeyFullAccess": {...}}`: a gas key that can perform any action (an access key prefunded with NEAR to pay for gas)
                                    - `{"GasKeyFunctionCall": {...}}`: a gas key that can only make function calls
                                  oneOf:
                                  - title: FullAccess
                                    type: string
                                    enum:
                                    - FullAccess
                                  - title: FunctionCall
                                    type: object
                                    properties:
                                      FunctionCall:
                                        type: object
                                        properties:
                                          allowance:
                                            type: string
                                            nullable: true
                                            description: Gas fee allowance this key can spend (yoctoNEAR, decimal string). `null` means unlimited.
                                          receiver_id:
                                            type: string
                                            description: Contract account ID this key can call
                                          method_names:
                                            type: array
                                            description: Method names this key can call. An empty array allows calling any method on `receiver_id`.
                                            items:
                                              type: string
                                  - title: GasKeyFullAccess
                                    type: object
                                    properties:
                                      GasKeyFullAccess:
                                        type: object
                                        properties:
                                          balance:
                                            type: string
                                            description: Balance funded to the gas key (yoctoNEAR, decimal string)
                                          num_nonces:
                                            type: integer
                                            description: Number of parallel nonce lanes of the gas key (0–65535)
                                  - title: GasKeyFunctionCall
                                    type: object
                                    properties:
                                      GasKeyFunctionCall:
                                        type: object
                                        description: An object with the same `allowance`, `receiver_id`, and `method_names` as `FunctionCall`, plus the gas key's `balance` and `num_nonces`.
                                        properties:
                                          balance:
                                            type: string
                                            description: Balance funded to the gas key (yoctoNEAR, decimal string)
                                          num_nonces:
                                            type: integer
                                            description: Number of parallel nonce lanes of the gas key (0–65535)
                                          allowance:
                                            type: string
                                            nullable: true
                                            description: Gas fee allowance this key can spend (yoctoNEAR, decimal string). `null` means unlimited.
                                          receiver_id:
                                            type: string
                                            description: Contract account ID this key can call
                                          method_names:
                                            type: array
                                            description: Method names this key can call. An empty array allows calling any method on `receiver_id`.
                                            items:
                                              type: string
                      last_key:
                        type: string
                        description: Public key to pass as `after_key` to fetch the next page. Present only when the list was truncated; absent on the last page or when no page is requested.
                      block_height:
                        $ref: '#/components/schemas/BlockHeight'
                      block_hash:
                        $ref: '#/components/schemas/CryptoHash'
                  error:
                    $ref: '#/components/schemas/RpcError'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
