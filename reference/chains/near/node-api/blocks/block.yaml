                              description: Gas used in the chunk
                            gas_limit:
                              type: integer
                              description: Gas limit of the chunk
                            balance_burnt:
                              type: string
                              description: Amount burnt in the chunk (yoctoNEAR, decimal string)
                            outgoing_receipts_root:
                              type: string
                              description: Merkle root of receipts sent to other shards (base58)
                            tx_root:
                              type: string
                              description: Merkle root of the transactions in the chunk (base58)
                            validator_proposals:
                              type: array
                              description: Validator stake changes proposed in the chunk
                              items:
                                type: object
                            congestion_info:
                              type: object
                              description: Shard congestion info. Total gas of delayed and buffered receipts (`delayed_receipts_gas`, `buffered_receipts_gas`), receipt size (`receipt_bytes`), and the allowed shard (`allowed_shard`).
                            bandwidth_requests:
                              type: object
                              description: Bandwidth this shard requests for sending to other shards
                            proposed_split:
                              type: object
                              description: Shard split proposed for dynamic resharding. `null` when there is no proposal.
                              nullable: true
                            signature:
                              type: string
                              description: Signature of the chunk producer
                            rent_paid:
                              type: string
                              description: Deprecated field; always `"0"`.
                            validator_reward:
                              type: string
                              description: Deprecated field; always `"0"`.
