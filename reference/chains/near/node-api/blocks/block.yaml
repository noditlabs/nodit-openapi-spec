                          timestamp_nanosec:
                            type: string
                            description: Block timestamp (Unix nanoseconds, decimal string)
                          random_value:
                            type: string
                            description: Random value of the block (base58)
                          validator_proposals:
                            type: array
                            description: Validator stake changes proposed in this block
                            items:
                              type: object
                          gas_price:
                            type: string
                            description: Gas price of this block (yoctoNEAR, decimal string)
                          block_ordinal:
                            type: integer
                            description: Ordinal of this block since genesis. Heights without a block are not counted.
                          total_supply:
                            type: string
                            description: Total NEAR supply (yoctoNEAR, decimal string)
                          last_final_block:
                            type: string
                            description: Hash of the last fully final block (base58)
                          last_ds_final_block:
                            type: string
                            description: Hash of the last Doomslug-final block (base58)
                          next_bp_hash:
                            type: string
                            description: Hash of the next epoch's block producer set (base58)
                          block_merkle_root:
                            type: string
                            description: Merkle root of all block hashes from genesis up to the previous block (base58)
                          block_body_hash:
                            type: string
                            description: Block body hash (base58)
                          epoch_sync_data_hash:
                            type: string
                            description: Epoch sync data hash. `null` when not applicable.
                            nullable: true
                          approvals:
                            type: array
                            description: Validator signatures approving this block. Positions of validators that did not approve are `null`.
                            items:
                              type: string
                              nullable: true
                          chunk_endorsements:
                            type: array
                            description: Per chunk, a bitmap (byte array) of validator endorsements
                            items:
                              type: array
                              items:
