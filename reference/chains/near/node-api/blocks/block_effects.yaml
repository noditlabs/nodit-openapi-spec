openapi: 3.1.0
info:
  title: Near - block_effects
  version: 1.0.0
servers:
- url: https://near-mainnet.nodit.io
  description: NEAR Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  schemas:
    BlockId:
      description: |-
        Specifies the block to query by block height (integer) or block hash (base58 string).
        Cannot be used together with `finality`.
      oneOf:
      - title: Block Height
        type: integer
        example: 220785385
      - title: Block Hash
        type: string
        example: 8EjuQRnAJiWkRmqxfexQFJWXXonuSMbz5AZziJLCWnWS
    Finality:
      type: string
      description: |-
        Specifies the block finality. Cannot be used together with `block_id`.
        - `optimistic`: the latest block the node has received (may be reorganized)
        - `near-final`: a Doomslug-final block (not reverted in most cases)
        - `final`: a fully finalized block
      enum:
      - optimistic
      - near-final
      - final
      example: final
    RpcError:
      type: object
      description: |-
        NEAR JSON-RPC error object. Request format errors are returned with HTTP 400, and processing errors with HTTP 200.
        Use `cause.name` to identify the specific cause (e.g. `UNKNOWN_BLOCK`, `UNKNOWN_ACCOUNT`, `TIMEOUT_ERROR`).
      properties:
        name:
          type: string
          description: Error class. `REQUEST_VALIDATION_ERROR` (invalid request), `HANDLER_ERROR` (processing error), `INTERNAL_ERROR` (node internal error)
          enum:
          - REQUEST_VALIDATION_ERROR
          - HANDLER_ERROR
          - INTERNAL_ERROR
        cause:
          type: object
          description: The specific cause of the error.
          properties:
            name:
              type: string
              description: Name of the error cause (e.g. `UNKNOWN_BLOCK`, `UNKNOWN_ACCOUNT`, `PARSE_ERROR`)
            info:
              type: object
              description: Additional information about the error (block hash, height, account ID, etc.)
        code:
          type: integer
          description: Legacy JSON-RPC error code (e.g. `-32000` server error, `-32700` parse error, `-32601` method not found)
        message:
          type: string
          description: Legacy error message
        data:
          type: string
          description: Legacy error details
  responses:
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - NO_AUTHENTICATION_FOUND
                - AUTHENTICATION_FAILED
                description: Code to identify the cause of authentication failure
              message:
                type: string
                description: Detailed message including the cause of authentication failure
            required:
            - code
            - message
          examples:
            NO_AUTHENTICATION_FOUND:
              summary: The request does not include authentication (API Key)
              value:
                code: NO_AUTHENTICATION_FOUND
                message: No authentication found.
            AUTHENTICATION_FAILED:
              summary: The authentication (API Key) is invalid
              value:
                code: AUTHENTICATION_FAILED
                message: Authentication failed.
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - PERMISSION_DENIED
                description: Code indicating permission denied
              message:
                type: string
                description: Detailed message including information about the denied resource
            required:
            - code
            - message
          examples:
            PERMISSION_DENIED:
              summary: The request accesses a resource it is not authorized for
              value:
                code: PERMISSION_DENIED
                message: Permission denied
    "429":
      description: Too Many Requests
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_MANY_REQUESTS
                - EXCEEDED_QUOTA_LIMIT
                description: Code identifying the cause of the request limit exceeded
              message:
                type: string
                description: Detailed message including the exceeded limit type and allowed threshold
            required:
            - code
            - message
          examples:
            TOO_MANY_REQUESTS:
              summary: The rate limit was exceeded
              value:
                code: TOO_MANY_REQUESTS
                message: Too many requests
            EXCEEDED_QUOTA_LIMIT:
              summary: The quota limit was exceeded
              value:
                code: EXCEEDED_QUOTA_LIMIT
                message: Exceeded quota limit
    "500":
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - INTERNAL_SERVER_ERROR
                - INTERRUPTED
                description: Code to identify the cause of the internal server error
              message:
                type: string
                description: Detailed message including the cause of the server error
            required:
            - code
            - message
          examples:
            INTERNAL_SERVER_ERROR:
              summary: An internal server error occurred
              value:
                code: INTERNAL_SERVER_ERROR
                message: Internal server error
            INTERRUPTED:
              summary: Processing failed temporarily due to server load
              value:
                code: INTERRUPTED
                message: Request interrupted
paths:
  /:
    post:
      security:
      - api_key: []
      operationId: near-block_effects
      summary: block_effects
      description: |
        Returns, by change type, the accounts whose state changed in a block. Each item holds only the change type (`type`) and the account ID. Query the changed values with the `changes` method.

        Use `finality` for the latest block, or `block_id` (block height or block hash) for a specific block. The result list is under the `changes` key. If the block cannot be found, the `UNKNOWN_BLOCK` error is returned. `EXPERIMENTAL_changes_in_block` is the former name of this method.
      x-seo-description: List NEAR accounts whose account info, access keys, contract data, or contract code changed in a block with the block_effects method.
      tags:
      - blocks
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - jsonrpc
              - id
              - method
              - params
              properties:
                jsonrpc:
                  type: string
                  example: "2.0"
                id:
                  type: string
                  description: Request ID. Any string; it is returned unchanged in the response.
                  example: dontcare
                method:
                  type: string
                  example: block_effects
                params:
                  type: object
                  description: Specifies the block to query. Set exactly one of `finality`, `block_id`, or `sync_checkpoint`.
                  properties:
                    finality:
                      $ref: '#/components/schemas/Finality'
                    block_id:
                      $ref: '#/components/schemas/BlockId'
                    sync_checkpoint:
                      type: string
                      description: Block selector. `genesis` returns the genesis block; `earliest_available` returns the oldest block the node holds.
                      enum:
                      - genesis
                      - earliest_available
              example:
                jsonrpc: "2.0"
                id: dontcare
                method: block_effects
                params:
                  finality: final
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              example:
                jsonrpc: "2.0"
                id: dontcare
                result:
                  block_hash: CWoAHhkRjrCiBMgCQsEKVBckqeRg8r1kwx6Npa9PiD8j
                  changes:
                  - account_id: 00000000012.near
                    type: account_touched
                  - account_id: token.sweat
                    type: account_touched
                  - account_id: token.sweat
                    type: data_touched
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                    description: JSON-RPC version
                  id:
                    type: string
                    description: Request ID
                  result:
                    type: object
                    properties:
                      block_hash:
                        type: string
                        description: Hash of the queried block (base58)
                      changes:
                        type: array
                        description: Accounts whose state changed. An account appears per change type, and may repeat as many times as the same kind of change occurred.
                        items:
                          type: object
                          properties:
                            type:
                              type: string
                              description: |-
                                Change type
                                - `account_touched`: account info (balance, locked amount, storage usage, code hash) changed, or the account was deleted
                                - `access_key_touched`: an access key was added, changed, or deleted
                                - `data_touched`: contract storage data was changed or deleted
                                - `contract_code_touched`: contract code was deployed or deleted
                              enum:
                              - account_touched
                              - access_key_touched
                              - data_touched
                              - contract_code_touched
                            account_id:
                              type: string
                              description: Account ID whose state changed
                  error:
                    $ref: '#/components/schemas/RpcError'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
