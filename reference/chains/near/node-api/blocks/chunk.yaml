openapi: 3.1.0
info:
  title: Near - chunk
  version: 1.0.0
servers:
- url: https://near-mainnet.nodit.io
  description: NEAR Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  schemas:
    AccountId:
      type: string
      description: NEAR account ID. A human-readable name (e.g. `wrap.near`) or a 64-character hex implicit account ID.
      example: wrap.near
    PublicKey:
      type: string
      description: Base58-encoded public key prefixed with `ed25519:` or `secp256k1:`.
      example: ed25519:168vdqFUxij2yvsxYgAGoykJMX7tgrPKVCH484A8nHP
    CryptoHash:
      type: string
      description: Base58-encoded 32-byte hash (block hash, chunk hash, transaction hash, etc.).
      example: 8EjuQRnAJiWkRmqxfexQFJWXXonuSMbz5AZziJLCWnWS
    BlockId:
      description: |-
        Specifies the block to query by block height (integer) or block hash (base58 string).
        Cannot be used together with `finality`.
      oneOf:
      - title: Block Height
        type: integer
        example: 220785385
      - title: Block Hash
        type: string
        example: 8EjuQRnAJiWkRmqxfexQFJWXXonuSMbz5AZziJLCWnWS
    Finality:
      type: string
      description: |-
        Specifies the block finality. Cannot be used together with `block_id`.
        - `optimistic`: the latest block the node has received (may be reorganized)
        - `near-final`: a Doomslug-final block (not reverted in most cases)
        - `final`: a fully finalized block
      enum:
      - optimistic
      - near-final
      - final
      example: final
    BlockHeight:
      type: integer
      description: Block height.
      example: 220785385
    Amount:
      type: string
      description: Amount in yoctoNEAR as a decimal string (1 NEAR = 10^24 yoctoNEAR).
      example: "100000000"
    RpcError:
      type: object
      description: |-
        NEAR JSON-RPC error object. Request format errors are returned with HTTP 400, and processing errors with HTTP 200.
        Use `cause.name` to identify the specific cause (e.g. `UNKNOWN_BLOCK`, `UNKNOWN_ACCOUNT`, `TIMEOUT_ERROR`).
      properties:
        name:
          type: string
          description: Error class. `REQUEST_VALIDATION_ERROR` (invalid request), `HANDLER_ERROR` (processing error), `INTERNAL_ERROR` (node internal error)
          enum:
          - REQUEST_VALIDATION_ERROR
          - HANDLER_ERROR
          - INTERNAL_ERROR
        cause:
          type: object
          description: The specific cause of the error.
          properties:
            name:
              type: string
              description: Name of the error cause (e.g. `UNKNOWN_BLOCK`, `UNKNOWN_ACCOUNT`, `PARSE_ERROR`)
            info:
              type: object
              description: Additional information about the error (block hash, height, account ID, etc.)
        code:
          type: integer
          description: Legacy JSON-RPC error code (e.g. `-32000` server error, `-32700` parse error, `-32601` method not found)
        message:
          type: string
          description: Legacy error message
        data:
          type: string
          description: Legacy error details
  responses:
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - NO_AUTHENTICATION_FOUND
                - AUTHENTICATION_FAILED
                description: Code to identify the cause of authentication failure
              message:
                type: string
                description: Detailed message including the cause of authentication failure
            required:
            - code
            - message
          examples:
            NO_AUTHENTICATION_FOUND:
              summary: The request does not include authentication (API Key)
              value:
                code: NO_AUTHENTICATION_FOUND
                message: No authentication found.
            AUTHENTICATION_FAILED:
              summary: The authentication (API Key) is invalid
              value:
                code: AUTHENTICATION_FAILED
                message: Authentication failed.
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - PERMISSION_DENIED
                description: Code indicating permission denied
              message:
                type: string
                description: Detailed message including information about the denied resource
            required:
            - code
            - message
          examples:
            PERMISSION_DENIED:
              summary: The request accesses a resource it is not authorized for
              value:
                code: PERMISSION_DENIED
                message: Permission denied
    "429":
      description: Too Many Requests
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_MANY_REQUESTS
                - EXCEEDED_QUOTA_LIMIT
                description: Code identifying the cause of the request limit exceeded
              message:
                type: string
                description: Detailed message including the exceeded limit type and allowed threshold
            required:
            - code
            - message
          examples:
            TOO_MANY_REQUESTS:
              summary: The rate limit was exceeded
              value:
                code: TOO_MANY_REQUESTS
                message: Too many requests
            EXCEEDED_QUOTA_LIMIT:
              summary: The quota limit was exceeded
              value:
                code: EXCEEDED_QUOTA_LIMIT
                message: Exceeded quota limit
    "500":
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - INTERNAL_SERVER_ERROR
                - INTERRUPTED
                description: Code to identify the cause of the internal server error
              message:
                type: string
                description: Detailed message including the cause of the server error
            required:
            - code
            - message
          examples:
            INTERNAL_SERVER_ERROR:
              summary: An internal server error occurred
              value:
                code: INTERNAL_SERVER_ERROR
                message: Internal server error
            INTERRUPTED:
              summary: Processing failed temporarily due to server load
              value:
                code: INTERRUPTED
                message: Request interrupted
paths:
  /:
    post:
      security:
      - api_key: []
      operationId: near-chunk
      summary: chunk
      description: |
        Returns the chunk header and the transactions and receipts included in the chunk.

        Call it with `chunk_id` (chunk hash), or with `block_id` and `shard_id` together. Get the chunk hash from `chunks[].chunk_hash` in the `block` method response. If the chunk cannot be found, the `UNKNOWN_CHUNK` error is returned; for a shard ID that does not exist, the `INVALID_SHARD_ID` error; if the block cannot be found, the `UNKNOWN_BLOCK` error.
      x-seo-description: Get a NEAR chunk, including its header, transactions, and receipts, by chunk hash or by block ID and shard ID with the chunk method.
      tags:
      - blocks
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - jsonrpc
              - id
              - method
              - params
              properties:
                jsonrpc:
                  type: string
                  example: "2.0"
                id:
                  type: string
                  description: Request ID. Any string; it is returned unchanged in the response.
                  example: dontcare
                method:
                  type: string
                  example: chunk
                params:
                  type: object
                  description: Specifies the chunk to query. Set `chunk_id` alone, or `block_id` and `shard_id` together.
                  properties:
                    chunk_id:
                      type: string
                      description: Chunk hash (base58). Cannot be used with `block_id` and `shard_id`.
                      example: Bwb7e4kc3EazNa2UNS18LGwpCUNtKCebcMwEDckqVAuW
                    block_id:
                      $ref: '#/components/schemas/BlockId'
                    shard_id:
                      type: integer
                      description: Shard ID. Set together with `block_id`.
                      example: 10
              example:
                jsonrpc: "2.0"
                id: dontcare
                method: chunk
                params:
                  chunk_id: Bwb7e4kc3EazNa2UNS18LGwpCUNtKCebcMwEDckqVAuW
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              example:
                jsonrpc: "2.0"
                id: dontcare
                result:
                  author: northstakenear.poolv1.near
                  header:
                    balance_burnt: "0"
                    bandwidth_requests:
                      V1:
                        requests: []
                    chunk_hash: Bwb7e4kc3EazNa2UNS18LGwpCUNtKCebcMwEDckqVAuW
                    congestion_info:
                      allowed_shard: 12
                      buffered_receipts_gas: "0"
                      delayed_receipts_gas: "0"
                      receipt_bytes: 0
                    encoded_length: 526
                    encoded_merkle_root: 3PtDhuYvav6hrN9GGu5wVPx7p3KptKaCX99YzdjvuKbj
                    gas_limit: 1000000000000000
                    gas_used: 0
                    height_created: 220785299
                    height_included: 220785299
                    outcome_root: "11111111111111111111111111111111"
                    outgoing_receipts_root: GkXFM5VkSNfBLbDv8igetxFxFj9f3pcsnjKC37w1CzCA
                    prev_block_hash: EchVfdovVaSQLUp4p5hXg9mxRow7VyfA1w5Ax5ev3iV2
                    prev_state_root: 8PiaWyhACTaqbPe8LPeYAtPFgZjrLv6JsRg64cNRWAPe
                    proposed_split: null
                    rent_paid: "0"
                    shard_id: 10
                    signature: ed25519:4R3aGDYqfSVE1x8SZr7rhjqCPEVHfdCvdDJem6K5evttEEYNgb3V3WvAYQ2BENAZ5SZdVXe62zfFqewxPCLcaZCH
                    tx_root: BG1meqDgUX7erusU7UN5YH5q6UKrJccqftT9jrTdyb2L
                    validator_proposals: []
                    validator_reward: "0"
                  receipts: []
                  transactions:
                  - actions:
                    - Delegate:
                        delegate_action:
                          actions:
                          - FunctionCall:
                              args: eyJjaGFyZ2VfZ2FzX2ZlZSI6dHJ1ZSwic2lnbmF0dXJlIjoiMWY3MWMxMzk5OTFjNGUwMDRmNGNhZWJjMjM4NDIyZTk0MzMzNmQwMGNiNzlhZmNjNDg5M2UzZTE2OWI2OWE3NCIsIm1pbmluZ190aW1lIjoiNDUwMDciLCJtYXhfdHMiOiIxNzkyNDg4ODgyNzM2ODgxOTIwIn0=
                              deposit: "0"
                              gas: 20000000000000
                              method_name: l2_claim
                          max_block_height: 221185293
                          nonce: 117245306001780
                          public_key: ed25519:GxKiWi42sV92ijqade5AoTBo9vUpEWoZKUw8i2BmuwaE
                          receiver_id: game.hot.tg
                          sender_id: 6464297750.tg
                        signature: ed25519:5Fhq2Eqa1CUeceTjFGqx1JiD13oGkp1Ag2rkbX2x2asREVbrggjGU4FLbvdziAXAeDaShZ43JV6hXJ7G5nCUT3DZ
                    hash: 5VPiJGhxiKsBk8a8W3NyVPTkEG3QY9y5iZ9PsQpAyYE9
                    nonce: 114560347115868
                    priority_fee: 0
                    public_key: ed25519:68EKbqA3fcSE8upq2bU1EawvURWZJXtTsbw3eK23a2Kf
                    receiver_id: 6464297750.tg
                    signature: ed25519:ncxmj7JgkcToxBxsGXgA22FYz55qSobM8SnEBUiD82pnY5WSQJcHC862S4LC3mdKavyeVVXQWUkk6eNyzQaN8Ee
                    signer_id: 0here.tg
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                    description: JSON-RPC version
                  id:
                    type: string
                    description: Request ID
                  result:
                    type: object
                    properties:
                      author:
                        type: string
                        description: Account ID of the validator that produced the chunk
                      header:
                        type: object
                        description: Chunk header
                        properties:
                          chunk_hash:
                            type: string
                            description: Chunk hash (base58)
                          prev_block_hash:
                            type: string
                            description: Previous block hash (base58)
                          outcome_root:
                            type: string
                            description: Merkle root of this chunk's execution outcomes (base58)
                          prev_state_root:
                            type: string
                            description: Shard state root before the chunk is applied (base58)
                          encoded_merkle_root:
                            type: string
                            description: Merkle root of the encoded chunk data (base58)
                          encoded_length:
                            type: integer
                            description: Size of the encoded chunk data (bytes)
                          height_created:
                            type: integer
                            description: Block height at which the chunk was created
                          height_included:
                            type: integer
                            description: Block height at which the chunk was included
                          shard_id:
                            type: integer
                            description: ID of the shard the chunk belongs to
                          gas_used:
                            type: integer
                            description: Gas used in the chunk
                          gas_limit:
                            type: integer
                            description: Gas limit of the chunk
                          balance_burnt:
                            type: string
                            description: Amount burnt in the chunk (yoctoNEAR, decimal string)
                          outgoing_receipts_root:
                            type: string
                            description: Merkle root of receipts sent to other shards (base58)
                          tx_root:
                            type: string
                            description: Merkle root of the transactions in the chunk (base58)
                          validator_proposals:
                            type: array
                            description: Validator stake changes proposed in the chunk
                            items:
                              type: object
                          congestion_info:
                            type: object
                            description: Shard congestion info. Total gas of delayed and buffered receipts (`delayed_receipts_gas`, `buffered_receipts_gas`), receipt size (`receipt_bytes`), and the allowed shard (`allowed_shard`).
                          bandwidth_requests:
                            type: object
                            description: Bandwidth this shard requests for sending to other shards
                          proposed_split:
                            type: object
                            description: Shard split proposed for dynamic resharding. `null` when there is no proposal.
                            nullable: true
                          signature:
                            type: string
                            description: Signature of the chunk producer
                          rent_paid:
                            type: string
                            description: Deprecated field; always `"0"`.
                          validator_reward:
                            type: string
                            description: Deprecated field; always `"0"`.
                      transactions:
                        type: array
                        description: Signed transactions included in the chunk
                        items:
                          type: object
                          properties:
                            signer_id:
                              type: string
                              description: Account ID that signed the transaction
                            public_key:
                              type: string
                              description: Public key used for signing
                            nonce:
                              type: integer
                              description: Access key nonce
                            receiver_id:
                              type: string
                              description: Account ID receiving the transaction
                            actions:
                              type: array
                              description: Actions of the transaction. Each item is an object keyed by the action type name (for example `Transfer`, `FunctionCall`, `Delegate`).
                              items:
                                type: object
                            signature:
                              type: string
                              description: Transaction signature
                            hash:
                              type: string
                              description: Transaction hash (base58)
                            priority_fee:
                              type: integer
                              description: Deprecated field; always `0`.
                      receipts:
                        type: array
                        description: Receipts included in the chunk. Empty when there are none.
                        items:
                          type: object
                          properties:
                            predecessor_id:
                              type: string
                              description: Account ID that created the receipt
                            receiver_id:
                              type: string
                              description: Account ID receiving the receipt
                            receipt_id:
                              type: string
                              description: Receipt ID (base58)
                            receipt:
                              type: object
                              description: Receipt body. Keyed by either `Action` (actions to execute) or `Data` (data to deliver).
                            priority:
                              type: integer
                              description: Deprecated field; always `0`.
                  error:
                    $ref: '#/components/schemas/RpcError'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
