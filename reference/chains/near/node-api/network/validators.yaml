openapi: 3.1.0
info:
  title: Near - validators
  version: 1.0.0
servers:
- url: https://near-mainnet.nodit.io
  description: NEAR Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  schemas:
    AccountId:
      type: string
      description: NEAR account ID. A human-readable name (e.g. `wrap.near`) or a 64-character hex implicit account ID.
      example: wrap.near
    PublicKey:
      type: string
      description: Base58-encoded public key prefixed with `ed25519:` or `secp256k1:`.
      example: ed25519:168vdqFUxij2yvsxYgAGoykJMX7tgrPKVCH484A8nHP
    BlockId:
      description: |-
        Specifies the block to query by block height (integer) or block hash (base58 string).
        Cannot be used together with `finality`.
      oneOf:
      - title: Block Height
        type: integer
        example: 220785385
      - title: Block Hash
        type: string
        example: 8EjuQRnAJiWkRmqxfexQFJWXXonuSMbz5AZziJLCWnWS
    RpcError:
      type: object
      description: |-
        NEAR JSON-RPC error object. Request format errors are returned with HTTP 400, and processing errors with HTTP 200.
        Use `cause.name` to identify the specific cause (e.g. `UNKNOWN_BLOCK`, `UNKNOWN_ACCOUNT`, `TIMEOUT_ERROR`).
      properties:
        name:
          type: string
          description: Error class. `REQUEST_VALIDATION_ERROR` (invalid request), `HANDLER_ERROR` (processing error), `INTERNAL_ERROR` (node internal error)
          enum:
          - REQUEST_VALIDATION_ERROR
          - HANDLER_ERROR
          - INTERNAL_ERROR
        cause:
          type: object
          description: The specific cause of the error.
          properties:
            name:
              type: string
              description: Name of the error cause (e.g. `UNKNOWN_BLOCK`, `UNKNOWN_ACCOUNT`, `PARSE_ERROR`)
            info:
              type: object
              description: Additional information about the error (block hash, height, account ID, etc.)
        code:
          type: integer
          description: Legacy JSON-RPC error code (e.g. `-32000` server error, `-32700` parse error, `-32601` method not found)
        message:
          type: string
          description: Legacy error message
        data:
          type: string
          description: Legacy error details
  responses:
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - NO_AUTHENTICATION_FOUND
                - AUTHENTICATION_FAILED
                description: Code to identify the cause of authentication failure
              message:
                type: string
                description: Detailed message including the cause of authentication failure
            required:
            - code
            - message
          examples:
            NO_AUTHENTICATION_FOUND:
              summary: The request does not include authentication (API Key)
              value:
                code: NO_AUTHENTICATION_FOUND
                message: No authentication found.
            AUTHENTICATION_FAILED:
              summary: The authentication (API Key) is invalid
              value:
                code: AUTHENTICATION_FAILED
                message: Authentication failed.
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - PERMISSION_DENIED
                description: Code indicating permission denied
              message:
                type: string
                description: Detailed message including information about the denied resource
            required:
            - code
            - message
          examples:
            PERMISSION_DENIED:
              summary: The request accesses a resource it is not authorized for
              value:
                code: PERMISSION_DENIED
                message: Permission denied
    "429":
      description: Too Many Requests
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_MANY_REQUESTS
                - EXCEEDED_QUOTA_LIMIT
                description: Code identifying the cause of the request limit exceeded
              message:
                type: string
                description: Detailed message including the exceeded limit type and allowed threshold
            required:
            - code
            - message
          examples:
            TOO_MANY_REQUESTS:
              summary: The rate limit was exceeded
              value:
                code: TOO_MANY_REQUESTS
                message: Too many requests
            EXCEEDED_QUOTA_LIMIT:
              summary: The quota limit was exceeded
              value:
                code: EXCEEDED_QUOTA_LIMIT
                message: Exceeded quota limit
    "500":
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - INTERNAL_SERVER_ERROR
                - INTERRUPTED
                description: Code to identify the cause of the internal server error
              message:
                type: string
                description: Detailed message including the cause of the server error
            required:
            - code
            - message
          examples:
            INTERNAL_SERVER_ERROR:
              summary: An internal server error occurred
              value:
                code: INTERNAL_SERVER_ERROR
                message: Internal server error
            INTERRUPTED:
              summary: Processing failed temporarily due to server load
              value:
                code: INTERRUPTED
                message: Request interrupted
paths:
  /:
    post:
      security:
      - api_key: []
      operationId: near-validators
      summary: validators
      description: |
        Returns the validators of the given epoch with their stakes and block and chunk production stats, along with next-epoch validators, staking proposals, and validators kicked out in the previous epoch.

        Send `params` as an object in one of three forms: `{ "latest": null }` for the latest epoch, `{ "epoch_id": "<epoch ID>" }` for a specific epoch, or `{ "block_id": <block height or hash> }` for the epoch containing that block. An epoch ID that cannot be found returns `UNKNOWN_EPOCH`, and missing validator information for the epoch on the node returns `VALIDATOR_INFO_UNAVAILABLE`. The Mainnet response lists hundreds of validators and reaches hundreds of KB; the example keeps one item per list.
      x-seo-description: 'List NEAR validators with the validators method: current and next epoch validator sets, stakes, block and chunk production stats, proposals, and kickouts.'
      tags:
      - network
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - jsonrpc
              - id
              - method
              - params
              properties:
                jsonrpc:
                  type: string
                  example: "2.0"
                id:
                  type: string
                  description: Request ID. Any string; it is returned unchanged in the response.
                  example: dontcare
                method:
                  type: string
                  example: validators
                params:
                  type: object
                  description: Specify the epoch with one of `latest`, `epoch_id`, or `block_id`.
                  properties:
                    latest:
                      type: object
                      nullable: true
                      description: Set to `null` to query the latest epoch.
                      example: null
                    epoch_id:
                      type: string
                      description: Epoch ID to query (base58). The ID of epoch T is the hash of the last block of epoch T-2.
                    block_id:
                      $ref: '#/components/schemas/BlockId'
              example:
                jsonrpc: "2.0"
                id: dontcare
                method: validators
                params:
                  latest: null
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              example:
                jsonrpc: "2.0"
                id: dontcare
                result:
                  current_fishermen: []
                  current_proposals:
                  - account_id: 00aboo203.pool.near
                    public_key: ed25519:2dJjJWXgvSG6iMbLFnhjrZhttrznxS225Wfq8Ffqz3Up
                    stake: "40010610607843207343471898899"
                    validator_stake_struct_version: V1
                  current_validators:
                  - account_id: astro-stakers.poolv1.near
                    is_slashed: false
                    num_expected_blocks: 1119
                    num_expected_chunks: 5621
                    num_expected_chunks_per_shard:
                    - 5621
                    num_expected_endorsements: 193958
                    num_expected_endorsements_per_shard:
                    - 19396
                    - 19400
                    - 19393
                    - 19395
                    - 19389
                    - 19397
                    - 19402
                    - 19387
                    - 19402
                    - 19397
                    num_produced_blocks: 1119
                    num_produced_chunks: 5617
                    num_produced_chunks_per_shard:
                    - 5617
                    num_produced_endorsements: 192457
                    num_produced_endorsements_per_shard:
                    - 19311
                    - 19316
                    - 19204
                    - 19319
                    - 19229
                    - 19267
                    - 19306
                    - 19244
                    - 18927
                    - 19334
                    public_key: ed25519:2nPSBCzjqikgwrqUMcuEVReJhmkC91eqJGPGqH9sZc28
                    shards:
                    - 13
                    shards_endorsed:
                    - 1
                    - 4
                    - 6
                    - 7
                    - 8
                    - 9
                    - 10
                    - 11
                    - 12
                    - 13
                    stake: "33323585676140012127856017486253"
                  epoch_height: 4883
                  epoch_start_height: 220765934
                  next_fishermen: []
                  next_validators:
                  - account_id: astro-stakers.poolv1.near
                    public_key: ed25519:2nPSBCzjqikgwrqUMcuEVReJhmkC91eqJGPGqH9sZc28
                    shards:
                    - 13
                    stake: "33322660870052523737784045263833"
                  prev_epoch_kickout:
                  - account_id: centurion.poolv1.near
                    reason:
                      NotEnoughChunkEndorsements:
                        expected: 43186
                        produced: 0
                  validator_reward_paid_prev_epoch:
                    00aboo203.pool.near: "1594782896905328933871483"
                    01node.poolv1.near: "41264540477619761619796770"
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                    description: JSON-RPC version
                  id:
                    type: string
                    description: Request ID
                  result:
                    type: object
                    properties:
                      current_validators:
                        type: array
                        description: Validators of the current epoch.
                        items:
                          type: object
                          properties:
                            account_id:
                              $ref: '#/components/schemas/AccountId'
                            public_key:
                              $ref: '#/components/schemas/PublicKey'
                            stake:
                              type: string
                              description: Staked amount (yoctoNEAR, decimal string)
                            is_slashed:
                              type: boolean
                              description: '`true` if the validator has been slashed.'
                            shards:
                              type: array
                              description: IDs of the shards assigned to the validator as a chunk producer.
                              items:
                                type: integer
                            shards_endorsed:
                              type: array
                              description: IDs of the shards assigned to the validator as a chunk validator.
                              items:
                                type: integer
                            num_produced_blocks:
                              type: integer
                              description: Number of blocks produced in this epoch.
                            num_expected_blocks:
                              type: integer
                              description: Number of blocks expected to be produced in this epoch.
                            num_produced_chunks:
                              type: integer
                              description: Number of chunks produced in this epoch.
                            num_expected_chunks:
                              type: integer
                              description: Number of chunks expected to be produced in this epoch.
                            num_produced_chunks_per_shard:
                              type: array
                              description: Chunks produced per shard, in the order of `shards`.
                              items:
                                type: integer
                            num_expected_chunks_per_shard:
                              type: array
                              description: Chunks expected per shard, in the order of `shards`.
                              items:
                                type: integer
                            num_produced_endorsements:
                              type: integer
                              description: Number of chunk endorsements submitted in this epoch.
                            num_expected_endorsements:
                              type: integer
                              description: Number of chunk endorsements expected in this epoch.
                            num_produced_endorsements_per_shard:
                              type: array
                              description: Chunk endorsements submitted per shard, in the order of `shards_endorsed`.
                              items:
                                type: integer
                            num_expected_endorsements_per_shard:
                              type: array
                              description: Chunk endorsements expected per shard, in the order of `shards_endorsed`.
                              items:
                                type: integer
                      next_validators:
                        type: array
                        description: Validators of the next epoch.
                        items:
                          type: object
                          properties:
                            account_id:
                              $ref: '#/components/schemas/AccountId'
                            public_key:
                              $ref: '#/components/schemas/PublicKey'
                            stake:
                              type: string
                              description: Staked amount (yoctoNEAR, decimal string)
                            shards:
                              type: array
                              description: IDs of the assigned shards.
                              items:
                                type: integer
                      current_proposals:
                        type: array
                        description: Staking proposals submitted in the current epoch.
                        items:
                          type: object
                          properties:
                            account_id:
                              $ref: '#/components/schemas/AccountId'
                            public_key:
                              $ref: '#/components/schemas/PublicKey'
                            stake:
                              type: string
                              description: Staked amount (yoctoNEAR, decimal string)
                            validator_stake_struct_version:
                              type: string
                              description: Structure version. Currently `V1`.
                      current_fishermen:
                        type: array
                        description: Fishermen of the current epoch. An empty array on Mainnet.
                        items:
                          type: object
                          properties:
                            account_id:
                              $ref: '#/components/schemas/AccountId'
                            public_key:
                              $ref: '#/components/schemas/PublicKey'
                            stake:
                              type: string
                              description: Staked amount (yoctoNEAR, decimal string)
                            validator_stake_struct_version:
                              type: string
                              description: Structure version. Currently `V1`.
                      next_fishermen:
                        type: array
                        description: Fishermen of the next epoch. An empty array on Mainnet.
                        items:
                          type: object
                          properties:
                            account_id:
                              $ref: '#/components/schemas/AccountId'
                            public_key:
                              $ref: '#/components/schemas/PublicKey'
                            stake:
                              type: string
                              description: Staked amount (yoctoNEAR, decimal string)
                            validator_stake_struct_version:
                              type: string
                              description: Structure version. Currently `V1`.
                      prev_epoch_kickout:
                        type: array
                        description: Accounts removed from the validator set in the previous epoch.
                        items:
                          type: object
                          properties:
                            account_id:
                              $ref: '#/components/schemas/AccountId'
                            reason:
                              type: object
                              description: The reason for removal. Too few blocks, chunks, or chunk endorsements (`NotEnoughBlocks`, `NotEnoughChunks`, `NotEnoughChunkEndorsements`, with `produced` and `expected`), insufficient stake (`NotEnoughStake`), and an outdated protocol version (`ProtocolVersionTooOld`) appear as objects; unstaking by the validator (`Unstaked`) and not getting a seat (`DidNotGetASeat`) appear as strings.
                      epoch_start_height:
                        type: integer
                        description: Block height at which the epoch started.
                      epoch_height:
                        type: integer
                        description: Epoch number counted from genesis.
                      validator_reward_paid_prev_epoch:
                        type: object
                        description: Per-validator rewards paid at the start of the previous epoch. Keys are account IDs and values are amounts (yoctoNEAR, decimal string).
                  error:
                    $ref: '#/components/schemas/RpcError'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
