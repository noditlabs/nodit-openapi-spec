openapi: 3.1.0
info:
  title: Near - status
  version: 1.0.0
servers:
- url: https://near-mainnet.nodit.io
  description: NEAR Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  schemas:
    CryptoHash:
      type: string
      description: Base58-encoded 32-byte hash (block hash, chunk hash, transaction hash, etc.).
      example: 8EjuQRnAJiWkRmqxfexQFJWXXonuSMbz5AZziJLCWnWS
    BlockHeight:
      type: integer
      description: Block height.
      example: 220785385
    RpcError:
      type: object
      description: |-
        NEAR JSON-RPC error object. Request format errors are returned with HTTP 400, and processing errors with HTTP 200.
        Use `cause.name` to identify the specific cause (e.g. `UNKNOWN_BLOCK`, `UNKNOWN_ACCOUNT`, `TIMEOUT_ERROR`).
      properties:
        name:
          type: string
          description: Error class. `REQUEST_VALIDATION_ERROR` (invalid request), `HANDLER_ERROR` (processing error), `INTERNAL_ERROR` (node internal error)
          enum:
          - REQUEST_VALIDATION_ERROR
          - HANDLER_ERROR
          - INTERNAL_ERROR
        cause:
          type: object
          description: The specific cause of the error.
          properties:
            name:
              type: string
              description: Name of the error cause (e.g. `UNKNOWN_BLOCK`, `UNKNOWN_ACCOUNT`, `PARSE_ERROR`)
            info:
              type: object
              description: Additional information about the error (block hash, height, account ID, etc.)
        code:
          type: integer
          description: Legacy JSON-RPC error code (e.g. `-32000` server error, `-32700` parse error, `-32601` method not found)
        message:
          type: string
          description: Legacy error message
        data:
          type: string
          description: Legacy error details
  responses:
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - NO_AUTHENTICATION_FOUND
                - AUTHENTICATION_FAILED
                description: Code to identify the cause of authentication failure
              message:
                type: string
                description: Detailed message including the cause of authentication failure
            required:
            - code
            - message
          examples:
            NO_AUTHENTICATION_FOUND:
              summary: The request does not include authentication (API Key)
              value:
                code: NO_AUTHENTICATION_FOUND
                message: No authentication found.
            AUTHENTICATION_FAILED:
              summary: The authentication (API Key) is invalid
              value:
                code: AUTHENTICATION_FAILED
                message: Authentication failed.
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - PERMISSION_DENIED
                description: Code indicating permission denied
              message:
                type: string
                description: Detailed message including information about the denied resource
            required:
            - code
            - message
          examples:
            PERMISSION_DENIED:
              summary: The request accesses a resource it is not authorized for
              value:
                code: PERMISSION_DENIED
                message: Permission denied
    "429":
      description: Too Many Requests
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_MANY_REQUESTS
                - EXCEEDED_QUOTA_LIMIT
                description: Code identifying the cause of the request limit exceeded
              message:
                type: string
                description: Detailed message including the exceeded limit type and allowed threshold
            required:
            - code
            - message
          examples:
            TOO_MANY_REQUESTS:
              summary: The rate limit was exceeded
              value:
                code: TOO_MANY_REQUESTS
                message: Too many requests
            EXCEEDED_QUOTA_LIMIT:
              summary: The quota limit was exceeded
              value:
                code: EXCEEDED_QUOTA_LIMIT
                message: Exceeded quota limit
    "500":
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - INTERNAL_SERVER_ERROR
                - INTERRUPTED
                description: Code to identify the cause of the internal server error
              message:
                type: string
                description: Detailed message including the cause of the server error
            required:
            - code
            - message
          examples:
            INTERNAL_SERVER_ERROR:
              summary: An internal server error occurred
              value:
                code: INTERNAL_SERVER_ERROR
                message: Internal server error
            INTERRUPTED:
              summary: Processing failed temporarily due to server load
              value:
                code: INTERRUPTED
                message: Request interrupted
paths:
  /:
    post:
      security:
      - api_key: []
      operationId: near-status
      summary: status
      description: |
        Returns the chain ID, genesis hash, protocol versions, node software version, and latest block sync information.

        This method takes no parameters; send an empty array `[]` as `params`. Information that identifies the node (node and validator public keys, validator list, RPC address, uptime) is not included in the response. To get the validator list, use the `validators` method. The method may return `NODE_IS_SYNCING` while the node is syncing, or `NO_NEW_BLOCKS` when the node is not receiving new blocks.
      x-seo-description: 'Get NEAR network status with the status method: chain ID, genesis hash, protocol version, node software version, and latest block sync info.'
      tags:
      - network
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - jsonrpc
              - id
              - method
              - params
              properties:
                jsonrpc:
                  type: string
                  example: "2.0"
                id:
                  type: string
                  description: Request ID. Any string; it is returned unchanged in the response.
                  example: dontcare
                method:
                  type: string
                  example: status
                params:
                  type: array
                  description: No parameters. Send an empty array `[]`.
                  items: {}
                  maxItems: 0
                  example: []
              example:
                jsonrpc: "2.0"
                id: dontcare
                method: status
                params: []
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              example:
                jsonrpc: "2.0"
                id: dontcare
                result:
                  chain_id: mainnet
                  genesis_hash: EPnLgE7iEq9s7yTkos96M3cWymH5avBAPm3qx3NXqR8H
                  latest_protocol_version: 86
                  protocol_version: 86
                  sync_info:
                    earliest_block_hash: FPCBfzCwcu6URU9zHetmNZV2qeTo1xWDVYGBYg8JjeXR
                    earliest_block_height: 220679011
                    earliest_block_time: '2026-10-19T16:06:55.243323368Z'
                    epoch_id: 8nD4ksRUJxEvy6E1MW3ySPrLjMq3CQsyXV7cFWvygF84
                    epoch_start_height: 220765934
                    latest_block_hash: 5StCfNcU1w4g9Q3CVQjVjtfnTnRywp1gY5WzASUNGJXW
                    latest_block_height: 220785296
                    latest_block_time: '2026-10-20T09:34:45.004573973Z'
                    latest_state_root: 68BESfKjUTNQzNmA1np8cQ92M2poPBLKPDbuQaXFRJ44
                    syncing: false
                  version:
                    build: 2.13.4
                    rustc_version: 1.93.0
                    version: 2.13.4
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                    description: JSON-RPC version
                  id:
                    type: string
                    description: Request ID
                  result:
                    type: object
                    properties:
                      chain_id:
                        type: string
                        description: Chain ID. `mainnet` for Mainnet.
                      genesis_hash:
                        $ref: '#/components/schemas/CryptoHash'
                      latest_protocol_version:
                        type: integer
                        description: The latest protocol version the node software supports.
                      protocol_version:
                        type: integer
                        description: The protocol version currently active on the network.
                      sync_info:
                        type: object
                        description: The node's block sync status.
                        properties:
                          latest_block_hash:
                            $ref: '#/components/schemas/CryptoHash'
                          latest_block_height:
                            $ref: '#/components/schemas/BlockHeight'
                          latest_state_root:
                            type: string
                            description: State root hash of the latest block (base58).
                          latest_block_time:
                            type: string
                            description: Timestamp of the latest block (ISO 8601, UTC).
                          syncing:
                            type: boolean
                            description: '`true` if the node is still syncing.'
                          earliest_block_hash:
                            type: string
                            description: Hash of the earliest block the node retains (base58).
                          earliest_block_height:
                            type: integer
                            description: Height of the earliest block the node retains.
                          earliest_block_time:
                            type: string
                            description: Timestamp of the earliest block the node retains (ISO 8601, UTC).
                          epoch_id:
                            type: string
                            description: Current epoch ID (base58). The ID of epoch T is the hash of the last block of epoch T-2.
                          epoch_start_height:
                            type: integer
                            description: Block height at which the current epoch started.
                      version:
                        type: object
                        description: Version information of the node software (nearcore).
                        properties:
                          version:
                            type: string
                            description: nearcore version.
                          build:
                            type: string
                            description: Build identifier.
                          rustc_version:
                            type: string
                            description: Rust compiler version used for the build.
                  error:
                    $ref: '#/components/schemas/RpcError'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
