openapi: 3.1.0
info:
  title: Near - account_changes
  version: 1.0.0
servers:
- url: https://near-mainnet.nodit.io
  description: NEAR Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  schemas:
    AccountId:
      type: string
      description: NEAR account ID. A human-readable name (e.g. `wrap.near`) or a 64-character hex implicit account ID.
      example: wrap.near
    BlockId:
      description: |-
        Specifies the block to query by block height (integer) or block hash (base58 string).
        Cannot be used together with `finality`.
      oneOf:
      - title: Block Height
        type: integer
        example: 220785385
      - title: Block Hash
        type: string
        example: 8EjuQRnAJiWkRmqxfexQFJWXXonuSMbz5AZziJLCWnWS
    Finality:
      type: string
      description: |-
        Specifies the block finality. Cannot be used together with `block_id`.
        - `optimistic`: the latest block the node has received (may be reorganized)
        - `near-final`: a Doomslug-final block (not reverted in most cases)
        - `final`: a fully finalized block
      enum:
      - optimistic
      - near-final
      - final
      example: final
    RpcError:
      type: object
      description: |-
        NEAR JSON-RPC error object. Request format errors are returned with HTTP 400, and processing errors with HTTP 200.
        Use `cause.name` to identify the specific cause (e.g. `UNKNOWN_BLOCK`, `UNKNOWN_ACCOUNT`, `TIMEOUT_ERROR`).
      properties:
        name:
          type: string
          description: Error class. `REQUEST_VALIDATION_ERROR` (invalid request), `HANDLER_ERROR` (processing error), `INTERNAL_ERROR` (node internal error)
          enum:
          - REQUEST_VALIDATION_ERROR
          - HANDLER_ERROR
          - INTERNAL_ERROR
        cause:
          type: object
          description: The specific cause of the error.
          properties:
            name:
              type: string
              description: Name of the error cause (e.g. `UNKNOWN_BLOCK`, `UNKNOWN_ACCOUNT`, `PARSE_ERROR`)
            info:
              type: object
              description: Additional information about the error (block hash, height, account ID, etc.)
        code:
          type: integer
          description: Legacy JSON-RPC error code (e.g. `-32000` server error, `-32700` parse error, `-32601` method not found)
        message:
          type: string
          description: Legacy error message
        data:
          type: string
          description: Legacy error details
  responses:
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - NO_AUTHENTICATION_FOUND
                - AUTHENTICATION_FAILED
                description: Code to identify the cause of authentication failure
              message:
                type: string
                description: Detailed message including the cause of authentication failure
            required:
            - code
            - message
          examples:
            NO_AUTHENTICATION_FOUND:
              summary: The request does not include authentication (API Key)
              value:
                code: NO_AUTHENTICATION_FOUND
                message: No authentication found.
            AUTHENTICATION_FAILED:
              summary: The authentication (API Key) is invalid
              value:
                code: AUTHENTICATION_FAILED
                message: Authentication failed.
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - PERMISSION_DENIED
                description: Code indicating permission denied
              message:
                type: string
                description: Detailed message including information about the denied resource
            required:
            - code
            - message
          examples:
            PERMISSION_DENIED:
              summary: The request accesses a resource it is not authorized for
              value:
                code: PERMISSION_DENIED
                message: Permission denied
    "429":
      description: Too Many Requests
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_MANY_REQUESTS
                - EXCEEDED_QUOTA_LIMIT
                description: Code identifying the cause of the request limit exceeded
              message:
                type: string
                description: Detailed message including the exceeded limit type and allowed threshold
            required:
            - code
            - message
          examples:
            TOO_MANY_REQUESTS:
              summary: The rate limit was exceeded
              value:
                code: TOO_MANY_REQUESTS
                message: Too many requests
            EXCEEDED_QUOTA_LIMIT:
              summary: The quota limit was exceeded
              value:
                code: EXCEEDED_QUOTA_LIMIT
                message: Exceeded quota limit
    "500":
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - INTERNAL_SERVER_ERROR
                - INTERRUPTED
                description: Code to identify the cause of the internal server error
              message:
                type: string
                description: Detailed message including the cause of the server error
            required:
            - code
            - message
          examples:
            INTERNAL_SERVER_ERROR:
              summary: An internal server error occurred
              value:
                code: INTERNAL_SERVER_ERROR
                message: Internal server error
            INTERRUPTED:
              summary: Processing failed temporarily due to server load
              value:
                code: INTERRUPTED
                message: Request interrupted
paths:
  /:
    post:
      security:
      - api_key: []
      operationId: near-changes_account_changes
      summary: account_changes
      description: |
        Returns, per block, the account info changes of the given accounts. Each item holds the account state after the change (balance, locked amount, storage usage, code hash) and the cause of the change.

        Call the `changes` method with `changes_type: "account_changes"`. If an account changes several times in one block, there is one item per change. If nothing changed, `changes` is an empty array. If the block cannot be found, the `UNKNOWN_BLOCK` error is returned. `EXPERIMENTAL_changes` is the former name of this method.
      x-seo-description: Track NEAR account balance, locked stake, storage, and code hash changes in a block, with the cause of each change, using the changes method (account_changes).
      tags:
      - changes
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - jsonrpc
              - id
              - method
              - params
              properties:
                jsonrpc:
                  type: string
                  example: "2.0"
                id:
                  type: string
                  description: Request ID. Any string; it is returned unchanged in the response.
                  example: dontcare
                method:
                  type: string
                  example: changes
                params:
                  type: object
                  description: Query parameters. Specify the block with either `finality` or `block_id`.
                  required:
                  - changes_type
                  - account_ids
                  properties:
                    changes_type:
                      type: string
                      description: Change query type. Fixed to `account_changes`.
                      enum:
                      - account_changes
                      example: account_changes
                    finality:
                      $ref: '#/components/schemas/Finality'
                    block_id:
                      $ref: '#/components/schemas/BlockId'
                    account_ids:
                      type: array
                      description: Account IDs to get changes for
                      items:
                        $ref: '#/components/schemas/AccountId'
              example:
                jsonrpc: "2.0"
                id: dontcare
                method: changes
                params:
                  changes_type: account_changes
                  account_ids:
                  - wrap.near
                  block_id: 220785299
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              example:
                jsonrpc: "2.0"
                id: dontcare
                result:
                  block_hash: 8EjuQRnAJiWkRmqxfexQFJWXXonuSMbz5AZziJLCWnWS
                  changes:
                  - cause:
                      receipt_hash: Htzihke1wZHo1sK92JGfsWuufG9RKG11MgHMeRCdSsJu
                      type: receipt_processing
                    change:
                      account_id: wrap.near
                      amount: "35723915907827417930574725046263"
                      code_hash: DL2f5xmZ44cQRP6vBMt94rvseH5d5KKnAGis2WkTAsh1
                      locked: "0"
                      storage_paid_at: 0
                      storage_usage: 166761807
                    type: account_update
                  - cause:
                      receipt_hash: Htzihke1wZHo1sK92JGfsWuufG9RKG11MgHMeRCdSsJu
                      type: action_receipt_gas_reward
                    change:
                      account_id: wrap.near
                      amount: "35723915907881588108301325046263"
                      code_hash: DL2f5xmZ44cQRP6vBMt94rvseH5d5KKnAGis2WkTAsh1
                      locked: "0"
                      storage_paid_at: 0
                      storage_usage: 166761807
                    type: account_update
              schema:
                type: object
                properties:
                  jsonrpc:
                    type: string
                    description: JSON-RPC version
                  id:
                    type: string
                    description: Request ID
                  result:
                    type: object
                    properties:
                      block_hash:
                        type: string
                        description: Hash of the queried block (base58)
                      changes:
                        type: array
                        description: List of account changes
                        items:
                          type: object
                          properties:
                            cause:
                              type: object
                              description: Cause of the change
                              properties:
                                type:
                                  type: string
                                  description: |-
                                    Cause type
                                    - `transaction_processing`: transaction processing (includes `tx_hash`)
                                    - `receipt_processing`: receipt processing (includes `receipt_hash`)
                                    - `action_receipt_processing_started`: action receipt processing started (includes `receipt_hash`)
                                    - `action_receipt_gas_reward`: gas reward paid for receipt execution (includes `receipt_hash`)
                                    - `postponed_receipt`: receipt postponed while waiting for data (includes `receipt_hash`)
                                    - `updated_delayed_receipts`: delayed receipt queue updated
                                    - `validator_accounts_update`: validator accounts updated at an epoch change
                                    - `migration`: protocol migration
                                    - `initial_state`: genesis initial state
                                    - `not_writable_to_disk`: change that is not written to disk
                                    - `bandwidth_scheduler_state_update`: bandwidth scheduler state updated
                                  enum:
                                  - transaction_processing
                                  - receipt_processing
                                  - action_receipt_processing_started
                                  - action_receipt_gas_reward
                                  - postponed_receipt
                                  - updated_delayed_receipts
                                  - validator_accounts_update
                                  - migration
                                  - initial_state
                                  - not_writable_to_disk
                                  - bandwidth_scheduler_state_update
                                tx_hash:
                                  type: string
                                  description: Hash of the causing transaction. Present only when `type` is `transaction_processing`. (base58)
                                receipt_hash:
                                  type: string
                                  description: Hash of the causing receipt. Present only for receipt-related causes. (base58)
                            type:
                              type: string
                              description: |-
                                Change type
                                - `account_update`: account info changed
                                - `account_deletion`: account deleted
                              enum:
                              - account_update
                              - account_deletion
                            change:
                              type: object
                              description: Account state after the change. For `account_deletion`, only `account_id` is present.
                              properties:
                                account_id:
                                  type: string
                                  description: Account ID
                                amount:
                                  type: string
                                  description: Available balance (yoctoNEAR, decimal string)
                                locked:
                                  type: string
                                  description: Amount locked for staking (yoctoNEAR, decimal string)
                                code_hash:
                                  type: string
                                  description: Hash of the deployed contract code (base58). `11111111111111111111111111111111` when no contract is deployed.
                                storage_usage:
                                  type: integer
                                  description: Storage used by the account (bytes)
                                storage_paid_at:
                                  type: integer
                                  description: Deprecated field; always `0`.
                                global_contract_hash:
                                  type: string
                                  description: Code hash of the global contract referenced by hash, if used. Present only when applicable.
                                global_contract_account_id:
                                  type: string
                                  description: Account ID of the global contract referenced by account ID, if used. Present only when applicable.
                  error:
                    $ref: '#/components/schemas/RpcError'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
