openapi: 3.1.0
info:
  title: Bitcoin - getblockchaininfo
  version: 1.0.0
servers:
- url: https://bitcoin-mainnet.nodit.io
  description: Bitcoin Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  schemas:
    BlockchainInfo:
      type: object
      description: Blockchain state information object.
      properties:
        chain:
          type: string
          description: The current network name. Returns one of `main`, `test`, `testnet4`, `signet` or `regtest`.
          example: main
        blocks:
          type: integer
          description: The height of the most-work fully-validated chain. The genesis block has height 0.
        headers:
          type: integer
          description: The current number of validated headers.
        bestblockhash:
          type: string
          description: The hash of the current best block.
        bits:
          type: string
          description: nBits, the compact representation of the block difficulty target.
        target:
          type: string
          description: The difficulty target, in hexadecimal.
        difficulty:
          type: number
          description: The current difficulty.
        time:
          type: integer
          description: The time of the current best block, expressed in UNIX epoch time.
        mediantime:
          type: integer
          description: The median time of the current best block, expressed in UNIX epoch time.
        verificationprogress:
          type: number
          description: An estimate of the verification progress. The value ranges from 0 to 1.
        initialblockdownload:
          type: boolean
          description: Whether the node is in Initial Block Download (IBD) mode.
        chainwork:
          type: string
          description: The total amount of work in the active chain, in hexadecimal.
        size_on_disk:
          type: integer
          description: The estimated size of the block and undo files on disk, in bytes.
        pruned:
          type: boolean
          description: Whether the blocks are subject to pruning.
        pruneheight:
          type: integer
          description: The height of the last block pruned, plus one. Returned only when pruning is enabled.
        automatic_pruning:
          type: boolean
          description: Whether automatic pruning is enabled. Returned only when pruning is enabled.
        prune_target_size:
          type: integer
          description: The target size used by pruning, in bytes. Returned only when automatic pruning is enabled.
        signet_challenge:
          type: string
          description: The block challenge of the signet network, in hexadecimal. Returned only on signet.
        warnings:
          type: array
          description: The list of network and blockchain warnings.
          items:
            type: string
            description: A warning message.
  responses:
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - NO_AUTHENTICATION_FOUND
                - AUTHENTICATION_FAILED
                description: Code to identify the cause of authentication failure
              message:
                type: string
                description: Detailed message including the cause of authentication failure
            required:
            - code
            - message
          examples:
            NO_AUTHENTICATION_FOUND:
              summary: The request does not include authentication (API Key)
              value:
                code: NO_AUTHENTICATION_FOUND
                message: No authentication found.
            AUTHENTICATION_FAILED:
              summary: The authentication (API Key) is invalid
              value:
                code: AUTHENTICATION_FAILED
                message: Authentication failed.
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - PERMISSION_DENIED
                description: Code indicating permission denied
              message:
                type: string
                description: Detailed message including information about the denied resource
            required:
            - code
            - message
          examples:
            PERMISSION_DENIED:
              summary: The request accesses a resource it is not authorized for
              value:
                code: PERMISSION_DENIED
                message: Permission denied
    "429":
      description: Too Many Requests
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_MANY_REQUESTS
                - EXCEEDED_QUOTA_LIMIT
                description: Code identifying the cause of the request limit exceeded
              message:
                type: string
                description: Detailed message including the exceeded limit type and allowed threshold
            required:
            - code
            - message
          examples:
            TOO_MANY_REQUESTS:
              summary: The rate limit was exceeded
              value:
                code: TOO_MANY_REQUESTS
                message: Too many requests
            EXCEEDED_QUOTA_LIMIT:
              summary: The quota limit was exceeded
              value:
                code: EXCEEDED_QUOTA_LIMIT
                message: Exceeded quota limit
    "500":
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - INTERNAL_SERVER_ERROR
                - INTERRUPTED
                description: Code to identify the cause of the internal server error
              message:
                type: string
                description: Detailed message including the cause of the server error
            required:
            - code
            - message
          examples:
            INTERNAL_SERVER_ERROR:
              summary: An internal server error occurred
              value:
                code: INTERNAL_SERVER_ERROR
                message: Internal server error
            INTERRUPTED:
              summary: Processing failed temporarily due to server load
              value:
                code: INTERRUPTED
                message: Request interrupted
paths:
  /:
    post:
      security:
      - api_key: []
      operationId: bitcoin-getblockchaininfo
      summary: getblockchaininfo
      description: |
        Returns an object containing various state information regarding blockchain processing.
        It includes the network name, the block height, the best block hash, the difficulty target, the verification progress and the pruning settings.

        > 📘 The softfork activation status was removed from this method in Bitcoin Core 25.0 and moved to `getdeploymentinfo`.
      x-seo-description: Returns an object containing various state info regarding blockchain processing.
      tags:
      - blockchain
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - jsonrpc
              - method
              - params
              properties:
                id:
                  type: integer
                  example: 1
                jsonrpc:
                  type: string
                  example: "2.0"
                method:
                  type: string
                  example: getblockchaininfo
                params:
                  type: array
                  description: This method takes no parameters. Pass an empty array.
                  items: {}
                  example: []
              example:
                id: 1
                jsonrpc: "2.0"
                method: getblockchaininfo
                params: []
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              example:
                jsonrpc: "2.0"
                id: 1
                result:
                  chain: main
                  blocks: 920000
                  headers: 920000
                  bestblockhash: 000000000000000000024bead8df69990852c202db0e0097c1a12ea637d7e96d
                  bits: 17038a4f
                  target: 000000000000000000038a4f0000000000000000000000000000000000000000
                  difficulty: 150839487445890.6
                  time: 1701388800
                  mediantime: 1701386400
                  verificationprogress: 0.9999987
                  initialblockdownload: false
                  chainwork: 00000000000000000000000000000000000000005f6bb1e6d0d1a3d5f6a5b8c1
                  size_on_disk: 623456789012
                  pruned: false
                  warnings: []
              schema:
                $ref: '#/components/schemas/BlockchainInfo'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
