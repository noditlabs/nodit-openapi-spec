openapi: 3.1.0
info:
  title: Bitcoin - getblockchaininfo
  version: 1.0.0
servers:
- url: https://bitcoin-mainnet.nodit.io
  description: Bitcoin Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  schemas:
    AddressInfo:
      type: object
      description: Address validation result object.
      properties:
        isvalid:
          type: boolean
          description: Whether the address is valid.
        address:
          type: string
          description: The Bitcoin address that was validated. Returned only when the address is valid.
        scriptPubKey:
          type: string
          description: The hex-encoded output script generated by the address. Returned only when the address is valid.
        isscript:
          type: boolean
          description: Whether the key is a script. Returned only when the address is valid.
        iswitness:
          type: boolean
          description: Whether the address is a witness address. Returned only when the address is valid.
        witness_version:
          type: integer
          description: The version number of the witness program. Returned only for witness addresses.
        witness_program:
          type: string
          description: The hex value of the witness program. Returned only for witness addresses.
        error:
          type: string
          description: The reason the address is invalid. Returned only when an error occurred.
        error_locations:
          type: array
          description: |
            Indices of likely error locations in the address string.
            Returned only when the locations can be identified, such as for Bech32 errors.
          items:
            type: integer
            description: The index of a potential error.
    Block:
      type: object
      description: A Bitcoin block object. It contains the block header data and the list of transactions.
      properties:
        hash:
          type: string
          description: The block hash, identical to the value provided in the request.
        confirmations:
          type: integer
          description: The number of confirmations, or -1 if the block is not on the main chain.
        size:
          type: integer
          description: The block size, in bytes.
        strippedsize:
          type: integer
          description: The block size excluding witness data, in bytes.
        weight:
          type: integer
          description: The block weight as defined in BIP 141.
        height:
          type: integer
          description: The block height.
        version:
          type: integer
          description: The block version.
        versionHex:
          type: string
          description: The block version in hexadecimal.
        merkleroot:
          type: string
          description: The merkle root of the transactions in the block.
        tx:
          type: array
          description: |
            The list of transactions included in the block.
            When `verbosity` is 1, an array of transaction id strings is returned; when 2 or higher, an array of transaction objects is returned.
            When `verbosity` is 3, each input additionally includes its `prevout` data.
          items:
            oneOf:
            - title: Transaction ID
              type: string
              description: The transaction id. Returned when `verbosity` is 1.
            - title: Transaction Object
              $ref: '#/components/schemas/RawTransaction'
        time:
          type: integer
          description: The block time expressed in UNIX epoch time.
        mediantime:
          type: integer
          description: The median time of the preceding 11 blocks, expressed in UNIX epoch time.
        nonce:
          type: integer
          description: The nonce used for proof of work.
        bits:
          type: string
          description: nBits, the compact representation of the block difficulty target.
        target:
          type: string
          description: The difficulty target, in hexadecimal.
        difficulty:
          type: number
          description: The difficulty of the block.
        chainwork:
          type: string
          description: The expected number of hashes required to produce the chain up to this block, in hexadecimal.
        nTx:
          type: integer
          description: The number of transactions in the block.
        previousblockhash:
          type: string
          description: The hash of the previous block.
        nextblockhash:
          type: string
          description: The hash of the next block.
    BlockCount:
      type: integer
      description: The height of the most-work fully-validated chain. The genesis block has height 0.
      example: 920000
    BlockHash:
      type: string
      description: The hex-encoded block hash.
      example: 000000000000000000024bead8df69990852c202db0e0097c1a12ea637d7e96d
    BlockHeader:
      type: object
      description: A Bitcoin block header object.
      properties:
        hash:
          type: string
          description: The block hash, identical to the value provided in the request.
        confirmations:
          type: integer
          description: The number of confirmations, or -1 if the block is not on the main chain.
        height:
          type: integer
          description: The block height.
        version:
          type: integer
          description: The block version.
        versionHex:
          type: string
          description: The block version in hexadecimal.
        merkleroot:
          type: string
          description: The merkle root of the transactions in the block.
        time:
          type: integer
          description: The block time expressed in UNIX epoch time.
        mediantime:
          type: integer
          description: The median time of the preceding 11 blocks, expressed in UNIX epoch time.
        nonce:
          type: integer
          description: The nonce used for proof of work.
        bits:
          type: string
          description: nBits, the compact representation of the block difficulty target.
        target:
          type: string
          description: The difficulty target, in hexadecimal.
        difficulty:
          type: number
          description: The difficulty of the block.
        chainwork:
          type: string
          description: The expected number of hashes required to produce the current chain, in hexadecimal.
        nTx:
          type: integer
          description: The number of transactions in the block.
        previousblockhash:
          type: string
          description: The hash of the previous block.
        nextblockhash:
          type: string
          description: The hash of the next block.
    BlockStats:
      type: object
      description: Per-block fee and size statistics. When `stats` is specified in the request, only the requested values are returned.
      properties:
        avgfee:
          type: integer
          description: The average fee in the block, in satoshis.
        avgfeerate:
          type: integer
          description: The average fee rate in the block, in satoshis per virtual byte.
        avgtxsize:
          type: integer
          description: The average transaction size in the block, in bytes.
        blockhash:
          type: string
          description: The hash of the block the statistics were computed for. Use it to check for potential reorgs.
        feerate_percentiles:
          type: array
          description: Fee rates at the 10th, 25th, 50th, 75th and 90th percentile, in satoshis per virtual byte.
          items:
            type: integer
            description: The fee rate at that percentile.
        height:
          type: integer
          description: The block height.
        ins:
          type: integer
          description: The number of inputs in the block, excluding the coinbase input.
        maxfee:
          type: integer
          description: The maximum fee in the block, in satoshis.
        maxfeerate:
          type: integer
          description: The maximum fee rate in the block, in satoshis per virtual byte.
        maxtxsize:
          type: integer
          description: The maximum transaction size in the block, in bytes.
        medianfee:
          type: integer
          description: The truncated median fee in the block, in satoshis.
        mediantime:
          type: integer
          description: The median time past of the block, expressed in UNIX epoch time.
        mediantxsize:
          type: integer
          description: The truncated median transaction size in the block, in bytes.
        minfee:
          type: integer
          description: The minimum fee in the block, in satoshis.
        minfeerate:
          type: integer
          description: The minimum fee rate in the block, in satoshis per virtual byte.
        mintxsize:
          type: integer
          description: The minimum transaction size in the block, in bytes.
        outs:
          type: integer
          description: The number of outputs in the block.
        subsidy:
          type: integer
          description: The block subsidy, in satoshis.
        swtotal_size:
          type: integer
          description: The total size of all segwit transactions, in bytes.
        swtotal_weight:
          type: integer
          description: The total weight of all segwit transactions.
        swtxs:
          type: integer
          description: The number of segwit transactions.
        time:
          type: integer
          description: The block time expressed in UNIX epoch time.
        total_out:
          type: integer
          description: The total amount in all outputs, excluding the coinbase, in satoshis.
        total_size:
          type: integer
          description: The total size of all non-coinbase transactions, in bytes.
        total_weight:
          type: integer
          description: The total weight of all non-coinbase transactions.
        totalfee:
          type: integer
          description: The total fee in the block, in satoshis.
        txs:
          type: integer
          description: The number of transactions in the block, including the coinbase.
        utxo_increase:
          type: integer
          description: The increase or decrease in the number of unspent outputs (UTXOs).
        utxo_size_inc:
          type: integer
          description: The increase or decrease in the size of the UTXO index, in bytes.
        utxo_increase_actual:
          type: integer
          description: The increase or decrease in the number of unspent outputs (UTXOs), not counting unspendables.
        utxo_size_inc_actual:
          type: integer
          description: The increase or decrease in the size of the UTXO index, not counting unspendables, in bytes.
    BlockchainInfo:
      type: object
      description: Blockchain state information object.
      properties:
        chain:
          type: string
          description: The current network name. Returns one of `main`, `test`, `testnet4`, `signet` or `regtest`.
          example: main
        blocks:
          type: integer
          description: The height of the most-work fully-validated chain. The genesis block has height 0.
        headers:
          type: integer
          description: The current number of validated headers.
        bestblockhash:
          type: string
          description: The hash of the current best block.
        bits:
          type: string
          description: nBits, the compact representation of the block difficulty target.
        target:
          type: string
          description: The difficulty target, in hexadecimal.
        difficulty:
          type: number
          description: The current difficulty.
        time:
          type: integer
          description: The time of the current best block, expressed in UNIX epoch time.
        mediantime:
          type: integer
          description: The median time of the current best block, expressed in UNIX epoch time.
        verificationprogress:
          type: number
          description: An estimate of the verification progress. The value ranges from 0 to 1.
        initialblockdownload:
          type: boolean
          description: Whether the node is in Initial Block Download (IBD) mode.
        chainwork:
          type: string
          description: The total amount of work in the active chain, in hexadecimal.
        size_on_disk:
          type: integer
          description: The estimated size of the block and undo files on disk, in bytes.
        pruned:
          type: boolean
          description: Whether the blocks are subject to pruning.
        pruneheight:
          type: integer
          description: The height of the last block pruned, plus one. Returned only when pruning is enabled.
        automatic_pruning:
          type: boolean
          description: Whether automatic pruning is enabled. Returned only when pruning is enabled.
        prune_target_size:
          type: integer
          description: The target size used by pruning, in bytes. Returned only when automatic pruning is enabled.
        signet_challenge:
          type: string
          description: The block challenge of the signet network, in hexadecimal. Returned only on signet.
        warnings:
          type: array
          description: The list of network and blockchain warnings.
          items:
            type: string
            description: A warning message.
    BooleanValue:
      type: boolean
      description: A boolean value that indicates the verification result.
      example: true
    ChainTipArray:
      type: array
      description: The list of all known chain tips.
      items:
        type: object
        description: Chain tip information.
        properties:
          height:
            type: integer
            description: The height of the chain tip.
          hash:
            type: string
            description: The block hash of the tip.
          branchlen:
            type: integer
            description: Zero for the main chain, otherwise the length of the branch connecting the tip to the main chain.
          status:
            type: string
            description: |
              The status of the chain.
              - `invalid`: The branch contains at least one invalid block.
              - `headers-only`: Not all blocks for this branch are available, but the headers are valid.
              - `valid-headers`: All blocks are available, but the branch was never fully validated.
              - `valid-fork`: The branch is fully validated but is not part of the active chain.
              - `active`: The tip of the active main chain.
            enum:
            - invalid
            - headers-only
            - valid-headers
            - valid-fork
            - active
    ChainTxStats:
      type: object
      description: Chain transaction count and rate statistics object.
      properties:
        time:
          type: integer
          description: The timestamp of the final block in the window, expressed in UNIX epoch time.
        txcount:
          type: integer
          description: |
            The total number of transactions in the chain up to that point.
            It may not be returned when the value is unknown, such as when using assumeutxo.
        window_final_block_hash:
          type: string
          description: The hash of the final block in the window.
        window_final_block_height:
          type: integer
          description: The height of the final block in the window.
        window_block_count:
          type: integer
          description: The size of the window in number of blocks.
        window_tx_count:
          type: integer
          description: |
            The number of transactions in the window.
            Returned only when `window_block_count` is greater than 0 and `txcount` exists for both the start and the end of the window.
        window_interval:
          type: integer
          description: The elapsed time in the window, in seconds. Returned only when `window_block_count` is greater than 0.
        txrate:
          type: number
          description: |
            The average rate of transactions per second in the window.
            Returned only when `window_interval` is greater than 0 and `window_tx_count` exists.
    DecodedScript:
      type: object
      description: Decoded script object.
      properties:
        asm:
          type: string
          description: Disassembly of the script.
        desc:
          type: string
          description: Inferred descriptor for the script.
        type:
          type: string
          description: |
            The output type. Returns one of `nonstandard`, `anchor`, `pubkey`, `pubkeyhash`, `scripthash`, `multisig`, `nulldata`,
            `witness_v0_scripthash`, `witness_v0_keyhash`, `witness_v1_taproot` or `witness_unknown`.
        address:
          type: string
          description: The Bitcoin address for the script. Returned only when a well-defined address exists.
        p2sh:
          type: string
          description: The address of the P2SH script wrapping this redeem script. Not returned for types that should not be wrapped.
        segwit:
          type: object
          description: |
            The result of a witness output script wrapping this redeem script.
            Not returned for types that should not be wrapped.
          properties:
            asm:
              type: string
              description: Disassembly of the output script.
            hex:
              type: string
              description: The raw output script bytes, hex-encoded.
            type:
              type: string
              description: The type of the output script.
            address:
              type: string
              description: The corresponding Bitcoin address. Returned only when a well-defined address exists.
            desc:
              type: string
              description: Inferred descriptor for the script.
            p2sh-segwit:
              type: string
              description: The address of the P2SH script wrapping this witness redeem script.
    Difficulty:
      type: number
      description: The proof-of-work difficulty as a multiple of the minimum difficulty.
      example: 150839487445890.6
    HexString:
      type: string
      description: The serialized data, hex-encoded.
      example: 0200000001c8a8a1...
    IndexInfo:
      type: object
      x-map-key-label: index name
      description: The sync status of the indices maintained by the node, as an object keyed by index name.
      additionalProperties:
        type: object
        description: An entry keyed by index name. (e.g.) `txindex`
        properties:
          synced:
            type: boolean
            description: Whether the index is synced or not.
          best_block_height:
            type: integer
            description: The block height to which the index is synced.
    MempoolEntry:
      type: object
      description: Detailed mempool data for a transaction.
      properties:
        vsize:
          type: integer
          description: The virtual transaction size as defined in BIP 141.
        weight:
          type: integer
          description: The transaction weight as defined in BIP 141.
        time:
          type: integer
          description: The local time the transaction entered the pool, expressed in UNIX epoch time.
        height:
          type: integer
          description: The block height when the transaction entered the pool.
        descendantcount:
          type: integer
          description: The number of in-mempool descendant transactions, including this one.
        descendantsize:
          type: integer
          description: The total virtual size of in-mempool descendants, including this one.
        ancestorcount:
          type: integer
          description: The number of in-mempool ancestor transactions, including this one.
        ancestorsize:
          type: integer
          description: The total virtual size of in-mempool ancestors, including this one.
        wtxid:
          type: string
          description: The hash of the serialized transaction, including witness data.
        fees:
          type: object
          description: Detailed transaction fee data. All values are denominated in BTC.
          properties:
            base:
              type: number
              description: The transaction fee.
            modified:
              type: number
              description: The transaction fee with fee deltas used for mining priority.
            ancestor:
              type: number
              description: The transaction fees of in-mempool ancestors with fee deltas used for mining priority.
            descendant:
              type: number
              description: The transaction fees of in-mempool descendants with fee deltas used for mining priority.
        depends:
          type: array
          description: The list of unconfirmed parent transaction ids used as inputs for this transaction.
          items:
            type: string
            description: An unconfirmed parent transaction id.
        spentby:
          type: array
          description: The list of unconfirmed child transaction ids spending outputs from this transaction.
          items:
            type: string
            description: An unconfirmed child transaction id.
        bip125-replaceable:
          type: boolean
          description: Whether this transaction signals BIP 125 replaceability. This field is deprecated.
        unbroadcast:
          type: boolean
          description: Whether this transaction is currently unbroadcast.
    MempoolEntryMap:
      type: object
      x-map-key-label: transaction id
      description: An object keyed by transaction id whose values contain detailed mempool data.
      additionalProperties:
        $ref: '#/components/schemas/MempoolEntry'
    MempoolInfo:
      type: object
      description: Mempool state information object.
      properties:
        loaded:
          type: boolean
          description: Whether the initial load of the persisted mempool has finished.
        size:
          type: integer
          description: The current transaction count in the mempool.
        bytes:
          type: integer
          description: |
            The sum of virtual transaction sizes as defined in BIP 141.
            It differs from the actual serialized size because witness data is discounted.
        usage:
          type: integer
          description: The total memory usage of the mempool, in bytes.
        total_fee:
          type: number
          description: The total fees of all transactions in the mempool, denominated in BTC.
        maxmempool:
          type: integer
          description: The maximum memory usage allowed for the mempool, in bytes.
        mempoolminfee:
          type: number
          description: |
            The minimum fee rate for a transaction to be accepted into the mempool.
            It is the maximum of `minrelaytxfee` and the minimum mempool fee, expressed in BTC/kvB.
        minrelaytxfee:
          type: number
          description: The current minimum relay fee rate for transactions, expressed in BTC/kvB.
        incrementalrelayfee:
          type: number
          description: The minimum fee increment for transaction replacement (RBF), expressed in BTC/kvB.
        unbroadcastcount:
          type: integer
          description: The number of transactions that have not passed initial broadcast yet.
        fullrbf:
          type: boolean
          description: Whether the mempool accepts transaction replacement (RBF) without checking the BIP 125 signal.
        permitbaremultisig:
          type: boolean
          description: Whether transactions with bare multisig outputs are accepted.
        maxdatacarriersize:
          type: integer
          description: The maximum size allowed for an OP_RETURN output, in bytes.
    RawMempool:
      description: |
        The list of transactions in the mempool. The response format depends on the request parameters.
        - When `verbose` is `false`: an array of transaction ids
        - When `verbose` is `false` and `mempool_sequence` is `true`: an object containing `txids` and `mempool_sequence`
        - When `verbose` is `true`: an object keyed by transaction id with detailed data
      oneOf:
      - title: Transaction ID Array
        type: array
        description: An array of transaction ids. Returned when `verbose` is `false`.
        items:
          type: string
          description: A transaction id in the mempool.
      - title: Transaction ID Array With Sequence
        type: object
        description: Returned when `verbose` is `false` and `mempool_sequence` is `true`.
        properties:
          txids:
            type: array
            description: The list of transaction ids in the mempool.
            items:
              type: string
              description: The transaction id.
          mempool_sequence:
            type: integer
            description: The mempool sequence value.
      - title: Mempool Entry Map
        $ref: '#/components/schemas/MempoolEntryMap'
    RawTransaction:
      type: object
      description: Decoded transaction object.
      properties:
        in_active_chain:
          type: boolean
          description: Whether the specified block is in the active chain. Returned only when `blockhash` is provided.
        hex:
          type: string
          description: The serialized transaction, hex-encoded.
        txid:
          type: string
          description: The transaction id.
        hash:
          type: string
          description: The transaction hash. It differs from `txid` for witness transactions.
        size:
          type: integer
          description: The serialized transaction size, in bytes.
        vsize:
          type: integer
          description: The virtual transaction size as defined in BIP 141. It differs from `size` for witness transactions.
        weight:
          type: integer
          description: The transaction weight as defined in BIP 141. The value is between `vsize * 4 - 3` and `vsize * 4`.
        version:
          type: integer
          description: The transaction version.
        locktime:
          type: integer
          description: The lock time that determines when the transaction becomes valid.
        vin:
          type: array
          description: The list of transaction inputs.
          items:
            $ref: '#/components/schemas/Vin'
        vout:
          type: array
          description: The list of transaction outputs.
          items:
            $ref: '#/components/schemas/Vout'
        fee:
          type: number
          description: |
            The transaction fee, denominated in BTC.
            Returned when `verbosity` is 2, and omitted if the block undo data is not available.
        blockhash:
          type: string
          description: The hash of the block containing the transaction.
        confirmations:
          type: integer
          description: The number of confirmations of the transaction.
        blocktime:
          type: integer
          description: The time of the block containing the transaction, expressed in UNIX epoch time.
        time:
          type: integer
          description: Same as `blocktime`.
    ScriptPubKey:
      type: object
      description: The output script (scriptPubKey) that defines the conditions for spending the output.
      properties:
        asm:
          type: string
          description: Disassembly of the script.
        desc:
          type: string
          description: Inferred descriptor for the script.
        hex:
          type: string
          description: The raw script bytes, hex-encoded.
        address:
          type: string
          description: The Bitcoin address for the script. Returned only when a well-defined address exists.
        type:
          type: string
          description: |
            The output type.
            - `nonstandard`: A script that does not match any standard type.
            - `anchor`: A Pay-to-Anchor (P2A) output.
            - `pubkey`: An output locked directly by a public key (P2PK).
            - `pubkeyhash`: An output locked by a public key hash (P2PKH).
            - `scripthash`: An output locked by a script hash (P2SH).
            - `multisig`: An output that requires multiple signatures.
            - `nulldata`: An output that only records data via OP_RETURN.
            - `witness_v0_keyhash`: A SegWit v0 public key hash output (P2WPKH).
            - `witness_v0_scripthash`: A SegWit v0 script hash output (P2WSH).
            - `witness_v1_taproot`: A Taproot output (P2TR).
            - `witness_unknown`: An output with an unknown witness version.
          example: witness_v0_keyhash
    ScriptSig:
      type: object
      description: The signature script (scriptSig) that unlocks the output referenced by the input.
      properties:
        asm:
          type: string
          description: Disassembly of the script.
        hex:
          type: string
          description: The script, hex-encoded.
    SmartFeeEstimate:
      type: object
      description: Fee rate estimate object.
      properties:
        feerate:
          type: number
          description: The estimated fee rate, expressed in BTC/kvB. Returned only when no errors were encountered.
        errors:
          type: array
          description: The list of errors encountered during estimation. Returned only when an error occurred.
          items:
            type: string
            description: An error message.
        blocks:
          type: integer
          description: |
            The block number where the estimate was found.
            The requested target is clamped between 2 and the highest target fee estimation is able to return.
    TestMempoolAcceptResult:
      type: array
      description: The mempool acceptance result for each submitted transaction, returned in the same order as the request.
      items:
        type: object
        description: The validation result for an individual transaction.
        properties:
          txid:
            type: string
            description: The transaction id.
          wtxid:
            type: string
            description: The hash of the serialized transaction, including witness data.
          package-error:
            type: string
            description: A package validation error. It can be returned only when more than one transaction was submitted.
          allowed:
            type: boolean
            description: Whether this transaction would be accepted into the mempool and pass the requested `maxfeerate`.
          vsize:
            type: integer
            description: The virtual transaction size as defined in BIP 141. Returned only when `allowed` is `true`.
          fees:
            type: object
            description: Transaction fee data. Returned only when `allowed` is `true`.
            properties:
              base:
                type: number
                description: The transaction fee, denominated in BTC.
              effective-feerate:
                type: number
                description: The effective fee rate used for validation, expressed in BTC/kvB.
              effective-includes:
                type: array
                description: The list of witness hashes of the transactions whose fees and virtual sizes are included in the effective fee rate.
                items:
                  type: string
                  description: The witness hash of a transaction.
          reject-reason:
            type: string
            description: The reason the transaction was rejected. Returned only when `allowed` is `false`.
          reject-details:
            type: string
            description: The details of the rejection. Returned only when `allowed` is `false` and rejection details exist.
    TxId:
      type: string
      description: The hex-encoded transaction id.
      example: 4a5e1e4baab89f3a32518a88c31bc87f618f76673e2cc77ab2127b7afdeda33b
    TxIdArray:
      type: array
      description: The list of transaction ids.
      items:
        type: string
        description: The transaction id.
      example:
      - 4a5e1e4baab89f3a32518a88c31bc87f618f76673e2cc77ab2127b7afdeda33b
      - 9b0fc92260312ce44e74ef369f5c66bbb85848f2eddd5a7a1cde251e54ccfdd5
    TxOut:
      type: object
      description: Unspent transaction output (UTXO) information object.
      properties:
        bestblock:
          type: string
          description: The hash of the block at the tip of the chain.
        confirmations:
          type: integer
          description: The number of confirmations of the transaction containing the output.
        value:
          type: number
          description: The value of the output, denominated in BTC.
        scriptPubKey:
          $ref: '#/components/schemas/ScriptPubKey'
        coinbase:
          type: boolean
          description: Whether the output is a coinbase output.
    TxOutSetInfo:
      type: object
      description: UTXO set statistics object.
      properties:
        height:
          type: integer
          description: The height of the block the statistics were computed for.
        bestblock:
          type: string
          description: The hash of the block the statistics were computed for.
        txouts:
          type: integer
          description: The number of unspent transaction outputs.
        bogosize:
          type: integer
          description: A database-independent metric for the size of the UTXO set.
        hash_serialized_3:
          type: string
          description: The serialized hash of the UTXO set. Returned only when `hash_type` is `hash_serialized_3`.
        muhash:
          type: string
          description: The MuHash of the UTXO set. Returned only when `hash_type` is `muhash`.
        transactions:
          type: integer
          description: The number of transactions with unspent outputs. Returned only when coinstatsindex is not used.
        disk_size:
          type: integer
          description: The estimated size of the chainstate on disk, in bytes. Returned only when coinstatsindex is not used.
        total_amount:
          type: number
          description: The total amount of coins in the UTXO set, denominated in BTC.
        total_unspendable_amount:
          type: number
          description: |
            The total amount permanently excluded from the UTXO set.
            It is denominated in BTC and returned only when coinstatsindex is used.
        block_info:
          type: object
          description: Amount details for the target block. Returned only when coinstatsindex is used.
          properties:
            prevout_spent:
              type: number
              description: The total amount of prevouts spent in the block, denominated in BTC.
            coinbase:
              type: number
              description: The coinbase amount of the block, denominated in BTC.
            new_outputs_ex_coinbase:
              type: number
              description: The total amount of new outputs excluding the coinbase, denominated in BTC.
            unspendable:
              type: number
              description: The total amount of unspendable outputs created in the block, denominated in BTC.
            unspendables:
              type: object
              description: Unspendable amounts broken down by cause. All values are denominated in BTC.
              properties:
                genesis_block:
                  type: number
                  description: The amount that is unspendable because of the genesis block reward.
                bip30:
                  type: number
                  description: The amount that is unspendable because of transactions overwritten under BIP 30.
                scripts:
                  type: number
                  description: The amount that is unspendable because of unspendable scripts, such as OP_RETURN.
                unclaimed_rewards:
                  type: number
                  description: The block reward amount that miners did not claim.
    Vin:
      type: object
      description: A transaction input.
      properties:
        coinbase:
          type: string
          description: The coinbase value of the input. Returned only for coinbase inputs.
        txid:
          type: string
          description: The id of the previous transaction referenced by this input. Returned only for non-coinbase inputs.
        vout:
          type: integer
          description: The output index of the previous transaction referenced by this input. Returned only for non-coinbase inputs.
        scriptSig:
          $ref: '#/components/schemas/ScriptSig'
        txinwitness:
          type: array
          description: The hex-encoded witness data. Returned only for SegWit inputs.
          items:
            type: string
            description: A witness stack item.
        prevout:
          type: object
          description: |
            The previous output spent by this input.
            It is returned when `verbosity` is 2 for `getrawtransaction` or 3 for `getblock`,
            and omitted if the block undo data is not available.
          properties:
            generated:
              type: boolean
              description: Whether the output was generated by a coinbase transaction.
            height:
              type: integer
              description: The height of the block containing the previous output.
            value:
              type: number
              description: The value of the previous output, denominated in BTC.
            scriptPubKey:
              $ref: '#/components/schemas/ScriptPubKey'
        sequence:
          type: integer
          description: The script sequence number of the input.
          example: 4294967295
    Vout:
      type: object
      description: A transaction output.
      properties:
        value:
          type: number
          description: The value of the output, denominated in BTC.
          example: 0.0125
        n:
          type: integer
          description: The index of the output within the transaction.
          example: 0
        scriptPubKey:
          $ref: '#/components/schemas/ScriptPubKey'
  responses:
    "400":
      description: Bad Request
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - MISSING_REQUIRED_PARAMETER
                - INVALID_PARAMETER
                - WRONG_RANGE_PARAMETER
                - DEPRECATED_OPERATION
                description: Code to identify the cause of the bad request
              message:
                type: string
                description: Detailed message including the name, value, etc. of the invalid parameter
            required:
            - code
            - message
          examples:
            MISSING_REQUIRED_PARAMETER:
              summary: A required parameter is missing
              value:
                code: MISSING_REQUIRED_PARAMETER
                message: 'Missing required parameter: { PARAMETER_NAME }'
            INVALID_PARAMETER:
              summary: A parameter has an invalid value
              value:
                code: INVALID_PARAMETER
                message: 'Invalid parameter: { PARAMETER1_NAME = PARAMETER1_VALUE }'
            WRONG_RANGE_PARAMETER:
              summary: A value is outside the allowed range
              value:
                code: WRONG_RANGE_PARAMETER
                message: 'Wrong range parameter: { PARAMETER_NAME }'
            DEPRECATED_OPERATION:
              summary: The requested API is no longer supported
              value:
                code: DEPRECATED_OPERATION
                message: This operation has been deprecated
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - NO_AUTHENTICATION_FOUND
                - AUTHENTICATION_FAILED
                description: Code to identify the cause of authentication failure
              message:
                type: string
                description: Detailed message including the cause of authentication failure
            required:
            - code
            - message
          examples:
            NO_AUTHENTICATION_FOUND:
              summary: The request does not include authentication (API Key)
              value:
                code: NO_AUTHENTICATION_FOUND
                message: No authentication found.
            AUTHENTICATION_FAILED:
              summary: The authentication (API Key) is invalid
              value:
                code: AUTHENTICATION_FAILED
                message: Authentication failed.
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - PERMISSION_DENIED
                description: Code indicating permission denied
              message:
                type: string
                description: Detailed message including information about the denied resource
            required:
            - code
            - message
          examples:
            PERMISSION_DENIED:
              summary: The request accesses a resource it is not authorized for
              value:
                code: PERMISSION_DENIED
                message: Permission denied
    "404":
      description: Not Found
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - WRONG_ENDPOINT
                - NOT_SUPPORTED_CHAIN
                - RESOURCE_NOT_FOUND
                description: Code to identify the cause of the resource not found
              message:
                type: string
                description: Detailed message including the name, value, etc. of the resource not found
            required:
            - code
            - message
          examples:
            WRONG_ENDPOINT:
              summary: The requested API path does not exist
              value:
                code: WRONG_ENDPOINT
                message: Wrong endpoint
            NOT_SUPPORTED_CHAIN:
              summary: The requested chain is not supported
              value:
                code: NOT_SUPPORTED_CHAIN
                message: Not supported chain
            RESOURCE_NOT_FOUND:
              summary: The requested resource does not exist
              value:
                code: RESOURCE_NOT_FOUND
                message: 'Resource not found: { RESOURCE_NAME = RESOURCE_VALUE }'
    "405":
      description: Method Not Allowed
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - METHOD_NOT_ALLOWED
                description: Code indicating a disallowed HTTP method
              message:
                type: string
                description: Detailed message about the disallowed HTTP method
            required:
            - code
            - message
          examples:
            METHOD_NOT_ALLOWED:
              summary: The request uses an unsupported HTTP method
              value:
                code: METHOD_NOT_ALLOWED
                message: Method not allowed
    "408":
      description: Request Timeout
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TIMEOUT
                description: Code indicating request timeout
              message:
                type: string
                description: Detailed message including the cause of the timeout
            required:
            - code
            - message
          examples:
            TIMEOUT:
              summary: Processing did not finish within the time limit
              value:
                code: TIMEOUT
                message: Request timeout
    "409":
      description: Conflict
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - RESOURCE_ALREADY_EXISTS
                - REJECTED
                description: Code to identify the cause of the request conflict
              message:
                type: string
                description: Detailed message including information about the conflicting resource
            required:
            - code
            - message
          examples:
            RESOURCE_ALREADY_EXISTS:
              summary: The request tries to create a resource that already exists
              value:
                code: RESOURCE_ALREADY_EXISTS
                message: Resource already exists
            REJECTED:
              summary: The server rejected the request
              value:
                code: REJECTED
                message: Request rejected
    "413":
      description: Payload Too Large
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - CONTENTS_TOO_LARGE
                description: Code indicating payload size exceeded
              message:
                type: string
                description: Detailed message including the maximum allowed payload size
            required:
            - code
            - message
          examples:
            CONTENTS_TOO_LARGE:
              summary: The payload exceeds the server's maximum size
              value:
                code: CONTENTS_TOO_LARGE
                message: Contents too large
    "414":
      description: URI Too Long
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_LONG_URI
                description: Code indicating URI length exceeded
              message:
                type: string
                description: Detailed message including the maximum allowed URI length
            required:
            - code
            - message
          examples:
            TOO_LONG_URI:
              summary: The request URI exceeds the server's maximum length
              value:
                code: TOO_LONG_URI
                message: URI too long
    "429":
      description: Too Many Requests
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_MANY_REQUESTS
                - EXCEEDED_QUOTA_LIMIT
                description: Code identifying the cause of the request limit exceeded
              message:
                type: string
                description: Detailed message including the exceeded limit type and allowed threshold
            required:
            - code
            - message
          examples:
            TOO_MANY_REQUESTS:
              summary: The rate limit was exceeded
              value:
                code: TOO_MANY_REQUESTS
                message: Too many requests
            EXCEEDED_QUOTA_LIMIT:
              summary: The quota limit was exceeded
              value:
                code: EXCEEDED_QUOTA_LIMIT
                message: Exceeded quota limit
    "500":
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - INTERNAL_SERVER_ERROR
                - INTERRUPTED
                description: Code to identify the cause of the internal server error
              message:
                type: string
                description: Detailed message including the cause of the server error
            required:
            - code
            - message
          examples:
            INTERNAL_SERVER_ERROR:
              summary: An internal server error occurred
              value:
                code: INTERNAL_SERVER_ERROR
                message: Internal server error
            INTERRUPTED:
              summary: Processing failed temporarily due to server load
              value:
                code: INTERRUPTED
                message: Request interrupted
    "503":
      description: Service Unavailable
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - UNAVAILABLE
                description: Code indicating service unavailability
              message:
                type: string
                description: Detailed message including the cause of the service outage
            required:
            - code
            - message
          examples:
            UNAVAILABLE:
              summary: The service is unavailable due to infrastructure downtime or an upgrade
              value:
                code: UNAVAILABLE
                message: Service unavailable
paths:
  /:
    post:
      security:
      - api_key: []
      operationId: bitcoin-getblockchaininfo
      summary: getblockchaininfo
      description: |
        Returns an object containing various state information regarding blockchain processing.
        It includes the network name, the block height, the best block hash, the difficulty target, the verification progress and the pruning settings.

        > 📘 The softfork activation status was removed from this method in Bitcoin Core 25.0 and moved to `getdeploymentinfo`.
      x-seo-description: Returns an object containing various state info regarding blockchain processing.
      tags:
      - blockchain
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - jsonrpc
              - method
              - params
              properties:
                id:
                  type: integer
                  example: 1
                jsonrpc:
                  type: string
                  example: "2.0"
                method:
                  type: string
                  example: getblockchaininfo
                params:
                  type: array
                  description: This method takes no parameters. Pass an empty array.
                  items: {}
                  example: []
              example:
                id: 1
                jsonrpc: "2.0"
                method: getblockchaininfo
                params: []
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              example:
                jsonrpc: "2.0"
                id: 1
                result:
                  chain: main
                  blocks: 920000
                  headers: 920000
                  bestblockhash: 000000000000000000024bead8df69990852c202db0e0097c1a12ea637d7e96d
                  bits: 17038a4f
                  target: 000000000000000000038a4f0000000000000000000000000000000000000000
                  difficulty: 150839487445890.6
                  time: 1701388800
                  mediantime: 1701386400
                  verificationprogress: 0.9999987
                  initialblockdownload: false
                  chainwork: 00000000000000000000000000000000000000005f6bb1e6d0d1a3d5f6a5b8c1
                  size_on_disk: 623456789012
                  pruned: false
                  warnings: []
              schema:
                $ref: '#/components/schemas/BlockchainInfo'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "404":
          $ref: '#/components/responses/404'
        "405":
          $ref: '#/components/responses/405'
        "408":
          $ref: '#/components/responses/408'
        "409":
          $ref: '#/components/responses/409'
        "413":
          $ref: '#/components/responses/413'
        "414":
          $ref: '#/components/responses/414'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
        "503":
          $ref: '#/components/responses/503'
