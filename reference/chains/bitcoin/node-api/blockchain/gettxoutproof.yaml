openapi: 3.1.0
info:
  title: Bitcoin - gettxoutproof
  version: 1.0.0
servers:
- url: https://bitcoin-mainnet.nodit.io
  description: Bitcoin Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  schemas:
    HexString:
      type: string
      description: The serialized data, hex-encoded.
      example: 0200000001c8a8a1...
  responses:
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - NO_AUTHENTICATION_FOUND
                - AUTHENTICATION_FAILED
                description: Code to identify the cause of authentication failure
              message:
                type: string
                description: Detailed message including the cause of authentication failure
            required:
            - code
            - message
          examples:
            NO_AUTHENTICATION_FOUND:
              summary: The request does not include authentication (API Key)
              value:
                code: NO_AUTHENTICATION_FOUND
                message: No authentication found.
            AUTHENTICATION_FAILED:
              summary: The authentication (API Key) is invalid
              value:
                code: AUTHENTICATION_FAILED
                message: Authentication failed.
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - PERMISSION_DENIED
                description: Code indicating permission denied
              message:
                type: string
                description: Detailed message including information about the denied resource
            required:
            - code
            - message
          examples:
            PERMISSION_DENIED:
              summary: The request accesses a resource it is not authorized for
              value:
                code: PERMISSION_DENIED
                message: Permission denied
    "429":
      description: Too Many Requests
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_MANY_REQUESTS
                - EXCEEDED_QUOTA_LIMIT
                description: Code identifying the cause of the request limit exceeded
              message:
                type: string
                description: Detailed message including the exceeded limit type and allowed threshold
            required:
            - code
            - message
          examples:
            TOO_MANY_REQUESTS:
              summary: The rate limit was exceeded
              value:
                code: TOO_MANY_REQUESTS
                message: Too many requests
            EXCEEDED_QUOTA_LIMIT:
              summary: The quota limit was exceeded
              value:
                code: EXCEEDED_QUOTA_LIMIT
                message: Exceeded quota limit
    "500":
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - INTERNAL_SERVER_ERROR
                - INTERRUPTED
                description: Code to identify the cause of the internal server error
              message:
                type: string
                description: Detailed message including the cause of the server error
            required:
            - code
            - message
          examples:
            INTERNAL_SERVER_ERROR:
              summary: An internal server error occurred
              value:
                code: INTERNAL_SERVER_ERROR
                message: Internal server error
            INTERRUPTED:
              summary: Processing failed temporarily due to server load
              value:
                code: INTERRUPTED
                message: Request interrupted
paths:
  /:
    post:
      security:
      - api_key: []
      operationId: bitcoin-gettxoutproof
      summary: gettxoutproof
      description: |
        Returns a hex-encoded merkle proof that one or more transactions were included in a block.
        The returned proof can be verified with `verifytxoutproof`.

        > 📘 When the target transaction no longer has an unspent output in the UTXO set, you must also pass `blockhash`.
      x-seo-description: Returns a hex-encoded proof that one or more transactions were included in a block.
      tags:
      - blockchain
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - jsonrpc
              - method
              - params
              properties:
                id:
                  type: integer
                  example: 1
                jsonrpc:
                  type: string
                  example: "2.0"
                method:
                  type: string
                  example: gettxoutproof
                params:
                  type: array
                  description: |-
                    It contains following parameters in order:
                    1. `txids`: The transaction ids to prove, as an array of strings. (required)
                    2. `blockhash`: The hash of the block to look for the transactions in, as a string. (optional)
                  items:
                    oneOf:
                    - title: Txids
                      type: array
                      description: The transaction ids to prove. All transactions must be included in the same block.
                      items:
                        type: string
                        description: The transaction id.
                      example:
                      - 4a5e1e4baab89f3a32518a88c31bc87f618f76673e2cc77ab2127b7afdeda33b
                    - title: Block Hash
                      type: string
                      description: The hash of the block to look for the transactions in. The UTXO set is searched when omitted.
                      example: 000000000000000000024bead8df69990852c202db0e0097c1a12ea637d7e96d
                  example:
                  - - 4a5e1e4baab89f3a32518a88c31bc87f618f76673e2cc77ab2127b7afdeda33b
                  - 000000000000000000024bead8df69990852c202db0e0097c1a12ea637d7e96d
              example:
                id: 1
                jsonrpc: "2.0"
                method: gettxoutproof
                params:
                - - 4a5e1e4baab89f3a32518a88c31bc87f618f76673e2cc77ab2127b7afdeda33b
                - 000000000000000000024bead8df69990852c202db0e0097c1a12ea637d7e96d
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              example:
                jsonrpc: "2.0"
                id: 1
                result: 0000202f8bd5a1f0e9c7b6a5948372615f4e3d2c1b0a99887766554433221100ffee0100000001
              schema:
                $ref: '#/components/schemas/HexString'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
