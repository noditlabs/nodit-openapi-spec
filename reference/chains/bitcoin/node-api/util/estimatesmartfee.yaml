openapi: 3.1.0
info:
  title: Bitcoin - estimatesmartfee
  version: 1.0.0
servers:
- url: https://bitcoin-mainnet.nodit.io
  description: Bitcoin Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  schemas:
    SmartFeeEstimate:
      type: object
      description: Fee rate estimate object.
      properties:
        feerate:
          type: number
          description: The estimated fee rate, expressed in BTC/kvB. Returned only when no errors were encountered.
        errors:
          type: array
          description: The list of errors encountered during estimation. Returned only when an error occurred.
          items:
            type: string
            description: An error message.
        blocks:
          type: integer
          description: |
            The block number where the estimate was found.
            The requested target is clamped between 2 and the highest target fee estimation is able to return.
  responses:
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - NO_AUTHENTICATION_FOUND
                - AUTHENTICATION_FAILED
                description: Code to identify the cause of authentication failure
              message:
                type: string
                description: Detailed message including the cause of authentication failure
            required:
            - code
            - message
          examples:
            NO_AUTHENTICATION_FOUND:
              summary: The request does not include authentication (API Key)
              value:
                code: NO_AUTHENTICATION_FOUND
                message: No authentication found.
            AUTHENTICATION_FAILED:
              summary: The authentication (API Key) is invalid
              value:
                code: AUTHENTICATION_FAILED
                message: Authentication failed.
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - PERMISSION_DENIED
                description: Code indicating permission denied
              message:
                type: string
                description: Detailed message including information about the denied resource
            required:
            - code
            - message
          examples:
            PERMISSION_DENIED:
              summary: The request accesses a resource it is not authorized for
              value:
                code: PERMISSION_DENIED
                message: Permission denied
    "429":
      description: Too Many Requests
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_MANY_REQUESTS
                - EXCEEDED_QUOTA_LIMIT
                description: Code identifying the cause of the request limit exceeded
              message:
                type: string
                description: Detailed message including the exceeded limit type and allowed threshold
            required:
            - code
            - message
          examples:
            TOO_MANY_REQUESTS:
              summary: The rate limit was exceeded
              value:
                code: TOO_MANY_REQUESTS
                message: Too many requests
            EXCEEDED_QUOTA_LIMIT:
              summary: The quota limit was exceeded
              value:
                code: EXCEEDED_QUOTA_LIMIT
                message: Exceeded quota limit
    "500":
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - INTERNAL_SERVER_ERROR
                - INTERRUPTED
                description: Code to identify the cause of the internal server error
              message:
                type: string
                description: Detailed message including the cause of the server error
            required:
            - code
            - message
          examples:
            INTERNAL_SERVER_ERROR:
              summary: An internal server error occurred
              value:
                code: INTERNAL_SERVER_ERROR
                message: Internal server error
            INTERRUPTED:
              summary: Processing failed temporarily due to server load
              value:
                code: INTERRUPTED
                message: Request interrupted
paths:
  /:
    post:
      security:
      - api_key: []
      operationId: bitcoin-estimatesmartfee
      summary: estimatesmartfee
      description: |
        Estimates the fee rate per kvB needed for a transaction to begin confirmation within the target number of blocks.

        > 📘 When there is not enough data for an estimate, `errors` is returned instead of `feerate`.
      x-seo-description: Estimates the approximate fee per kilobyte needed for a transaction to begin confirmation within a target number of blocks.
      tags:
      - util
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - jsonrpc
              - method
              - params
              properties:
                id:
                  type: integer
                  example: 1
                jsonrpc:
                  type: string
                  example: "2.0"
                method:
                  type: string
                  example: estimatesmartfee
                params:
                  type: array
                  description: |-
                    It contains following parameters in order:
                    1. `conf_target`: The confirmation target in blocks, as an integer between 1 and 1008. (required)
                    2. `estimate_mode`: The fee estimate mode, as a string. (optional, default `economical`)
                  items:
                    oneOf:
                    - title: Conf Target
                      type: integer
                      description: The confirmation target in blocks. Pass a value between 1 and 1008.
                      example: 6
                    - title: Estimate Mode
                      type: string
                      description: |
                        The fee estimate mode.
                        - `economical`: Estimates over a shorter time horizon, so it is more responsive to short-term fee drops.
                        - `conservative`: Estimates over a longer time horizon, so it is less responsive to short-term fee drops. It is more likely to be sufficient for the target but may return a higher fee rate.
                        - `unset`: Does not set a mode and uses the default behavior.
                      enum:
                      - unset
                      - economical
                      - conservative
                      example: economical
                  example:
                  - 6
                  - economical
              example:
                id: 1
                jsonrpc: "2.0"
                method: estimatesmartfee
                params:
                - 6
                - economical
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              example:
                jsonrpc: "2.0"
                id: 1
                result:
                  feerate: 0.00018327
                  blocks: 6
              schema:
                $ref: '#/components/schemas/SmartFeeEstimate'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
