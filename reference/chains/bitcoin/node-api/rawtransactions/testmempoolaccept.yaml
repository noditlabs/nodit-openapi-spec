openapi: 3.1.0
info:
  title: Bitcoin - testmempoolaccept
  version: 1.0.0
servers:
- url: https://bitcoin-mainnet.nodit.io
  description: Bitcoin Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  schemas:
    TestMempoolAcceptResult:
      type: array
      description: The mempool acceptance result for each submitted transaction, returned in the same order as the request.
      items:
        type: object
        description: The validation result for an individual transaction.
        properties:
          txid:
            type: string
            description: The transaction id.
          wtxid:
            type: string
            description: The hash of the serialized transaction, including witness data.
          package-error:
            type: string
            description: A package validation error. It can be returned only when more than one transaction was submitted.
          allowed:
            type: boolean
            description: Whether this transaction would be accepted into the mempool and pass the requested `maxfeerate`.
          vsize:
            type: integer
            description: The virtual transaction size as defined in BIP 141. Returned only when `allowed` is `true`.
          fees:
            type: object
            description: Transaction fee data. Returned only when `allowed` is `true`.
            properties:
              base:
                type: number
                description: The transaction fee, denominated in BTC.
              effective-feerate:
                type: number
                description: The effective fee rate used for validation, expressed in BTC/kvB.
              effective-includes:
                type: array
                description: The list of witness hashes of the transactions whose fees and virtual sizes are included in the effective fee rate.
                items:
                  type: string
                  description: The witness hash of a transaction.
          reject-reason:
            type: string
            description: The reason the transaction was rejected. Returned only when `allowed` is `false`.
          reject-details:
            type: string
            description: The details of the rejection. Returned only when `allowed` is `false` and rejection details exist.
  responses:
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - NO_AUTHENTICATION_FOUND
                - AUTHENTICATION_FAILED
                description: Code to identify the cause of authentication failure
              message:
                type: string
                description: Detailed message including the cause of authentication failure
            required:
            - code
            - message
          examples:
            NO_AUTHENTICATION_FOUND:
              summary: The request does not include authentication (API Key)
              value:
                code: NO_AUTHENTICATION_FOUND
                message: No authentication found.
            AUTHENTICATION_FAILED:
              summary: The authentication (API Key) is invalid
              value:
                code: AUTHENTICATION_FAILED
                message: Authentication failed.
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - PERMISSION_DENIED
                description: Code indicating permission denied
              message:
                type: string
                description: Detailed message including information about the denied resource
            required:
            - code
            - message
          examples:
            PERMISSION_DENIED:
              summary: The request accesses a resource it is not authorized for
              value:
                code: PERMISSION_DENIED
                message: Permission denied
    "429":
      description: Too Many Requests
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_MANY_REQUESTS
                - EXCEEDED_QUOTA_LIMIT
                description: Code identifying the cause of the request limit exceeded
              message:
                type: string
                description: Detailed message including the exceeded limit type and allowed threshold
            required:
            - code
            - message
          examples:
            TOO_MANY_REQUESTS:
              summary: The rate limit was exceeded
              value:
                code: TOO_MANY_REQUESTS
                message: Too many requests
            EXCEEDED_QUOTA_LIMIT:
              summary: The quota limit was exceeded
              value:
                code: EXCEEDED_QUOTA_LIMIT
                message: Exceeded quota limit
    "500":
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - INTERNAL_SERVER_ERROR
                - INTERRUPTED
                description: Code to identify the cause of the internal server error
              message:
                type: string
                description: Detailed message including the cause of the server error
            required:
            - code
            - message
          examples:
            INTERNAL_SERVER_ERROR:
              summary: An internal server error occurred
              value:
                code: INTERNAL_SERVER_ERROR
                message: Internal server error
            INTERRUPTED:
              summary: Processing failed temporarily due to server load
              value:
                code: INTERRUPTED
                message: Request interrupted
paths:
  /:
    post:
      security:
      - api_key: []
      operationId: bitcoin-testmempoolaccept
      summary: testmempoolaccept
      description: |
        Verifies whether a transaction would be accepted into the mempool without actually submitting it.
        Use it as a pre-flight check before broadcasting.

        > 📘 Submitting more than one transaction validates them as a package, in which case `package-error` may be returned.
      x-seo-description: Returns result of mempool acceptance tests for a raw transaction without submitting it.
      tags:
      - rawtransactions
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - jsonrpc
              - method
              - params
              properties:
                id:
                  type: integer
                  example: 1
                jsonrpc:
                  type: string
                  example: "2.0"
                method:
                  type: string
                  example: testmempoolaccept
                params:
                  type: array
                  description: |-
                    It contains following parameters in order:
                    1. `rawtxs`: The hex strings of the transactions to validate, as an array. (required)
                    2. `maxfeerate`: The maximum fee rate to allow. (optional, default `0.10`)
                  items:
                    oneOf:
                    - title: Rawtxs
                      type: array
                      description: The hex strings of the transactions to validate.
                      items:
                        type: string
                        description: The hex string of the signed raw transaction.
                      example:
                      - 02000000013ba3edfd7a7b12b27ac72c3e67768f617fc81bc3888a51323a9fb8aa4b1e5e4a00000000da00483045
                    - title: Maxfeerate
                      type: string
                      description: |
                        Reject transactions whose fee rate is higher than this value, expressed in BTC/kvB.
                        Fee rates larger than 1 BTC/kvB are rejected. Set to `0` to accept any fee rate.
                      example: "0.10"
                  example:
                  - - 02000000013ba3edfd7a7b12b27ac72c3e67768f617fc81bc3888a51323a9fb8aa4b1e5e4a00000000da00483045
                  - "0.10"
              example:
                id: 1
                jsonrpc: "2.0"
                method: testmempoolaccept
                params:
                - - 02000000013ba3edfd7a7b12b27ac72c3e67768f617fc81bc3888a51323a9fb8aa4b1e5e4a00000000da00483045
                - "0.10"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              example:
                jsonrpc: "2.0"
                id: 1
                result:
                - txid: 4a5e1e4baab89f3a32518a88c31bc87f618f76673e2cc77ab2127b7afdeda33b
                  wtxid: 9b0fc92260312ce44e74ef369f5c66bbb85848f2eddd5a7a1cde251e54ccfdd5
                  allowed: true
                  vsize: 144
                  fees:
                    base: 2.538e-05
                    effective-feerate: 0.00017625
                    effective-includes:
                    - 9b0fc92260312ce44e74ef369f5c66bbb85848f2eddd5a7a1cde251e54ccfdd5
              schema:
                $ref: '#/components/schemas/TestMempoolAcceptResult'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
