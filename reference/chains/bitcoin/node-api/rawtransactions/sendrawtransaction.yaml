openapi: 3.1.0
info:
  title: Bitcoin - sendrawtransaction
  version: 1.0.0
servers:
- url: https://bitcoin-mainnet.nodit.io
  description: Bitcoin Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  schemas:
    TxId:
      type: string
      description: The hex-encoded transaction id.
      example: 4a5e1e4baab89f3a32518a88c31bc87f618f76673e2cc77ab2127b7afdeda33b
  responses:
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - NO_AUTHENTICATION_FOUND
                - AUTHENTICATION_FAILED
                description: Code to identify the cause of authentication failure
              message:
                type: string
                description: Detailed message including the cause of authentication failure
            required:
            - code
            - message
          examples:
            NO_AUTHENTICATION_FOUND:
              summary: The request does not include authentication (API Key)
              value:
                code: NO_AUTHENTICATION_FOUND
                message: No authentication found.
            AUTHENTICATION_FAILED:
              summary: The authentication (API Key) is invalid
              value:
                code: AUTHENTICATION_FAILED
                message: Authentication failed.
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - PERMISSION_DENIED
                description: Code indicating permission denied
              message:
                type: string
                description: Detailed message including information about the denied resource
            required:
            - code
            - message
          examples:
            PERMISSION_DENIED:
              summary: The request accesses a resource it is not authorized for
              value:
                code: PERMISSION_DENIED
                message: Permission denied
    "429":
      description: Too Many Requests
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_MANY_REQUESTS
                - EXCEEDED_QUOTA_LIMIT
                description: Code identifying the cause of the request limit exceeded
              message:
                type: string
                description: Detailed message including the exceeded limit type and allowed threshold
            required:
            - code
            - message
          examples:
            TOO_MANY_REQUESTS:
              summary: The rate limit was exceeded
              value:
                code: TOO_MANY_REQUESTS
                message: Too many requests
            EXCEEDED_QUOTA_LIMIT:
              summary: The quota limit was exceeded
              value:
                code: EXCEEDED_QUOTA_LIMIT
                message: Exceeded quota limit
    "500":
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - INTERNAL_SERVER_ERROR
                - INTERRUPTED
                description: Code to identify the cause of the internal server error
              message:
                type: string
                description: Detailed message including the cause of the server error
            required:
            - code
            - message
          examples:
            INTERNAL_SERVER_ERROR:
              summary: An internal server error occurred
              value:
                code: INTERNAL_SERVER_ERROR
                message: Internal server error
            INTERRUPTED:
              summary: Processing failed temporarily due to server load
              value:
                code: INTERRUPTED
                message: Request interrupted
paths:
  /:
    post:
      security:
      - api_key: []
      operationId: bitcoin-sendrawtransaction
      summary: sendrawtransaction
      description: |
        Submits a signed raw transaction to the local node and the network, and returns the transaction id.

        > 🚧 A submitted transaction cannot be cancelled!
        >
        > Verifying mempool acceptance with `testmempoolaccept` before submitting is recommended.
      x-seo-description: Submits a raw transaction (serialized, hex-encoded) to the local node and network.
      tags:
      - rawtransactions
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - jsonrpc
              - method
              - params
              properties:
                id:
                  type: integer
                  example: 1
                jsonrpc:
                  type: string
                  example: "2.0"
                method:
                  type: string
                  example: sendrawtransaction
                params:
                  type: array
                  description: |-
                    It contains following parameters in order:
                    1. `hexstring`: The transaction to submit, as a hex string. (required)
                    2. `maxfeerate`: The maximum fee rate to allow. (optional, default `0.10`)
                    3. `maxburnamount`: The maximum burn amount to allow. (optional, default `0.00`)
                  items:
                    oneOf:
                    - title: Hexstring
                      type: string
                      description: The hex string of the signed raw transaction.
                      example: 02000000013ba3edfd7a7b12b27ac72c3e67768f617fc81bc3888a51323a9fb8aa4b1e5e4a00000000da00483045
                    - title: Maxfeerate
                      type: string
                      description: |
                        Reject transactions whose fee rate is higher than this value, expressed in BTC/kvB.
                        Fee rates larger than 1 BTC/kvB are rejected. Set to `0` to accept any fee rate.
                      example: "0.10"
                    - title: Maxburnamount
                      type: string
                      description: |
                        The maximum burn amount to allow, denominated in BTC.
                        Transactions whose provably unspendable outputs, such as OP_RETURN outputs, exceed this value are rejected.
                        This check is based on heuristics and does not guarantee spendability of the outputs.
                      example: "0.00"
                  example:
                  - 02000000013ba3edfd7a7b12b27ac72c3e67768f617fc81bc3888a51323a9fb8aa4b1e5e4a00000000da00483045
                  - "0.10"
                  - "0.00"
              example:
                id: 1
                jsonrpc: "2.0"
                method: sendrawtransaction
                params:
                - 02000000013ba3edfd7a7b12b27ac72c3e67768f617fc81bc3888a51323a9fb8aa4b1e5e4a00000000da00483045
                - "0.10"
                - "0.00"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              example:
                jsonrpc: "2.0"
                id: 1
                result: 4a5e1e4baab89f3a32518a88c31bc87f618f76673e2cc77ab2127b7afdeda33b
              schema:
                $ref: '#/components/schemas/TxId'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
