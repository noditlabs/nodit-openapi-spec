openapi: 3.1.0
info:
  title: Ethereum - trace_filter
  version: 1.0.0
servers:
- url: https://ethereum-mainnet.nodit.io
  description: Ethereum Mainnet
- url: https://ethereum-sepolia.nodit.io
  description: Ethereum Sepolia
- url: https://ethereum-hoodi.nodit.io
  description: Ethereum Hoodi
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  schemas:
    TraceResult:
      type: object
      description: A trace result object. An individual trace entry returned by trace_* methods.
      properties:
        action:
          type: object
          description: Information about the traced action
          properties:
            from:
              type: string
              description: Caller address
            callType:
              type: string
              description: Call type (call, delegatecall, staticcall, etc.)
            gas:
              type: string
              description: Gas limit set for the call (hex)
            input:
              type: string
              description: Call input data (hex)
            to:
              type: string
              description: Callee address
            value:
              type: string
              description: Amount of ETH transferred (hex, in wei)
        blockHash:
          type: string
          description: Hash of the block containing this transaction
        blockNumber:
          type: integer
          description: Block number containing the transaction
        result:
          type: object
          description: Call result
          properties:
            gasUsed:
              type: string
              description: Actual gas used (hex)
            output:
              type: string
              description: Call return data (hex)
        subtraces:
          type: integer
          description: Number of sub-traces
        traceAddress:
          type: array
          description: Index array representing the trace path
          items:
            type: integer
        transactionHash:
          type: string
          description: Hash of the traced transaction
        transactionPosition:
          type: integer
          description: Position of the transaction within the block
        type:
          type: string
          description: Trace type (call, create, reward, etc.)
    TraceResultArray:
      type: array
      description: An array of trace result objects.
      items:
        $ref: '#/components/schemas/TraceResult'
  responses:
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - NO_AUTHENTICATION_FOUND
                - AUTHENTICATION_FAILED
                description: Code to identify the cause of authentication failure
              message:
                type: string
                description: Detailed message including the cause of authentication failure
            required:
            - code
            - message
          examples:
            NO_AUTHENTICATION_FOUND:
              summary: The request does not include authentication (API Key)
              value:
                code: NO_AUTHENTICATION_FOUND
                message: No authentication found.
            AUTHENTICATION_FAILED:
              summary: The authentication (API Key) is invalid
              value:
                code: AUTHENTICATION_FAILED
                message: Authentication failed.
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - PERMISSION_DENIED
                description: Code indicating permission denied
              message:
                type: string
                description: Detailed message including information about the denied resource
            required:
            - code
            - message
          examples:
            PERMISSION_DENIED:
              summary: The request accesses a resource it is not authorized for
              value:
                code: PERMISSION_DENIED
                message: Permission denied
    "429":
      description: Too Many Requests
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_MANY_REQUESTS
                - EXCEEDED_QUOTA_LIMIT
                description: Code identifying the cause of the request limit exceeded
              message:
                type: string
                description: Detailed message including the exceeded limit type and allowed threshold
            required:
            - code
            - message
          examples:
            TOO_MANY_REQUESTS:
              summary: The rate limit was exceeded
              value:
                code: TOO_MANY_REQUESTS
                message: Too many requests
            EXCEEDED_QUOTA_LIMIT:
              summary: The quota limit was exceeded
              value:
                code: EXCEEDED_QUOTA_LIMIT
                message: Exceeded quota limit
    "500":
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - INTERNAL_SERVER_ERROR
                - INTERRUPTED
                description: Code to identify the cause of the internal server error
              message:
                type: string
                description: Detailed message including the cause of the server error
            required:
            - code
            - message
          examples:
            INTERNAL_SERVER_ERROR:
              summary: An internal server error occurred
              value:
                code: INTERNAL_SERVER_ERROR
                message: Internal server error
            INTERRUPTED:
              summary: Processing failed temporarily due to server load
              value:
                code: INTERRUPTED
                message: Request interrupted
paths:
  /:
    post:
      security:
      - api_key: []
      operationId: ethereum-trace_filter
      summary: trace_filter
      description: |
        Filters and traces the execution of transactions matching the specified criteria. Users can set various conditions such as block number range, addresses used, and tokens used, and obtain trace information for transactions that match these criteria.


        > 🚧 Experiencing slow response times? Response time may increase depending on the block range!
        >
        > Specifying a wide block range or including blocks with many events may cause delayed responses or timeouts.
        >
        > For faster responses, consider the following recommendations:
        >
        > - Set the fromBlock ~ toBlock range to 1000 blocks or less.
        > - When using latest as blockTag, the internal block number may not be known, which can increase response time.
          In that case, query the latest block number with eth_blockNumber and specify it explicitly.
      x-seo-description: Filter and retrieve transaction traces matching specified criteria including addresses and block range.
      tags:
      - trace
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - jsonrpc
              - method
              - params
              properties:
                id:
                  type: integer
                  example: 1
                jsonrpc:
                  type: string
                  example: "2.0"
                method:
                  type: string
                  example: trace_filter
                params:
                  type: array
                  items:
                    oneOf:
                    - title: Trace Object
                      type: object
                      properties:
                        fromBlock:
                          title: Block Number
                          type: string
                          pattern: ^0[xX][0-9a-fA-F]+$
                          example: "0x1076B5A"
                          description: Block number indicates the sequential order of a block. Block numbers are expressed as hexadecimal strings.
                        toBlock:
                          title: Block Number
                          type: string
                          pattern: ^0[xX][0-9a-fA-F]+$
                          example: "0x1076B5A"
                          description: Block number indicates the sequential order of a block. Block numbers are expressed as hexadecimal strings.
                        fromAddress:
                          type: array
                          items:
                            title: Address
                            type: string
                            pattern: ^0[xX][0-9a-fA-F]{40}$
                            example: "0xd8dA6BF26964aF9D7eEd9e03E53415D37aA96045"
                            description: Address is expressed as a 20-byte hexadecimal string, the address format used in EVM-compatible blockchains.
                          description: Enter the from addresses to filter as an array.
                        toAddress:
                          type: array
                          items:
                            title: Address
                            type: string
                            pattern: ^0[xX][0-9a-fA-F]{40}$
                            example: "0xd8dA6BF26964aF9D7eEd9e03E53415D37aA96045"
                            description: Address is expressed as a 20-byte hexadecimal string, the address format used in EVM-compatible blockchains.
                          description: Enter the to addresses to filter as an array.
                        after:
                          type: string
                          pattern: ^0[xX][0-9a-fA-F]+$
                          description: The offset size for traces.
                        count:
                          type: integer
                          description: The number of traces to display in the trace batch.
                      description: Enter trace filter options as an Object.
                  example:
                  - fromBlock: "0x1253B3F"
                    toBlock: "0x1253B5F"
                    fromAddress:
                    - "0xB287eaC48aB21c5FB1d3723830d60b4c797555B0"
                  description: |-
                    Enter the following parameters as an array with the appropriate types.

                    1. `trace object`: Enter trace filter options as an Object.
              example:
                id: 1
                jsonrpc: "2.0"
                method: trace_filter
                params:
                - fromBlock: "0x1253B3F"
                  toBlock: "0x1253B5F"
                  fromAddress:
                  - "0xB287eaC48aB21c5FB1d3723830d60b4c797555B0"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              example:
                jsonrpc: "2.0"
                id: 1
                result:
                - action:
                    callType: call
                    from: "0xb287eac48ab21c5fb1d3723830d60b4c797555b0"
                    gas: "0x0"
                    input: 0x
                    to: "0x6a78a5f8a7839a234dee4de29c26c5f6ebad5caa"
                    value: "0x521153de4fc000"
                  blockHash: "0x7a1e8b72cbb07cae9c4b1d4fa32593ff2446c8a0a8e65ee9dadd6fb2f04862eb"
                  blockNumber: 19217231
                  result:
                    gasUsed: "0x0"
                    output: 0x
                  subtraces: 0
                  traceAddress: []
                  transactionHash: "0x3b60b4393fbc01b2ec6a0a24c0c39b42ee49c0dded76f1eb5af623004d2ddc6e"
                  transactionPosition: 62
                  type: call
              schema:
                $ref: '#/components/schemas/TraceResultArray'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
