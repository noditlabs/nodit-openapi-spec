openapi: 3.1.0
info:
  title: Ethereum - trace_call
  version: 1.0.0
servers:
- url: https://ethereum-mainnet.nodit.io
  description: Ethereum Mainnet
- url: https://ethereum-sepolia.nodit.io
  description: Ethereum Sepolia
- url: https://ethereum-hoodi.nodit.io
  description: Ethereum Hoodi
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  schemas:
    TraceResult:
      type: object
      description: A trace result object. An individual trace entry returned by trace_* methods.
      properties:
        action:
          type: object
          description: Information about the traced action
          properties:
            from:
              type: string
              description: Caller address
            callType:
              type: string
              description: Call type (call, delegatecall, staticcall, etc.)
            gas:
              type: string
              description: Gas limit set for the call (hex)
            input:
              type: string
              description: Call input data (hex)
            to:
              type: string
              description: Callee address
            value:
              type: string
              description: Amount of ETH transferred (hex, in wei)
        blockHash:
          type: string
          description: Hash of the block containing this transaction
        blockNumber:
          type: integer
          description: Block number containing the transaction
        result:
          type: object
          description: Call result
          properties:
            gasUsed:
              type: string
              description: Actual gas used (hex)
            output:
              type: string
              description: Call return data (hex)
        subtraces:
          type: integer
          description: Number of sub-traces
        traceAddress:
          type: array
          description: Index array representing the trace path
          items:
            type: integer
        transactionHash:
          type: string
          description: Hash of the traced transaction
        transactionPosition:
          type: integer
          description: Position of the transaction within the block
        type:
          type: string
          description: Trace type (call, create, reward, etc.)
  responses:
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - NO_AUTHENTICATION_FOUND
                - AUTHENTICATION_FAILED
                description: Code to identify the cause of authentication failure
              message:
                type: string
                description: Detailed message including the cause of authentication failure
            required:
            - code
            - message
          examples:
            NO_AUTHENTICATION_FOUND:
              summary: The request does not include authentication (API Key)
              value:
                code: NO_AUTHENTICATION_FOUND
                message: No authentication found.
            AUTHENTICATION_FAILED:
              summary: The authentication (API Key) is invalid
              value:
                code: AUTHENTICATION_FAILED
                message: Authentication failed.
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - PERMISSION_DENIED
                description: Code indicating permission denied
              message:
                type: string
                description: Detailed message including information about the denied resource
            required:
            - code
            - message
          examples:
            PERMISSION_DENIED:
              summary: The request accesses a resource it is not authorized for
              value:
                code: PERMISSION_DENIED
                message: Permission denied
    "429":
      description: Too Many Requests
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_MANY_REQUESTS
                - EXCEEDED_QUOTA_LIMIT
                description: Code identifying the cause of the request limit exceeded
              message:
                type: string
                description: Detailed message including the exceeded limit type and allowed threshold
            required:
            - code
            - message
          examples:
            TOO_MANY_REQUESTS:
              summary: The rate limit was exceeded
              value:
                code: TOO_MANY_REQUESTS
                message: Too many requests
            EXCEEDED_QUOTA_LIMIT:
              summary: The quota limit was exceeded
              value:
                code: EXCEEDED_QUOTA_LIMIT
                message: Exceeded quota limit
    "500":
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - INTERNAL_SERVER_ERROR
                - INTERRUPTED
                description: Code to identify the cause of the internal server error
              message:
                type: string
                description: Detailed message including the cause of the server error
            required:
            - code
            - message
          examples:
            INTERNAL_SERVER_ERROR:
              summary: An internal server error occurred
              value:
                code: INTERNAL_SERVER_ERROR
                message: Internal server error
            INTERRUPTED:
              summary: Processing failed temporarily due to server load
              value:
                code: INTERRUPTED
                message: Request interrupted
paths:
  /:
    post:
      security:
      - api_key: []
      operationId: ethereum-trace_call
      summary: trace_call
      description: Simulates a specified transaction call and returns the result. This method does not actually send a transaction to the blockchain and provides detailed execution information including gas consumption, execution results, and logs. This is useful when you want to preview how a specific function call will be executed.
      x-seo-description: Execute and trace a call against the blockchain state without creating a transaction.
      tags:
      - trace
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - jsonrpc
              - method
              - params
              properties:
                id:
                  type: integer
                  example: 1
                jsonrpc:
                  type: string
                  example: "2.0"
                method:
                  type: string
                  example: trace_call
                params:
                  type: array
                  items:
                    oneOf:
                    - title: Call Object
                      type: object
                      properties:
                        from:
                          type: string
                          description: Enter the transaction's from address as a string.
                        to:
                          type: string
                          description: Enter the transaction's to address as a string.
                          example: "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"
                        gas:
                          type: string
                          description: Enter the gas required to process the transaction as a hex-format string. For smart contract calls, no gas is consumed, so you can enter 0x0.
                        gasPrice:
                          type: string
                          description: Enter the desired cost per gas as a hex-format string.
                        value:
                          type: string
                          description: The value of the transaction.
                        data:
                          type: string
                          description: The method signature hash of the transaction to execute. Can be referenced from the ABI.
                          example: "0x70a08231000000000000000000000000d8dA6BF26964aF9D7eEd9e03E53415D37aA96045"
                      description: |-
                        Call object for transaction simulation. May include the following fields.
                        * `from`: Enter the transaction's from address as a string.
                        * `to`: Enter the transaction's to address as a string.
                        * `gas`: Enter the gas required to process the transaction as a hex-format string. For smart contract calls, no gas is consumed, so you can enter 0x0.
                        * `gasPrice`: Enter the desired cost per gas as a hex-format string.
                        * `value`: The value of the transaction.
                        * `data`: The method signature hash of the transaction to execute. Can be referenced from the ABI.
                    - title: Trace Type
                      type: array
                      items:
                        type: string
                        enum:
                        - vmTrace
                        - trace
                        - stateDiff
                        example: trace
                      description: |-
                        Trace type specifies the data types used when querying detailed execution information for a specific transaction or block on the Ethereum blockchain. This array can contain the following three string values:
                        - vmTrace: Traces the virtual machine's step-by-step execution in detail. This includes memory state, stack state, and the result of each execution instruction.
                        - `trace`: Provides step-by-step logs of transaction execution. These logs include call flow and details of internal transactions that occurred.
                        - `stateDiff`: Shows the difference in account state before and after transaction execution. This includes changed storage keys and values, account balance changes, and contract code changes.

                        This information helps developers better understand the transaction processing flow and debug. Each type provides detailed information on a specific aspect of the blockchain to clearly understand the impact of a transaction.
                  example:
                  - from: "0xc90d3Ac75D1D36dF0b0a229E73D8409FB7F3c4ab"
                    to: "0xd3CdA913deB6f67967B99D67aCDFa1712C293601"
                    value: "0x186a0"
                  - - trace
                  - latest
                  description: |-
                    Enter the following parameters as an array with the appropriate types.

                    1. `call object` is an object containing the following fields.
                    2. `trace type`: Select one or more trace types to use and enter as an array. You can use "vmTrace", "trace", or "stateDiff" values. See the API documentation for details on each option.
                    3. `block number or block tag`: Enter the block number in hexadecimal string format. You can also enter block tags such as "earliest", "latest", or "pending".
              example:
                id: 1
                jsonrpc: "2.0"
                method: trace_call
                params:
                - from: "0xc90d3Ac75D1D36dF0b0a229E73D8409FB7F3c4ab"
                  to: "0xd3CdA913deB6f67967B99D67aCDFa1712C293601"
                  value: "0x186a0"
                - - trace
                - latest
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              example:
                jsonrpc: "2.0"
                id: 1
                result:
                  output: 0x
                  stateDiff: null
                  trace:
                  - action:
                      from: "0xc90d3ac75d1d36df0b0a229e73d8409fb7f3c4ab"
                      callType: call
                      gas: "0x2fa9e78"
                      input: 0x
                      to: "0xd3cda913deb6f67967b99d67acdfa1712c293601"
                      value: "0x186a0"
                    result:
                      gasUsed: "0x0"
                      output: 0x
                    subtraces: 0
                    traceAddress: []
                    type: call
                  vmTrace: null
              schema:
                $ref: '#/components/schemas/TraceResult'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
