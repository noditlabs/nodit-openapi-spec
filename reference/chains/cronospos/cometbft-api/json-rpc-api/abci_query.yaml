openapi: 3.1.0
info:
  title: Cronos POS - ABCIQuery
  version: 1.0.0
servers:
- url: https://rpc-cronospos-mainnet.nodit.io
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
paths:
  /:
    post:
      security:
      - api_key: []
      operationId: abci_query
      summary: ABCIQuery
      description: Queries the application with a specific path and data.
      tags:
      - json-rpc-api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - jsonrpc
              - id
              - method
              properties:
                jsonrpc:
                  description: JSON-RPC protocol version. Always `2.0`.
                  type: string
                  const: "2.0"
                id:
                  description: Identifier of the request. Returned unchanged as `id` in the response.
                  type: integer
                method:
                  description: Name of the JSON-RPC method to call.
                  type: string
                  const: abci_query
                params:
                  description: Parameters passed to the method.
                  type: object
                  additionalProperties: false
                  properties:
                    path:
                      type: string
                      description: Application request path.
                    data:
                      type: string
                      description: Hex-encoded serialized byte data.
                    height:
                      type: string
                      description: Block height for the query.
                    prove:
                      type: string
                      description: String boolean indicating whether to include proof.
            example:
              jsonrpc: "2.0"
              id: 1
              method: abci_query
              params:
                path: /store/foo/key
                data: 636f6d6574626674
                height: "1"
                prove: "true"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - jsonrpc
                - id
                - result
                properties:
                  jsonrpc:
                    description: JSON-RPC protocol version. Always `2.0`.
                    type: string
                    const: "2.0"
                  id:
                    description: The request ID, echoed back unchanged.
                    type: integer
                  error:
                    description: Error information returned when the request fails.
                    type: string
                  result:
                    description: Result of the method call.
                    type: object
                    additionalProperties: false
                    properties:
                      response:
                        description: Response from the ABCI application.
                        type: object
                        additionalProperties: false
                        properties:
                          log:
                            description: Execution log message.
                            type: string
                          height:
                            description: Block height the query result refers to.
                            type: string
                          proof:
                            description: Merkle proof of the query result.
                            type: string
                          key:
                            description: Queried key (Base64).
                            type: string
                          value:
                            description: Query result value (Base64).
                            type: string
                          index:
                            description: Index of the query result.
                            type: string
                          code:
                            description: Result code. `0` means success; any other value is an error.
                            type: string
              example:
                jsonrpc: "2.0"
                id: 1
                result:
                  response:
                    log: exists
                    height: "1"
                    proof: CgMIARIFCgNmb28=
                    key: Zm9v
                    value: YmFy
                    index: "0"
                    code: "0"
