openapi: 3.1.0
info:
  title: Cosmos - Tx
  version: 1.0.0
servers:
- url: https://rpc-cosmos-mainnet.nodit.io
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
paths:
  /:
    post:
      security:
      - api_key: []
      operationId: tx
      summary: Tx
      description: Retrieves a specific transaction by its hash.
      tags:
      - json-rpc-api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - jsonrpc
              - id
              - method
              properties:
                jsonrpc:
                  description: JSON-RPC protocol version. Always `2.0`.
                  type: string
                  const: "2.0"
                id:
                  description: Identifier of the request. Returned unchanged as `id` in the response.
                  type: integer
                method:
                  description: Name of the JSON-RPC method to call.
                  type: string
                  const: tx
                params:
                  description: Parameters passed to the method.
                  type: object
                  additionalProperties: false
                  required:
                  - hash
                  properties:
                    hash:
                      type: string
                      description: Transaction hash to query.
                    prove:
                      type: string
                      description: String boolean indicating whether to include proof.
            example:
              jsonrpc: "2.0"
              id: 1
              method: tx
              params:
                hash: "0xD70952032620CC4E2737EB8AC379806359D8E0B17B0488F627997A0B043ABDED"
                prove: "true"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - jsonrpc
                - id
                - result
                properties:
                  jsonrpc:
                    description: JSON-RPC protocol version. Always `2.0`.
                    type: string
                    const: "2.0"
                  id:
                    description: The request ID, echoed back unchanged.
                    type: integer
                  result:
                    description: Result of the method call.
                    type: object
                    additionalProperties: false
                    properties:
                      hash:
                        description: Transaction hash.
                        type: string
                      height:
                        description: Block height.
                        type: string
                      index:
                        description: Index of the transaction within the block.
                        type: integer
                      tx_result:
                        description: Transaction execution result.
                        type: object
                        additionalProperties: false
                        properties:
                          log:
                            description: Execution log message.
                            type: string
                          gas_wanted:
                            description: Gas limit requested by the transaction.
                            type: string
                          gas_used:
                            description: Gas actually used.
                            type: string
                          tags:
                            description: Tags recorded during transaction execution.
                            type: array
                            items:
                              type: object
                              additionalProperties: false
                              properties:
                                key:
                                  description: Tag key.
                                  type: string
                                value:
                                  description: Tag value.
                                  type: string
                                index:
                                  description: Whether the tag is indexed.
                                  type: boolean
                      tx:
                        description: Raw transaction (Base64).
                        type: string
              example:
                jsonrpc: "2.0"
                id: 1
                result:
                  hash: D70952032620CC4E2737EB8AC379806359D8E0B17B0488F627997A0B043ABDED
                  height: "1000"
                  index: 0
                  tx_result:
                    log: '[]'
                    gas_wanted: "200000"
                    gas_used: "123456"
                    tags:
                    - key: action
                      value: send
                      index: true
                  tx: a/encoded_tx/c
