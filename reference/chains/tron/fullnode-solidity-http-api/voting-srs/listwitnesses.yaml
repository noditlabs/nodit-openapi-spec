openapi: 3.1.0
info:
  title: Tron - ListWitnesses
  version: 1.0.0
servers:
- url: https://tron-mainnet.nodit.io
  description: Tron Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  parameters: {}
  schemas: {}
  responses: {}
paths:
  /walletsolidity/listwitnesses:
    get:
      security:
      - api_key: []
      operationId: tron-listwitnesses
      summary: ListWitnesses
      description: List all Super Representatives (Confirmed state)
      x-seo-description: List TRON Super Representatives from the solidified chain state.
      tags:
      - voting-srs
      parameters:
      - in: query
        name: visible
        schema:
          type: boolean
        description: 'Optional. Set to `true` to format addresses in Base58; set to `false` for hex format. (Default: `false`)'
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  address:
                    type: string
                    description: Super Representative (SR) address.
                  voteCount:
                    type: integer
                    format: int64
                    description: Total number of votes received.
                  url:
                    type: string
                    description: URL of the Super Representative's (SR) official website.
                  totalProduced:
                    type: integer
                    format: int64
                    description: Total number of blocks produced by the SR.
                  totalMissed:
                    type: integer
                    format: int64
                    description: Total number of blocks missed by the SR.
                  latestBlockNum:
                    type: integer
                    format: int64
                    description: Latest block number (height).
                  latestSlotNum:
                    type: integer
                    format: int64
                    description: Latest slot number.
                  isJobs:
                    type: boolean
                    description: Whether the SR is eligible to produce blocks.
              examples:
                Result:
                  value: '{}'
