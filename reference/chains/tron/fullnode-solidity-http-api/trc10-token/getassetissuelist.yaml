openapi: 3.1.0
info:
  title: Tron - GetAssetIssueList
  version: 1.0.0
servers:
- url: https://tron-mainnet.nodit.io
  description: Tron Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  parameters: {}
  schemas: {}
  responses: {}
paths:
  /walletsolidity/getassetissuelist:
    get:
      security:
      - api_key: []
      operationId: tron-getassetissuelist
      summary: GetAssetIssueList
      description: Query the list of all the TRC-10 tokens (Confirmed state)
      x-seo-description: List every TRC-10 token from the solidified TRON chain state.
      tags:
      - trc10-token
      parameters:
      - in: query
        name: visible
        schema:
          type: boolean
        description: 'Optional. Set to `true` to format addresses in Base58; set to `false` for hex format. (Default: `false`)'
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  assetIssue:
                    type: array
                    items:
                      type: object
                      description: 'TRC-10 token info. See [GetAssetIssueByAccount](https://developers.tron.network/reference/getassetissuebyaccount) for full structure. Note: string fields are HexString-encoded.'
                      properties: {}
                    description: The list of all TRC-10 tokens, please refer to [GetAssetIssueByAccount](https://developers.tron.network/reference/getassetissuebyaccount) for detailed fields of AssetIssueCapsule object, please note that string fields are in HexString format.
              examples:
                Result:
                  value: '{}'
