openapi: 3.1.0
info:
  title: Tron - GetTransactionById
  version: 1.0.0
servers:
- url: https://tron-mainnet.nodit.io
  description: Tron Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  parameters: {}
  schemas: {}
  responses: {}
paths:
  /walletsolidity/gettransactionbyid:
    post:
      security:
      - api_key: []
      operationId: tron-gettransactionbyid
      summary: GetTransactionById
      description: Query the transaction body by transaction ID from the SolidityNode view. Only solidified transactions are returned.
      x-seo-description: Query a solidified TRON transaction by transaction ID.
      tags:
      - transactions
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              value: 349ab7e2ba7f10687049d02a8138668d14a88888709aa681f7b32d475b0049d4
            schema:
              type: object
              properties:
                value:
                  type: string
                  description: 'Transaction ID (hash). Example: `bd32eef7469d57011a092c59c745cab1e49c501e9f0ac15c580656f9ead1e319`'
                  example: bd32eef7469d57011a092c59c745cab1e49c501e9f0ac15c580656f9ead1e319
                visible:
                  type: boolean
                  description: 'Optional. Set to `true` to format addresses in Base58; set to `false` for hex format. (Default: `false`)'
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  txID:
                    type: string
                    description: Transaction ID(Hash).
                  ret:
                    type: object
                    description: List of transaction execution results.
                    properties:
                      contractRet:
                        type: array
                        items:
                          type: string
                        description: Transaction Execution Results.
                  signature:
                    type: array
                    items:
                      type: string
                    description: Transaction signature.
                  raw_data_hex:
                    type: string
                    description: 'The transaction''s raw data. (Format: hex)'
                  raw_data:
                    type: object
                    description: Transaction content. See [here](https://developers.tron.network/docs/tron-protocol-transaction)  for details.
                    properties: {}
                  fee_limit:
                    type: integer
                    format: int64
                    description: 'The transaction''s `FeeLimit`. See [here](https://developers.tron.network/docs/feelimit)  for details. (Unit: sun)'
                  ref_block_bytes:
                    type: string
                    description: The last two bytes of the reference block's number (height), used for transaction validation.
                  ref_block_hash:
                    type: string
                    description: Bytes 8 to 16 of the reference block's hash, used for transaction validation.
                  expiration:
                    type: integer
                    format: int64
                    description: 'Transaction expiration time. (Unit: millisecond)'
                  timestamp:
                    type: int64
                    description: 'Timestamp. (Unit: millisecond)'
                    format: int64
              examples:
                Example API Call Response:
                  value: |-
                    // Example API Call Response

                    {  
                       "ret":[  
                          {  
                             "contractRet":"SUCCESS"
                          }
                       ],
                       "signature":[  
                          "ffbf691a89d95f6ad8175611c7d334c8159b95ff9c1e83872e7670103b185e85faf0a394b23d99581385d38038ab5c4684759c864a5621009f6e95da0a5feab501"
                       ],
                       "txID":"d0807adb3c5412aa150787b944c96ee898c997debdc27e2f6a643c771edb5933",
                       "raw_data":{  
                          "contract":[  
                             {  
                                "parameter":{  
                                   "value":{  
                                      "amount":16,
                                      "asset_name":"54726f6e696373",
                                      "owner_address":"414a5fe0179f2dd9c900194e63d661863cd0ade7b0",
                                      "to_address":"41718de6b323652d1257437ace160c4f4198aae4e1"
                                   },
                                   "type_url":"type.googleapis.com/protocol.TransferAssetContract"
                                },
                                "type":"TransferAssetContract"
                             }
                          ],
                          "ref_block_bytes":"6bdd",
                          "ref_block_hash":"1616edaf3a57fe19",
                          "expiration":1546455678000,
                          "timestamp":1546455620175
                       }
                    }
        "400":
          description: "400"
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
