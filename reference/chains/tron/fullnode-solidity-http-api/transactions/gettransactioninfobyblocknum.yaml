openapi: 3.1.0
info:
  title: Tron - GetTransactionInfoByBlockNum
  version: 1.0.0
servers:
- url: https://tron-mainnet.nodit.io
  description: Tron Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  parameters: {}
  schemas: {}
  responses: {}
paths:
  /walletsolidity/gettransactioninfobyblocknum:
    post:
      security:
      - api_key: []
      operationId: tron-gettransactioninfobyblocknum
      summary: GetTransactionInfoByBlockNum
      description: An array of TransactionInfo objects for all transactions in the specified block. For the specific fields of each transaction, see walletsolidity/gettransactioninfobyid.
      x-seo-description: Query execution info for every transaction in a solidified TRON block.
      tags:
      - transactions
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              num: 86720418
            schema:
              type: object
              properties:
                num:
                  type: integer
                  description: 'Block number (height). Example: `61815425`'
                  format: int32
                  example: 61815425
                visible:
                  type: boolean
                  description: 'Optional. Set to `true` to format addresses in Base58; set to `false` for hex format. (Default: `false`)'
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                type: array
                description: List of TransactionInfo for all transactions in the specified block (solidified).
                items:
                  type: object
                  description: Transaction execution result (logs, energy/bandwidth usage, return value). See [wallet/gettransactioninfobyid](https://developers.tron.network/reference/gettransactioninfobyid) for full structure.
                  properties: {}
              examples:
                Result:
                  value: '{}'
        "400":
          description: "400"
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
