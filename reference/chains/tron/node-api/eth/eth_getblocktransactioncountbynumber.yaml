openapi: 3.1.0
info:
  title: Tron - eth_getBlockTransactionCountByNumber
  version: 1.0.0
servers:
- url: https://tron-mainnet.nodit.io
  description: Tron Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  schemas:
    BlockTag:
      description: |
        Specifies the block to query. Pass a hexadecimal block number or a block tag.
        Unlike Ethereum, TRON supports only a limited set of tags.
        - `latest`: The most recent block.
        - `earliest`: The oldest available block.
      oneOf:
      - title: Block Number
        type: string
        description: The hex-encoded block number.
        pattern: ^0[xX][0-9a-fA-F]+$
        example: "0x51e8875"
      - title: Block Tag
        type: string
        description: A tag string that points to a block.
        enum:
        - latest
        - earliest
        example: latest
    HexQuantity:
      type: string
      description: An integer encoded as a hexadecimal string. (e.g.) `0x51e8875`
      pattern: ^0[xX][0-9a-fA-F]+$
      example: "0x51e8875"
  responses:
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - NO_AUTHENTICATION_FOUND
                - AUTHENTICATION_FAILED
                description: Code to identify the cause of authentication failure
              message:
                type: string
                description: Detailed message including the cause of authentication failure
            required:
            - code
            - message
          examples:
            NO_AUTHENTICATION_FOUND:
              summary: The request does not include authentication (API Key)
              value:
                code: NO_AUTHENTICATION_FOUND
                message: No authentication found.
            AUTHENTICATION_FAILED:
              summary: The authentication (API Key) is invalid
              value:
                code: AUTHENTICATION_FAILED
                message: Authentication failed.
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - PERMISSION_DENIED
                description: Code indicating permission denied
              message:
                type: string
                description: Detailed message including information about the denied resource
            required:
            - code
            - message
          examples:
            PERMISSION_DENIED:
              summary: The request accesses a resource it is not authorized for
              value:
                code: PERMISSION_DENIED
                message: Permission denied
    "429":
      description: Too Many Requests
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_MANY_REQUESTS
                - EXCEEDED_QUOTA_LIMIT
                description: Code identifying the cause of the request limit exceeded
              message:
                type: string
                description: Detailed message including the exceeded limit type and allowed threshold
            required:
            - code
            - message
          examples:
            TOO_MANY_REQUESTS:
              summary: The rate limit was exceeded
              value:
                code: TOO_MANY_REQUESTS
                message: Too many requests
            EXCEEDED_QUOTA_LIMIT:
              summary: The quota limit was exceeded
              value:
                code: EXCEEDED_QUOTA_LIMIT
                message: Exceeded quota limit
    "500":
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - INTERNAL_SERVER_ERROR
                - INTERRUPTED
                description: Code to identify the cause of the internal server error
              message:
                type: string
                description: Detailed message including the cause of the server error
            required:
            - code
            - message
          examples:
            INTERNAL_SERVER_ERROR:
              summary: An internal server error occurred
              value:
                code: INTERNAL_SERVER_ERROR
                message: Internal server error
            INTERRUPTED:
              summary: Processing failed temporarily due to server load
              value:
                code: INTERRUPTED
                message: Request interrupted
paths:
  /:
    post:
      security:
      - api_key: []
      operationId: tron-eth_getblocktransactioncountbynumber
      summary: eth_getBlockTransactionCountByNumber
      description: |
        Returns the number of transactions in a block by block number.
      x-seo-description: Returns the number of transactions in a TRON block matching the given block number.
      tags:
      - eth
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - jsonrpc
              - method
              - params
              properties:
                id:
                  type: integer
                  example: 1
                jsonrpc:
                  type: string
                  example: "2.0"
                method:
                  type: string
                  example: eth_getBlockTransactionCountByNumber
                params:
                  type: array
                  description: |-
                    It contains following parameter in order:
                    1. `block`: The block number to look up, or a tag (`latest`, `earliest`). (required)
                  items:
                    oneOf:
                    - title: Block Number or Tag
                      $ref: '#/components/schemas/BlockTag'
                  example:
                  - "0x20ef11c"
              example:
                id: 1
                jsonrpc: "2.0"
                method: eth_getBlockTransactionCountByNumber
                params:
                - "0x20ef11c"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              example:
                jsonrpc: "2.0"
                id: 1
                result: "0x23"
              schema:
                $ref: '#/components/schemas/HexQuantity'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
