openapi: 3.1.0
info:
  title: Tron - eth_getFilterChanges
  version: 1.0.0
servers:
- url: https://tron-mainnet.nodit.io
  description: Tron Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  schemas:
    Log:
      type: object
      description: An event log object.
      properties:
        address:
          type: string
          description: The address of the contract that emitted the log.
        topics:
          type: array
          description: The list of log topics. The first entry is the event signature hash.
          items:
            type: string
            description: A 32-byte topic value.
        data:
          type: string
          description: The ABI-encoded data for the non-indexed event arguments.
        blockNumber:
          type: string
          description: The number of the block containing the log.
        blockHash:
          type: string
          description: The hash of the block containing the log.
        blockTimestamp:
          type: string
          description: |
            The creation time of the block containing the log, in UNIX epoch seconds, hex-encoded.
            It is returned on GreatVoyage-v4.8.2 and later, and may be omitted on gateways that have not been upgraded yet.
        transactionHash:
          type: string
          description: The hash of the transaction that emitted the log.
        transactionIndex:
          type: string
          description: The transaction index within the block.
        logIndex:
          type: string
          description: The log index within the block.
        removed:
          type: boolean
          description: Whether the log was removed by a chain reorganization.
  responses:
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - NO_AUTHENTICATION_FOUND
                - AUTHENTICATION_FAILED
                description: Code to identify the cause of authentication failure
              message:
                type: string
                description: Detailed message including the cause of authentication failure
            required:
            - code
            - message
          examples:
            NO_AUTHENTICATION_FOUND:
              summary: The request does not include authentication (API Key)
              value:
                code: NO_AUTHENTICATION_FOUND
                message: No authentication found.
            AUTHENTICATION_FAILED:
              summary: The authentication (API Key) is invalid
              value:
                code: AUTHENTICATION_FAILED
                message: Authentication failed.
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - PERMISSION_DENIED
                description: Code indicating permission denied
              message:
                type: string
                description: Detailed message including information about the denied resource
            required:
            - code
            - message
          examples:
            PERMISSION_DENIED:
              summary: The request accesses a resource it is not authorized for
              value:
                code: PERMISSION_DENIED
                message: Permission denied
    "429":
      description: Too Many Requests
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_MANY_REQUESTS
                - EXCEEDED_QUOTA_LIMIT
                description: Code identifying the cause of the request limit exceeded
              message:
                type: string
                description: Detailed message including the exceeded limit type and allowed threshold
            required:
            - code
            - message
          examples:
            TOO_MANY_REQUESTS:
              summary: The rate limit was exceeded
              value:
                code: TOO_MANY_REQUESTS
                message: Too many requests
            EXCEEDED_QUOTA_LIMIT:
              summary: The quota limit was exceeded
              value:
                code: EXCEEDED_QUOTA_LIMIT
                message: Exceeded quota limit
    "500":
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - INTERNAL_SERVER_ERROR
                - INTERRUPTED
                description: Code to identify the cause of the internal server error
              message:
                type: string
                description: Detailed message including the cause of the server error
            required:
            - code
            - message
          examples:
            INTERNAL_SERVER_ERROR:
              summary: An internal server error occurred
              value:
                code: INTERNAL_SERVER_ERROR
                message: Internal server error
            INTERRUPTED:
              summary: Processing failed temporarily due to server load
              value:
                code: INTERRUPTED
                message: Request interrupted
paths:
  /:
    post:
      security:
      - api_key: []
      operationId: tron-eth_getfilterchanges
      summary: eth_getFilterChanges
      description: |
        Polls a filter and returns the changes that occurred since the last poll.
        A filter created with `eth_newFilter` returns an array of logs, while one created with `eth_newBlockFilter` returns an array of block hashes.

        > 📘 On GreatVoyage-v4.8.2 and later, each log includes `blockTimestamp`.
        > On gateways that have not been upgraded yet, this field may be omitted.
      x-seo-description: Polls a TRON filter and returns the changes since the last poll.
      tags:
      - eth
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - jsonrpc
              - method
              - params
              properties:
                id:
                  type: integer
                  example: 1
                jsonrpc:
                  type: string
                  example: "2.0"
                method:
                  type: string
                  example: eth_getFilterChanges
                params:
                  type: array
                  description: |-
                    It contains following parameter in order:
                    1. `filterId`: The ID of the filter to query. (required)
                  items:
                    oneOf:
                    - title: Filter ID
                      type: string
                      description: The ID of the filter to query.
                      example: "0x2bab51aee6345d2748e0a4a3f4569d80"
                  example:
                  - "0x2bab51aee6345d2748e0a4a3f4569d80"
              example:
                id: 1
                jsonrpc: "2.0"
                method: eth_getFilterChanges
                params:
                - "0x2bab51aee6345d2748e0a4a3f4569d80"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              example:
                jsonrpc: "2.0"
                id: 1
                result: []
              schema:
                description: |
                  The return shape depends on the filter type.
                  - A filter created with `eth_newFilter`: an array of event logs
                  - A filter created with `eth_newBlockFilter`: an array of block hashes
                oneOf:
                - title: Log Array
                  type: array
                  description: The list of event logs.
                  items:
                    $ref: '#/components/schemas/Log'
                - title: Block Hash Array
                  type: array
                  description: The list of hashes of newly created blocks.
                  items:
                    type: string
                    description: A block hash.
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
