openapi: 3.1.0
info:
  title: Tron - eth_newFilter
  version: 1.0.0
servers:
- url: https://tron-mainnet.nodit.io
  description: Tron Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  responses:
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - NO_AUTHENTICATION_FOUND
                - AUTHENTICATION_FAILED
                description: Code to identify the cause of authentication failure
              message:
                type: string
                description: Detailed message including the cause of authentication failure
            required:
            - code
            - message
          examples:
            NO_AUTHENTICATION_FOUND:
              summary: The request does not include authentication (API Key)
              value:
                code: NO_AUTHENTICATION_FOUND
                message: No authentication found.
            AUTHENTICATION_FAILED:
              summary: The authentication (API Key) is invalid
              value:
                code: AUTHENTICATION_FAILED
                message: Authentication failed.
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - PERMISSION_DENIED
                description: Code indicating permission denied
              message:
                type: string
                description: Detailed message including information about the denied resource
            required:
            - code
            - message
          examples:
            PERMISSION_DENIED:
              summary: The request accesses a resource it is not authorized for
              value:
                code: PERMISSION_DENIED
                message: Permission denied
    "429":
      description: Too Many Requests
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_MANY_REQUESTS
                - EXCEEDED_QUOTA_LIMIT
                description: Code identifying the cause of the request limit exceeded
              message:
                type: string
                description: Detailed message including the exceeded limit type and allowed threshold
            required:
            - code
            - message
          examples:
            TOO_MANY_REQUESTS:
              summary: The rate limit was exceeded
              value:
                code: TOO_MANY_REQUESTS
                message: Too many requests
            EXCEEDED_QUOTA_LIMIT:
              summary: The quota limit was exceeded
              value:
                code: EXCEEDED_QUOTA_LIMIT
                message: Exceeded quota limit
    "500":
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - INTERNAL_SERVER_ERROR
                - INTERRUPTED
                description: Code to identify the cause of the internal server error
              message:
                type: string
                description: Detailed message including the cause of the server error
            required:
            - code
            - message
          examples:
            INTERNAL_SERVER_ERROR:
              summary: An internal server error occurred
              value:
                code: INTERNAL_SERVER_ERROR
                message: Internal server error
            INTERRUPTED:
              summary: Processing failed temporarily due to server load
              value:
                code: INTERRUPTED
                message: Request interrupted
paths:
  /:
    post:
      security:
      - api_key: []
      operationId: tron-eth_newfilter
      summary: eth_newFilter
      description: |
        Registers log query conditions to create a filter and returns the filter ID.
        Query the created filter with `eth_getFilterChanges` or `eth_getFilterLogs`.

        > 📘 A filter expires automatically if it is not queried with `eth_getFilterChanges` for a certain period.
      x-seo-description: Creates a log filter on the TRON node based on the given filter options.
      tags:
      - eth
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - jsonrpc
              - method
              - params
              properties:
                id:
                  type: integer
                  example: 1
                jsonrpc:
                  type: string
                  example: "2.0"
                method:
                  type: string
                  example: eth_newFilter
                params:
                  type: array
                  description: |-
                    It contains following parameter in order:
                    1. `filterOptions`: The log query conditions, as an object. (required)
                  items:
                    oneOf:
                    - title: Filter Options
                      type: object
                      description: The log query conditions.
                      properties:
                        fromBlock:
                          type: string
                          description: The block number to start searching from, or the `latest` tag.
                          example: "0x989680"
                        toBlock:
                          type: string
                          description: The block number to stop searching at, or the `latest` tag.
                          example: "0x9959d0"
                        address:
                          description: The contract address or list of addresses that emitted the logs.
                          oneOf:
                          - title: Single Address
                            type: string
                            description: The contract address.
                          - title: Address Array
                            type: array
                            description: The list of contract addresses.
                            items:
                              type: string
                              description: The contract address.
                        topics:
                          type: array
                          description: |
                            The list of topics to query. Their order is significant, and each position may contain `null` or an array of OR conditions.
                          items:
                            description: A 32-byte topic value, `null`, or an array of OR conditions.
                  example:
                  - fromBlock: "0x989680"
                    toBlock: "0x9959d0"
                    address:
                    - "0xcc2e32f2388f0096fae9b055acffd76d4b3e5532"
                    topics:
                    - "0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef"
              example:
                id: 1
                jsonrpc: "2.0"
                method: eth_newFilter
                params:
                - fromBlock: "0x989680"
                  toBlock: "0x9959d0"
                  address:
                  - "0xcc2e32f2388f0096fae9b055acffd76d4b3e5532"
                  topics:
                  - "0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              example:
                jsonrpc: "2.0"
                id: 1
                result: "0x2bab51aee6345d2748e0a4a3f4569d80"
              schema:
                type: string
                description: The ID of the created filter.
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
