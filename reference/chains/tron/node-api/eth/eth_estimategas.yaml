openapi: 3.1.0
info:
  title: Tron - eth_estimateGas
  version: 1.0.0
servers:
- url: https://tron-mainnet.nodit.io
  description: Tron Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  schemas:
    HexQuantity:
      type: string
      description: An integer encoded as a hexadecimal string. (e.g.) `0x51e8875`
      pattern: ^0[xX][0-9a-fA-F]+$
      example: "0x51e8875"
  responses:
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - NO_AUTHENTICATION_FOUND
                - AUTHENTICATION_FAILED
                description: Code to identify the cause of authentication failure
              message:
                type: string
                description: Detailed message including the cause of authentication failure
            required:
            - code
            - message
          examples:
            NO_AUTHENTICATION_FOUND:
              summary: The request does not include authentication (API Key)
              value:
                code: NO_AUTHENTICATION_FOUND
                message: No authentication found.
            AUTHENTICATION_FAILED:
              summary: The authentication (API Key) is invalid
              value:
                code: AUTHENTICATION_FAILED
                message: Authentication failed.
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - PERMISSION_DENIED
                description: Code indicating permission denied
              message:
                type: string
                description: Detailed message including information about the denied resource
            required:
            - code
            - message
          examples:
            PERMISSION_DENIED:
              summary: The request accesses a resource it is not authorized for
              value:
                code: PERMISSION_DENIED
                message: Permission denied
    "429":
      description: Too Many Requests
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_MANY_REQUESTS
                - EXCEEDED_QUOTA_LIMIT
                description: Code identifying the cause of the request limit exceeded
              message:
                type: string
                description: Detailed message including the exceeded limit type and allowed threshold
            required:
            - code
            - message
          examples:
            TOO_MANY_REQUESTS:
              summary: The rate limit was exceeded
              value:
                code: TOO_MANY_REQUESTS
                message: Too many requests
            EXCEEDED_QUOTA_LIMIT:
              summary: The quota limit was exceeded
              value:
                code: EXCEEDED_QUOTA_LIMIT
                message: Exceeded quota limit
    "500":
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - INTERNAL_SERVER_ERROR
                - INTERRUPTED
                description: Code to identify the cause of the internal server error
              message:
                type: string
                description: Detailed message including the cause of the server error
            required:
            - code
            - message
          examples:
            INTERNAL_SERVER_ERROR:
              summary: An internal server error occurred
              value:
                code: INTERNAL_SERVER_ERROR
                message: Internal server error
            INTERRUPTED:
              summary: Processing failed temporarily due to server load
              value:
                code: INTERRUPTED
                message: Request interrupted
paths:
  /:
    post:
      security:
      - api_key: []
      operationId: tron-eth_estimategas
      summary: eth_estimateGas
      description: |
        Estimates the **energy** consumption required to execute a transaction.
        Unlike Ethereum's `eth_estimateGas`, which returns a gas amount, TRON returns an energy amount.
      x-seo-description: Estimates the energy consumption required for a TRON transaction.
      tags:
      - eth
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - jsonrpc
              - method
              - params
              properties:
                id:
                  type: integer
                  example: 1
                jsonrpc:
                  type: string
                  example: "2.0"
                method:
                  type: string
                  example: eth_estimateGas
                params:
                  type: array
                  description: |-
                    It contains following parameter in order:
                    1. `callObject`: The transaction to execute, as an object. (required)
                  items:
                    oneOf:
                    - title: Call Object
                      type: object
                      description: |
                        The transaction to estimate energy consumption for.
                        `data` and `input` are aliases for each other; when both are given, `input` takes precedence.
                      properties:
                        from:
                          type: string
                          description: The address of the account sending the transaction.
                          example: "0xf0cc5a2a84cd0f68ed1667070934542d673acbd8"
                        to:
                          type: string
                          description: The address of the account or contract that will receive the transaction.
                          example: "0x70082243784dcdf3042034e7b044d6d342a91360"
                        gas:
                          type: string
                          description: The fee limit. Retained for Ethereum compatibility and ignored by TRON.
                          example: "0x01"
                        gasPrice:
                          type: string
                          description: The energy price. Retained for Ethereum compatibility and ignored by TRON.
                          example: "0x8c"
                        value:
                          type: string
                          description: The amount of TRX sent via `call_value`, in sun.
                          example: "0x01"
                        data:
                          type: string
                          description: The function selector and the ABI-encoded parameters.
                        input:
                          type: string
                          description: |
                            An alias for `data`. When both are given, this value takes precedence.
                            When a value is given, it requires a `0x` prefix and an even number of hex digits.
                  example:
                  - from: "0xf0cc5a2a84cd0f68ed1667070934542d673acbd8"
                    to: "0x70082243784dcdf3042034e7b044d6d342a91360"
                    gas: "0x01"
                    gasPrice: "0x8c"
                    value: "0x01"
                    data: "0x70a08231000000000000000000000041f0cc5a2a84cd0f68ed1667070934542d673acbd8"
              example:
                id: 1
                jsonrpc: "2.0"
                method: eth_estimateGas
                params:
                - from: "0xf0cc5a2a84cd0f68ed1667070934542d673acbd8"
                  to: "0x70082243784dcdf3042034e7b044d6d342a91360"
                  gas: "0x01"
                  gasPrice: "0x8c"
                  value: "0x01"
                  data: "0x70a08231000000000000000000000041f0cc5a2a84cd0f68ed1667070934542d673acbd8"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              example:
                jsonrpc: "2.0"
                id: 1
                result: "0x0"
              schema:
                $ref: '#/components/schemas/HexQuantity'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
