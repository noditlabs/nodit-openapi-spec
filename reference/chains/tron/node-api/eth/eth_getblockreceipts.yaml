openapi: 3.1.0
info:
  title: Tron - eth_getBlockReceipts
  version: 1.0.0
servers:
- url: https://tron-mainnet.nodit.io
  description: Tron Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  schemas:
    Log:
      type: object
      description: An event log object.
      properties:
        address:
          type: string
          description: The address of the contract that emitted the log.
        topics:
          type: array
          description: The list of log topics. The first entry is the event signature hash.
          items:
            type: string
            description: A 32-byte topic value.
        data:
          type: string
          description: The ABI-encoded data for the non-indexed event arguments.
        blockNumber:
          type: string
          description: The number of the block containing the log.
        blockHash:
          type: string
          description: The hash of the block containing the log.
        blockTimestamp:
          type: string
          description: |
            The creation time of the block containing the log, in UNIX epoch seconds, hex-encoded.
            It is returned on GreatVoyage-v4.8.2 and later, and may be omitted on gateways that have not been upgraded yet.
        transactionHash:
          type: string
          description: The hash of the transaction that emitted the log.
        transactionIndex:
          type: string
          description: The transaction index within the block.
        logIndex:
          type: string
          description: The log index within the block.
        removed:
          type: boolean
          description: Whether the log was removed by a chain reorganization.
    TransactionReceipt:
      type: object
      description: A transaction receipt object.
      properties:
        transactionHash:
          type: string
          description: The transaction hash.
        transactionIndex:
          type: string
          description: The transaction index within the block.
        blockHash:
          type: string
          description: The hash of the block containing the transaction.
        blockNumber:
          type: string
          description: The number of the block containing the transaction.
        from:
          type: string
          description: The address of the account that sent the transaction.
        to:
          type: string
          description: The address of the account or contract that received the transaction.
        contractAddress:
          type: string
          description: The address of the created contract when the transaction created one. Otherwise it is `null`.
        gasUsed:
          type: string
          description: The energy consumed by this transaction.
        cumulativeGasUsed:
          type: string
          description: The cumulative energy consumed in the block up to this transaction.
        effectiveGasPrice:
          type: string
          description: The energy price actually applied, in sun.
        logs:
          type: array
          description: The list of event logs emitted by the transaction.
          items:
            $ref: '#/components/schemas/Log'
        logsBloom:
          type: string
          description: The Bloom filter used to search event logs.
        status:
          type: string
          description: The execution result of the transaction. `0x1` for success, `0x0` for failure.
        type:
          type: string
          description: The transaction type. TRON returns `0x0`.
  responses:
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - NO_AUTHENTICATION_FOUND
                - AUTHENTICATION_FAILED
                description: Code to identify the cause of authentication failure
              message:
                type: string
                description: Detailed message including the cause of authentication failure
            required:
            - code
            - message
          examples:
            NO_AUTHENTICATION_FOUND:
              summary: The request does not include authentication (API Key)
              value:
                code: NO_AUTHENTICATION_FOUND
                message: No authentication found.
            AUTHENTICATION_FAILED:
              summary: The authentication (API Key) is invalid
              value:
                code: AUTHENTICATION_FAILED
                message: Authentication failed.
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - PERMISSION_DENIED
                description: Code indicating permission denied
              message:
                type: string
                description: Detailed message including information about the denied resource
            required:
            - code
            - message
          examples:
            PERMISSION_DENIED:
              summary: The request accesses a resource it is not authorized for
              value:
                code: PERMISSION_DENIED
                message: Permission denied
    "429":
      description: Too Many Requests
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_MANY_REQUESTS
                - EXCEEDED_QUOTA_LIMIT
                description: Code identifying the cause of the request limit exceeded
              message:
                type: string
                description: Detailed message including the exceeded limit type and allowed threshold
            required:
            - code
            - message
          examples:
            TOO_MANY_REQUESTS:
              summary: The rate limit was exceeded
              value:
                code: TOO_MANY_REQUESTS
                message: Too many requests
            EXCEEDED_QUOTA_LIMIT:
              summary: The quota limit was exceeded
              value:
                code: EXCEEDED_QUOTA_LIMIT
                message: Exceeded quota limit
    "500":
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - INTERNAL_SERVER_ERROR
                - INTERRUPTED
                description: Code to identify the cause of the internal server error
              message:
                type: string
                description: Detailed message including the cause of the server error
            required:
            - code
            - message
          examples:
            INTERNAL_SERVER_ERROR:
              summary: An internal server error occurred
              value:
                code: INTERNAL_SERVER_ERROR
                message: Internal server error
            INTERRUPTED:
              summary: Processing failed temporarily due to server load
              value:
                code: INTERRUPTED
                message: Request interrupted
paths:
  /:
    post:
      security:
      - api_key: []
      operationId: tron-eth_getblockreceipts
      summary: eth_getBlockReceipts
      description: |
        Queries all transaction receipts contained in a specified block.
      x-seo-description: Queries all transaction receipts contained in a specified TRON block.
      tags:
      - eth
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - jsonrpc
              - method
              - params
              properties:
                id:
                  type: integer
                  example: 1
                jsonrpc:
                  type: string
                  example: "2.0"
                method:
                  type: string
                  example: eth_getBlockReceipts
                params:
                  type: array
                  description: |-
                    It contains following parameter in order:
                    1. `blockIdentifier`: A block number, block hash, or tag. (required)
                       - Block number: a decimal value or a `0x`-prefixed hexadecimal value
                       - Block hash: a 32-byte hash (the `0x` prefix may be omitted)
                       - Tag: `latest`, `earliest` or `finalized` (`pending` and `safe` are unsupported)
                  items:
                    oneOf:
                    - title: Block Identifier
                      type: string
                      description: |
                        Specifies the block to query. Pass a block number, a block hash, or a tag.
                        Only the `latest`, `earliest` and `finalized` tags are supported; `pending` and `safe` cannot be used.
                      example: "0x20ef11c"
                  example:
                  - "0x20ef11c"
              example:
                id: 1
                jsonrpc: "2.0"
                method: eth_getBlockReceipts
                params:
                - "0x20ef11c"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              example:
                jsonrpc: "2.0"
                id: 1
                result:
                - transactionHash: "0xc9af231ad59bcd7e8dcf827afd45020a02112704dce74ec5f72cb090aa07eef0"
                  transactionIndex: "0x6"
                  blockHash: "0x00000000020ef11c87517739090601aa0a7be1de6faebf35ddb14e7ab7d1cc5b"
                  blockNumber: "0x20ef11c"
                  from: "0x6eced5214d62c3bc9eaa742e2f86d5c516785e14"
                  to: "0x0697250b9d73b460a9d2bbfd8c4cacebb05dd1f1"
                  contractAddress: null
                  gasUsed: "0x0"
                  cumulativeGasUsed: "0x646e2"
                  effectiveGasPrice: "0x8c"
                  logs: []
                  status: "0x1"
                  type: "0x0"
              schema:
                type: array
                description: The list of transaction receipts contained in the block.
                items:
                  $ref: '#/components/schemas/TransactionReceipt'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
