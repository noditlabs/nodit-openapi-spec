openapi: 3.1.0
info:
  title: Tron - CreateWitness
  version: 1.0.0
servers:
- url: https://tron-mainnet.nodit.io
  description: Tron Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  parameters: {}
  schemas: {}
  responses: {}
paths:
  /wallet/createwitness:
    post:
      security:
      - api_key: []
      operationId: tron-createwitness
      summary: CreateWitness
      description: Apply to become a super representative candidate.
      x-seo-description: Create a transaction that applies to become a TRON Super Representative candidate.
      tags:
      - voting-srs
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              owner_address: TUoHaVjx7n5xz8LwPRDckgFrDWhMhuSuJM
              url: "0x7777772e6578616d706c652e636f6d"
              visible: true
            schema:
              type: object
              properties:
                owner_address:
                  type: string
                  description: 'Super Representative (SR) address. (Format: Base58 or Hex)'
                url:
                  type: string
                  description: URL of the official website.
                Permission_id:
                  type: integer
                  description: Optional. Permission ID used for multi-signature account operations. Defaults to the owner permission (0) if unspecified.
                  format: int32
                visible:
                  type: boolean
                  description: 'Optional. Set to `true` to format addresses in Base58; set to `false` for hex format. (Default: `false`)'
              required:
              - owner_address
              - url
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  owner_address:
                    type: string
                    description: Super Representative (SR) address.
                  url:
                    type: string
                    description: URL of the Super Representative's (SR) official website.
              examples:
                Result:
                  value: '{}'
        "400":
          description: "400"
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
