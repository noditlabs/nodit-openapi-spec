openapi: 3.1.0
info:
  title: Tron - CreateCommonTransaction
  version: 1.0.0
servers:
- url: https://tron-mainnet.nodit.io
  description: Tron Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  parameters: {}
  schemas: {}
  responses: {}
paths:
  /wallet/createCommonTransaction:
    post:
      security:
      - api_key: []
      operationId: tron-createCommonTransaction
      summary: CreateCommonTransaction
      description: Create a transaction for a specified contract type. Put the contract type in `contractType` and the contract's own parameters in the top-level fields alongside it. It creates transactions for multiple contract types through a single endpoint instead of calling each per-type endpoint.
      x-seo-description: Create a TRON transaction for any contract type through a single endpoint.
      tags:
      - transactions
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - contractType
              properties:
                contractType:
                  type: string
                  description: 'Contract type of the transaction to create. Use a name defined in `Transaction.Contract.ContractType`. Example: `TransferContract`, `FreezeBalanceV2Contract`, `TriggerSmartContract`'
                  example: TransferContract
                visible:
                  type: boolean
                  description: 'Optional. Set to `true` to format addresses in Base58; set to `false` for hex format. (Default: `false`)'
                Permission_id:
                  type: integer
                  description: Optional. Permission ID used for multi-signature account operations. Defaults to the owner permission (0) if unspecified.
              additionalProperties: true
            example:
              contractType: TransferContract
              owner_address: TUoHaVjx7n5xz8LwPRDckgFrDWhMhuSuJM
              to_address: TPswDDCAWhJAZGdHPidFg5nEf8TkNToDX1
              amount: 1
              visible: true
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                description: Unsigned (or signed) transaction object ready for signing / broadcasting.
                properties:
                  txID:
                    type: string
                    description: Transaction ID (hash).
                  raw_data:
                    type: object
                    description: The transaction `raw_data` (contract, ref_block_*, expiration, etc.).
                  raw_data_hex:
                    type: string
                    description: Hex-encoded protobuf of `raw_data`.
                  visible:
                    type: boolean
                    description: Echoes back the `visible` value given in the request.
