openapi: 3.1.0
info:
  title: Tron - BroadcastHex
  version: 1.0.0
servers:
- url: https://tron-mainnet.nodit.io
  description: Tron Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  parameters: {}
  schemas: {}
  responses: {}
paths:
  /wallet/broadcasthex:
    post:
      security:
      - api_key: []
      operationId: tron-broadcasthex
      summary: BroadcastHex
      description: Broadcasts a signed, protocol buffer-encoded transaction hex string to the network.
      x-seo-description: Broadcast a signed, protobuf-encoded TRON transaction hex string.
      tags:
      - transactions
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              transaction: 
            schema:
              type: object
              required:
              - transaction
              properties:
                transaction:
                  type: string
                  description: |-
                    Transaction object. See [here](https://developers.tron.network/docs/tron-protocol-transaction) for details. (Format: Hex).
                    e.g., 
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  '`result`':
                    type: boolean
                    description: Whether the broadcast was successful. `true` - successful; `false` - failed. (Field omitted in result).
                  '`txid`':
                    type: string
                    description: The transaction hash.
                  '`code`':
                    type: string
                    description: Error code indicating the result.
                  '`message`':
                    type: string
                    description: Detailed error information.
                  '`transaction`':
                    type: object
                    description: The transaction object. Refer to the [Transaction](https://developers.tron.network/docs/tron-protocol-transaction)  chapter for details.
                    properties: {}
              examples:
                Result:
                  value: '{}'
        "400":
          description: "400"
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
