openapi: 3.1.0
info:
  title: Tron - ValidateAddress
  version: 1.0.0
servers:
- url: https://tron-mainnet.nodit.io
  description: Tron Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  parameters: {}
  schemas: {}
  responses: {}
paths:
  /wallet/validateaddress:
    post:
      security:
      - api_key: []
      operationId: tron-validateaddress
      summary: ValidateAddress
      description: Validates address, returns either true or false.
      x-seo-description: Check whether a TRON address is in a valid format.
      tags:
      - address-utilities
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              address: TUoHaVjx7n5xz8LwPRDckgFrDWhMhuSuJM
              visible: true
            schema:
              type: object
              required:
              - address
              properties:
                address:
                  type: string
                  description: 'Account address. (Format: Base58 or Hex). Example: `TUoHaVjx7n5xz8LwPRDckgFrDWhMhuSuJM`'
                  example: TUoHaVjx7n5xz8LwPRDckgFrDWhMhuSuJM
                visible:
                  type: boolean
                  description: 'Optional. Set to `true` to format addresses in Base58; set to `false` for hex format. (Default: `false`)'
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: boolean
                    description: Whether the address format is correct.
                  message:
                    type: string
                    description: Address format type or error message.
              examples:
                Result:
                  value: '{"result":true}'
        "400":
          description: "400"
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
