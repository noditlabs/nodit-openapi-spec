openapi: 3.1.0
info:
  title: Tron - GetPaginatedExchangeList
  version: 1.0.0
servers:
- url: https://tron-mainnet.nodit.io
  description: Tron Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  parameters: {}
  schemas: {}
  responses: {}
paths:
  /wallet/getpaginatedexchangelist:
    post:
      security:
      - api_key: []
      operationId: tron-getpaginatedexchangelist
      summary: GetPaginatedExchangeList
      description: List exchange pairs with pagination.
      x-seo-description: List TRON exchange pairs with pagination.
      tags:
      - exchange
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              offset: 0
              limit: 10
            schema:
              type: object
              properties:
                offset:
                  type: integer
                  description: 'Starting position for pagination. Must be ≥ 0. (Default: 0)'
                  example: 0
                limit:
                  type: integer
                  description: 'The number of results to return per page. Must be greater than 0 and cannot exceed 1000. (Default: 50)'
                  example: 10
                visible:
                  type: boolean
                  description: 'Optional. Set to `true` to format addresses in Base58; set to `false` for hex format. (Default: `false`)'
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  exchanges:
                    type: array
                    description: List of exchange pairs.
                    items:
                      type: object
                      properties:
                        exchange_id:
                          type: integer
                          format: int64
                          description: Unique ID of the exchange pair.
                        creator_address:
                          type: string
                          description: Address of the account that created the exchange.
                        create_time:
                          type: integer
                          format: int64
                          description: 'Timestamp when the exchange was created. (Unit: millisecond)'
                        first_token_id:
                          type: string
                          description: ID of the first token. TRX is represented as `_`.
                        first_token_balance:
                          type: integer
                          format: int64
                          description: Balance of the first token held by the exchange.
                        second_token_id:
                          type: string
                          description: ID of the second token. TRX is represented as `_`.
                        second_token_balance:
                          type: integer
                          format: int64
                          description: Balance of the second token held by the exchange.
