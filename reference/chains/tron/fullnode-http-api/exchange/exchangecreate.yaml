openapi: 3.1.0
info:
  title: Tron - ExchangeCreate
  version: 1.0.0
servers:
- url: https://tron-mainnet.nodit.io
  description: Tron Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  parameters: {}
  schemas: {}
  responses: {}
paths:
  /wallet/exchangecreate:
    post:
      security:
      - api_key: []
      operationId: tron-exchangecreate
      summary: ExchangeCreate
      description: Create a transaction that opens a new exchange pair. Both tokens must be injected with equal value, and a creation fee applies.
      x-seo-description: Create a transaction that opens a new TRON exchange pair.
      tags:
      - exchange
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              owner_address: TUoHaVjx7n5xz8LwPRDckgFrDWhMhuSuJM
              first_token_id: _
              first_token_balance: 100000000
              second_token_id: "1002000"
              second_token_balance: 100000000
              visible: true
            schema:
              type: object
              required:
              - owner_address
              - first_token_id
              - first_token_balance
              - second_token_id
              - second_token_balance
              properties:
                owner_address:
                  type: string
                  description: 'Transaction initiator address. (Format: Base58 or Hex)'
                  example: TUoHaVjx7n5xz8LwPRDckgFrDWhMhuSuJM
                first_token_id:
                  type: string
                  description: ID of the first token. Use `_` for TRX.
                  example: _
                first_token_balance:
                  type: integer
                  format: int64
                  description: Amount of the first token to inject.
                second_token_id:
                  type: string
                  description: ID of the second token. Use `_` for TRX.
                  example: _
                second_token_balance:
                  type: integer
                  format: int64
                  description: Amount of the second token to inject.
                visible:
                  type: boolean
                  description: 'Optional. Set to `true` to format addresses in Base58; set to `false` for hex format. (Default: `false`)'
                Permission_id:
                  type: integer
                  description: Optional. Permission ID used for multi-signature account operations. Defaults to the owner permission (0) if unspecified.
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                description: Unsigned (or signed) transaction object ready for signing / broadcasting.
                properties:
                  txID:
                    type: string
                    description: Transaction ID (hash).
                  raw_data:
                    type: object
                    description: The transaction `raw_data` (contract, ref_block_*, expiration, etc.).
                  raw_data_hex:
                    type: string
                    description: Hex-encoded protobuf of `raw_data`.
                  visible:
                    type: boolean
                    description: Echoes back the `visible` value given in the request.
