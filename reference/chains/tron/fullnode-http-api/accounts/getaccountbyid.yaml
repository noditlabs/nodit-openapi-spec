openapi: 3.1.0
info:
  title: Tron - GetAccountById
  version: 1.0.0
servers:
- url: https://tron-mainnet.nodit.io
  description: Tron Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  parameters: {}
  schemas: {}
  responses: {}
paths:
  /wallet/getaccountbyid:
    post:
      security:
      - api_key: []
      operationId: tron-getaccountbyid
      summary: GetAccountById
      description: Query account information by account ID.
      x-seo-description: Query a TRON account by its account ID.
      tags:
      - accounts
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              account_id: "6161616162626262"
              visible: true
            schema:
              type: object
              required:
              - account_id
              properties:
                account_id:
                  type: string
                  description: 'Account ID to query. (Format: hex) Example: `6161616162626262`'
                  example: "6161616162626262"
                visible:
                  type: boolean
                  description: 'Optional. Set to `true` to format addresses in Base58; set to `false` for hex format. (Default: `false`)'
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                description: Account details. See [GetAccount](https://developers.tron.network/reference/wallet-getaccount) for the full structure.
