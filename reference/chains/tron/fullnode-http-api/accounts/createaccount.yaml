openapi: 3.1.0
info:
  title: Tron - CreateAccount
  version: 1.0.0
servers:
- url: https://tron-mainnet.nodit.io
  description: Tron Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  parameters: {}
  schemas: {}
  responses: {}
paths:
  /wallet/createaccount:
    post:
      security:
      - api_key: []
      operationId: tron-createaccount
      summary: CreateAccount
      description: Activate an account. Uses an already activated account to activate a new account. Users have to generate an account locally with wallet-cli or others SDKs like TronWeb, and then use this API to activate the account generated, or just simply transfer TRX to it.
      x-seo-description: Create a transaction that activates a new TRON account.
      tags:
      - accounts
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              owner_address: TUoHaVjx7n5xz8LwPRDckgFrDWhMhuSuJM
              account_address: TUZKijZ9Esy8JEkrqMpaVgtbDKKNA5p5CZ
              visible: true
            schema:
              type: object
              properties:
                owner_address:
                  type: string
                  description: 'Transaction initiator address. (Format: Base58 or Hex)'
                account_address:
                  type: string
                  description: 'Address of the account to be activated (format: Base58 or Hex). Example: `TUZKijZ9Esy8JEkrqMpaVgtbDKKNA5p5CZ`'
                  example: TUZKijZ9Esy8JEkrqMpaVgtbDKKNA5p5CZ
                visible:
                  type: boolean
                  description: 'Optional. Set to `true` to format addresses in Base58; set to `false` for hex format. (Default: `false`)'
                Permission_id:
                  type: integer
                  description: Optional. Permission ID used for multi-signature account operations. Defaults to the owner permission (0) if unspecified.
                  format: int32
              required:
              - owner_address
              - account_address
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  owner_address:
                    type: string
                    description: 'Transaction initiator address. (Format: Base58 or Hex)'
                  account_address:
                    type: string
                    description: Account address to be activated.
                  type:
                    type: integer
                    description: Account type (e.g., 0 for external accounts).
              examples:
                Result:
                  value: '{}'
        "400":
          description: "400"
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
