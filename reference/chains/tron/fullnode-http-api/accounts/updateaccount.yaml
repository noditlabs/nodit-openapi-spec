openapi: 3.1.0
info:
  title: Tron - UpdateAccount
  version: 1.0.0
servers:
- url: https://tron-mainnet.nodit.io
  description: Tron Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  parameters: {}
  schemas: {}
  responses: {}
paths:
  /wallet/updateaccount:
    post:
      security:
      - api_key: []
      operationId: tron-updateaccount
      summary: UpdateAccount
      description: Modify account name
      x-seo-description: Create a transaction that changes a TRON account's name.
      tags:
      - accounts
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              owner_address: TUoHaVjx7n5xz8LwPRDckgFrDWhMhuSuJM
              account_name: "0x7570646174654e616d6531353330383933343635353139"
              visible: true
            schema:
              type: object
              properties:
                owner_address:
                  type: string
                  description: 'Transaction initiator address. (Format: Base58 or Hex)'
                account_name:
                  type: string
                  description: 'Account name. Example: `testAccountName`'
                  example: testAccountName
                visible:
                  type: boolean
                  description: 'Optional. Set to `true` to format addresses in Base58; set to `false` for hex format. (Default: `false`)'
                Permission_id:
                  type: integer
                  description: Optional. Permission ID used for multi-signature account operations. Defaults to the owner permission (0) if unspecified.
                  format: int32
              required:
              - account_name
              - owner_address
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  owner_address:
                    type: string
                    description: 'Transaction initiator address. (Format: Base58 or Hex)'
                  account_name:
                    type: string
                    description: Account name. (Can be modified **once** via [wallet/updateaccount](https://developers.tron.network/reference/updateaccount)).
              examples:
                Result:
                  value: '{}'
        "400":
          description: "400"
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
