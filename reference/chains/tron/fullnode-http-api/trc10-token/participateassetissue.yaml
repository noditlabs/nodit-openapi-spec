openapi: 3.1.0
info:
  title: Tron - ParticipateAssetIssue
  version: 1.0.0
servers:
- url: https://tron-mainnet.nodit.io
  description: Tron Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  parameters: {}
  schemas: {}
  responses: {}
paths:
  /wallet/participateassetissue:
    post:
      security:
      - api_key: []
      operationId: tron-participateassetissue
      summary: ParticipateAssetIssue
      description: Participate in an asset issue.
      x-seo-description: Create a transaction that participates in a TRC-10 token issuance.
      tags:
      - trc10-token
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              owner_address: TUoHaVjx7n5xz8LwPRDckgFrDWhMhuSuJM
              to_address: TPswDDCAWhJAZGdHPidFg5nEf8TkNToDX1
              asset_name: "1002000"
              amount: 100
              visible: true
            schema:
              type: object
              properties:
                to_address:
                  type: string
                  description: 'Issuer''s address. (Format: Base58 or Hex). Example: `TPswDDCAWhJAZGdHPidFg5nEf8TkNToDX1`'
                  example: TPswDDCAWhJAZGdHPidFg5nEf8TkNToDX1
                owner_address:
                  type: string
                  description: 'Transaction initiator address. (Format: Base58 or Hex)'
                amount:
                  type: integer
                  description: 'Amount of TRX to participate in token issuance. (Unit: sun)'
                  format: int64
                asset_name:
                  type: string
                  description: 'Token id, default hexString. Example: `1000001031303030303031`'
                  example: "1000001031303030303031"
                visible:
                  type: boolean
                  description: 'Optional. Set to `true` to format addresses in Base58; set to `false` for hex format. (Default: `false`)'
                  default: true
                Permission_id:
                  type: integer
                  description: Optional. Permission ID used for multi-signature account operations. Defaults to the owner permission (0) if unspecified.
                  format: int32
              required:
              - to_address
              - owner_address
              - asset_name
              - amount
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  owner_address:
                    type: string
                    description: 'Transaction initiator address. (Format: Base58 or Hex)'
                  to_address:
                    type: string
                    description: Token issuer's address.
                  asset_name:
                    type: string
                    description: TRC-10 Token ID.
                  amount:
                    type: integer
                    format: int64
                    description: 'Amount of TRX used to purchase the token. (Unit: sun)'
              examples:
                Result:
                  value: '{}'
        "400":
          description: "400"
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
