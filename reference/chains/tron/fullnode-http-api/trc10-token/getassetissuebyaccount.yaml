openapi: 3.1.0
info:
  title: Tron - GetAssetIssueByAccount
  version: 1.0.0
servers:
- url: https://tron-mainnet.nodit.io
  description: Tron Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  parameters: {}
  schemas: {}
  responses: {}
paths:
  /wallet/getassetissuebyaccount:
    post:
      security:
      - api_key: []
      operationId: tron-getassetissuebyaccount
      summary: GetAssetIssueByAccount
      description: Query the TRC-10 token information issued by an account.
      x-seo-description: Query the TRC-10 token issued by a TRON account.
      tags:
      - trc10-token
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              address: TF5Bn4cJCT6GVeUgyCN4rBhDg42KBrpAjg
              visible: true
            schema:
              type: object
              properties:
                address:
                  type: string
                  description: 'Token issuer account address. (Format: Base58 or Hex)'
                visible:
                  type: boolean
                  description: 'Optional. Set to `true` to format addresses in Base58; set to `false` for hex format. (Default: `false`)'
              required:
              - address
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: The TRC-10 Token ID.
                  owner_address:
                    type: string
                    description: Token issuer's address.
              examples:
                Result:
                  value: '{}'
