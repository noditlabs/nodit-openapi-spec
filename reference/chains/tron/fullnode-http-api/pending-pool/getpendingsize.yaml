openapi: 3.1.0
info:
  title: Tron - GetPendingSize
  version: 1.0.0
servers:
- url: https://tron-mainnet.nodit.io
  description: Tron Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  parameters: {}
  schemas: {}
  responses: {}
paths:
  /wallet/getpendingsize:
    get:
      security:
      - api_key: []
      operationId: tron-getpendingsize
      summary: GetPendingSize
      description: Get the size of the pending pool queue
      x-seo-description: Query the number of transactions waiting in the TRON node pending pool.
      tags:
      - pending-pool
      parameters: []
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  pendingSize:
                    type: integer
                    format: int64
                    description: The size of the pending pool queue.
              examples:
                Result:
                  value: '{"pendingSize": 126}'
        "400":
          description: "400"
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
