openapi: 3.1.0
info:
  title: Tron - GetNextMaintenanceTime
  version: 1.0.0
servers:
- url: https://tron-mainnet.nodit.io
  description: Tron Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  parameters: {}
  schemas: {}
  responses: {}
paths:
  /wallet/getnextmaintenancetime:
    get:
      security:
      - api_key: []
      operationId: tron-getnextmaintenancetime
      summary: GetNextMaintenanceTime
      description: Returns the timestamp of the next voting time in milliseconds.
      x-seo-description: Query the timestamp of the next TRON maintenance (voting) period.
      tags:
      - query-the-network
      parameters: []
      responses:
        "200":
          description: "200"
          content:
            application/json:
              examples:
                Result:
                  value: '{"num": 1591099200000}'
              schema:
                type: object
                properties:
                  num:
                    type: integer
                    example: 1591099200000
                    default: 0
        "400":
          description: "400"
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
