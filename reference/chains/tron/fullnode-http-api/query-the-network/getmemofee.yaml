openapi: 3.1.0
info:
  title: Tron - GetMemoFee
  version: 1.0.0
servers:
- url: https://tron-mainnet.nodit.io
  description: Tron Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  parameters: {}
  schemas: {}
  responses: {}
paths:
  /wallet/getmemofee:
    get:
      security:
      - api_key: []
      operationId: tron-getmemofee
      summary: GetMemoFee
      description: Query the change history of the fee charged for attaching a memo to a transaction.
      x-seo-description: Query the historical fee charged for attaching a memo to a TRON transaction.
      tags:
      - query-the-network
      parameters: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  prices:
                    type: string
                    description: Full memo fee history. Each change is separated by a comma in the format `timestamp:fee`, where the timestamp is in milliseconds and the fee is in sun.
                    example: 0:0,1671170400000:1000000
