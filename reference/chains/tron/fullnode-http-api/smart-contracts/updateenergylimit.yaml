openapi: 3.1.0
info:
  title: Tron - UpdateEnergyLimit
  version: 1.0.0
servers:
- url: https://tron-mainnet.nodit.io
  description: Tron Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  parameters: {}
  schemas: {}
  responses: {}
paths:
  /wallet/updateenergylimit:
    post:
      security:
      - api_key: []
      operationId: tron-updateenergylimit
      summary: UpdateEnergyLimit
      description: Update the origin_energy_limit parameter of a smart contract
      x-seo-description: Create a transaction that updates a contract's origin Energy limit.
      tags:
      - smart-contracts
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              owner_address: TUoHaVjx7n5xz8LwPRDckgFrDWhMhuSuJM
              contract_address: TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t
              origin_energy_limit: 10000000
              visible: true
            schema:
              type: object
              properties:
                owner_address:
                  type: string
                  description: 'Transaction initiator address. (Format: Base58 or Hex)'
                contract_address:
                  type: string
                  description: |-
                    Contract address. (Format: Base58 or Hex).
                    Example: `TG3XXyExBkPp9nzdajDZsozEu4BkaSJozs`
                  example: TG3XXyExBkPp9nzdajDZsozEu4BkaSJozs
                origin_energy_limit:
                  type: integer
                  description: 'Maximum Energy the contract deployer is willing to subsidize per call. Must be > 0; typical value: 1,000,000–10,000,000. Example: `100000000`'
                  format: int32
                  example: 100000000
                Permission_id:
                  type: integer
                  description: Optional. Permission ID used for multi-signature account operations. Defaults to the owner permission (0) if unspecified.
                  format: int32
                visible:
                  type: boolean
                  description: 'Optional. Set to `true` to format addresses in Base58; set to `false` for hex format. (Default: `false`)'
                  default: true
              required:
              - owner_address
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  owner_address:
                    type: string
                    description: 'Transaction initiator address. (Format: Base58 or Hex)'
                  contract_address:
                    type: string
                    description: 'Contract address. (Format: Base58 or Hex)'
                  origin_energy_limit:
                    type: integer
                    description: Adjusted maximum energy provided by the contract deployer per transaction.
              examples:
                Result:
                  value: '{}'
        "400":
          description: "400"
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
