openapi: 3.1.0
info:
  title: Tron - EstimateEnergy
  version: 1.0.0
servers:
- url: https://tron-mainnet.nodit.io
  description: Tron Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  parameters: {}
  schemas: {}
  responses: {}
paths:
  /wallet/estimateenergy:
    post:
      security:
      - api_key: []
      operationId: tron-estimateenergy
      summary: EstimateEnergy
      description: Estimate the energy required for the successful execution of smart contract transactions or deploying a contract
      x-seo-description: Estimate the Energy required to execute a TRON smart contract transaction.
      tags:
      - smart-contracts
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              owner_address: TUoHaVjx7n5xz8LwPRDckgFrDWhMhuSuJM
              contract_address: TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t
              function_selector: transfer(address,uint256)
              parameter: 00000000000000000000000098927ffb9f554dc4a453c64b2e553a02d6df514b00000000000000000000000000000000000000000000000000000000000f4240
              visible: true
            schema:
              type: object
              properties:
                owner_address:
                  type: string
                  description: 'Transaction initiator address. (Format: Base58 or Hex)'
                contract_address:
                  type: string
                  description: |-
                    Contract address. (Format: Base58 or Hex)
                    Example: `TG3XXyExBkPp9nzdajDZsozEu4BkaSJozs`
                  example: TG3XXyExBkPp9nzdajDZsozEu4BkaSJozs
                function_selector:
                  type: string
                  description: |-
                    Function selector.
                    Example: `transfer(address,uint256)`.
                  example: transfer(address,uint256)
                parameter:
                  type: string
                  description: |-
                    ABI-encoded function parameters (Hex String).
                    Example: `000000000000000000000000a614f803b6fd780986a42c78ec9c7f77e6ded13c`
                  example: 000000000000000000000000a614f803b6fd780986a42c78ec9c7f77e6ded13c
                data:
                  type: string
                  description: This field transmits the necessary `data` for smart contract interaction, including the function being called and its parameters. You may choose to use the data field, which contains the complete ABI-encoded information, or use the `function_selector` and `parameter` fields separately. Note that if both `data` and `function_selector` are present, the system will prioritize using the `function_selector` and `parameter` fields for the contract interaction.
                call_value:
                  type: integer
                  description: 'Amount of TRX transferred into the contract. (Unit: sun)'
                  format: int64
                call_token_value:
                  type: integer
                  description: Amount of TRC-10 token transferred into the contract.
                  format: int64
                token_id:
                  type: integer
                  description: TRC-10 token ID
                  format: int64
                visible:
                  type: boolean
                  description: 'Optional. Set to `true` to format addresses in Base58; set to `false` for hex format. (Default: `false`)'
                  default: true
              required:
              - owner_address
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object
                    description: Result of the contract execution simulation.
                    properties:
                      result:
                        type: object
                        description: Result of the contract execution simulation.
                      code:
                        type: string
                        description: Response code indicating the error type. (Returned only on failure)
                      message:
                        type: string
                        description: Response message describing the error details. (Returned only on failure)
                  energy_required:
                    type: integer
                    format: int64
                    description: Estimated Energy required to execute the transaction.
              examples:
                Result:
                  value: |-
                    {
                      "result":{"result":true},
                      // constant_result should be parsed by corresponding ABI
                      "constant_result":["000000000000000000000000000000000000000000000000000009a1832a6361"]
                     // ...
                    }
        "400":
          description: "400"
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
