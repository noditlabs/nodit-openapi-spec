openapi: 3.1.0
info:
  title: Tron - UpdateSetting
  version: 1.0.0
servers:
- url: https://tron-mainnet.nodit.io
  description: Tron Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  parameters: {}
  schemas: {}
  responses: {}
paths:
  /wallet/updatesetting:
    post:
      security:
      - api_key: []
      operationId: tron-updatesetting
      summary: UpdateSetting
      description: Update the consume_user_resource_percent parameter of a smart contract
      x-seo-description: Create a transaction that updates a contract's user resource percentage.
      tags:
      - smart-contracts
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              owner_address: TUoHaVjx7n5xz8LwPRDckgFrDWhMhuSuJM
              contract_address: TR7NHqjeKQxGTCi8q8ZY4pL8otSzgjLj6t
              consume_user_resource_percent: 10
              visible: true
            schema:
              type: object
              required:
              - owner_address
              - contract_address
              - consume_user_resource_percent
              properties:
                owner_address:
                  type: string
                  description: 'Transaction initiator address. (Format: Base58 or Hex)'
                contract_address:
                  type: string
                  description: |-
                    Contract address. (Format: Base58 or Hex).
                    Example: `TG3XXyExBkPp9nzdajDZsozEu4BkaSJozs`
                  example: TG3XXyExBkPp9nzdajDZsozEu4BkaSJozs
                consume_user_resource_percent:
                  type: integer
                  description: 'Percentage of Energy paid by the contract caller (vs. the deployer). Range: 0–100. Default: 0 (deployer pays all). Example: `10` (caller pays 10%, deployer pays 90%).'
                  format: int32
                Permission_id:
                  type: integer
                  description: Optional. Permission ID used for multi-signature account operations. Defaults to the owner permission (0) if unspecified.
                  format: int32
                visible:
                  type: boolean
                  description: 'Optional. Set to `true` to format addresses in Base58; set to `false` for hex format. (Default: `false`)'
                  default: true
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  owner_address:
                    type: string
                    description: 'Transaction initiator address. (Format: Base58 or Hex)'
                  contract_address:
                    type: string
                    description: 'Contract address. (Format: Base58 or Hex)'
                  consume_user_resource_percent:
                    type: int64
                    description: 'Percentage of user Energy consumption for a smart contract. (Range: [0-100])'
                    format: int64
              examples:
                Result:
                  value: '{}'
        "400":
          description: "400"
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
