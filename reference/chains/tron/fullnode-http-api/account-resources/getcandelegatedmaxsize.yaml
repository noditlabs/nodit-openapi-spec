openapi: 3.1.0
info:
  title: Tron - GetCanDelegatedMaxSize
  version: 1.0.0
servers:
- url: https://tron-mainnet.nodit.io
  description: Tron Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  parameters: {}
  schemas: {}
  responses: {}
paths:
  /wallet/getcandelegatedmaxsize:
    post:
      security:
      - api_key: []
      operationId: tron-getcandelegatedmaxsize
      summary: GetCanDelegatedMaxSize
      description: In Stake 2.0, query the amount of delegatable resources share of the specified resource type for an address, unit is sun.
      x-seo-description: Query the maximum delegatable resource share of a TRON account.
      tags:
      - account-resources
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              owner_address: TUoHaVjx7n5xz8LwPRDckgFrDWhMhuSuJM
              type: 1
              visible: true
            schema:
              type: object
              properties:
                owner_address:
                  type: string
                  description: 'Transaction initiator address. (Format: Base58 or Hex)'
                type:
                  type: integer
                  description: Resource type, 0 is bandwidth, 1 is energy.
                  default: 0
                  format: int32
                visible:
                  type: boolean
                  description: 'Optional. Set to `true` to format addresses in Base58; set to `false` for hex format. (Default: `false`)'
                  default: "false"
              required:
              - owner_address
              - type
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                type: object
                properties:
                  max_size:
                    type: integer
                    format: int64
                    description: 'Maximum amount of delegatable resource shares. (Unit: sun)'
              examples:
                Result:
                  value: '{}'
        "400":
          description: "400"
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
