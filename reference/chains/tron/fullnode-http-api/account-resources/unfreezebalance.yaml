openapi: 3.1.0
info:
  title: Tron - UnfreezeBalance
  version: 1.0.0
servers:
- url: https://tron-mainnet.nodit.io
  description: Tron Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  parameters: {}
  schemas: {}
  responses: {}
paths:
  /wallet/unfreezebalance:
    post:
      security:
      - api_key: []
      operationId: tron-unfreezebalance
      summary: UnfreezeBalance
      description: Unstake the TRX staked during Stake 1.0, release the obtained bandwidth or energy and TP. This operation will cause automatically cancel all votes.
      x-seo-description: Create a Stake 1.0 transaction that unstakes TRX.
      tags:
      - account-resources
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              owner_address: TUoHaVjx7n5xz8LwPRDckgFrDWhMhuSuJM
              resource: ENERGY
              receiver_address: TPswDDCAWhJAZGdHPidFg5nEf8TkNToDX1
              visible: true
            schema:
              type: object
              properties:
                owner_address:
                  type: string
                  description: 'Transaction initiator address. (Format: Base58 or Hex)'
                resource:
                  type: string
                  description: 'Type of resource. (Enum: "BANDWIDTH" or "ENERGY")'
                receiver_address:
                  type: string
                  description: Optional, in Base58 format or HEX format.
                Permission_id:
                  type: integer
                  description: Optional. Permission ID used for multi-signature account operations. Defaults to the owner permission (0) if unspecified.
                  format: int32
                visible:
                  type: boolean
                  description: 'Optional. Set to `true` to format addresses in Base58; set to `false` for hex format. (Default: `false`)'
                  default: "false"
              required:
              - owner_address
              - resource
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  owner_address:
                    type: string
                    description: 'Transaction initiator address. (Format: Base58 or Hex)'
                  resource:
                    type: string
                    description: 'Type of resource. (Enum: `BANDWIDTH`, `ENERGY`)'
                  receiver_address:
                    type: string
                    description: Resource receiver address.
              examples:
                Result:
                  value: '{}'
        "400":
          description: "400"
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
