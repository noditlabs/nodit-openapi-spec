openapi: 3.1.0
info:
  title: Tron - UnfreezeBalanceV2
  version: 1.0.0
servers:
- url: https://tron-mainnet.nodit.io
  description: Tron Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  parameters: {}
  schemas: {}
  responses: {}
paths:
  /wallet/unfreezebalancev2:
    post:
      security:
      - api_key: []
      operationId: tron-unfreezebalancev2
      summary: UnfreezeBalanceV2
      description: Unstake some TRX staked in Stake 2.0, release the corresponding amount of bandwidth or energy, and voting rights (TP)
      x-seo-description: Create a Stake 2.0 transaction that unstakes TRX.
      tags:
      - account-resources
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              owner_address: TUoHaVjx7n5xz8LwPRDckgFrDWhMhuSuJM
              unfreeze_balance: 1000000
              resource: ENERGY
              visible: true
            schema:
              type: object
              properties:
                owner_address:
                  type: string
                  description: 'Transaction initiator address. (Format: Base58 or Hex)'
                unfreeze_balance:
                  type: integer
                  description: 'Amount of TRX to unstake. (Unit: sun)'
                  format: int64
                resource:
                  type: string
                  description: 'Type of resource. (Enum: "BANDWIDTH" or "ENERGY")'
                Permission_id:
                  type: integer
                  description: Optional. Permission ID used for multi-signature account operations. Defaults to the owner permission (0) if unspecified.
                  format: int32
                visible:
                  type: boolean
                  description: 'Optional. Set to `true` to format addresses in Base58; set to `false` for hex format. (Default: `false`)'
                  default: "false"
              required:
              - owner_address
              - unfreeze_balance
              - resource
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  owner_address:
                    type: string
                    description: 'Transaction initiator address. (Format: Base58 or Hex)'
                  resource:
                    type: string
                    description: 'Type of resource. (Enum: `BANDWIDTH`, `ENERGY`)'
                  unfreeze_balance:
                    type: integer
                    format: int64
                    description: 'Amount of TRX to unstake. (Unit: sun)'
              examples:
                Result:
                  value: '{}'
        "400":
          description: "400"
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
