openapi: 3.1.0
info:
  title: Tron - FreezeBalanceV2
  version: 1.0.0
servers:
- url: https://tron-mainnet.nodit.io
  description: Tron Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  parameters: {}
  schemas: {}
  responses: {}
paths:
  /wallet/freezebalancev2:
    post:
      security:
      - api_key: []
      operationId: tron-freezebalancev2
      summary: FreezeBalanceV2
      description: In Stake 2.0, stake an amount of TRX to obtain bandwidth or energy, and obtain equivalent TRON Power(TP) according to the staked amount
      x-seo-description: Create a Stake 2.0 transaction that stakes TRX for Bandwidth or Energy.
      tags:
      - account-resources
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              owner_address: TUoHaVjx7n5xz8LwPRDckgFrDWhMhuSuJM
              frozen_balance: 1000000
              resource: ENERGY
              visible: true
            schema:
              type: object
              required:
              - owner_address
              - frozen_balance
              - resource
              properties:
                owner_address:
                  type: string
                  description: 'Transaction initiator address. (Format: Base58 or Hex)'
                frozen_balance:
                  type: integer
                  description: TRX stake amount, the unit is sun
                  format: int64
                resource:
                  type: string
                  description: TRX stake type, 'BANDWIDTH' or 'ENERGY'
                Permission_id:
                  type: integer
                  description: Optional. Permission ID used for multi-signature account operations. Defaults to the owner permission (0) if unspecified.
                  format: int32
                visible:
                  type: boolean
                  description: 'Optional. Set to `true` to format addresses in Base58; set to `false` for hex format. (Default: `false`)'
                  default: "false"
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  owner_address:
                    type: string
                    description: 'Transaction initiator address. (Format: Base58 or Hex)'
                  resource:
                    type: string
                    description: 'Type of resource. (Enum: `BANDWIDTH`, `ENERGY`)'
                  frozen_balance:
                    type: integer
                    format: int64
                    description: 'Amount of TRX to stake. (Unit: sun, in Stake 2.0)'
              examples:
                Result:
                  value: '{}'
        "400":
          description: "400"
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
