openapi: 3.1.0
info:
  title: Tron - UnDelegateResource
  version: 1.0.0
servers:
- url: https://tron-mainnet.nodit.io
  description: Tron Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  parameters: {}
  schemas: {}
  responses: {}
paths:
  /wallet/undelegateresource:
    post:
      security:
      - api_key: []
      operationId: tron-undelegateresource
      summary: UnDelegateResource
      description: Cancel the delegation of bandwidth or energy resources to other accounts in Stake 2.0
      x-seo-description: Create a Stake 2.0 transaction that reclaims delegated Bandwidth or Energy.
      tags:
      - account-resources
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              owner_address: TUoHaVjx7n5xz8LwPRDckgFrDWhMhuSuJM
              receiver_address: TPswDDCAWhJAZGdHPidFg5nEf8TkNToDX1
              balance: 1000000
              resource: ENERGY
              visible: true
            schema:
              type: object
              properties:
                owner_address:
                  type: string
                  description: 'Transaction initiator address. (Format: Base58 or Hex)'
                receiver_address:
                  type: string
                  description: Resource receiver address, in Base58 format or HEX format.
                balance:
                  type: integer
                  description: 'Amount of TRX to delegate or undelegate for resources. (Unit: sun)'
                  format: int64
                resource:
                  type: string
                  description: 'Type of resource. (Enum: "BANDWIDTH" or "ENERGY")'
                visible:
                  type: boolean
                  description: 'Optional. Set to `true` to format addresses in Base58; set to `false` for hex format. (Default: `false`)'
                  default: "false"
                Permission_id:
                  type: integer
                  description: Optional. Permission ID used for multi-signature account operations. Defaults to the owner permission (0) if unspecified.
                  format: int32
              required:
              - owner_address
              - receiver_address
              - balance
              - resource
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  owner_address:
                    type: string
                    description: 'Transaction initiator address. (Format: Base58 or Hex)'
                  resource:
                    type: string
                    description: 'Type of resource. (Enum: `BANDWIDTH`, `ENERGY`)'
                  receiver_address:
                    type: string
                    description: Resource receiver address.
                  balance:
                    type: integer
                    format: int64
                    description: 'Amount of TRX for resource delegation. (Unit: sun)'
              examples:
                Result:
                  value: '{}'
        "400":
          description: "400"
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
