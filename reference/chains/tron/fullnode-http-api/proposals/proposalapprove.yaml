openapi: 3.1.0
info:
  title: Tron - ProposalApprove
  version: 1.0.0
servers:
- url: https://tron-mainnet.nodit.io
  description: Tron Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  parameters: {}
  schemas: {}
  responses: {}
paths:
  /wallet/proposalapprove:
    post:
      security:
      - api_key: []
      operationId: tron-proposalapprove
      summary: ProposalApprove
      description: Approves proposed transaction.
      x-seo-description: Create a transaction that approves a TRON chain proposal.
      tags:
      - proposals
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              owner_address: TJvaAeFb8Lykt9RQcVyyTFN2iDvGMuyD4M
              proposal_id: 89
              is_add_approval: true
              visible: true
            schema:
              type: object
              properties:
                owner_address:
                  type: string
                  description: 'Transaction initiator address. (Format: Base58 or Hex)'
                proposal_id:
                  type: integer
                  description: 'Unique ID for the chain proposal. Example:  `89`'
                  format: int32
                  example: 89
                is_add_approval:
                  type: boolean
                  description: Whether to approve the proposal.
                Permission_id:
                  type: integer
                  description: Optional. Permission ID used for multi-signature account operations. Defaults to the owner permission (0) if unspecified.
                  format: int32
                visible:
                  type: boolean
                  description: 'Optional. Set to `true` to format addresses in Base58; set to `false` for hex format. (Default: `false`)'
              required:
              - owner_address
              - proposal_id
              - is_add_approval
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  owner_address:
                    type: string
                    description: 'Transaction initiator address. (Format: Base58 or Hex)'
                  proposal_id:
                    type: int64
                    description: Unique ID for the chain proposal.
                    format: int64
                  is_add_approval:
                    type: boolean
                    description: Whether to approve the proposal.
              examples:
                Result:
                  value: '{}'
        "400":
          description: "400"
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
