openapi: 3.1.0
info:
  title: Tron - ProposalCreate
  version: 1.0.0
servers:
- url: https://tron-mainnet.nodit.io
  description: Tron Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  parameters: {}
  schemas: {}
  responses: {}
paths:
  /wallet/proposalcreate:
    post:
      security:
      - api_key: []
      operationId: tron-proposalcreate
      summary: ProposalCreate
      description: Creates a proposal transaction.
      x-seo-description: Create a transaction that proposes new TRON chain parameter values.
      tags:
      - proposals
      parameters: []
      requestBody:
        content:
          application/json:
            example:
              owner_address: TJvaAeFb8Lykt9RQcVyyTFN2iDvGMuyD4M
              parameters:
              - key: 0
                value: 100000
              - key: 1
                value: 2
              visible: true
            schema:
              type: object
              properties:
                owner_address:
                  type: string
                  description: 'Transaction initiator address. (Format: Base58 or Hex)'
                parameters:
                  type: string
                  description: |-
                    Map of chain parameter IDs and their new values.
                    For example: `  [{"key": 0,"value": 100000},{"key": 1,"value": 2}] `
                  format: json
                Permission_id:
                  type: integer
                  description: Optional. Permission ID used for multi-signature account operations. Defaults to the owner permission (0) if unspecified.
                  format: int32
                visible:
                  type: boolean
                  description: 'Optional. Set to `true` to format addresses in Base58; set to `false` for hex format. (Default: `false`)'
              required:
              - owner_address
              - parameters
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  owner_address:
                    type: string
                    description: 'Transaction initiator address. (Format: Base58 or Hex)'
                  parameters:
                    type: map\<int64, int64>
                    description: Proposed values for chain parameters, keyed by parameter ID.
              examples:
                Result:
                  value: '{}'
        "400":
          description: "400"
          content:
            application/json:
              examples:
                Result:
                  value: '{}'
              schema:
                type: object
                properties: {}
