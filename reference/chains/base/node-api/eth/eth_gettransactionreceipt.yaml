openapi: 3.1.0
info:
  title: Base - eth_getTransactionReceipt
  version: 1.0.0
servers:
- url: https://base-mainnet.nodit.io
  description: Base Mainnet
- url: https://base-sepolia.nodit.io
  description: Base Sepolia
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  schemas:
    Log:
      type: object
      description: An event log object containing information about events emitted during transaction execution.
      properties:
        address:
          type: string
          description: The address of the contract that emitted this log
        topics:
          type: array
          description: Array of event signature hash and indexed parameters (up to 4 entries)
          items:
            type: string
        data:
          type: string
          description: Non-indexed event parameter data (hex encoded)
        blockNumber:
          type: string
          description: Block number containing this log (hex)
        transactionHash:
          type: string
          description: Hash of the transaction that created this log
        transactionIndex:
          type: string
          description: Transaction position index within the block (hex)
        blockHash:
          type: string
          description: Hash of the block containing this log
        logIndex:
          type: string
          description: Log position index within the block (hex)
        removed:
          type: boolean
          description: True if the log was removed due to a chain reorganization
    TransactionReceipt:
      type: object
      description: A transaction receipt object. Available only after the transaction has been included in a block.
      properties:
        blockHash:
          type: string
          description: Hash of the block containing this transaction
        blockNumber:
          type: string
          description: Block number containing this transaction (hex)
        contractAddress:
          type: string
          nullable: true
          description: Contract address created if this was a contract creation transaction, otherwise null
        cumulativeGasUsed:
          type: string
          description: Total gas used in the block up to and including this transaction (hex)
        effectiveGasPrice:
          type: string
          description: Actual gas price paid (hex, in wei)
        from:
          type: string
          description: Sender address of the transaction
        gasUsed:
          type: string
          description: Gas used by this specific transaction (hex)
        logs:
          type: array
          description: List of event logs emitted during transaction execution
          items:
            $ref: '#/components/schemas/Log'
        logsBloom:
          type: string
          description: Bloom filter for event log search (2048 bits, hex)
        status:
          type: string
          description: Transaction execution result (0x1=success, 0x0=failure)
        to:
          type: string
          nullable: true
          description: Recipient address. Null for contract creation transactions
        transactionHash:
          type: string
          description: Transaction hash
        transactionIndex:
          type: string
          description: Transaction position index within the block (hex)
        type:
          type: string
          description: Transaction type (0x0=Legacy, 0x1=EIP-2930, 0x2=EIP-1559)
  responses:
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - NO_AUTHENTICATION_FOUND
                - AUTHENTICATION_FAILED
                description: Code to identify the cause of authentication failure
              message:
                type: string
                description: Detailed message including the cause of authentication failure
            required:
            - code
            - message
          examples:
            NO_AUTHENTICATION_FOUND:
              summary: The request does not include authentication (API Key)
              value:
                code: NO_AUTHENTICATION_FOUND
                message: No authentication found.
            AUTHENTICATION_FAILED:
              summary: The authentication (API Key) is invalid
              value:
                code: AUTHENTICATION_FAILED
                message: Authentication failed.
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - PERMISSION_DENIED
                description: Code indicating permission denied
              message:
                type: string
                description: Detailed message including information about the denied resource
            required:
            - code
            - message
          examples:
            PERMISSION_DENIED:
              summary: The request accesses a resource it is not authorized for
              value:
                code: PERMISSION_DENIED
                message: Permission denied
    "404":
      description: Not Found
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - WRONG_ENDPOINT
                - NOT_SUPPORTED_CHAIN
                - RESOURCE_NOT_FOUND
                description: Code to identify the cause of the resource not found
              message:
                type: string
                description: Detailed message including the name, value, etc. of the resource not found
            required:
            - code
            - message
          examples:
            WRONG_ENDPOINT:
              summary: The requested API path does not exist
              value:
                code: WRONG_ENDPOINT
                message: Wrong endpoint
            NOT_SUPPORTED_CHAIN:
              summary: The requested chain is not supported
              value:
                code: NOT_SUPPORTED_CHAIN
                message: Not supported chain
            RESOURCE_NOT_FOUND:
              summary: The requested resource does not exist
              value:
                code: RESOURCE_NOT_FOUND
                message: 'Resource not found: { RESOURCE_NAME = RESOURCE_VALUE }'
    "405":
      description: Method Not Allowed
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - METHOD_NOT_ALLOWED
                description: Code indicating a disallowed HTTP method
              message:
                type: string
                description: Detailed message about the disallowed HTTP method
            required:
            - code
            - message
          examples:
            METHOD_NOT_ALLOWED:
              summary: The request uses an unsupported HTTP method
              value:
                code: METHOD_NOT_ALLOWED
                message: Method not allowed
    "408":
      description: Request Timeout
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TIMEOUT
                description: Code indicating request timeout
              message:
                type: string
                description: Detailed message including the cause of the timeout
            required:
            - code
            - message
          examples:
            TIMEOUT:
              summary: Processing did not finish within the time limit
              value:
                code: TIMEOUT
                message: Request timeout
    "409":
      description: Conflict
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - RESOURCE_ALREADY_EXISTS
                - REJECTED
                description: Code to identify the cause of the request conflict
              message:
                type: string
                description: Detailed message including information about the conflicting resource
            required:
            - code
            - message
          examples:
            RESOURCE_ALREADY_EXISTS:
              summary: The request tries to create a resource that already exists
              value:
                code: RESOURCE_ALREADY_EXISTS
                message: Resource already exists
            REJECTED:
              summary: The server rejected the request
              value:
                code: REJECTED
                message: Request rejected
    "413":
      description: Payload Too Large
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - CONTENTS_TOO_LARGE
                description: Code indicating payload size exceeded
              message:
                type: string
                description: Detailed message including the maximum allowed payload size
            required:
            - code
            - message
          examples:
            CONTENTS_TOO_LARGE:
              summary: The payload exceeds the server's maximum size
              value:
                code: CONTENTS_TOO_LARGE
                message: Contents too large
    "414":
      description: URI Too Long
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_LONG_URI
                description: Code indicating URI length exceeded
              message:
                type: string
                description: Detailed message including the maximum allowed URI length
            required:
            - code
            - message
          examples:
            TOO_LONG_URI:
              summary: The request URI exceeds the server's maximum length
              value:
                code: TOO_LONG_URI
                message: URI too long
    "429":
      description: Too Many Requests
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_MANY_REQUESTS
                - EXCEEDED_QUOTA_LIMIT
                description: Code identifying the cause of the request limit exceeded
              message:
                type: string
                description: Detailed message including the exceeded limit type and allowed threshold
            required:
            - code
            - message
          examples:
            TOO_MANY_REQUESTS:
              summary: The rate limit was exceeded
              value:
                code: TOO_MANY_REQUESTS
                message: Too many requests
            EXCEEDED_QUOTA_LIMIT:
              summary: The quota limit was exceeded
              value:
                code: EXCEEDED_QUOTA_LIMIT
                message: Exceeded quota limit
    "500":
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - INTERNAL_SERVER_ERROR
                - INTERRUPTED
                description: Code to identify the cause of the internal server error
              message:
                type: string
                description: Detailed message including the cause of the server error
            required:
            - code
            - message
          examples:
            INTERNAL_SERVER_ERROR:
              summary: An internal server error occurred
              value:
                code: INTERNAL_SERVER_ERROR
                message: Internal server error
            INTERRUPTED:
              summary: Processing failed temporarily due to server load
              value:
                code: INTERRUPTED
                message: Request interrupted
    "503":
      description: Service Unavailable
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - UNAVAILABLE
                description: Code indicating service unavailability
              message:
                type: string
                description: Detailed message including the cause of the service outage
            required:
            - code
            - message
          examples:
            UNAVAILABLE:
              summary: The service is unavailable due to infrastructure downtime or an upgrade
              value:
                code: UNAVAILABLE
                message: Service unavailable
paths:
  /:
    post:
      security:
      - api_key: []
      operationId: base-eth_gettransactionreceipt
      summary: eth_getTransactionReceipt
      description: |
        Returns the transaction receipt for the specified transaction hash.
        					

        > 🚧 Response taking too long? Response time may vary based on transaction complexity!
        >
        > When querying a specific transaction, response time can increase depending on the amount of event logs, transaction order in the block, etc.
        > For faster responses, request without including the transaction's event logs.
      x-seo-description: Retrieve the transaction receipt including status, gas used, and logs after confirmation.
      tags:
      - eth
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - jsonrpc
              - method
              - params
              properties:
                id:
                  type: integer
                  example: 1
                jsonrpc:
                  type: string
                  example: "2.0"
                method:
                  type: string
                  example: eth_getTransactionReceipt
                params:
                  type: array
                  items:
                    oneOf:
                    - title: Transaction Hash
                      type: string
                      pattern: ^0[xX][0-9a-fA-F]{64}
                      example: "0xda148d856aef6d77d0b76c90ef1091ffe77afe9ee9b1c6cc23f28f042f198bd8"
                      description: Transaction hash is the unique identifier of a transaction. It is expressed as a 64-character hexadecimal string.
                  example:
                  - "0xda148d856aef6d77d0b76c90ef1091ffe77afe9ee9b1c6cc23f28f042f198bd8"
                  description: |-
                    Pass the following parameters as an array with the appropriate types.
                    1. `transaction hash`: The transaction hash to query as a string.
              example:
                id: 1
                jsonrpc: "2.0"
                method: eth_getTransactionReceipt
                params:
                - "0xda148d856aef6d77d0b76c90ef1091ffe77afe9ee9b1c6cc23f28f042f198bd8"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              example:
                jsonrpc: "2.0"
                id: 1
                result:
                  blockHash: "0x7ce837c7672f469b85b0fbad0d1cc650a37e955efa43c018efb2f8624af6a772"
                  blockNumber: "0x1076b5f"
                  contractAddress: null
                  cumulativeGasUsed: "0x125392e"
                  effectiveGasPrice: "0xa44661dc3"
                  from: "0x1f9090aae28b8a3dceadf281b0f12828e676c326"
                  gasUsed: "0x565f"
                  logs:
                  - address: "0x388c818ca8b9251b393131c08a736a67ccb19297"
                    topics:
                    - "0x27f12abfe35860a9a927b465bb3d4a9c23c8428174b83f278fe45ed7b4da2662"
                    data: "0x00000000000000000000000000000000000000000000000001162a2c94f37cd6"
                    blockNumber: "0x1076b5f"
                    transactionHash: "0xda148d856aef6d77d0b76c90ef1091ffe77afe9ee9b1c6cc23f28f042f198bd8"
                    transactionIndex: "0xd7"
                    blockHash: "0x7ce837c7672f469b85b0fbad0d1cc650a37e955efa43c018efb2f8624af6a772"
                    logIndex: "0x21d"
                    removed: false
                  logsBloom: ""
                  status: "0x1"
                  to: "0x388c818ca8b9251b393131c08a736a67ccb19297"
                  transactionHash: "0xda148d856aef6d77d0b76c90ef1091ffe77afe9ee9b1c6cc23f28f042f198bd8"
                  transactionIndex: "0xd7"
                  type: "0x2"
              schema:
                $ref: '#/components/schemas/TransactionReceipt'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "404":
          $ref: '#/components/responses/404'
        "405":
          $ref: '#/components/responses/405'
        "408":
          $ref: '#/components/responses/408'
        "409":
          $ref: '#/components/responses/409'
        "413":
          $ref: '#/components/responses/413'
        "414":
          $ref: '#/components/responses/414'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
        "503":
          $ref: '#/components/responses/503'
