openapi: 3.1.0
info:
  title: Kaia - kaia_getProof
  version: 1.0.0
servers:
- url: https://kaia-mainnet.nodit.io
  description: Kaia Mainnet
- url: https://kaia-kairos.nodit.io
  description: Kaia Kairos
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  schemas:
    Proof:
      type: object
      description: Merkle proof object for an account. Allows verification that account state and storage values have not been tampered with.
      properties:
        address:
          type: string
          description: Address of the proven account
        accountProof:
          type: array
          description: Merkle proof nodes of the account state trie (RLP encoded, hex)
          items:
            type: string
        balance:
          type: string
          description: Account balance (hex, in wei)
        codeHash:
          type: string
          description: Keccak-256 hash of the account code
        nonce:
          type: string
          description: Account transaction count (hex)
        storageHash:
          type: string
          description: Root hash of the storage trie
        storageProof:
          type: array
          description: Array of proofs for the requested storage keys
          items:
            type: object
            properties:
              key:
                type: string
                description: Storage key (hex)
              value:
                type: string
                description: Storage value (hex)
              proof:
                type: array
                description: Merkle proof nodes of the storage state trie (RLP encoded, hex)
                items:
                  type: string
  responses:
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - NO_AUTHENTICATION_FOUND
                - AUTHENTICATION_FAILED
                description: Code to identify the cause of authentication failure
              message:
                type: string
                description: Detailed message including the cause of authentication failure
            required:
            - code
            - message
          examples:
            NO_AUTHENTICATION_FOUND:
              summary: The request does not include authentication (API Key)
              value:
                code: NO_AUTHENTICATION_FOUND
                message: No authentication found.
            AUTHENTICATION_FAILED:
              summary: The authentication (API Key) is invalid
              value:
                code: AUTHENTICATION_FAILED
                message: Authentication failed.
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - PERMISSION_DENIED
                description: Code indicating permission denied
              message:
                type: string
                description: Detailed message including information about the denied resource
            required:
            - code
            - message
          examples:
            PERMISSION_DENIED:
              summary: The request accesses a resource it is not authorized for
              value:
                code: PERMISSION_DENIED
                message: Permission denied
    "404":
      description: Not Found
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - WRONG_ENDPOINT
                - NOT_SUPPORTED_CHAIN
                - RESOURCE_NOT_FOUND
                description: Code to identify the cause of the resource not found
              message:
                type: string
                description: Detailed message including the name, value, etc. of the resource not found
            required:
            - code
            - message
          examples:
            WRONG_ENDPOINT:
              summary: The requested API path does not exist
              value:
                code: WRONG_ENDPOINT
                message: Wrong endpoint
            NOT_SUPPORTED_CHAIN:
              summary: The requested chain is not supported
              value:
                code: NOT_SUPPORTED_CHAIN
                message: Not supported chain
            RESOURCE_NOT_FOUND:
              summary: The requested resource does not exist
              value:
                code: RESOURCE_NOT_FOUND
                message: 'Resource not found: { RESOURCE_NAME = RESOURCE_VALUE }'
    "405":
      description: Method Not Allowed
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - METHOD_NOT_ALLOWED
                description: Code indicating a disallowed HTTP method
              message:
                type: string
                description: Detailed message about the disallowed HTTP method
            required:
            - code
            - message
          examples:
            METHOD_NOT_ALLOWED:
              summary: The request uses an unsupported HTTP method
              value:
                code: METHOD_NOT_ALLOWED
                message: Method not allowed
    "408":
      description: Request Timeout
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TIMEOUT
                description: Code indicating request timeout
              message:
                type: string
                description: Detailed message including the cause of the timeout
            required:
            - code
            - message
          examples:
            TIMEOUT:
              summary: Processing did not finish within the time limit
              value:
                code: TIMEOUT
                message: Request timeout
    "409":
      description: Conflict
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - RESOURCE_ALREADY_EXISTS
                - REJECTED
                description: Code to identify the cause of the request conflict
              message:
                type: string
                description: Detailed message including information about the conflicting resource
            required:
            - code
            - message
          examples:
            RESOURCE_ALREADY_EXISTS:
              summary: The request tries to create a resource that already exists
              value:
                code: RESOURCE_ALREADY_EXISTS
                message: Resource already exists
            REJECTED:
              summary: The server rejected the request
              value:
                code: REJECTED
                message: Request rejected
    "413":
      description: Payload Too Large
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - CONTENTS_TOO_LARGE
                description: Code indicating payload size exceeded
              message:
                type: string
                description: Detailed message including the maximum allowed payload size
            required:
            - code
            - message
          examples:
            CONTENTS_TOO_LARGE:
              summary: The payload exceeds the server's maximum size
              value:
                code: CONTENTS_TOO_LARGE
                message: Contents too large
    "414":
      description: URI Too Long
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_LONG_URI
                description: Code indicating URI length exceeded
              message:
                type: string
                description: Detailed message including the maximum allowed URI length
            required:
            - code
            - message
          examples:
            TOO_LONG_URI:
              summary: The request URI exceeds the server's maximum length
              value:
                code: TOO_LONG_URI
                message: URI too long
    "429":
      description: Too Many Requests
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_MANY_REQUESTS
                - EXCEEDED_QUOTA_LIMIT
                description: Code identifying the cause of the request limit exceeded
              message:
                type: string
                description: Detailed message including the exceeded limit type and allowed threshold
            required:
            - code
            - message
          examples:
            TOO_MANY_REQUESTS:
              summary: The rate limit was exceeded
              value:
                code: TOO_MANY_REQUESTS
                message: Too many requests
            EXCEEDED_QUOTA_LIMIT:
              summary: The quota limit was exceeded
              value:
                code: EXCEEDED_QUOTA_LIMIT
                message: Exceeded quota limit
    "500":
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - INTERNAL_SERVER_ERROR
                - INTERRUPTED
                description: Code to identify the cause of the internal server error
              message:
                type: string
                description: Detailed message including the cause of the server error
            required:
            - code
            - message
          examples:
            INTERNAL_SERVER_ERROR:
              summary: An internal server error occurred
              value:
                code: INTERNAL_SERVER_ERROR
                message: Internal server error
            INTERRUPTED:
              summary: Processing failed temporarily due to server load
              value:
                code: INTERRUPTED
                message: Request interrupted
    "503":
      description: Service Unavailable
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - UNAVAILABLE
                description: Code indicating service unavailability
              message:
                type: string
                description: Detailed message including the cause of the service outage
            required:
            - code
            - message
          examples:
            UNAVAILABLE:
              summary: The service is unavailable due to infrastructure downtime or an upgrade
              value:
                code: UNAVAILABLE
                message: Service unavailable
paths:
  /:
    post:
      security:
      - api_key: []
      operationId: kaia-kaia_getproof
      summary: kaia_getProof
      description: Returns values stored in Storage for a specific address in a format including merkle-proof. The returned proof can be used to verify that the queried storage state has not been tampered with.
      x-seo-description: Generate a Merkle proof for account storage and state on the Kaia blockchain.
      tags:
      - kaia
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - jsonrpc
              - method
              - params
              properties:
                id:
                  type: integer
                  example: 1
                jsonrpc:
                  type: string
                  example: "2.0"
                method:
                  type: string
                  example: kaia_getProof
                params:
                  type: array
                  items:
                    oneOf:
                    - title: Address
                      type: string
                      pattern: ^0[xX][0-9a-fA-F]{40}$
                      example: "0xd8dA6BF26964aF9D7eEd9e03E53415D37aA96045"
                      description: Address is expressed as a 20-byte hexadecimal string, the address format used on EVM-compatible blockchains.
                    - title: Storage Hashes
                      type: array
                      items:
                        title: Storage Hash
                        type: string
                        description: Storage Hash is used to query values stored in Storage at a specific address. Hash is expressed as a 64-digit hexadecimal string.
                        pattern: ^0[xX][0-9a-fA-F]{64}
                      example:
                      - "0x000000000000000000000000c6cde7c39eb2f0f0095f41570af89efc2c1ea828"
                      description: Storage Hashes is an array of hashes to query values stored in Storage at a specific address. Each hash is expressed as a 64-digit hexadecimal string.
                    - title: Block Number or Hash or Tag
                      type: string
                      pattern: ^0[xX][0-9a-fA-F]+$|^0[xX][0-9a-fA-F]{64}$|^(latest|earliest|pending)$
                      description: |
                        Use one of block hash, block number, or block tag to specify the block.
                        * Block number: Hexadecimal string (e.g. "0x1")
                        * Block hash: 64-digit hexadecimal string (e.g. "0x39008d07edf93c03bb9d1cfc80598fcf63f441ec86e9de3733fa6a484980ca48")]
                        * Block tag: Enum string (e.g. "latest", "earliest", "pending")
                          * `earliest`: The oldest available block on the chain.
                          * `finalized`: A recently finalized block that can no longer be changed. Primarily used in proof-of-stake (PoS) blockchains.
                          * `safe`: A recent block considered safe by the network (immune to reorgs).
                          * `latest`: The most recent block on the chain (may be subject to reorgs).
                          * `pending`: The next block to be mined, including pending transactions in the mempool.
                      example: latest
                  example:
                  - "0xdac17f958d2ee523a2206206994597c13d831ec7"
                  - - "0x000000000000000000000000c6cde7c39eb2f0f0095f41570af89efc2c1ea828"
                  - latest
                  description: |-
                    Enter the following parameters as an array with the appropriate types.
                    1. `address` - Enter the address to query as a 40-digit hexadecimal string.
                    2. `storage hashes` - Array of storage slot positions to query (hexadecimal strings)
                    3. `block identifier` - Block number, block hash, or block tag for the block to query.
                    	- Block number: Hexadecimal string (e.g. "0x1")
                    	- Block hash: 64-digit hexadecimal string (e.g. "0x39008d07edf93c03bb9d1cfc80598fcf63f441ec86e9de3733fa6a484980ca48")]
                    	- Block tag: Enum string (e.g. "latest", "earliest", "pending")
              example:
                id: 1
                jsonrpc: "2.0"
                method: kaia_getProof
                params:
                - "0xdac17f958d2ee523a2206206994597c13d831ec7"
                - - "0x000000000000000000000000c6cde7c39eb2f0f0095f41570af89efc2c1ea828"
                - latest
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Proof'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "404":
          $ref: '#/components/responses/404'
        "405":
          $ref: '#/components/responses/405'
        "408":
          $ref: '#/components/responses/408'
        "409":
          $ref: '#/components/responses/409'
        "413":
          $ref: '#/components/responses/413'
        "414":
          $ref: '#/components/responses/414'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
        "503":
          $ref: '#/components/responses/503'
