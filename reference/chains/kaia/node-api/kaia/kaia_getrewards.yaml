openapi: 3.1.0
info:
  title: Kaia - kaia_getRewards
  version: 1.0.0
servers:
- url: https://kaia-mainnet.nodit.io
  description: Kaia Mainnet
- url: https://kaia-kairos.nodit.io
  description: Kaia Kairos
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  schemas:
    KaiaRewards:
      type: object
      description: Kaia block reward distribution result object.
      properties:
        minted:
          type: string
          description: Total KAIA newly minted in this block (hex, in peb)
        totalFee:
          type: string
          description: Total transaction fees in this block (hex, in peb)
        burntFee:
          type: string
          description: Total fees burned (hex, in peb)
        proposer:
          type: string
          description: Reward received by the block proposer (hex, in peb)
        stakers:
          type: string
          description: Total rewards received by staking participants (hex, in peb)
        kif:
          type: string
          description: Reward received by the Kaia Infrastructure Fund (hex, in peb)
        kef:
          type: string
          description: Reward received by the Kaia Ecosystem Fund (hex, in peb)
        rewards:
          type: object
          description: Map of rewards per beneficiary address (key=address, value=amount in hex)
          additionalProperties:
            type: string
  responses:
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - NO_AUTHENTICATION_FOUND
                - AUTHENTICATION_FAILED
                description: Code to identify the cause of authentication failure
              message:
                type: string
                description: Detailed message including the cause of authentication failure
            required:
            - code
            - message
          examples:
            NO_AUTHENTICATION_FOUND:
              summary: The request does not include authentication (API Key)
              value:
                code: NO_AUTHENTICATION_FOUND
                message: No authentication found.
            AUTHENTICATION_FAILED:
              summary: The authentication (API Key) is invalid
              value:
                code: AUTHENTICATION_FAILED
                message: Authentication failed.
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - PERMISSION_DENIED
                description: Code indicating permission denied
              message:
                type: string
                description: Detailed message including information about the denied resource
            required:
            - code
            - message
          examples:
            PERMISSION_DENIED:
              summary: The request accesses a resource it is not authorized for
              value:
                code: PERMISSION_DENIED
                message: Permission denied
    "429":
      description: Too Many Requests
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_MANY_REQUESTS
                - EXCEEDED_QUOTA_LIMIT
                description: Code identifying the cause of the request limit exceeded
              message:
                type: string
                description: Detailed message including the exceeded limit type and allowed threshold
            required:
            - code
            - message
          examples:
            TOO_MANY_REQUESTS:
              summary: The rate limit was exceeded
              value:
                code: TOO_MANY_REQUESTS
                message: Too many requests
            EXCEEDED_QUOTA_LIMIT:
              summary: The quota limit was exceeded
              value:
                code: EXCEEDED_QUOTA_LIMIT
                message: Exceeded quota limit
    "500":
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - INTERNAL_SERVER_ERROR
                - INTERRUPTED
                description: Code to identify the cause of the internal server error
              message:
                type: string
                description: Detailed message including the cause of the server error
            required:
            - code
            - message
          examples:
            INTERNAL_SERVER_ERROR:
              summary: An internal server error occurred
              value:
                code: INTERNAL_SERVER_ERROR
                message: Internal server error
            INTERRUPTED:
              summary: Processing failed temporarily due to server load
              value:
                code: INTERRUPTED
                message: Request interrupted
paths:
  /:
    post:
      security:
      - api_key: []
      operationId: kaia-kaia_getrewards
      summary: kaia_getRewards
      description: |
        Retrieves reward distribution for a block by block number. Includes reward recipients and their share. If the parameter is omitted, returns reward distribution for the latest block.
      x-seo-description: Retrieve block reward distribution details for a specific block on the Kaia network.
      tags:
      - kaia
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - jsonrpc
              - method
              properties:
                id:
                  type: integer
                  example: 1
                jsonrpc:
                  type: string
                  example: "2.0"
                method:
                  type: string
                  example: kaia_getRewards
                params:
                  type: array
                  items:
                    oneOf:
                    - title: Block Number
                      type: string
                      pattern: ^0[xX][0-9a-fA-F]+$
                      example: "0x1076B5A"
                      description: Block number represents the sequence order of a block. It is expressed as a hexadecimal string.
                    - title: Block Tag
                      type: string
                      pattern: ^(latest|earliest|pending|safe|finalized)$
                      example: latest
                      description: |-
                        Block tag can be used to specify a block with one of the following.
                        * `earliest`: Represents the oldest block available on the chain.
                        * `latest`: Represents the most recent block on the current chain. It may not yet be finalized and could be subject to reorgs. Typically used when querying the latest state.
                        * `pending`: Represents the next block that will include transactions in the mempool that have not yet been mined. Primarily used when checking the status of pending transactions.
                  example: []
                  description: |-
                    Enter the following parameters as an array with the appropriate types. When omitted, returns reward distribution for the latest block.
                    1. `block number or block tag` - Block number or block tag for the block to query.
                    - Block number: Integer or hexadecimal string (e.g. "0x1")
                    - Block tag: Enum string (e.g. "latest", "earliest", "pending")
              example:
                id: 1
                jsonrpc: "2.0"
                method: kaia_getRewards
                params: []
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KaiaRewards'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
