openapi: 3.1.0
info:
  title: Kaia - klay_call
  version: 1.0.0
servers:
- url: https://kaia-mainnet.nodit.io
  description: Kaia Mainnet
- url: https://kaia-kairos.nodit.io
  description: Kaia Kairos
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  schemas:
    HexString:
      type: string
      description: A hexadecimal string prefixed with 0x.
      pattern: ^0[xX][0-9a-fA-F]*$
      example: "0x1"
  responses:
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - NO_AUTHENTICATION_FOUND
                - AUTHENTICATION_FAILED
                description: Code to identify the cause of authentication failure
              message:
                type: string
                description: Detailed message including the cause of authentication failure
            required:
            - code
            - message
          examples:
            NO_AUTHENTICATION_FOUND:
              summary: The request does not include authentication (API Key)
              value:
                code: NO_AUTHENTICATION_FOUND
                message: No authentication found.
            AUTHENTICATION_FAILED:
              summary: The authentication (API Key) is invalid
              value:
                code: AUTHENTICATION_FAILED
                message: Authentication failed.
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - PERMISSION_DENIED
                description: Code indicating permission denied
              message:
                type: string
                description: Detailed message including information about the denied resource
            required:
            - code
            - message
          examples:
            PERMISSION_DENIED:
              summary: The request accesses a resource it is not authorized for
              value:
                code: PERMISSION_DENIED
                message: Permission denied
    "429":
      description: Too Many Requests
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_MANY_REQUESTS
                - EXCEEDED_QUOTA_LIMIT
                description: Code identifying the cause of the request limit exceeded
              message:
                type: string
                description: Detailed message including the exceeded limit type and allowed threshold
            required:
            - code
            - message
          examples:
            TOO_MANY_REQUESTS:
              summary: The rate limit was exceeded
              value:
                code: TOO_MANY_REQUESTS
                message: Too many requests
            EXCEEDED_QUOTA_LIMIT:
              summary: The quota limit was exceeded
              value:
                code: EXCEEDED_QUOTA_LIMIT
                message: Exceeded quota limit
    "500":
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - INTERNAL_SERVER_ERROR
                - INTERRUPTED
                description: Code to identify the cause of the internal server error
              message:
                type: string
                description: Detailed message including the cause of the server error
            required:
            - code
            - message
          examples:
            INTERNAL_SERVER_ERROR:
              summary: An internal server error occurred
              value:
                code: INTERNAL_SERVER_ERROR
                message: Internal server error
            INTERRUPTED:
              summary: Processing failed temporarily due to server load
              value:
                code: INTERRUPTED
                message: Request interrupted
paths:
  /:
    post:
      security:
      - api_key: []
      operationId: kaia-klay_call
      summary: klay_call
      description: |
        Executes a contract's read-only method without creating or submitting a transaction. Primarily used to read the current state of a specific smart contract. State changes from the call do not occur.
        					

        > 🚧 Is the response taking a long time? Response time may vary based on function complexity!
        >
        > When executing a smart contract function at a specific state, response time may increase depending on the function's complexity.
        > If you want faster responses, optimize the function being executed and minimize the function's execution result.
      x-seo-description: Execute a read-only smart contract call on the Klaytn/Kaia network without a transaction.
      tags:
      - klay
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - jsonrpc
              - method
              - params
              properties:
                id:
                  type: integer
                  example: 1
                jsonrpc:
                  type: string
                  example: "2.0"
                method:
                  type: string
                  example: klay_call
                params:
                  type: array
                  items:
                    oneOf:
                    - title: Call Object
                      type: object
                      properties:
                        from:
                          type: string
                          description: Enter the transaction's from address as a string.
                        to:
                          type: string
                          description: Enter the transaction's to address as a string.
                          example: "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"
                        gas:
                          type: string
                          description: Enter the gas limit for the transaction as a hexadecimal string. For smart contract calls, you can enter 0x0 since no gas is consumed.
                        gasPrice:
                          type: string
                          description: Enter the gas price per unit as a hexadecimal string.
                        value:
                          type: string
                          description: The value field of the transaction.
                        data:
                          type: string
                          description: The method signature hash of the transaction to execute. Can be referenced from the ABI.
                          example: "0x70a08231000000000000000000000000d8dA6BF26964aF9D7eEd9e03E53415D37aA96045"
                      description: |-
                        Call object for transaction simulation. May include the following fields.
                        * `from`: Enter the transaction's from address as a string.
                        * `to` : Enter the transaction's to address as a string.
                        * `gas` : Enter the gas limit for the transaction as a hexadecimal string. For smart contract calls, you can enter 0x0 since no gas is consumed.
                        * `gasPrice` : Enter the gas price per unit as a hexadecimal string.
                        * `value` : The value field of the transaction.
                        * `data` : The method signature hash of the transaction to execute. Can be referenced from the ABI.
                    - title: Block Number or Hash or Tag
                      type: string
                      pattern: ^0[xX][0-9a-fA-F]+$|^0[xX][0-9a-fA-F]{64}$|^(latest|earliest|pending)$
                      description: |
                        Use one of block hash, block number, or block tag to specify the block.
                        * Block number: Hexadecimal string (e.g. "0x1")
                        * Block hash: 64-digit hexadecimal string (e.g. "0x39008d07edf93c03bb9d1cfc80598fcf63f441ec86e9de3733fa6a484980ca48")]
                        * Block tag: Enum string (e.g. "latest", "earliest", "pending")
                          * `earliest`: The oldest available block on the chain.
                          * `finalized`: A recently finalized block that can no longer be changed. Primarily used in proof-of-stake (PoS) blockchains.
                          * `safe`: A recent block considered safe by the network (immune to reorgs).
                          * `latest`: The most recent block on the chain (may be subject to reorgs).
                          * `pending`: The next block to be mined, including pending transactions in the mempool.
                      example: latest
                    - title: State Override Set
                      type: object
                      example: {}
                      description: |-
                        Allows overriding the balance, nonce, code, and state of the smart contract being called for simulation at call time without changing actual values on the blockchain. May include the following fields.
                        * `balance`: Hex string to override the account balance.
                        * `nonce`: Hex string to override the account's nonce value.
                        * `code`: Hex string for fake EVM bytecode to inject into the account.
                        * `state`: Key-value pairs to override the account's storage state. Each key and value is expressed as a hex string.
                        * `stateDiff`: Key-value pairs to override individual storage slots in the account's storage state. Similar to state but used when targeting only specific slot changes.
                  example:
                  - to: "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"
                    data: "0x70a08231000000000000000000000000d8dA6BF26964aF9D7eEd9e03E53415D37aA96045"
                  - latest
                  description: |-
                    Enter the following parameters as an array with the appropriate types.
                    1. `call object` - Enter the contract address to call and the function data.
                    2. `block identifier` - Block number, block hash, or block tag for the block to query.
                    3. `state override set` - State override set for the transaction (optional).
              example:
                id: 1
                jsonrpc: "2.0"
                method: klay_call
                params:
                - to: "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"
                  data: "0x70a08231000000000000000000000000d8dA6BF26964aF9D7eEd9e03E53415D37aA96045"
                - latest
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HexString'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
