openapi: 3.1.0
info:
  title: Kaia - klay_estimateGas
  version: 1.0.0
servers:
- url: https://kaia-mainnet.nodit.io
  description: Kaia Mainnet
- url: https://kaia-kairos.nodit.io
  description: Kaia Kairos
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  schemas:
    HexQuantity:
      type: string
      description: An integer encoded as a hexadecimal string. (e.g. '0x1a')
      pattern: ^0[xX][0-9a-fA-F]+
      example: "0x1a"
  responses:
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - NO_AUTHENTICATION_FOUND
                - AUTHENTICATION_FAILED
                description: Code to identify the cause of authentication failure
              message:
                type: string
                description: Detailed message including the cause of authentication failure
            required:
            - code
            - message
          examples:
            NO_AUTHENTICATION_FOUND:
              summary: The request does not include authentication (API Key)
              value:
                code: NO_AUTHENTICATION_FOUND
                message: No authentication found.
            AUTHENTICATION_FAILED:
              summary: The authentication (API Key) is invalid
              value:
                code: AUTHENTICATION_FAILED
                message: Authentication failed.
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - PERMISSION_DENIED
                description: Code indicating permission denied
              message:
                type: string
                description: Detailed message including information about the denied resource
            required:
            - code
            - message
          examples:
            PERMISSION_DENIED:
              summary: The request accesses a resource it is not authorized for
              value:
                code: PERMISSION_DENIED
                message: Permission denied
    "429":
      description: Too Many Requests
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_MANY_REQUESTS
                - EXCEEDED_QUOTA_LIMIT
                description: Code identifying the cause of the request limit exceeded
              message:
                type: string
                description: Detailed message including the exceeded limit type and allowed threshold
            required:
            - code
            - message
          examples:
            TOO_MANY_REQUESTS:
              summary: The rate limit was exceeded
              value:
                code: TOO_MANY_REQUESTS
                message: Too many requests
            EXCEEDED_QUOTA_LIMIT:
              summary: The quota limit was exceeded
              value:
                code: EXCEEDED_QUOTA_LIMIT
                message: Exceeded quota limit
    "500":
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - INTERNAL_SERVER_ERROR
                - INTERRUPTED
                description: Code to identify the cause of the internal server error
              message:
                type: string
                description: Detailed message including the cause of the server error
            required:
            - code
            - message
          examples:
            INTERNAL_SERVER_ERROR:
              summary: An internal server error occurred
              value:
                code: INTERNAL_SERVER_ERROR
                message: Internal server error
            INTERRUPTED:
              summary: Processing failed temporarily due to server load
              value:
                code: INTERRUPTED
                message: Request interrupted
paths:
  /:
    post:
      security:
      - api_key: []
      operationId: kaia-klay_estimategas
      summary: klay_estimateGas
      description: Estimates the gas required to execute a transaction. Estimates gas without actually submitting the transaction.
      x-seo-description: Estimate the gas required to execute a transaction or contract call on the Klaytn network.
      tags:
      - klay
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - jsonrpc
              - method
              - params
              properties:
                id:
                  type: integer
                  example: 1
                jsonrpc:
                  type: string
                  example: "2.0"
                method:
                  type: string
                  example: klay_estimateGas
                params:
                  type: array
                  items:
                    oneOf:
                    - title: Call Object
                      type: object
                      properties:
                        from:
                          type: string
                          description: Enter the transaction's from address as a string.
                        to:
                          type: string
                          description: Enter the transaction's to address as a string.
                          example: "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"
                        gas:
                          type: string
                          description: Enter the gas limit for the transaction as a hexadecimal string. For smart contract calls, you can enter 0x0 since no gas is consumed.
                        gasPrice:
                          type: string
                          description: Enter the gas price per unit as a hexadecimal string.
                        value:
                          type: string
                          description: The value field of the transaction.
                        data:
                          type: string
                          description: The method signature hash of the transaction to execute. Can be referenced from the ABI.
                          example: "0x70a08231000000000000000000000000d8dA6BF26964aF9D7eEd9e03E53415D37aA96045"
                      description: |-
                        Call object for transaction simulation. May include the following fields.
                        * `from`: Enter the transaction's from address as a string.
                        * `to` : Enter the transaction's to address as a string.
                        * `gas` : Enter the gas limit for the transaction as a hexadecimal string. For smart contract calls, you can enter 0x0 since no gas is consumed.
                        * `gasPrice` : Enter the gas price per unit as a hexadecimal string.
                        * `value` : The value field of the transaction.
                        * `data` : The method signature hash of the transaction to execute. Can be referenced from the ABI.
                  example:
                  - from: "0xc90d3Ac75D1D36dF0b0a229E73D8409FB7F3c4ab"
                    to: "0xd3CdA913deB6f67967B99D67aCDFa1712C293601"
                    value: "0x186a0"
                  description: |-
                    Enter the following parameters as an array with the appropriate types.
                    1. `call object` - Enter the contract address to call and the function data.
              example:
                id: 1
                jsonrpc: "2.0"
                method: klay_estimateGas
                params:
                - from: "0xc90d3Ac75D1D36dF0b0a229E73D8409FB7F3c4ab"
                  to: "0xd3CdA913deB6f67967B99D67aCDFa1712C293601"
                  value: "0x186a0"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HexQuantity'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
