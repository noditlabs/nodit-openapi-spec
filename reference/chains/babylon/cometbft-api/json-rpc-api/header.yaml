openapi: 3.1.0
info:
  title: Babylon - Header
  version: 1.0.0
servers:
- url: https://rpc-babylon-mainnet.nodit.io
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
paths:
  /:
    post:
      security:
      - api_key: []
      operationId: header
      summary: Header
      description: Retrieves the header at the specified block height. Returns the latest header if height is omitted.
      tags:
      - json-rpc-api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - jsonrpc
              - id
              - method
              properties:
                jsonrpc:
                  description: JSON-RPC protocol version. Always `2.0`.
                  type: string
                  const: "2.0"
                id:
                  description: Identifier of the request. Returned unchanged as `id` in the response.
                  type: integer
                method:
                  description: Name of the JSON-RPC method to call.
                  type: string
                  const: header
                params:
                  description: Parameters passed to the method.
                  type: object
                  additionalProperties: false
                  properties:
                    height:
                      type: string
                      description: Target block height. Returns the latest header if omitted.
            example:
              jsonrpc: "2.0"
              id: 1
              method: header
              params:
                height: "1"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - jsonrpc
                - id
                - result
                properties:
                  jsonrpc:
                    description: JSON-RPC protocol version. Always `2.0`.
                    type: string
                    const: "2.0"
                  id:
                    description: The request ID, echoed back unchanged.
                    type: integer
                  result:
                    description: Result of the method call.
                    type: object
                    additionalProperties: false
                    properties:
                      header:
                        description: Block header.
                        type: object
                        additionalProperties: false
                        properties:
                          version:
                            description: Block and application protocol versions.
                            type: object
                            additionalProperties: false
                            properties:
                              block:
                                description: Block protocol version.
                                type: string
                              app:
                                description: Application protocol version.
                                type: string
                          chain_id:
                            description: Chain ID.
                            type: string
                          height:
                            description: Block height.
                            type: string
                          time:
                            description: Block time (UTC).
                            type: string
                          last_block_id:
                            description: Block ID of the previous block.
                            type: object
                            additionalProperties: false
                            properties:
                              hash:
                                description: Block hash.
                                type: string
                              parts:
                                description: Part set header, used when the block is split into parts for gossiping.
                                type: object
                                additionalProperties: false
                                properties:
                                  total:
                                    description: Total number of block parts.
                                    type: integer
                                  hash:
                                    description: Merkle root hash of the block parts.
                                    type: string
                          last_commit_hash:
                            description: Hash of the validators' commit for the previous block.
                            type: string
                          data_hash:
                            description: Hash of the transactions in the block.
                            type: string
                          validators_hash:
                            description: Hash of the validator set for the current block.
                            type: string
                          next_validators_hash:
                            description: Hash of the validator set for the next block.
                            type: string
                          consensus_hash:
                            description: Hash of the consensus parameters for the current block.
                            type: string
                          app_hash:
                            description: Application state hash after executing the previous block's transactions.
                            type: string
                          last_results_hash:
                            description: Root hash of the execution results of the previous block's transactions.
                            type: string
                          evidence_hash:
                            description: Hash of the evidence included in the block.
                            type: string
                          proposer_address:
                            description: Address of the validator that proposed the block.
                            type: string
              example:
                jsonrpc: "2.0"
                id: 1
                result:
                  header:
                    version:
                      block: "11"
                      app: "0"
                    chain_id: cosmoshub-4
                    height: "1"
                    time: '2019-12-11T16:11:34Z'
                    last_block_id:
                      hash: ""
                      parts:
                        total: 0
                        hash: ""
                    last_commit_hash: E3B0C44298FC1C149AFBF4C8996FB92427AE41E4649B934CA495991B7852B855
                    data_hash: E3B0C44298FC1C149AFBF4C8996FB92427AE41E4649B934CA495991B7852B855
                    validators_hash: 8B4640A28F07F7F4D9D5C7F4A7A2FBE8E1E5C3A1D2B3C4D5E6F7A8B9C0D1E2F3
                    next_validators_hash: 8B4640A28F07F7F4D9D5C7F4A7A2FBE8E1E5C3A1D2B3C4D5E6F7A8B9C0D1E2F3
                    consensus_hash: 048091BC7DDC283F77BFBF91D73C44DA58C3DF8A9CBC867405D8B7F3DAADA22F
                    app_hash: ""
                    last_results_hash: E3B0C44298FC1C149AFBF4C8996FB92427AE41E4649B934CA495991B7852B855
                    evidence_hash: E3B0C44298FC1C149AFBF4C8996FB92427AE41E4649B934CA495991B7852B855
                    proposer_address: B00A6323737F321EB0B8D59C6FD497A14B60938A
