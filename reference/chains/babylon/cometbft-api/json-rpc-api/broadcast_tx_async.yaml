openapi: 3.1.0
info:
  title: Babylon - BroadCastTxAsync
  version: 1.0.0
servers:
- url: https://rpc-babylon-mainnet.nodit.io
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
paths:
  /:
    post:
      security:
      - api_key: []
      operationId: broadcast_tx_async
      summary: BroadCastTxAsync
      description: Broadcasts a transaction asynchronously and returns immediately. Does not wait for CheckTx or DeliverTx results.
      tags:
      - json-rpc-api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - jsonrpc
              - id
              - method
              properties:
                jsonrpc:
                  description: JSON-RPC protocol version. Always `2.0`.
                  type: string
                  const: "2.0"
                id:
                  description: Identifier of the request. Returned unchanged as `id` in the response.
                  type: integer
                method:
                  description: Name of the JSON-RPC method to call.
                  type: string
                  const: broadcast_tx_async
                params:
                  description: Parameters passed to the method.
                  type: object
                  additionalProperties: false
                  required:
                  - tx
                  properties:
                    tx:
                      type: string
                      description: Encoded transaction.
            example:
              jsonrpc: "2.0"
              id: 1
              method: broadcast_tx_async
              params:
                tx: a/encoded_tx/c
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - jsonrpc
                - id
                - result
                properties:
                  jsonrpc:
                    description: JSON-RPC protocol version. Always `2.0`.
                    type: string
                    const: "2.0"
                  id:
                    description: The request ID, echoed back unchanged.
                    type: integer
                  error:
                    description: Error information returned when the request fails.
                    type: string
                  result:
                    description: Result of the method call.
                    type: object
                    additionalProperties: false
                    properties:
                      code:
                        description: CheckTx result code. Always `0` because the call is asynchronous; it does not reflect the actual check.
                        type: string
                      data:
                        description: Data returned by CheckTx.
                        type: string
                      log:
                        description: Execution log message.
                        type: string
                      codespace:
                        description: Namespace of the result code.
                        type: string
                      hash:
                        description: Transaction hash.
                        type: string
              example:
                jsonrpc: "2.0"
                id: 1
                result:
                  code: "0"
                  data: ""
                  log: ""
                  codespace: ""
                  hash: D70952032620CC4E2737EB8AC379806359D8E0B17B0488F627997A0B043ABDED
