openapi: 3.1.0
info:
  title: Babylon - NumUnconfirmedTxs
  version: 1.0.0
servers:
- url: https://rpc-babylon-mainnet.nodit.io
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
paths:
  /:
    post:
      security:
      - api_key: []
      operationId: num_unconfirmed_txs
      summary: NumUnconfirmedTxs
      description: Retrieves the count and total size of unconfirmed transactions.
      tags:
      - json-rpc-api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - jsonrpc
              - id
              - method
              properties:
                jsonrpc:
                  description: JSON-RPC protocol version. Always `2.0`.
                  type: string
                  const: "2.0"
                id:
                  description: Identifier of the request. Returned unchanged as `id` in the response.
                  type: integer
                method:
                  description: Name of the JSON-RPC method to call.
                  type: string
                  const: num_unconfirmed_txs
            example:
              jsonrpc: "2.0"
              id: 1
              method: num_unconfirmed_txs
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - jsonrpc
                - id
                - result
                properties:
                  jsonrpc:
                    description: JSON-RPC protocol version. Always `2.0`.
                    type: string
                    const: "2.0"
                  id:
                    description: The request ID, echoed back unchanged.
                    type: integer
                  result:
                    description: Result of the method call.
                    type: object
                    additionalProperties: false
                    properties:
                      n_txs:
                        description: Number of transactions in this response.
                        type: string
                      total:
                        description: Total number of transactions in the mempool.
                        type: string
                      total_bytes:
                        description: Total size of mempool transactions in bytes.
                        type: string
              example:
                jsonrpc: "2.0"
                id: 1
                result:
                  n_txs: "5"
                  total: "5"
                  total_bytes: "2560"
