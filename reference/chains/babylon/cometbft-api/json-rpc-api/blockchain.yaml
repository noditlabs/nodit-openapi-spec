openapi: 3.1.0
info:
  title: Babylon - Blockchain
  version: 1.0.0
servers:
- url: https://rpc-babylon-mainnet.nodit.io
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
paths:
  /:
    post:
      security:
      - api_key: []
      operationId: blockchain
      summary: Blockchain
      description: Retrieves a list of block headers in descending order. The number of results may be limited.
      tags:
      - json-rpc-api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - jsonrpc
              - id
              - method
              properties:
                jsonrpc:
                  description: JSON-RPC protocol version. Always `2.0`.
                  type: string
                  const: "2.0"
                id:
                  description: Identifier of the request. Returned unchanged as `id` in the response.
                  type: integer
                method:
                  description: Name of the JSON-RPC method to call.
                  type: string
                  const: blockchain
                params:
                  description: Parameters passed to the method.
                  type: object
                  additionalProperties: false
                  properties:
                    minHeight:
                      type: string
                      description: Minimum block height to include in the response.
                    maxHeight:
                      type: string
                      description: Maximum block height to include in the response.
            example:
              jsonrpc: "2.0"
              id: 1
              method: blockchain
              params:
                minHeight: "1"
                maxHeight: "2"
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - jsonrpc
                - id
                - result
                properties:
                  jsonrpc:
                    description: JSON-RPC protocol version. Always `2.0`.
                    type: string
                    const: "2.0"
                  id:
                    description: The request ID, echoed back unchanged.
                    type: integer
                  result:
                    description: Result of the method call.
                    type: object
                    additionalProperties: false
                    properties:
                      last_height:
                        description: Latest block height on the node.
                        type: string
                      block_metas:
                        description: List of block metadata.
                        type: array
                        items:
                          type: object
                          additionalProperties: false
                          properties:
                            block_id:
                              description: Block ID (block hash and part set header).
                              type: object
                              additionalProperties: false
                              properties:
                                hash:
                                  description: Block hash.
                                  type: string
                                parts:
                                  description: Part set header, used when the block is split into parts for gossiping.
                                  type: object
                                  additionalProperties: false
                                  properties:
                                    total:
                                      description: Total number of block parts.
                                      type: integer
                                    hash:
                                      description: Merkle root hash of the block parts.
                                      type: string
                            block_size:
                              description: Block size in bytes.
                              type: integer
                            header:
                              description: Block header.
                              type: object
                              additionalProperties: false
                              properties:
                                version:
                                  description: Block and application protocol versions.
                                  type: object
                                  additionalProperties: false
                                  properties:
                                    block:
                                      description: Block protocol version.
                                      type: string
                                    app:
                                      description: Application protocol version.
                                      type: string
                                chain_id:
                                  description: Chain ID.
                                  type: string
                                height:
                                  description: Block height.
                                  type: string
                                time:
                                  description: Block time (UTC).
                                  type: string
                                last_block_id:
                                  description: Block ID of the previous block.
                                  type: object
                                  additionalProperties: false
                                  properties:
                                    hash:
                                      description: Block hash.
                                      type: string
                                    parts:
                                      description: Part set header, used when the block is split into parts for gossiping.
                                      type: object
                                      additionalProperties: false
                                      properties:
                                        total:
                                          description: Total number of block parts.
                                          type: integer
                                        hash:
                                          description: Merkle root hash of the block parts.
                                          type: string
                                last_commit_hash:
                                  description: Hash of the validators' commit for the previous block.
                                  type: string
                                data_hash:
                                  description: Hash of the transactions in the block.
                                  type: string
                                validators_hash:
                                  description: Hash of the validator set for the current block.
                                  type: string
                                next_validators_hash:
                                  description: Hash of the validator set for the next block.
                                  type: string
                                consensus_hash:
                                  description: Hash of the consensus parameters for the current block.
                                  type: string
                                app_hash:
                                  description: Application state hash after executing the previous block's transactions.
                                  type: string
                                last_results_hash:
                                  description: Root hash of the execution results of the previous block's transactions.
                                  type: string
                                evidence_hash:
                                  description: Hash of the evidence included in the block.
                                  type: string
                                proposer_address:
                                  description: Address of the validator that proposed the block.
                                  type: string
                            num_txs:
                              description: Number of transactions in the block.
                              type: string
              example:
                jsonrpc: "2.0"
                id: 1
                result:
                  last_height: "12345678"
                  block_metas:
