openapi: 3.1.0
info:
  title: Aptos - Get ledger info
  version: 1.0.0
servers:
- url: https://aptos-mainnet.nodit.io/v1
  description: Aptos Mainnet
- url: https://aptos-testnet.nodit.io/v1
  description: Aptos Testnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  schemas:
    AptosError:
      type: object
      required:
      - message
      - error_code
      properties:
        message:
          type: string
        error_code:
          type: string
          description: |
            These codes provide more detailed error information that cannot be determined from the HTTP status code alone.

            - Error codes that may be included in the response: `account_not_found`, `resource_not_found`, `module_not_found`, `struct_field_not_found`, `version_not_found`, `transaction_not_found`, `table_item_not_found`, `block_not_found`, `state_value_not_found`, `version_pruned`, `block_pruned`, `invalid_input`, `invalid_transaction_update`, `sequence_number_too_old`, `vm_error`, `health_check_failed`
        vm_error_code:
          type: integer
          description: |
            Provides the detailed VM error code that occurs when submitting a transaction to the VM.
    NoditError:
      type: object
      properties:
        code:
          type: string
          description: Returns a code that identifies the situation where the error occurred.
        message:
          type: string
          description: Returns a detailed message explaining the cause of the error.
      required:
      - code
      - message
  responses:
    "400":
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AptosError'
            example:
              message: 'Failed to read raw transactions from storage: AptosDB Other Error: Transaction at version 3 is pruned, min available version is 3133900526.'
              error_code: internal_error
              vm_error_code: null
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NoditError'
            example:
              code: AUTHENTICATION_FAILED
              message: Authentication failed
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NoditError'
            example:
              code: PERMISSION_DENIED
              message: Permission denied
    "404":
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NoditError'
            example:
              code: RESOURCE_NOT_FOUND
              message: 'Resource not found: { RESOURCE1_NAME = RESOURCE1_VALUE, RESOURCE2_NAME = RESOURCE2_VALUE, ... }'
    "410":
      description: Block Pruned
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AptosError'
            example:
              message: Block(160155267) has been pruned
              error_code: block_pruned
              vm_error_code: null
    "429":
      description: Too Many Requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NoditError'
            example:
              code: TOO_MANY_REQUESTS
              message: Too many requests
paths:
  /:
    get:
      security:
      - api_key: []
      operationId: aptos-getLedgerInfo
      summary: Get ledger info
      description: |
        Retrieves the latest ledger information. Includes data such as chain ID, role type, ledger version, and epoch.
      x-seo-description: Retrieve the latest ledger information including chain ID, epoch, and block height for Aptos.
      tags:
      - General
      parameters: []
      responses:
        "200":
          description: Successful Response
          headers:
            X-APTOS-BLOCK-HEIGHT:
              description: Current block height of the chain
              schema:
                type: integer
              required: true
            X-APTOS-CHAIN-ID:
              description: Chain ID of the current chain
              schema:
                type: integer
              required: true
            X-APTOS-EPOCH:
              description: Current epoch of the chain
              schema:
                type: integer
              required: true
            X-APTOS-LEDGER-OLDEST-VERSION:
              description: Oldest unpruned ledger version of the chain
              schema:
                type: integer
              required: true
            X-APTOS-LEDGER-TIMESTAMPUSEC:
              description: Current timestamp of the chain
              schema:
                type: integer
              required: true
            X-APTOS-LEDGER-VERSION:
              description: Current ledger version of the chain
              schema:
                type: integer
              required: true
            X-APTOS-OLDEST-BLOCK-HEIGHT:
              description: Oldest unpruned block height of the chain
              schema:
                type: integer
              required: true
            X-APTOS-CURSOR:
              description: Cursor for the next page
              schema:
                type: string
            X-APTOS-GAS-USED:
              description: Amount of gas actually used for transaction execution
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: object
                required:
                - chain_id
                - epoch
                - ledger_version
                - oldest_ledger_version
                - ledger_timestamp
                - node_role
                - oldest_block_height
                - block_height
                properties:
                  chain_id:
                    type: integer
                    description: Identifier of the current chain.
                  epoch:
                    type: string
                    description: Current consensus epoch number, based on the validator set for that period.
                  ledger_version:
                    type: string
                    description: Ledger version of the latest transaction.
                  oldest_ledger_version:
                    type: string
                    description: Ledger version of the oldest transaction.
                  ledger_timestamp:
                    type: string
                    description: Ledger timestamp indicating when the current ledger was created.
                  node_role:
                    type: string
                    description: Role of the node (full_node, validator).
                  oldest_block_height:
                    type: string
                    description: Oldest block height.
                  block_height:
                    type: string
                    description: Latest block height.
                  git_hash:
                    type: string
                    description: Git hash of the built API endpoint. Used to identify the exact software version used by the API endpoint.
              example:
                chain_id: 1
                epoch: "3671"
                ledger_version: "223505345"
                oldest_ledger_version: "0"
                ledger_timestamp: "1691977290941952"
                node_role: full_node
                oldest_block_height: "0"
                block_height: "80602020"
                git_hash: ebfec6c8296848d00b69cc7bfa284d820a3c3566
        "400":
          $ref: '#/components/responses/400'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "404":
          $ref: '#/components/responses/404'
        "410":
          $ref: '#/components/responses/410'
        "429":
          $ref: '#/components/responses/429'
