openapi: 3.1.0
info:
  title: Aptos - Get account balance
  version: 1.0.0
servers:
- url: https://aptos-mainnet.nodit.io/v1
  description: Aptos Mainnet
- url: https://aptos-testnet.nodit.io/v1
  description: Aptos Testnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  parameters:
    Address:
      name: address
      in: path
      required: true
      schema:
        type: string
        pattern: ^0[xX]?[0-9a-fA-F]{0,64}$
        example: "0x1"
        examples:
        - "0x1"
        - "0xf22bede237a07e121b56d91a491eb7bcdfd1f5907926a9e58338f964a01b17fa"
      description: |
        The address of the account to retrieve. Account addresses without the hexadecimal prefix can also be queried.
    AssetType:
      name: asset_type
      in: path
      required: true
      schema:
        type: string
        example: 0x1::aptos_coin::AptosCoin
        examples:
        - 0x1::aptos_coin::AptosCoin
        - "0xa"
      description: |
        A parameter used to specify the type of asset to retrieve.
        The asset type must be provided in one of the following formats:
        - Coin: Struct-form asset ID (e.g., `0x1::aptos_coin::AptosCoin`)
        - Fungible Asset: Object address that owns the Token Metadata (e.g., `0xa`)
    LedgerVersion:
      name: ledger_version
      in: query
      required: false
      schema:
        type: integer
      description: |
        The ledger version of the transaction to fetch account state from.
        If no value is provided, the latest version is used.
  schemas:
    AptosError:
      type: object
      required:
      - message
      - error_code
      properties:
        message:
          type: string
        error_code:
          type: string
          description: |
            These codes provide more detailed error information that cannot be determined from the HTTP status code alone.

            - Error codes that may be included in the response: `account_not_found`, `resource_not_found`, `module_not_found`, `struct_field_not_found`, `version_not_found`, `transaction_not_found`, `table_item_not_found`, `block_not_found`, `state_value_not_found`, `version_pruned`, `block_pruned`, `invalid_input`, `invalid_transaction_update`, `sequence_number_too_old`, `vm_error`, `health_check_failed`
        vm_error_code:
          type: integer
          description: |
            Provides the detailed VM error code that occurs when submitting a transaction to the VM.
    NoditError:
      type: object
      properties:
        code:
          type: string
          description: Returns a code that identifies the situation where the error occurred.
        message:
          type: string
          description: Returns a detailed message explaining the cause of the error.
      required:
      - code
      - message
  responses:
    "400":
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AptosError'
            example:
              message: 'Failed to read raw transactions from storage: AptosDB Other Error: Transaction at version 3 is pruned, min available version is 3133900526.'
              error_code: internal_error
              vm_error_code: null
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NoditError'
            example:
              code: AUTHENTICATION_FAILED
              message: Authentication failed
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NoditError'
            example:
              code: PERMISSION_DENIED
              message: Permission denied
    "404":
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NoditError'
            example:
              code: RESOURCE_NOT_FOUND
              message: 'Resource not found: { RESOURCE1_NAME = RESOURCE1_VALUE, RESOURCE2_NAME = RESOURCE2_VALUE, ... }'
    "410":
      description: Block Pruned
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AptosError'
            example:
              message: Block(160155267) has been pruned
              error_code: block_pruned
              vm_error_code: null
    "429":
      description: Too Many Requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NoditError'
            example:
              code: TOO_MANY_REQUESTS
              message: Too many requests
paths:
  /accounts/{address}/balance/{asset_type}:
    get:
      security:
      - api_key: []
      operationId: aptos-getAccountBalance
      summary: Get account balance
      description: |
        Returns the balance of coin/fungible asset (primary fungible asset store only) for the specified account, asset type, and ledger version of a specific transaction. If no ledger version is specified in the request, the latest ledger version is used.
        Aptos nodes prune account state history according to a configurable retention period. If the requested ledger version has been pruned, the server responds with a 410 status code.
      x-seo-description: Retrieve the APT coin balance for a specific account address on the Aptos blockchain.
      tags:
      - Accounts
      parameters:
      - name: address
        in: path
        required: true
        schema:
          type: string
          pattern: ^0[xX]?[0-9a-fA-F]{0,64}$
          example: "0x1"
          examples:
          - "0x1"
          - "0xf22bede237a07e121b56d91a491eb7bcdfd1f5907926a9e58338f964a01b17fa"
        description: |
          The address of the account to retrieve. Account addresses without the hexadecimal prefix can also be queried.
      - name: asset_type
        in: path
        required: true
        schema:
          type: string
          example: 0x1::aptos_coin::AptosCoin
          examples:
          - 0x1::aptos_coin::AptosCoin
          - "0xa"
        description: |
          A parameter used to specify the type of asset to retrieve.
          The asset type must be provided in one of the following formats:
          - Coin: Struct-form asset ID (e.g., `0x1::aptos_coin::AptosCoin`)
          - Fungible Asset: Object address that owns the Token Metadata (e.g., `0xa`)
      - name: ledger_version
        in: query
        required: false
        schema:
          type: integer
        description: |
          The ledger version of the transaction to fetch account state from.
          If no value is provided, the latest version is used.
      responses:
        "200":
          description: Successful Response
          headers:
            X-APTOS-BLOCK-HEIGHT:
              description: Current block height of the chain
              schema:
                type: integer
              required: true
            X-APTOS-CHAIN-ID:
              description: Chain ID of the current chain
              schema:
                type: integer
              required: true
            X-APTOS-EPOCH:
              description: Current epoch of the chain
              schema:
                type: integer
              required: true
            X-APTOS-LEDGER-OLDEST-VERSION:
              description: Oldest unpruned ledger version of the chain
              schema:
                type: integer
              required: true
            X-APTOS-LEDGER-TIMESTAMPUSEC:
              description: Current timestamp of the chain
              schema:
                type: integer
              required: true
            X-APTOS-LEDGER-VERSION:
              description: Current ledger version of the chain
              schema:
                type: integer
              required: true
            X-APTOS-OLDEST-BLOCK-HEIGHT:
              description: Oldest unpruned block height of the chain
              schema:
                type: integer
              required: true
            X-APTOS-CURSOR:
              description: Cursor for the next page
              schema:
                type: string
            X-APTOS-GAS-USED:
              description: Amount of gas actually used for transaction execution
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: integer
                description: Balance of coin/fungible asset (primary fungible asset store only)
              example: 10478529012
        "400":
          $ref: '#/components/responses/400'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "404":
          $ref: '#/components/responses/404'
        "410":
          $ref: '#/components/responses/410'
        "429":
          $ref: '#/components/responses/429'
