- url: https://rest-sei-mainnet.nodit.io
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
paths:
  /cosmos/tx/v1beta1/txs/block/{height}:
    get:
      description: GetBlockWithTxs fetches a block with decoded txs.
      operationId: cosmos_tx_v1beta1_txs_block_{height}
      tags:
      - tx
      responses:
        "200":
          description: Successful Response
          content:
            '*/*':
              schema:
                type: object
                description: |-
                  GetBlockWithTxsResponse is the response type for the Service.GetBlockWithTxs
                  method.

                  Since: cosmos-sdk 0.45.2
                properties:
                  txs:
                    type: array
                    description: txs are the transactions in the block.
                    items:
                      type: object
                      description: Tx is the standard type used for broadcasting transactions.
                      properties:
                        body:
                          type: object
                          description: TxBody is the body of a transaction that all signers sign over.
                          properties:
                            messages:
                              type: array
                              description: |-
