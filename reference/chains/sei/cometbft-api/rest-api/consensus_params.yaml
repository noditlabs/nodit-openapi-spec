openapi: 3.1.0
info:
  title: Sei - ConsensusParams
  version: 1.0.0
servers:
- url: https://rpc-sei-mainnet.nodit.io
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
paths:
  /consensus_params:
    get:
      security:
      - api_key: []
      operationId: consensus_params
      summary: ConsensusParams
      description: Retrieves consensus parameters at the specified block height.
      tags:
      - rest-api
      parameters:
      - name: height
        in: query
        description: Target block height.
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - jsonrpc
                - id
                - result
                properties:
                  jsonrpc:
                    description: JSON-RPC protocol version. Always `2.0`.
                    type: string
                    const: "2.0"
                  id:
                    description: The request ID, echoed back unchanged.
                    type: integer
                  result:
                    description: Result of the method call.
                    type: object
                    additionalProperties: false
                    properties:
                      block_height:
                        description: Block height the result refers to.
                        type: string
                      consensus_params:
                        description: Consensus parameters.
                        type: object
                        additionalProperties: false
                        properties:
                          block:
                            description: Block-related consensus parameters.
                            type: object
                            additionalProperties: false
                            properties:
                              max_bytes:
                                description: Maximum block size in bytes.
                                type: string
                              max_gas:
                                description: Maximum gas per block. `-1` means unlimited.
                                type: string
                              time_iota_ms:
                                description: Minimum time increment between blocks in milliseconds (legacy field).
                                type: string
                          evidence:
                            description: Evidence-related consensus parameters.
                            type: object
                            additionalProperties: false
                            properties:
                              max_age:
                                description: Maximum age of evidence, in blocks.
                                type: string
                          validator:
                            description: Validator-related consensus parameters.
                            type: object
                            additionalProperties: false
                            properties:
                              pub_key_types:
                                description: Public key types validators can use.
                                type: array
                                items:
                                  type: string
              example:
                jsonrpc: "2.0"
                id: 1
                result:
                  block_height: "12345678"
                  consensus_params:
                    block:
                      max_bytes: "22020096"
                      max_gas: "-1"
                      time_iota_ms: "1000"
                    evidence:
                      max_age: "100000"
                    validator:
                      pub_key_types:
                      - ed25519
