openapi: 3.1.0
info:
  title: Optimism - eth_newFilter
  version: 1.0.0
servers:
- url: https://optimism-mainnet.nodit.io
  description: Optimism Mainnet
- url: https://optimism-sepolia.nodit.io
  description: Optimism Sepolia
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  schemas:
    HexQuantity:
      type: string
      description: An integer encoded as a hexadecimal string. (e.g. '0x1a')
      pattern: ^0[xX][0-9a-fA-F]+
      example: "0x1a"
  responses:
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - NO_AUTHENTICATION_FOUND
                - AUTHENTICATION_FAILED
                description: Code to identify the cause of authentication failure
              message:
                type: string
                description: Detailed message including the cause of authentication failure
            required:
            - code
            - message
          examples:
            NO_AUTHENTICATION_FOUND:
              summary: The request does not include authentication (API Key)
              value:
                code: NO_AUTHENTICATION_FOUND
                message: No authentication found.
            AUTHENTICATION_FAILED:
              summary: The authentication (API Key) is invalid
              value:
                code: AUTHENTICATION_FAILED
                message: Authentication failed.
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - PERMISSION_DENIED
                description: Code indicating permission denied
              message:
                type: string
                description: Detailed message including information about the denied resource
            required:
            - code
            - message
          examples:
            PERMISSION_DENIED:
              summary: The request accesses a resource it is not authorized for
              value:
                code: PERMISSION_DENIED
                message: Permission denied
    "429":
      description: Too Many Requests
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_MANY_REQUESTS
                - EXCEEDED_QUOTA_LIMIT
                description: Code identifying the cause of the request limit exceeded
              message:
                type: string
                description: Detailed message including the exceeded limit type and allowed threshold
            required:
            - code
            - message
          examples:
            TOO_MANY_REQUESTS:
              summary: The rate limit was exceeded
              value:
                code: TOO_MANY_REQUESTS
                message: Too many requests
            EXCEEDED_QUOTA_LIMIT:
              summary: The quota limit was exceeded
              value:
                code: EXCEEDED_QUOTA_LIMIT
                message: Exceeded quota limit
    "500":
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - INTERNAL_SERVER_ERROR
                - INTERRUPTED
                description: Code to identify the cause of the internal server error
              message:
                type: string
                description: Detailed message including the cause of the server error
            required:
            - code
            - message
          examples:
            INTERNAL_SERVER_ERROR:
              summary: An internal server error occurred
              value:
                code: INTERNAL_SERVER_ERROR
                message: Internal server error
            INTERRUPTED:
              summary: Processing failed temporarily due to server load
              value:
                code: INTERRUPTED
                message: Request interrupted
paths:
  /:
    post:
      security:
      - api_key: []
      operationId: optimism-eth_newfilter
      summary: eth_newFilter
      description: |
        Creates a filter for logs matching the specified criteria and returns a filter ID. The filter ID is used with eth_getFilterLogs and eth_uninstallFilter.


        > 🚧 Response taking too long? Response time may increase with block range!
        >
        > Specifying a wide block range or including blocks with many events can cause response delays or timeouts.
        >
        > For faster responses:
        >
        > - Keep the fromBlock ~ toBlock range to 1000 blocks or less.
        > - When using blockTag "latest", the response may be slower since the exact block number is not known internally.
          In that case, use eth_blockNumber to get the latest block number and specify it explicitly.
      x-seo-description: Create an event log filter with specified topics, address, and block range for polling.
      tags:
      - eth
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - jsonrpc
              - method
              - params
              properties:
                id:
                  type: integer
                  example: 1
                jsonrpc:
                  type: string
                  example: "2.0"
                method:
                  type: string
                  example: eth_newFilter
                params:
                  type: array
                  items:
                    title: Log Object
                    type: object
                    properties:
                      fromBlock:
                        title: Block Number or Tag
                        type: string
                        oneOf:
                        - title: Block Number
                          type: string
                          pattern: ^0[xX][0-9a-fA-F]+$
                          example: "0x1076B5A"
                          description: Block number represents the order of blocks in the chain. It is expressed as a hexadecimal string.
                        - title: Block Tag
                          type: string
                          pattern: ^(latest|earliest|pending|safe|finalized)$
                          example: latest
                          description: |-
                            Block tag specifies a block using one of the following:
                            * `earliest`: The oldest available block on the chain.
                            * `finalized`: A recently finalized block that can no longer be changed. Primarily used in proof-of-stake (PoS) blockchains.
                            * `safe`: A recent block considered safe by the network (immune to reorgs).
                            * `latest`: The most recent block on the chain (may be subject to reorgs).
                            * `pending`: The next block to be mined, including pending transactions in the mempool.
                        example: "0x12C1A00"
                        description: |-
                          Use one of block number or block tag to specify a block.
                          * Block number: hex string (ex. "0x1")
                          * Block tag: enum string (ex. "latest", "earliest", "pending")
                      toBlock:
                        title: Block Number or Tag
                        type: string
                        oneOf:
                        - title: Block Number
                          type: string
                          pattern: ^0[xX][0-9a-fA-F]+$
                          example: "0x1076B5A"
                          description: Block number represents the order of blocks in the chain. It is expressed as a hexadecimal string.
                        - title: Block Tag
                          type: string
                          pattern: ^(latest|earliest|pending|safe|finalized)$
                          example: latest
                          description: |-
                            Block tag specifies a block using one of the following:
                            * `earliest`: The oldest available block on the chain.
                            * `finalized`: A recently finalized block that can no longer be changed. Primarily used in proof-of-stake (PoS) blockchains.
                            * `safe`: A recent block considered safe by the network (immune to reorgs).
                            * `latest`: The most recent block on the chain (may be subject to reorgs).
                            * `pending`: The next block to be mined, including pending transactions in the mempool.
                        example: "0x12C1A00"
                        description: |-
                          Use one of block number or block tag to specify a block.
                          * Block number: hex string (ex. "0x1")
                          * Block tag: enum string (ex. "latest", "earliest", "pending")
                      address:
                        type: array
                        items:
                          title: Address
                          type: string
                          pattern: ^0[xX][0-9a-fA-F]{40}$
                          example: "0xd8dA6BF26964aF9D7eEd9e03E53415D37aA96045"
                          description: Address is expressed as a 20-byte hexadecimal string, the address format used in EVM-compatible blockchains.
                        description: Addresses to filter by, as an array.
                      topics:
                        title: Topics
                        type: array
                        minimum: 1
                        maximum: 4
                        items:
                          type: string
                          description: Topic for filtering transaction logs, as a 32-byte hex string.
                        example:
                        - "0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef"
                        - "0x000000000000000000000000d8dA6BF26964aF9D7eEd9e03E53415D37aA96045"
                        description: Topics array for filtering transaction logs. Each topic is a 32-byte hex string.
                    description: Object for filtering logs.
                  example:
                  - fromBlock: latest
              example:
                id: 1
                jsonrpc: "2.0"
                method: eth_newFilter
                params:
                - fromBlock: latest
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              example:
                jsonrpc: "2.0"
                id: 1
                result: "0x0100000000000000ee32c7a8d24aac1f"
              schema:
                $ref: '#/components/schemas/HexQuantity'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
