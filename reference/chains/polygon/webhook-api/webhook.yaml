    patch:
      security:
      - api_key: []
      operationId: polygon-updateWebhook
      summary: Update Webhook
      description: |+
        You can modify the subscription condition of a Webhook, or activate or deactivate a Webhook.

        For an `ADDRESS_ACTIVITY` Webhook, the way monitored addresses are specified (`addresses` or `addressSetId`) and the attached Address Set cannot be changed after creation. A Webhook created with `addresses` can only change the address list in `addresses`, and a Webhook created with `addressSetId` cannot be switched to another set or to `addresses`. Attempting to do so returns `409 ADDRESS_SET_BINDING_IMMUTABLE`; to change the method or the set, create a new Webhook. To change the monitored addresses of a Webhook attached to a set, modify the addresses of the set through the Address Set API. Even for a Webhook created with `addresses`, if another Webhook also reads its address list via `addressSetId`, `addresses` cannot be changed and `409 ADDRESS_SET_MANAGED` is returned. In that case as well, modify the addresses through the Address Set API.

      x-seo-description: Update the configuration of an existing webhook subscription, including URL and event filters.
      tags:
      - Webhook API
      parameters:
      - name: chain
        in: path
        required: true
        schema:
          type: string
          enum:
          - polygon
          default: polygon
        description: Parameter to specify the target chain for the query.
      - name: network
        in: path
        required: true
        schema:
          type: string
          enum:
          - mainnet
          default: mainnet
        description: Parameter to specify the network of the target chain. Supported networks may vary depending on the chain.
      - name: subscriptionId
        in: path
        required: true
        schema:
          type: string
          example: "5001"
        description: Parameter to specify the subscriptionId assigned to the Webhook you want to query. You can use the subscriptionId returned when creating a Webhook to query, modify, and delete Webhook information.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              additionalProperties: false
              type: object
              properties:
                notification:
                  type: object
                  description: Parameter specifying the information required to receive notifications when an event occurs.
                  properties:
                    webhookUrl:
                      type: string
                      description: Parameter specifying the webhook URL to receive notifications when the subscribed event occurs. A publicly accessible URL must be specified.
                description:
                  type: string
                  description: Parameter specifying the description of the event.
                isActive:
                  type: boolean
                  description: Parameter specifying whether the Webhook is active. When set to true, the Webhook is activated; when set to false, it is deactivated. A deactivated Webhook cannot receive notifications but is not deleted.
                condition:
                  type: object
                  description: Field for defining detailed conditions of the events you want to subscribe to. Available conditions vary by event type, so refer to the Webhook Types page for usage.
                  oneOf:
                  - title: ADDRESS_ACTIVITY
                    description: Monitors activity of the addresses you specify. This event sends a notification whenever these accounts are involved as either sender (from) or recipient (to) in a transaction, i.e., when a transaction, token transfer (ERC20), or NFT transfer (ERC721, ERC1155) occurs. This service enables users to track activity across multiple addresses in real time and effectively monitor asset movements and transactions. Provide the monitored addresses in **exactly one** of two ways, either listing them directly in `addresses` or specifying the `addressSetId` of a set created in advance with the Address Set API. Providing both returns 400 `INVALID_PARAMETER`, and providing neither returns 400 `MISSING_REQUIRED_PARAMETER`.
                    type: object
                    oneOf:
                    - required:
                      - addresses
                    - required:
                      - addressSetId
                    properties:
                      addresses:
                        type: array
                        description: List of addresses to monitor for events. Cannot be used together with `addressSetId`.
                        items:
                          type: string
                          format: ^0[xX][0-9a-fA-F]{40}$
                          default: "0x4838b106fce9647bdf1e7877bf73ce8b0bad5f97"
                          example: "0xd8dA6BF26964aF9D7eEd9e03E53415D37aA96045"
                      addressSetId:
                        type: string
                        description: The addressSetId of the Address Set whose addresses are to be monitored. Specify a set created in advance with the Address Set API; it cannot be used together with `addresses`. The set must be in `READY` status (otherwise 409 `ADDRESS_SET_NOT_READY`), and its `addressFormat` must match the chain's address format (otherwise 422 `ADDRESS_SET_FORMAT_MISMATCH`). Specifying a set that does not exist, or that belongs to another account or another project, returns 404 `RESOURCE_NOT_FOUND`. Pass the 19-digit number as a string.
                        example: "1788439512345678901"
                  - title: TOKEN_TRANSFER
                    description: Provides a notification when a token (ERC20) transfer or NFT (ERC721, ERC1155) transfer occurs. Users can specify a contract address to monitor token movements from that contract. For NFTs under ERC721 and ERC1155 standards, you can also set a specific token ID as a condition to track transfers of only that token.
                    type: object
                    required:
                    - tokens
                    properties:
                      tokens:
                        type: array
                        description: Token information object for monitoring transfer events
                        items:
                          type: object
                          required:
                          - contractAddress
                          properties:
                            contractAddress:
                              type: string
                              description: Contract address of the ERC20, ERC721, or ERC1155 token to monitor
                              format: ^0[xX][0-9a-fA-F]{40}$
                              default: "0x4838b106fce9647bdf1e7877bf73ce8b0bad5f97"
                              example: "0xd8dA6BF26964aF9D7eEd9e03E53415D37aA96045"
                            tokenId:
                              type: string
                              description: Token ID when monitoring transfer events for a specific token in the ERC721 or ERC1155 contract only
                              format: ^[0-9]+$
                              example:
                              - "1"
                              - "9386"
                  - title: LOG
                    description: Provides a notification when a transaction containing specified smart contract event logs is created. Users can specify the account address (address) to monitor and event identifier information (topics) as filter conditions. For example, configuring monitoring for the ERC20 standard token transfer event Transfer(address,address,uint256) captures all transaction logs matching that event signature (0xddf252ad...). Use the LOG EventType to efficiently track important activities such as standard token transfers or specific smart contract events.
                    type: object
                    required:
                    - address
                    - topics
                    properties:
                      address:
                        type: string
                        description: Target address to monitor for token transfer events
                        default: "0xd8dA6BF26964aF9D7eEd9e03E53415D37aA96045"
                        example:
                        - "0xd8dA6BF26964aF9D7eEd9e03E53415D37aA96045"
                        - "0x3f5CE5FBFe3E9af3971dD833D26bA9b5C936f0bE"
                      topics:
                        type: array
                        description: |
                          Array of topics for the Event Log to monitor. Can contain up to 4 strings.

                          > 📘 The Topic fields of the event you want to monitor are used to filter data associated with smart contract events. Each topic contains the event's signature and indexed parameter information.
                          > **topics[0]: Event Signature**
                          > - topics[0] is always the Keccak256 hash of the event signature.
                          > For example, for the Transfer(address indexed from, address indexed to, uint256 value) event, the event signature can be verified with code like this:
                          > `Keccak256("Transfer(address,address,uint256)") = 0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef `
                          >
                          > **topics[1], topics[2], topics[3]: Indexed Parameters**
                          > - topics[1] onward correspond to indexed parameter values of the event. Only event parameters declared with the indexed keyword in the smart contract are included in topics. For the Transfer event example above, the from address maps to topics[1] and the to address to topics[2]. To filter events where from is a specific address, enter that address in topics[1]. Values for non-indexed parameters can be found in the data field of the retrieved logs.
                          >
                          > **How to find Topic values**
                          > - From smart contract code: Check the event definition in Solidity code, identify indexed parameters and the event signature, then obtain topic values via Keccak256 hashing.
                          > - Using a block explorer: Select a sample transaction to trace, go to the transaction details, and find topic values in sections such as "Logs". Below is an example view from Etherscan (https://etherscan.io) for USDC (ERC20) Transfer event logs.
                        minItems: 1
                        maxItems: 4
                        items:
                          type: string
                          default: "0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef"
                          example:
                          - "0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef"
                          - "0x000000000000000000000000b7aa2d3c833a6827c4f39bef9622d7cddf66b7e7"
                          - "0x0000000000000000000000003264039cfaa37a70a0e8ccfbf4b7e60bedce5c9f"
              example:
                notification:
                  webhookUrl: https://your-webhook-url.com
                description: Your webhook description
                isActive: false
                condition:
                  addresses:
                  - "0xd8dA6BF26964aF9D7eEd9e03E53415D37aA96045"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: boolean
                    description: Field indicating the result of the call. Returns true on success and false on failure.
              example:
                result: true
        "400":
          $ref: '#/components/responses/400'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "404":
          $ref: '#/components/responses/404'
        "405":
          $ref: '#/components/responses/405'
        "408":
          $ref: '#/components/responses/408'
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                    enum:
                    - ADDRESS_SET_BINDING_IMMUTABLE
                    - ADDRESS_SET_MANAGED
                    - REJECTED
                    description: A code that identifies the cause of the error.
                  message:
                    type: string
                    description: A detailed message including the cause of the error.
              examples:
                ADDRESS_SET_BINDING_IMMUTABLE:
                  summary: The request tries to change how an `ADDRESS_ACTIVITY` Webhook specifies its addresses or which Address Set it is attached to. This includes giving `addressSetId` to a Webhook created with `addresses`, and switching a set-attached Webhook to another set or to `addresses`
                  value:
                    code: ADDRESS_SET_BINDING_IMMUTABLE
                    message: subscription 9163 is bound to address set 1791882485839048148; the binding cannot be changed
                ADDRESS_SET_MANAGED:
                  summary: Another Webhook also reads this Webhook's address list via `addressSetId`. A change on one side would affect the other Webhook, so modify the addresses only through the Address Set API
                  value:
                    code: ADDRESS_SET_MANAGED
                    message: address set 1791884127529205343 is read by more than one subscription; change its addresses through the address set API
                REJECTED:
                  summary: The server rejected the request
                  value:
                    code: REJECTED
                    message: Request rejected
        "413":
          $ref: '#/components/responses/413'
        "414":
          $ref: '#/components/responses/414'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
        "503":
          $ref: '#/components/responses/503'
  /{chain}/{network}/webhooks/history:
    get:
      security:
      - api_key: []
      operationId: polygon-getWebhookHistory
      summary: Get Webhook History
      description: |-
        API for querying Webhook call history. Use this API to check Webhook execution status and call results. Call history includes Webhook event success/failure status and detailed information for each call.

        > 🚧 History data is retained for 7 days
        > Only Webhook call history from the last 7 days is retained. Once an entry passes 7 days, it is deleted in full - including `eventMessage` - and cannot be recovered, so you must query the history you need within that period.
      x-seo-description: Retrieve the delivery history of a webhook subscription, including event logs and response statuses.
      tags:
      - Webhook API
      parameters:
      - name: chain
        in: path
        required: true
        schema:
          type: string
          enum:
          - polygon
          default: polygon
        description: Parameter to specify the target chain for the query.
      - name: network
        in: path
        required: true
        schema:
          type: string
          enum:
          - mainnet
          default: mainnet
        description: Parameter to specify the network of the target chain. Supported networks may vary depending on the chain.
      - name: subscriptionId
        in: query
        required: true
        schema:
          type: string
          example: "5001"
        description: Parameter that specifies the subscriptionId assigned to the Webhook to query. Use the subscriptionId returned when creating the Webhook to query, update, or delete Webhook information. Enter an empty value to query all Webhook information.
      - name: page
        in: query
        required: false
        schema:
          type: string
          example: 1
        description: Specifies the page to query. Default is 1.
      - name: rpp
        in: query
        required: false
        schema:
          type: string
          example: "10"
        description: Specifies the number of events to query per page. Value range is 1 to 100. Default is 10.
      - name: withEventMessage
        in: query
        required: false
        schema:
          type: boolean
          example: true
        description: Specifies whether to include event messages in the query. Default is false.
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - SUCCESS
          - FAIL
          example: SUCCESS
        description: Filters events by webhook call success (SUCCESS) or failure (FAIL).
      - name: startAt
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-01-01T00:00:00Z'
        description: Specifies the start time for event occurrence in ISO 8601 format.
      - name: endAt
        in: query
        required: false
        schema:
          type: string
          format: date-time
          example: '2026-01-01T00:00:00Z'
        description: Specifies the end time for event occurrence in ISO 8601 format.
      - name: startSequenceNumber
        in: query
        required: false
        schema:
          type: string
          example: "100"
        description: Specifies the sequenceNumber to start the query from.
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: number
                    description: Total number of events matching the criteria.
                  page:
                    type: number
                    description: Current page number of the query.
                  rpp:
                    type: number
                    description: Number of events per page returned based on the request.
                  items:
                    type: array
                    description: Array containing call history data.
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: Unique value identifying the call history entry.
                        compositeKey:
                          type: string
                          description: Value combining subscriptionId and sequenceNumber. (Format&#58; `{subscriptionId}&#58;{sequenceNumber}`)
                        subscriptionId:
                          type: string
                          description: Field representing the subscriptionId of the Webhook this call history entry belongs to.
                        sequenceNumber:
                          type: string
                          description: Field representing the sequence number of the Webhook message. Compare the sequenceNumber of received messages to identify missing messages.
                        status:
                          type: string
                          enum:
                          - SUCCESS
                          - FAIL
                          description: Field representing whether the Webhook call succeeded (SUCCESS) or failed (FAIL).
                        updatedAt:
                          type: string
                          description: Indicates when there was a change in the webhook delivery result (status), e.g., when a failed delivery was retried and changed to success. This field is returned in ISO 8601 format.
                        createdAt:
                          type: string
                          description: Indicates when the webhook event occurred and the log was created. This field is returned in ISO 8601 format.
                        eventMessage:
                          type: object
                          description: Field representing the message body delivered via Webhook. Included only when `withEventMessage` is set to `true` in the request, and not returned for entries past the 7-day retention period.
                          properties:
                            subscriptionId:
                              type: string
                              description: Field representing the subscriptionId of the Webhook the message was delivered to.
                            sequenceNumber:
                              type: string
                              description: Field representing the sequence number of the message.
                            eventType:
                              type: string
                              description: Field representing the event type subscribed to by this Webhook. (e.g., ADDRESS_ACTIVITY, TOKEN_TRANSFER, LOG, ...)
                            protocol:
                              type: string
                              description: Field representing the chain subscribed to via this Webhook. (e.g., ethereum, polygon, kaia, ...)
                            network:
                              type: string
                              description: Field representing the network subscribed to via this Webhook. (e.g., mainnet, sepolia, ...)
                            event:
                              type: object
                              description: Field representing the details of the detected event. The structure varies by eventType.
                              properties:
                                reorgRemoved:
                                  type: boolean
                                  example: true
                                  description: Field that indicates whether the message resulted from a reorg. When a reorg occurs, the message is sent with this field added and set to true. It uses the same Sequence Number as the message containing the data of the affected block, so you can tell which block's data was reorged by its Sequence Number.
              example:
                total: 15
                rpp: 1
                page: 1
                items:
                - id: "1284507193"
                  compositeKey: '5001:15'
                  subscriptionId: "5001"
                  sequenceNumber: "15"
                  status: SUCCESS
                  updatedAt: '2026-08-10T07:33:53.000Z'
                  createdAt: '2026-08-10T07:33:52.000Z'
                  eventMessage:
                    subscriptionId: "5001"
