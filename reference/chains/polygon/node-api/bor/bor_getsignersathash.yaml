openapi: 3.1.0
info:
  title: Polygon - bor_getSignersAtHash
  version: 1.0.0
servers:
- url: https://polygon-mainnet.nodit.io
  description: Polygon Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  schemas:
    HexStringArray:
      type: array
      description: An array of hexadecimal strings.
      items:
        type: string
      example:
      - "0x00856730088a5c3191bd26eb482e45229555ce57"
      - "0x1a3cca9a3b6c5e2a4b4d7f8e1d2c3a4b5c6d7e8f"
  responses:
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - NO_AUTHENTICATION_FOUND
                - AUTHENTICATION_FAILED
                description: Code to identify the cause of authentication failure
              message:
                type: string
                description: Detailed message including the cause of authentication failure
            required:
            - code
            - message
          examples:
            NO_AUTHENTICATION_FOUND:
              summary: The request does not include authentication (API Key)
              value:
                code: NO_AUTHENTICATION_FOUND
                message: No authentication found.
            AUTHENTICATION_FAILED:
              summary: The authentication (API Key) is invalid
              value:
                code: AUTHENTICATION_FAILED
                message: Authentication failed.
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - PERMISSION_DENIED
                description: Code indicating permission denied
              message:
                type: string
                description: Detailed message including information about the denied resource
            required:
            - code
            - message
          examples:
            PERMISSION_DENIED:
              summary: The request accesses a resource it is not authorized for
              value:
                code: PERMISSION_DENIED
                message: Permission denied
    "429":
      description: Too Many Requests
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_MANY_REQUESTS
                - EXCEEDED_QUOTA_LIMIT
                description: Code identifying the cause of the request limit exceeded
              message:
                type: string
                description: Detailed message including the exceeded limit type and allowed threshold
            required:
            - code
            - message
          examples:
            TOO_MANY_REQUESTS:
              summary: The rate limit was exceeded
              value:
                code: TOO_MANY_REQUESTS
                message: Too many requests
            EXCEEDED_QUOTA_LIMIT:
              summary: The quota limit was exceeded
              value:
                code: EXCEEDED_QUOTA_LIMIT
                message: Exceeded quota limit
    "500":
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - INTERNAL_SERVER_ERROR
                - INTERRUPTED
                description: Code to identify the cause of the internal server error
              message:
                type: string
                description: Detailed message including the cause of the server error
            required:
            - code
            - message
          examples:
            INTERNAL_SERVER_ERROR:
              summary: An internal server error occurred
              value:
                code: INTERNAL_SERVER_ERROR
                message: Internal server error
            INTERRUPTED:
              summary: Processing failed temporarily due to server load
              value:
                code: INTERRUPTED
                message: Request interrupted
paths:
  /:
    post:
      security:
      - api_key: []
      operationId: polygon-bor_getsignersathash
      summary: bor_getSignersAtHash
      description: Returns the list of validators who signed a specific block hash. This method is used to query the addresses of signers (validators) for a given block hash and allows you to identify the nodes that participated in block validation at a specific point in the network.
      x-seo-description: Returns the list of signers for a specific block identified by its hash on the Bor network.
      tags:
      - bor
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - jsonrpc
              - method
              - params
              properties:
                id:
                  type: integer
                  example: 1
                jsonrpc:
                  type: string
                  example: "2.0"
                method:
                  type: string
                  example: bor_getSignersAtHash
                params:
                  type: array
                  items:
                    oneOf:
                    - title: Block Hash
                      type: string
                      pattern: ^0[xX][0-9a-fA-F]{64}
                      example: "0x39008d07edf93c03bb9d1cfc80598fcf63f441ec86e9de3733fa6a484980ca48"
                      description: Block hash is the unique identifier of a block. Block hashes are expressed as 64-digit hexadecimal strings.
                  example: "0xa70c0bff4de8a59f521920deb8b6f3a4885845f2f418409f5fc8daade7717505"
                  description: |
                    Enter the following parameters as an array with the appropriate types.

                    1. `block hash`: Enter the block hash to query in 64-digit hexadecimal string format.
              example:
                id: 1
                jsonrpc: "2.0"
                method: bor_getSignersAtHash
                params:
                - "0xa70c0bff4de8a59f521920deb8b6f3a4885845f2f418409f5fc8daade7717505"
      responses:
        "200":
          description: Successful Response
          content:
