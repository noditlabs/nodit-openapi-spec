openapi: 3.1.0
info:
  title: Polygon - bor_getAuthor
  version: 1.0.0
servers:
- url: https://polygon-mainnet.nodit.io
  description: Polygon Mainnet
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: X-API-KEY
      in: header
      x-default: nodit-demo
      description: |
        The example value `nodit-demo` is for use in the developer documentation only.
        For real applications or services, please use the API key issued from the Nodit console.
  schemas:
    HexString:
      type: string
      description: A hexadecimal string prefixed with 0x.
      pattern: ^0[xX][0-9a-fA-F]*$
      example: "0x1"
  responses:
    "401":
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - NO_AUTHENTICATION_FOUND
                - AUTHENTICATION_FAILED
                description: Code to identify the cause of authentication failure
              message:
                type: string
                description: Detailed message including the cause of authentication failure
            required:
            - code
            - message
          examples:
            NO_AUTHENTICATION_FOUND:
              summary: The request does not include authentication (API Key)
              value:
                code: NO_AUTHENTICATION_FOUND
                message: No authentication found.
            AUTHENTICATION_FAILED:
              summary: The authentication (API Key) is invalid
              value:
                code: AUTHENTICATION_FAILED
                message: Authentication failed.
    "403":
      description: Forbidden
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - PERMISSION_DENIED
                description: Code indicating permission denied
              message:
                type: string
                description: Detailed message including information about the denied resource
            required:
            - code
            - message
          examples:
            PERMISSION_DENIED:
              summary: The request accesses a resource it is not authorized for
              value:
                code: PERMISSION_DENIED
                message: Permission denied
    "429":
      description: Too Many Requests
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - TOO_MANY_REQUESTS
                - EXCEEDED_QUOTA_LIMIT
                description: Code identifying the cause of the request limit exceeded
              message:
                type: string
                description: Detailed message including the exceeded limit type and allowed threshold
            required:
            - code
            - message
          examples:
            TOO_MANY_REQUESTS:
              summary: The rate limit was exceeded
              value:
                code: TOO_MANY_REQUESTS
                message: Too many requests
            EXCEEDED_QUOTA_LIMIT:
              summary: The quota limit was exceeded
              value:
                code: EXCEEDED_QUOTA_LIMIT
                message: Exceeded quota limit
    "500":
      description: Internal Server Error
      content:
        application/json:
          schema:
            type: object
            properties:
              code:
                type: string
                enum:
                - INTERNAL_SERVER_ERROR
                - INTERRUPTED
                description: Code to identify the cause of the internal server error
              message:
                type: string
                description: Detailed message including the cause of the server error
            required:
            - code
            - message
          examples:
            INTERNAL_SERVER_ERROR:
              summary: An internal server error occurred
              value:
                code: INTERNAL_SERVER_ERROR
                message: Internal server error
            INTERRUPTED:
              summary: Processing failed temporarily due to server load
              value:
                code: INTERRUPTED
                message: Request interrupted
paths:
  /:
    post:
      security:
      - api_key: []
      operationId: polygon-bor_getauthor
      summary: bor_getAuthor
      description: Returns the address of the validator (or block producer) that created the current block. This method is used to identify the node that produced a block in a PoA network. The block producer is selected according to the network's consensus protocol, and this method reveals the address of the block's "author" or "miner".
      x-seo-description: Returns the author (validator) of a specific block on the Polygon/Bor network.
      tags:
      - bor
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - id
              - jsonrpc
              - method
              - params
              properties:
                id:
                  type: integer
                  example: 1
                jsonrpc:
                  type: string
                  example: "2.0"
                method:
                  type: string
                  example: bor_getAuthor
                params:
                  type: array
                  items:
                    oneOf:
                    - title: Block Number or Tag
                      type: string
                      pattern: ^0[xX][0-9a-fA-F]+$|^(latest|earliest|pending|safe|finalized)$
                      description: |
                        Use either block number or block tag to specify a block.

                        * Block number: Hexadecimal string (e.g. "0x1")
                        * Block tag: Enum string (e.g. "latest", "earliest", "pending")
                          * `earliest`: The oldest available block on the chain.
                          * `finalized`: A recently finalized block that can no longer be changed. Primarily used in proof-of-stake (PoS) blockchains.
                          * `safe`: A recent block considered safe by the network (immune to reorgs).
                          * `latest`: The most recent block on the chain (may be subject to reorgs).
                          * `pending`: The next block to be mined, including pending transactions in the mempool.
                      example: latest
                  description: |
                    Enter the following parameters as an array with the appropriate types.
                    1. `block number or block tag`: Enter the block number in hexadecimal string format. You can also enter block tags such as "earliest", "latest", or "pending".
              example:
                id: 1
                jsonrpc: "2.0"
                method: bor_getAuthor
                params:
                - latest
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              example:
                jsonrpc: "2.0"
                id: 1
                result: "0x7c7379531b2aee82e4ca06d4175d13b9cbeafd49"
              schema:
                $ref: '#/components/schemas/HexString'
        "401":
          $ref: '#/components/responses/401'
        "403":
          $ref: '#/components/responses/403'
        "429":
          $ref: '#/components/responses/429'
        "500":
          $ref: '#/components/responses/500'
